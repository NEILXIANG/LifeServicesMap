</style>
</head>
<body>
<!-- WCAG 2.1 §2.4.1: keyboard-only escape. Translated by JS in setLang().
     href="#map" jumps focus past the header and filter rows straight to the map. -->
<a href="#map" class="skip-link" id="skipLink"></a>
<header role="banner">
  <div class="lang-sw" role="group" id="langSw" aria-label="">
    <!-- 2026-09-13 (item 13): on a phone the six buttons fold into one menu
         button that names the current language; the list opens below it with
         the current language first and the phone's own language next. -->
    <button class="lang-menu-btn" id="langMenuBtn" type="button" aria-haspopup="true" aria-expanded="false"><span class="lm-ic" aria-hidden="true" data-ic="globe">🌐</span><span id="langMenuCur">EN</span><span class="lm-ch" aria-hidden="true">▾</span></button>
    <div class="lang-menu" id="langMenu">
    <button class="lang-btn active" data-lang="en" lang="en" aria-label="English" title="English">EN</button>
    <button class="lang-btn" data-lang="fr" lang="fr" aria-label="Français" title="Français">FR</button>
    <button class="lang-btn" data-lang="es" lang="es" aria-label="Español" title="Español">ES</button>
    <button class="lang-btn" data-lang="zh" lang="zh-CN" aria-label="中文" title="中文">中文</button>
    <button class="lang-btn" data-lang="ko" lang="ko" aria-label="한국어" title="한국어">한국어</button>
    <button class="lang-btn" data-lang="ja" lang="ja" aria-label="日本語" title="日本語">日本語</button>
    </div>
  </div>
  <div class="header-links" role="group" id="headerLinksGroup" aria-label="">
    <button class="note-toggle help-btn" id="helpBtn" type="button"><span class="hl-ic" aria-hidden="true"></span><span class="hl-tx"></span></button>
    <button class="note-toggle" id="shareBtn"><span class="hl-ic" aria-hidden="true"></span><span class="hl-tx"></span></button>
    <a class="feedback-link" id="feedbackLink" href="#"><span class="hl-ic" aria-hidden="true"></span><span class="hl-tx"></span></a>
    <button class="note-toggle" id="guideToggle"><span class="hl-ic" aria-hidden="true"></span><span class="hl-tx"></span></button>
    <!-- 2026-09-08: hidden at the user's request pending a rethink of this feature —
         not removed. The button, its modal, and #noteBody's per-language content
         all still render normally; `hidden` only takes the entry point out of the
         page (and out of tab order) so it can come back with one attribute. -->
    <button class="note-toggle" id="noteToggle" hidden><span class="hl-ic" aria-hidden="true"></span><span class="hl-tx"></span></button>
  </div>
  <h1 id="h1" aria-describedby="sub"></h1>
  <p class="sub" id="sub"></p>
</header>
<div class="backdrop" id="helpBackdrop">
  <div class="guide-modal" id="helpModal">
    <div class="sheet-grab" aria-hidden="true"><div class="panel-handle"></div></div>
    <div class="guide-head">
      <div class="panel-title" id="helpTitle"></div>
      <button class="panel-close" id="helpClose">✕</button>
    </div>
    <div class="guide-body" id="helpBody"></div>
  </div>
</div>
<div class="backdrop" id="shareBackdrop">
  <div class="guide-modal" id="shareModal">
    <div class="sheet-grab" aria-hidden="true"><div class="panel-handle"></div></div>
    <div class="guide-head">
      <div class="panel-title" id="shareTitle"></div>
      <button class="panel-close" id="shareClose">✕</button>
    </div>
    <div class="guide-body">
      <p class="share-lead" id="shareLead"></p>
      <button class="share-native" id="shareNative" hidden></button>
      <div class="share-grid" id="shareGrid"></div>
      <p class="share-note" id="shareNote"></p>
    </div>
  </div>
</div>
<div class="backdrop" id="noteBackdrop">
  <div class="guide-modal" id="noteModal">
    <div class="sheet-grab" aria-hidden="true"><div class="panel-handle"></div></div>
    <div class="guide-head">
      <div class="panel-title" id="noteTitle"></div>
      <button class="panel-close" id="noteClose">✕</button>
    </div>
    <div class="guide-body" id="noteBody"></div>
  </div>
</div>
<div class="search-bar">
  <span class="search-ic" aria-hidden="true" data-ic="search">🔍</span>
  <input type="search" id="searchInput" autocomplete="off">
  <button class="search-clear" id="searchClear" hidden>✕</button>
</div>
<!-- 2026-09-13: the search box leads first use — with nothing typed, a tap
     shows four things people actually ask, two of them cards and two of
     them map questions. Hidden once there is text, on Escape, or on blur. -->
<div class="search-suggest" id="searchSuggest" hidden></div>
<div class="search-note" id="searchNote" role="status" aria-live="polite"></div>
<!-- WCAG 2.4.4 / 4.1.3: visually-hidden polite live region for screen readers.
     sr-only keeps it accessible but invisible; aria-live=polite queues updates
     without interrupting the user's current utterance. -->
<div id="a11yAnnounce" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
<div class="ftoolbar" role="toolbar" id="ftoolbar" aria-label="">
  <button class="filter-btn" id="areaBtn" aria-haspopup="dialog">
    <span class="fbicon" data-ic="pin">📍</span><span id="areaBtnLabel"></span><span class="badge" id="areaBadge" hidden></span>
    <span class="chev">▾</span>
  </button>
  <button class="filter-btn" id="catBtn" aria-haspopup="dialog">
    <span class="fbicon" data-ic="tag">🏷️</span><span id="catBtnLabel"></span><span class="badge" id="catBadge" hidden></span>
    <span class="chev">▾</span>
  </button>
  <button class="filter-btn" id="busBtn" aria-haspopup="dialog">
    <span class="fbicon" data-ic="bus">🚌</span><span id="busBtnLabel"></span>
    <span class="chev">▾</span>
  </button>
  <button class="filter-btn" id="favBtn" aria-haspopup="dialog">
    <span class="fbicon" data-ic="star">⭐</span><span id="favBtnLabel"></span><span class="badge" id="favBadge" hidden></span>
    <span class="chev">▾</span>
  </button>
  <div class="status" id="statusText" title=""></div>
  <button class="reset-btn" id="resetBtn" hidden><span data-ic="reset">↺</span> <span id="resetLabel"></span></button>
</div>
<div class="empty-state" id="emptyState" role="status" aria-live="polite" hidden></div>
<div class="search-help" id="searchHelp" hidden></div>
<div class="result-list" id="resultList" hidden></div>
<div class="qp-row" id="qpRow" aria-labelledby="quickLabel">
  <div class="qp-head">
    <div class="sec-label" id="quickLabel"></div>
  </div>
  <div class="preset-row" id="presetRow">
    <!-- 2026-09-10: the guide's entry point, in the row where thumbs actually go.
         It opens the guide rather than toggling a filter, so it is styled as a
         doorway (filled) rather than a chip, and carries none of the preset
         bookkeeping. -->
    <button class="preset-chip qp-guide" id="qpGuide" type="button"></button>
    <button class="preset-chip" id="daily"></button>
    <button class="preset-chip" id="newcomer"></button>
    <!-- P2-I: three of the ten themes surfaced directly here, since the theme
         axis (this session's new second filter) otherwise has zero presence on
         the first screen. These toggle a theme (aT), not a category set — a
         different, independent gesture from the category presets around them,
         so they carry none of the presetsAdjusted bookkeeping that only makes
         sense for a category set drifting from its own preset. Their text and
         icon come from TIC/themeLabel() at runtime (updateThemeQuickpicks). -->
    <button class="preset-chip" id="qpFree" type="button"></button>
    <button class="preset-chip" id="qpFamily" type="button"></button>
    <button class="preset-chip" id="qpIndoor" type="button"></button>
    <button class="preset-chip" id="qpOpen" type="button" aria-pressed="false"></button>
    <button class="preset-chip" id="qpNear" type="button" aria-pressed="false" hidden></button>
    <!-- 2026-09-11: the row used to hold fourteen chips; a 390px phone shows three,
         and nothing past the sixth was ever reached. The seven category sets
         (kids/edu/health/…) now live at the top of the Category sheet, which this
         last chip opens. What stays here are scenarios, and applyQuickPickOrder()
         puts the likeliest first for this hour, season and reader. -->
    <button class="preset-chip qp-more" id="qpMore" type="button"></button>
  </div>
</div>
<div class="fhint" id="fhint"></div>
<button type="button" class="guide-progress" id="guideProgress" hidden></button>
<!-- 2026-09-10: shown once, on a first visit. Three lines that say what this
     page does, in the reader's own terms, each a live door. Dismissed with one
     tap and remembered in this browser only. -->
<div class="active-filters" id="activeFilters"></div>
<div id="map" tabindex="-1"><div class="bus-indicator" id="busIndicator" role="status" aria-live="polite" hidden></div><div class="firstuse" id="firstUse" hidden></div><div class="season-note" id="seasonNote" role="note" hidden></div><div class="offline-note" id="offlineNote" role="status" hidden><span id="offlineText"></span><button class="offline-x" id="offlineClose" type="button">✕</button></div></div>
<div class="footer" id="footer"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<div class="backdrop" id="backdrop">
  <div class="panel" id="panel">
    <div class="panel-grab" id="panelGrab" aria-hidden="true"><div class="panel-handle"></div></div>
    <div class="panel-head">
      <div class="panel-title" id="panelTitle"></div>
      <button class="panel-close" id="panelClose">✕</button>
    </div>
    <div class="panel-body">
      <div id="panelArea">
        <div class="reg-row" id="regRow"></div>
      </div>
      <div id="panelCat" hidden>
        <!-- 2026-09-11: the seven category sets that used to crowd the Quick
             Picks row. One tap selects a whole set of categories; they read as
             the same chips they were on the front page, so nothing is re-learnt. -->
        <div class="psec" id="presetSec">
          <div class="sec-label" id="presetSecLabel"></div>
          <p class="cat-panel-hint" id="presetSecHint"></p>
          <div class="preset-grid" id="presetGrid">
            <button class="preset-chip" id="kids" type="button"></button>
            <button class="preset-chip" id="edu" type="button"></button>
            <button class="preset-chip" id="health" type="button"></button>
            <button class="preset-chip" id="sports" type="button"></button>
            <button class="preset-chip" id="outdoor" type="button"></button>
            <button class="preset-chip" id="shopping" type="button"></button>
            <button class="preset-chip" id="auto" type="button"></button>
          </div>
        </div>
        <div class="psec">
          <div class="theme-sec" id="themeSec">
            <div class="sec-label" id="themeLabel"></div>
            <p class="cat-panel-hint" id="themeHint"></p>
            <div class="theme-row" id="themeRow"></div>
          </div>
          <p class="cat-panel-hint" id="catPanelHint"></p>
          <div class="cat-utils-inline">
            <div class="cat-utils"><button id="clearCat" class="cat-util-btn"></button></div>
          </div>
          <div class="cat-wrap" id="catGrid"></div>
        </div>
      </div>
      <div id="panelBus" hidden>
        <p class="cat-panel-hint" id="busPanelHint"></p>
        <!-- 2026-09-10: "which bus goes to TRU?" had no answer but reading
             fourteen route names. Stop names are in the data; let them be asked. -->
        <input type="search" class="task-search bus-search" id="busSearch" autocomplete="off">
        <div class="bus-list" id="busList"></div><div class="bus-coverage" id="busCoverage"></div>
      </div>
      <div id="panelFav" hidden>
        <div class="bus-list" id="favList"></div>
        <div class="fav-io" id="favIO">
          <p class="fav-io-note" id="favIONote"></p>
          <div class="fav-io-row">
            <button class="fav-io-btn" id="favExport"></button>
            <button class="fav-io-btn" id="favImport"></button>
          </div>
          <textarea class="fav-io-box" id="favCode" rows="2" spellcheck="false"></textarea>
          <p class="fav-io-msg" id="favIOMsg" role="status"></p>
        </div>
      </div>
    </div>
    <div class="apply-bar" id="applyBar"><button class="apply-btn" id="applyBtn"></button></div>
  </div>
</div>

<div class="backdrop" id="guideBackdrop">
  <div class="guide-modal" id="guideModal">
    <div class="sheet-grab" aria-hidden="true"><div class="panel-handle"></div></div>
    <div class="guide-head">
      <div class="panel-title" id="guideTitle"></div>
      <button class="panel-close" id="guideClose">✕</button>
    </div>
    <div class="guide-body"><div id="guideTasks"></div><div id="guideBody"></div></div>
  </div>
</div>

<script id="app">
