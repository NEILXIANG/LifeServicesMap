<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{CITY_TITLE}}</title>
<meta name="description" id="metaDesc" content="{{CITY_DESC}}">
<meta property="og:type" content="website">
<meta property="og:title" id="ogTitle" content="{{CITY_TITLE}}">
<meta property="og:description" id="ogDesc" content="{{CITY_DESC}}">
<meta property="og:url" content="{{CITY_SITE_URL}}">
<meta property="og:image" content="{{CITY_SITE_URL}}icon-512.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<!-- Safari has never accepted an SVG apple-touch-icon, so the previous line
     pointed iOS at a file it silently ignored and the home-screen tile came out
     as a screenshot of the page. A real 180px PNG is what that platform wants. -->
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b6be0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
