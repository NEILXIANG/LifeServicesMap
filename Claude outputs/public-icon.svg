<?xml version="1.0" encoding="UTF-8"?>
<!--
  App icon for the Kamloops living-services map.

  The city's name comes from the Secwepemc "Tk'emlúps" — the meeting of the
  waters — and the place itself is exactly that: the North Thompson coming down
  from the north, the South Thompson coming in from the east, joining below the
  dry benchland hills and leaving west as one wider river. So the icon is that
  confluence, in the colours the valley actually is in summer: bunchgrass gold,
  ochre benches, river blue.

  Drawn from scratch as plain geometry. Nothing here reproduces a logo,
  wordmark, photograph or any other protected work — a river junction and a
  hillside are facts of the landscape, and these particular curves are original.
  The previous icon was a 🗺️ emoji inside a blue square: it said nothing about
  this city, and rendered as whatever glyph the reader's OS happened to supply.

  Two things the geometry has to satisfy:
  · No width/height attributes, only a viewBox, so it scales to whatever box a
    favicon, a home-screen tile or an app-switcher card gives it.
  · "any maskable" means the platform cuts its own shape, so the ground bleeds
    to all four edges and everything load-bearing sits inside the central 80%
    safe circle (radius 76.8 about 96,96). The river arms deliberately run past
    that edge — a river that stops short of the frame looks like a stub, and one
    that runs off it looks like a river.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" role="img" aria-label="Two rivers meeting below dry hills">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EBCB80"/>
      <stop offset="1" stop-color="#C08529"/>
    </linearGradient>
    <linearGradient id="water" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#63BEEA"/>
      <stop offset="1" stop-color="#1A6699"/>
    </linearGradient>
  </defs>

  <rect width="192" height="192" fill="url(#ground)"/>

  <!-- Two benches, not three: at 32 px a third band turns the whole ground into
       one flat colour, and the terraces are only there to say "dry hillside". -->
  <path d="M0 84 C 30 64, 60 68, 84 82 C 104 94, 118 92, 138 78 C 160 62, 176 64, 192 78 L192 0 L0 0 Z"
        fill="#D3A044" opacity="0.75"/>
  <path d="M0 192 L0 122 C 28 104, 58 108, 82 122 C 102 134, 118 132, 138 118 C 160 102, 176 106, 192 120 L192 192 Z"
        fill="#A96A1D" opacity="0.45"/>

  <!-- The confluence. Each tributary is stroked at 15 and the river they become
       at 24, so the widening is real rather than implied. -->
  <g fill="none" stroke="url(#water)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M64 22 C 62 52, 74 78, 92 96" stroke-width="15"/>
    <path d="M170 44 C 142 56, 116 74, 100 96" stroke-width="15"/>
    <path d="M96 92 C 96 122, 90 150, 74 182" stroke-width="24"/>
  </g>

  <!-- Low sun on the near bank. Detail for the large sizes; it simply fades out
       below about 48 px, which is the right thing for it to do. -->
  <g fill="none" stroke="#CDEBFA" stroke-linecap="round" opacity="0.5">
    <path d="M66 34 C 65 56, 74 76, 88 90" stroke-width="3.5"/>
    <path d="M160 50 C 138 60, 118 76, 106 90" stroke-width="3.5"/>
    <path d="M88 108 C 88 132, 83 152, 71 174" stroke-width="4.5"/>
  </g>
</svg>
