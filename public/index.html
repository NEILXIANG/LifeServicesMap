UI.es.guideProv=`<h3>⚕️ Cobertura de salud de BC (MSP + tarjeta Services Card)</h3>
<p>El plan público de salud de BC se llama MSP (Medical Services Plan). Solicite su tarjeta BC Services Card a través del <a href="https://www2.gov.bc.ca/gov/content/health/health-drug-coverage/msp/bc-residents/enrolment" target="_blank" rel="noopener">sitio web de Health Insurance BC</a>. <b>El período de espera es lo que reste del mes en que usted pasa a ser residente, más dos meses completos</b> — cerca de tres meses en el peor caso. Durante ese tiempo, las consultas y las urgencias se le facturan por completo, así que contrate un seguro médico privado <em>antes</em> de llegar para cubrir el hueco (la mayoría de las pólizas excluyen condiciones preexistentes: lea esa cláusula). Si se muda desde otra provincia canadiense, conserve su plan anterior hasta que termine la espera. El reloj arranca cuando usted <b>solicita</b>, así que solicite el primer día. Desde enero de 2020, el MSP no cobra prima mensual a los residentes inscritos.</p>
<h3>🩺 Cuando no encuentra médico de familia</h3>
<p>La escasez de médicos de familia aquí es general: muchos residentes de toda la vida tampoco tienen uno. No es un trato reservado a los residentes. El paso correcto es inscribirse en el <b>Health Connect Registry</b>, la lista de espera provincial: en línea, en pocos minutos, en <a href="https://www.healthlinkbc.ca/find-care/health-connect-registry" target="_blank" rel="noopener">HealthLink BC</a>, o llamando al <b>8-1-1</b> para inscribirse en su propio idioma (más de 130 idiomas). Necesitará su Número Personal de Salud (PHN), dirección, teléfono y correo. Mientras espera, no se queda sin atención: el <b>8-1-1</b> le comunica con enfermeras, farmacéuticos y dietistas las 24 horas; un <b>Urgent and Primary Care Centre</b> atiende lo no urgente el mismo día; una <b>clínica sin cita</b> cubre dolencias corrientes; en BC los farmacéuticos comunitarios pueden recetar para una lista de afecciones menores y vacunar; y la urgencia hospitalaria o el 911 son para emergencias reales. Recuerde que puede pedir intérprete gratuito para todo esto (sección anterior).</p>
<h3>🚗 Licencia, seguro y neumáticos de invierno</h3>
<p>Las licencias de conducir de BC son administradas por ICBC. Las licencias de muchos países pueden canjearse directamente, o calificar para requisitos reducidos de examen según la experiencia — consulte la página <a href="https://www.icbc.com/driver-licensing/new-to-bc" target="_blank" rel="noopener">"New to BC" de ICBC</a> para ver si su licencia califica bajo un acuerdo recíproco. Para tomar clases localmente, vea Categoría → Autoescuela. Dos cosas en las que los residentes pierden dinero de forma rutinaria: <b>el historial de seguro</b> — sus años sin siniestros en el extranjero solo cuentan si trae una carta de historial de reclamaciones en inglés de su aseguradora anterior; sin ella le tarifan como conductor novato, la prima más cara, y esa carta es mucho más fácil de obtener antes de salir que después. Y <b>los neumáticos de invierno</b> — la mayoría de las carreteras de montaña de BC los exigen del 1 de octubre al 31 de marzo, y algunas rutas hasta el 30 de abril. Un neumático de invierno legal lleva la marca M+S o el símbolo de la montaña de tres picos con copo de nieve, y al menos 3,5 mm de dibujo. Los "all-season" no son automáticamente neumáticos de invierno; la policía revisa, hay multas, y en una ruta de montaña pueden hacerle dar la vuelta.</p>
<h3>🎒 Matrícula escolar y apoyo lingüístico</h3>
<p>{CITY} pertenece al distrito escolar {SD}. Las escuelas públicas se asignan según la dirección — use el <a href="{SD_URL}" target="_blank" rel="noopener">buscador de zona escolar de {SD}</a> para encontrar su escuela local, luego contacte a la escuela o al distrito para inscribirse. Generalmente necesitará certificado de nacimiento/pasaporte, registro de vacunación, comprobante de domicilio y sus documentos de inmigración. Tres cosas que los padres más necesitan saber: <b>1. El inglés no es requisito de admisión.</b> Las escuelas ofrecen apoyo ELL (English Language Learner): su hijo va al grado que le corresponde y recibe ayuda lingüística adicional en paralelo; no se le retrasa de grado por el idioma. <b>2. Hay trabajadores de asentamiento gratuitos dentro de las escuelas.</b> SWIS (Settlement Workers in Schools) es un servicio gratuito específico para familias residentes: explica cómo funciona el sistema escolar, ayuda con formularios y reuniones de padres, conecta con actividades y puede gestionar interpretación. <b>3. La comunicación escuela-familia es más frecuente que en muchos países.</b> Los correos, las aplicaciones escolares y las reuniones importan; si no entiende algo, diga que necesita traducción. La escuela tiene la obligación de hacerle comprensible la información sobre su hijo.</p>
<h3>🏠 Alquiler: el mínimo que le garantiza la ley</h3>
<p>El depósito de garantía está legalmente limitado a <b>medio mes de alquiler</b> (más otro medio mes de depósito por mascota, si la tiene); más allá de eso, el propietario no puede exigir depósitos adicionales. La renta solo puede subirse <b>una vez cada 12 meses</b>, exige <b>tres meses completos</b> de aviso escrito en el formulario oficial (RTB-7), y el aumento máximo permitido en 2026 es del <b>2,3 %</b> — no está obligado a pagar un aumento por encima del tope o notificado sin el aviso debido. Los plazos de aviso, y la regla de que el propietario debe avisar por escrito con 24 horas antes de entrar, los fija la <a href="https://www2.gov.bc.ca/gov/content/housing-tenancy/residential-tenancies" target="_blank" rel="noopener">Oficina de Arrendamientos Residenciales de BC (RTB)</a>; para disputas, llame al <b>1-800-665-8779</b>. Tres trampas frecuentes: <b>estafas de alquiler</b> — un anuncio en el que nunca conoce a nadie y le piden transferir un depósito porque "estoy fuera de la ciudad" es casi siempre fraude; visite la vivienda en persona, conozca al propietario o a un agente con licencia, y obtenga un contrato escrito antes de mover dinero. <b>Sin historial crediticio local</b> — ofrezca una carta de oferta de empleo, extractos bancarios, un garante, o varios meses pagados por adelantado (ojo: el alquiler pagado por adelantado no es un depósito y la ley no se lo exige). <b>Promesas verbales</b> — reparaciones, servicios incluidos, mascotas permitidas: póngalo todo por escrito en el contrato, porque lo verbal es casi imposible de probar. Haga con el propietario un informe escrito del estado de la vivienda al entrar y al salir: es la prueba más fuerte que tendrá para recuperar el depósito.</p>
<h3>⚖️ Problemas legales y cómo obtener ayuda legal</h3>
<p>Necesitar ayuda legal no siempre significa pagar un abogado — BC tiene varias opciones gratuitas o de bajo costo. <b>Legal Aid BC</b> cubre derecho de familia, defensa criminal e inmigración/refugiados para personas que califican por ingresos — línea de {CITY} <b>250-314-1900</b>, línea provincial <b>1-866-577-2525</b>, legalaid.bc.ca. {CITY} tiene una clínica legal física, la <b>Okanagan Thompson Legal Clinic</b> (220-301 Victoria St, 236-425-9121), que ofrece ayuda gratuita o de bajo costo en derecho de familia, asistencia social/beneficios por discapacidad, seguro de desempleo, deudas y disputas de arrendamiento (vea Categoría → Ayuda legal en este mapa). <b>Access Pro Bono BC</b> (604-878-7400, accessprobono.ca) ofrece asesoría legal gratuita y referencias para personas de bajos ingresos, personas mayores de 55 años, personas con discapacidad e inmigrantes/refugiados. Las demandas de menor cuantía por debajo de $5,000 y las disputas de condominios pueden resolverse en línea, sin abogado, a través del <b>Tribunal de Resolución Civil de BC (CRT)</b> (1-844-322-2292). Los salarios impagos u otras disputas laborales van a la <b>Dirección de Normas Laborales de BC</b> (1-833-236-3700).</p>
<h3>🛡️ Si sufre discriminación, acoso o trato injusto</h3>
<p>Si le tratan de forma distinta por su <b>raza, color, lugar de origen, ascendencia, religión, los prejuicios asociados a su acento, sexo, edad, discapacidad u orientación sexual</b> — en la <b>contratación y en el trabajo, al alquilar vivienda, o en cualquier servicio abierto al público</b> (tienda, restaurante, escuela, hospital, autobús) — eso es ilegal en BC, existe una vía formal de queja, y <b>no necesita abogado ni inglés fluido</b> para usarla.</p>
<p><b>Paso uno: escríbalo.</b> Ese mismo día si es posible: fecha, hora, lugar, quién estaba presente, las palabras exactas hasta donde las recuerde, y qué respondió usted. Guarde mensajes, correos, el anuncio de empleo, el anuncio del alquiler, la conversación. Una nota escrita de memoria después también sirve: cuanto antes se escriba, más peso tiene.</p>
<p><b>Paso dos: elija la vía.</b> Presente la queja ante el <b>Tribunal de Derechos Humanos de BC</b>, <b>1-888-440-8844</b>. Se puede presentar en línea, es <b>gratuito</b>, y hay un <b>plazo de un año</b> desde los hechos (más allá hace falta una justificación aparte), así que no lo deje pasar. Si duda si presentarla, o quiere ayuda para redactarla, la <b>BC Human Rights Clinic</b> ofrece asistencia legal y representación gratuitas a los denunciantes que califican. Si ocurrió en el trabajo e implica salarios, horas o despido, la <b>Dirección de Normas Laborales</b> (1-833-236-3700) puede actuar en paralelo. Si hubo discurso de odio, amenazas o violencia, eso es materia penal: llame a la policía (911 en emergencias; el número no urgente está en la sección siguiente).</p>
<p><b>Sobre "¿esto es discriminación?"</b> Muchos residentes dudan de sí mismos: que le salten en la fila, que le hablen muy despacio, que le pregunten una y otra vez de dónde es <em>realmente</em>, enviar currículums al silencio. Parte es prejuicio irreflexivo; parte es trato desigual ilegal; y la línea no siempre se ve con claridad desde dentro. Puede llamar al <b>2-1-1</b>, contarlo en su idioma y pedir que le deriven, o sentarse una vez con un trabajador de asentamiento de una agencia local de servicios para inmigrantes: han visto muchísimas versiones de esto y pueden ayudarle a juzgar si es una queja formal o una conversación con el supervisor de alguien. <b>En cualquier caso, no es algo que tenga que digerir solo.</b></p>
<h3>🎓 Para estudiantes internacionales</h3>
<p><b>Horas de trabajo:</b> con permiso de estudios válido, matriculado a tiempo completo en una institución designada (DLI) y habiendo comenzado los estudios, puede trabajar fuera del campus hasta <b>24 horas por semana</b> durante los períodos lectivos, y sin límite durante los recesos programados (verano, invierno, semana de lectura). Necesita un SIN antes del primer turno. Superar el límite incumple las condiciones del permiso y puede costarle su condición de estudiante o derivar en una orden de salida — no crea a quien diga que "unas horas de más nunca se revisan": la nómina de su empleador <em>es</em> el registro.</p>
<p><b>Seguro médico:</b> los estudiantes también deben estar asegurados aquí. Su institución normalmente le inscribe de oficio en un seguro privado (como GuardMe) los primeros meses; después usted solicita el MSP y hace el cambio cuando se lo aprueben. El hueco entre ambos es donde la gente queda sin cobertura: confirme las dos fechas en la semana de orientación. La mayoría de los campus tienen además un plan complementario dental y de salud del sindicato estudiantil, en el que se le inscribe por defecto, con una ventana corta para darse de baja.</p>
<p><b>Estatus y después de graduarse:</b> la elegibilidad para el Permiso de Trabajo Posgraduación (PGWP) depende del tipo y la duración del programa y de la institución, y las reglas han cambiado varias veces en los últimos años. Guíese por el sitio de <a href="https://www.canada.ca/en/immigration-refugees-citizenship.html" target="_blank" rel="noopener">IRCC</a> y por la información vigente de su oficina internacional, no por lo que hizo un amigo hace tres años ni por la promesa verbal de un reclutador. Prepare cualquier renovación del permiso de estudios varios meses antes de que venza.</p>
<p><b>Estudios y bienestar:</b> las aulas canadienses dan mucho peso a la participación, al trabajo en grupo y a la <b>citación de fuentes</b>. Copiar sin atribución es falta académica, y las consecuencias pueden llegar a afectar su estatus migratorio — esto difiere mucho de lo que se tolera en algunos países, así que aprenda las normas de citación de su institución en el primer semestre. La asesoría académica, el centro de escritura y el servicio de consejería suelen estar ya incluidos en su matrícula. Usarlos no es una marca en su contra.</p>
<h3>🍲 Cuando el dinero no alcanza, o algo sale mal</h3>
<p>Que el efectivo escasee los primeros meses es extremadamente común, y existe toda una red para pedir ayuda sin pasar vergüenza. Los <b>bancos de alimentos</b> entregan comida presentando una identificación por cada miembro del hogar y no filtran por situación migratoria (los datos locales están en la sección siguiente y en el mapa). El <b>2-1-1</b> es la línea canadiense de derivación a servicios comunitarios — gratuita, confidencial, disponible en más de una docena de idiomas: describa el problema y le dirán qué agencia local lo atiende, ya sea alquiler, comida, cuidado infantil, violencia familiar, salud mental o servicios para mayores. Si el problema es el alquiler mismo, pregunte al 2-1-1 o a una agencia local por un <b>Rent Bank</b> (un pequeño préstamo reembolsable para evitar el desalojo). Los residentes de bajos ingresos que califiquen pueden solicitar la <b>Asistencia de Ingresos</b> provincial. Para las facturas de servicios, llame a la empresa y pida un acuerdo de pago: esa conversación va mucho mejor antes de un corte que después. Una advertencia: usar un banco de alimentos o los servicios sociales locales es un asunto distinto de su solicitud de inmigración, pero algunas categorías de permiso sí tienen condiciones relevantes — si no está seguro, pida primero asesoría gratuita a una agencia de asentamiento o a asistencia legal, en lugar de pasar hambre por miedo.</p>

UI.es.guideCA2=`<h3>☎️ Números útiles de un vistazo</h3>
<p><b>911</b> — policía/bomberos/ambulancia, para emergencias con riesgo vital; diga primero la dirección. <b>8-1-1</b> — HealthLink BC, asesoría de salud no urgente, enfermeras las 24 horas, interpretación en más de 130 idiomas a solicitud. <b>2-1-1</b> — derivación a servicios comunitarios y sociales (alquiler, comida, cuidado infantil, personas mayores, violencia familiar, salud mental); gratuito, confidencial, multilingüe. <b>988</b> — línea nacional de crisis por suicidio; llamada o mensaje de texto. <b>1-877-228-2557</b> — reserva de intérprete médico. <b>1-800-665-8779</b> — Oficina de Arrendamientos Residenciales de BC. <b>1-833-236-3700</b> — Normas Laborales de BC (salarios, horas, despido). <b>1-888-440-8844</b> — Tribunal de Derechos Humanos de BC (discriminación). <b>1-800-563-0808</b> — VictimLinkBC, apoyo a víctimas de violencia familiar y delitos, 24 horas, más de 110 idiomas. <b>250-828-3000</b> — línea no urgente de la RCMP local. La mayoría de los servicios gubernamentales pueden proporcionar un intérprete a solicitud, por lo que no se requiere inglés fluido para hacer trámites.</p>
<h3>🧭 ¿No sabe a quién preguntar? Empareje el problema con la puerta</h3>
<p>La dificultad más común de los residentes no es la falta de servicios, sino no saber qué organismo se ocupa de cada cosa. Esta lista cubre la mayoría de los casos:</p>
<p><b>Estatus, visas, patrocinio, ciudadanía</b> → IRCC (canada.ca) es la única fuente con autoridad; para un caso complicado, un consultor de inmigración con licencia (RCIC) o un abogado, y si el dinero escasea, pregunte antes a Legal Aid BC. No se fíe de las publicaciones en grupos de redes sociales: las reglas cambian cada año.<br>
<b>SIN, seguro de desempleo, pensiones CPP/OAS</b> → Service Canada (1-800-622-6232).<br>
<b>Impuestos, Beneficio por Hijos, crédito del GST</b> → Agencia Tributaria de Canadá (1-800-959-8281); para la declaración en sí, una clínica de impuestos gratuita.<br>
<b>Tarjeta de salud, ver a un médico, vacunas, salud mental</b> → 8-1-1 (24 horas, con intérpretes); si no tiene médico de familia, inscríbase en el Health Connect Registry.<br>
<b>Disputas de alquiler, depósitos, aumentos, desalojo</b> → RTB 1-800-665-8779; para asesoría legal gratuita, Access Pro Bono.<br>
<b>Salarios impagos, despido injusto, horas extra no pagadas</b> → Normas Laborales de BC 1-833-236-3700.<br>
<b>Discriminación o acoso</b> → Tribunal de Derechos Humanos de BC 1-888-440-8844 (plazo de un año).<br>
<b>Matrícula escolar, traslados, apoyo en inglés, cartas que no entiende</b> → la escuela misma, más SWIS (trabajadores de asentamiento en escuelas) y la oficina del distrito.<br>
<b>Licencia de conducir, seguro del auto, reclamos por accidente</b> → ICBC.<br>
<b>Servicios públicos, internet, disputas de facturación</b> → la línea de atención de la propia empresa; si no puede pagar una factura, llame antes del vencimiento y pida un acuerdo.<br>
<b>"Ni siquiera sé qué tipo de problema es este"</b> → llame al <b>2-1-1</b>, o entre a una agencia local de servicios para inmigrantes. Clasificar el problema es exactamente para lo que existen esas dos puertas.</p>
<p>Tres reglas que valen para todo: <b>1. Empiece por el sitio oficial</b> (direcciones que terminan en .gc.ca o .bc.ca); la información de agencias privadas y foros suele estar desactualizada o tener intereses. <b>2. Cualquier llamada que exija pago inmediato, pago con tarjetas de regalo, o que le amenace con arresto o deportación es una estafa</b> — cuelgue y devuelva la llamada al número que figura en el sitio oficial. <b>3. Anote la fecha, el nombre de quien le atendió y cualquier número de referencia</b>; muchos trámites aquí requieren varios contactos, y esas notas son lo que hace que la segunda llamada salga bien.</p>
<h3>🤝 Soledad, nostalgia y pertenecer de verdad</h3>
<p>La parte menos hablada y más universal de emigrar no es la visa ni la búsqueda de empleo: es <b>la soledad que llega a los pocos meses</b> — una capa de idioma entre usted y todos los demás, chistes que no capta, una identidad profesional puesta a cero, amistades de su país que se van adelgazando a través del huso horario. Eso no es fragilidad ni un fracaso de adaptación: casi todos los inmigrantes lo atraviesan, y el primer o segundo año suele ser lo más duro.</p>
<p><b>El apoyo en salud mental aquí es gratuito y confidencial.</b> Llame al <b>8-1-1</b> para preguntar por los servicios locales y pedir intérprete en su idioma; el <b>988</b> es la línea nacional de crisis, por teléfono o mensaje; la delegación local de la Asociación Canadiense de Salud Mental (CMHA) ofrece consejería y grupos gratuitos o de bajo costo; los estudiantes universitarios tienen consejería gratuita en el campus; y algunas agencias ofrecen consejería específicamente para inmigrantes, en su idioma. Usar cualquiera de estos servicios no afecta su situación migratoria.</p>
<p><b>En la práctica, las formas en que la gente se conoce aquí son bastante predecibles:</b> actividades gratuitas y círculos de conversación en la biblioteca; cursos en centros comunitarios; los grupos de padres y los equipos deportivos de la escuela de sus hijos; los lugares de culto (muchos funcionan además como centro comunitario del país de origen); el voluntariado — de lejos lo más eficiente, porque atiende a la vez la soledad y el problema de la "experiencia canadiense"; y los encuentros para residentes y los emparejamientos de amistad que organizan las agencias de asentamiento. La sociabilidad canadiense suele ser más lenta y más superficial al principio que en muchos países: un vecino que solo saluda no está siendo frío, y unos colegas que se van directo a casa tras el trabajo no le están excluyendo. Los vínculos se calientan tras meses de coincidir una y otra vez en la misma actividad fija. <b>Aparecer, repetidamente, a tiempo</b> cuenta más que lo bueno que sea su inglés.</p>
<p><b>Dos cosas que conviene decir con claridad sobre el acento y la identidad.</b> Primera: su acento no es un defecto — más de una quinta parte de la población de este país nació en el extranjero, y el inglés con acento es aquí la norma y no la excepción; posponer las cosas hasta que su inglés esté "listo" normalmente solo alarga el aislamiento. Segunda: si en ciertos entornos siente que le tratan distinto, esa percepción merece tomarse en serio y existen cauces formales (vea "discriminación", más arriba) — y tampoco tiene por qué definir su lectura de toda la ciudad, porque la gran mayoría de las interacciones diarias no son así.</p>
<p><b>Y permítase no asimilarse del todo.</b> Cocinar su comida, conservar sus fiestas, mantenerse cerca de su familia allá, encontrar aquí su propia comunidad de origen — nada de eso es no integrarse. Suele ser justamente el sistema de raíces que hace posible quedarse. Integrarse no es borrar quien uno era e instalar a otra persona.</p>
<p style="margin-top:14px;color:var(--sub-ink);font-size:11.5px;">Este es un resumen general de referencia basado en información pública — siempre confirme la política vigente en los sitios web oficiales o por teléfono, ya que las reglas pueden cambiar.</p>

UI.ko.guideCA1=`<h3>🛬 도착 후 첫 2주, 이 순서대로</h3>
<p>1️⃣ 휴대폰 SIM(연락이 닿게 하기) → 2️⃣ SIN(취업·세금신고·수당 수령의 전제) → 3️⃣ 주 의료보험 신청(대기 기간이 있으므로 도착 당일 신청) → 4️⃣ 은행 계좌 개설 → 5️⃣ 주거와 고정 주소 확보 → 6️⃣ 자녀 학교 등록 → 7️⃣ 운전면허. 이 단계들은 서로 의존합니다. SIN이 없으면 정식으로 급여를 받을 수 없고, 고정 주소가 없으면 처리되지 않는 절차가 많으며, 의료보험 대기 시계는 신청해야 비로소 돌아가기 시작합니다. 출국 전에 여권, 비자·이민 서류, 출생증명서, 혼인증명서, 학위증과 성적증명서, 예방접종 기록을 모두 스캔해 휴대폰과 클라우드에 보관하세요. 앞으로 6개월 동안 반복해서 요구받게 되며, 원본을 해외에서 재발급받으려면 몇 달이 걸리는 경우가 많습니다.</p>
<h3>🪪 사회보험번호(SIN)</h3>
<p>취업, 세금 신고, 대부분의 정부 혜택 신청에 SIN이 필요합니다. <a href="https://www.canada.ca/en/employment-social-development/services/sin.html" target="_blank" rel="noopener">Service Canada 웹사이트</a>에서 온라인으로 신청하거나, 지역 Service Canada 사무소를 방문해 직접 신청할 수 있습니다(이 지도의 「분류 → 정부/이민」에서 위치를 찾을 수 있습니다). 무료이며 보통 당일 또는 며칠 내에 발급됩니다. SIN은 평생 쓰는 신원 정보입니다. 고용주, 은행, 정부기관 외에 누가 요구하든 거절하세요. 국세청이나 이민국을 사칭해 SIN과 즉시 송금을 요구하는 전화 사기는 주민이 가장 흔히 겪는 사기입니다. 진짜 정부기관은 전화로 체포하겠다고 위협하지 않으며, 기프트카드나 암호화폐로 납부하라고 하지 않습니다.</p>
<h3>🏦 은행 계좌 개설</h3>
<p>현지 주요 은행(TD, CIBC, BMO, Scotiabank 등)은 대부분 "주민 환영 계좌"를 제공하며, 첫 해 월 수수료가 면제되고 여권과 이민/학생비자/취업비자 서류만으로 개설 가능해 현지 신용기록이 필요 없습니다. 여권, 이민 서류(영주권 카드/학생비자/취업비자), SIN 카드(있는 경우)를 지참해 지점을 방문하세요. 지도의 「분류 → 은행」에서 근처 지점을 찾을 수 있습니다. 창구에서 세 가지를 꼭 물어보세요. 월 수수료 면제 조건, 월 무료 거래 횟수, 해외 송금 수수료입니다. 은행마다 차이가 크고, 이 세 가지는 앞으로 몇 년간 매달 내게 될 비용입니다.</p>
<h3>💳 신용기록 처음부터 쌓기</h3>
<p>캐나다에서는 집을 빌릴 때, 휴대폰 요금제를 신청할 때, 자동차 할부를 받을 때, 때로는 취업 신원조회에서도 신용조회를 합니다. 갓 도착한 사람은 신용이 <em>나쁜</em> 것이 아니라 <em>기록 자체가 없는</em> 상태입니다. 시스템이 당신을 찾지 못하므로, 본국에서의 자산이나 소득과 무관하게 신청이 거절됩니다. 가장 빠른 시작은 <b>담보형 신용카드</b>(secured credit card: 예치한 금액이 한도가 되므로 사실상 승인 거절이 없습니다)나 은행의 주민용 기본 카드입니다. 그다음 소액의 고정 지출을 그 카드로 결제하고 <b>매달 전액을 기한 내 상환</b>하세요. 6~12개월이면 기본 기록이 만들어집니다. 흔한 함정 네 가지: "최소 결제액"만 내기(이자가 매우 높고 점수에도 도움이 되지 않습니다), 한도를 꽉 채워 쓰기(한도의 약 30% 이내 사용 권장), 짧은 기간에 여러 장 신청하기(조회할 때마다 점수가 깎입니다), 그리고 연체 — 한 번의 연체 기록도 수년간 남습니다. Equifax와 TransUnion 두 곳 모두에서 본인 신용보고서를 무료로 받아볼 수 있으며, 연 1회 확인하면 명의도용도 함께 잡아낼 수 있습니다.</p>
<h3>📱 휴대폰과 인터넷</h3>
<p>캐나다의 주요 통신사는 Rogers/Telus/Bell과 이들의 저가 브랜드(Fido, Koodo, Virgin Plus 등)로, 저가 브랜드가 대체로 더 저렴합니다. 우선 선불 SIM 카드로 급한 용무를 처리한 뒤, 정착 후 안정되면 약정 요금제를 고려하세요(약정에는 신용기록이나 보증금이 필요할 수 있습니다). 계약 전에 약정 기간, 데이터 초과 요금, 그리고 "공짜 단말기"가 2년간 비싼 요금제에 묶는 조건은 아닌지 확인하세요.</p>
<h3>🗣️ 영어가 서툴다면: 무료 통역을 요청할 권리가 있습니다</h3>
<p>주민이 가장 활용하지 못하는 권리입니다. 주 언어서비스(Provincial Language Service)를 통해 이 주의 공공 의료 체계는 <b>200개 이상 언어의 무료 통역을 하루 24시간, 환자와 가족에게 비용 없이</b> 제공합니다. 예약할 때나 접수 창구에서 "I need an interpreter. I speak ______." 라고 말하면 됩니다. 긴급 상황은 <b>1-877-228-2557</b>로 연락하세요. 건강 상담 <b>8-1-1</b>은 130개 이상 언어, 지역사회 서비스 안내 <b>2-1-1</b>은 십여 개 언어로 연계 서비스를 제공합니다. 진료실에서 아이에게 통역을 시키지 마세요. 의학 용어를 잘못 옮기면 실제로 위험하고, 아이에게는 부당한 부담입니다. 은행, 학교, 법률지원 기관도 대개 전화 통역을 준비해 줄 수 있습니다. 요청하는 것은 폐를 끼치는 일이 아니라 이미 당신을 위해 마련된 서비스를 쓰는 일입니다. 자기 언어 이름을 영어로 적은 쪽지("Korean", "Mandarin", "Tagalog")를 갖고 다니면 요청이 훨씬 빨라집니다.</p>
<h3>🧾 소득이 0이어도 세금 신고는 하세요</h3>
<p>캐나다의 많은 혜택은 신청하는 것이 아니라 <em>세금 신고에서 계산되어</em> 나옵니다. GST/HST 환급, 캐나다 아동수당(CCB), 대부분의 주 보조금은 전년도 신고 내역을 근거로 자동 지급됩니다. 즉 <b>그 해에 소득이 전혀 없어도 신고해야 하며, 신고하지 않으면 한 푼도 받지 못합니다</b>. 나중에 소급해 받으려면 훨씬 번거롭습니다. 신고 시즌은 보통 2월에 시작해 개인 마감일은 4월 30일입니다. 소득이 많지 않고 세무 상황이 단순한 사람(대부분의 주민, 유학생, 수당 수급자가 여기 해당)은 국세청(CRA)이 지원하는 <b>무료 세무 클리닉</b>(Community Volunteer Income Tax Program)에서 자원봉사자가 무료로 대신 신고해 줍니다. <a href="https://www.canada.ca/en/revenue-agency/services/tax/individuals/community-volunteer-income-tax-program.html" target="_blank" rel="noopener">CRA 웹사이트</a>에서 우편번호로 가까운 곳을 찾을 수 있습니다. 첫 신고는 보통 종이 서식을 우편으로 보내야 하며, 그 이후에 온라인 신고가 열립니다.</p>
<h3>💼 구직, 이력서, 학력 인정</h3>
<p>본국과 크게 다르고, 실제로 사람들이 막히는 지점이 세 군데 있습니다.</p>
<p><b>1. 이력서 형식이 다릅니다.</b> 캐나다 이력서는 보통 1~2쪽이며 <b>사진, 나이, 성별, 결혼 여부, 주민번호를 넣지 않습니다</b>. 오히려 넣으면 고용주가 차별 소지를 피하려고 그 이력서를 제쳐둘 수 있습니다. 담당 업무를 나열하기보다 구체적인 수치로 성과를 앞세우고, 커버레터는 지원할 때마다 새로 씁니다.</p>
<p><b>2. "캐나다 경력"의 악순환.</b> 많은 공고가 현지 경력을 요구하는데, 갓 온 사람에게는 당연히 없습니다. 보통의 돌파 경로는 이렇습니다. 현지 추천인을 얻기 위해 징검다리 일자리를 먼저 하고, 자원봉사를 하며(캐나다에서는 자원봉사 경력을 실제 경력으로 진지하게 인정하고 이력서에 씁니다), 정착지원 기관의 취업 상담과 <b>멘토 매칭</b>을 활용해 같은 업계에 자리 잡은 현지인에게 업계 관행과 인맥을 배웁니다.</p>
<p><b>3. 학력과 규제 직종.</b> 외국 학위 자체는 유효하지만, 학교 지원이나 일부 직종에서는 <b>학력 평가서</b>(WES 등 기관의 인증 보고서)를 요구합니다. 더 중요한 것은 의사, 간호사, 약사, 교사, 회계사, 엔지니어, 변호사, 전기기사, 배관공 등이 <b>규제 직종</b>이라는 점입니다. 해당 주의 전문 협회에서 면허를 받아야 일할 수 있고, 시험과 감독하 실습이 필요하며 1년에서 수년이 걸릴 수 있습니다. 이 분야라면 구직에 실패하고 나서가 아니라 도착 후 몇 주 안에 절차를 알아보기 시작하세요. 무료 이력서 첨삭, 모의 면접, 업계 설명회는 정착지원 기관의 기본 서비스입니다.</p>

`;UI.ja.guideCA1=`<h3>🛬 到着後の最初の2週間、この順番で</h3>
<p>1️⃣ 携帯電話のSIM（連絡が取れるようにする）→ 2️⃣ SIN（就労・確定申告・給付金受給に必須）→ 3️⃣ 州の医療保険に申請（待機期間があるため到着当日に申請）→ 4️⃣ 銀行口座を開設 → 5️⃣ 住まいと定まった住所を確保 → 6️⃣ 子どもを学校に登録 → 7️⃣ 運転免許証。これらは互いに依存しています：SINがなければ正式に給与を受け取れず、多くの申請には定まった住所が必要で、医療保険の待機期間は申請した時点から始まります。出国前にパスポート、ビザ・移民関連書類、出生証明書、婚姻証明書、学位記・成績証明書、予防接種記録をすべてスキャンし、携帯電話とクラウドの両方に保存しておいてください——今後半年間、繰り返しこれらの提出を求められますし、海外から原本を再取得するには数か月かかることもあります。</p>
<h3>🪪 社会保険番号（SIN）</h3>
<p>就労、確定申告、ほとんどの政府給付金の利用にはSINが必要です。<a href="https://www.canada.ca/en/employment-social-development/services/sin.html" target="_blank" rel="noopener">Service Canadaのウェブサイト</a>からオンラインで申請するか、最寄りのService Canadaオフィス（この地図の「カテゴリー→行政・移民」から探せます）で窓口申請できます。無料で、通常は当日か数日以内に発行されます。SINは一生使う個人情報です——雇用主・銀行・政府機関以外から求められたら断ってください。税務当局や移民局を装い、SINと即時の支払いを要求する電話詐欺は、住民が最もよく遭う詐欺のひとつです。本物の政府機関は電話で逮捕をちらつかせたり、ギフトカードや暗号資産での支払いを求めたりすることは絶対にありません。</p>
<h3>🏦 銀行口座の開設</h3>
<p>この国の主要銀行（TD、CIBC、BMO、Scotiabankなど）の多くは、初年度の月額手数料が無料になる「住民歓迎」口座を用意しており、パスポートと移民・就学・就労許可の書類があれば開設できます——現地の信用履歴は不要です。パスポート、移民関連書類（永住権カード／就学・就労許可証）、SINカード（お持ちの場合）を窓口に持参してください。近くの支店はこの地図の「カテゴリー→銀行」で探せます。窓口では3つ質問してください：月額手数料はどうすれば免除されるか、月に何回まで無料取引ができるか、海外送金にいくらかかるか。この3点は銀行によって大きく異なり、しかも何年にもわたって毎月支払うことになる費用です。</p>
<h3>💳 信用情報をゼロから築く</h3>
<p>カナダでは住居を借りるとき、携帯電話の契約、車のローン、ときには就職の身元確認にまで信用照会が関わります。来たばかりの人は信用が<em>悪い</em>のではなく、そもそも<em>記録がない</em>状態です。だからシステムはあなたを見つけられず、母国で何を所有し、いくら稼いでいたかに関係なく審査に落とされます。最も早い始め方は<b>担保付きクレジットカード</b>（預けたお金がそのまま利用限度額になるため、ほぼ自動的に審査が通ります）か、銀行の入門レベルの住民向けカードです。そこに毎月の小さな固定支出を乗せ、<b>毎月必ず全額・期日通りに支払う</b>——これを6〜12か月続けると基本的な信用記録ができます。よくある4つの落とし穴：「最低支払額」だけを払う（利息が重く、スコアの改善にもつながりません）、限度額いっぱいまで使う（利用は限度額の3割程度に抑えるのが目安です）、短期間に複数のカードに申し込む（審査のたびにスコアが下がります）、支払いを1回でも延滞する（一度の延滞記録が何年も残ることがあります）。EquifaxとTransUnionのどちらからも、自分の信用情報を無料で取り寄せられます。年に一度確認する習慣は、なりすまし被害の早期発見にもつながります。</p>
<h3>📱 携帯電話とインターネット</h3>
<p>主要キャリアはRogers・Telus・Bellと、それぞれの格安ブランド（Fido、Koodo、Virgin Plusなど）で、後者の方が通常安くなります。当面はプリペイドSIMから始め、生活が落ち着いてから契約プランに切り替えるのも一つの方法です（契約には信用履歴やデポジットが必要な場合があります）。契約前には、契約期間、データ超過時の追加料金、「無料スマホ」につられて2年間の高額プランに縛られていないかを確認してください。</p>
<h3>🗣️ 英語に自信がなくても：無料の通訳を依頼できます</h3>
<p>これは住民が最も活用できていない権利です。州の言語サービス（Provincial Language Service）を通じて、BC州の公的医療制度は<b>200以上の言語で24時間、患者やその家族の費用負担なしに通訳を提供</b>しています。予約時や受付で「通訳が必要です。話す言語は______です」と伝えるだけです。緊急の場合の連絡先は<b>1-877-228-2557</b>。<b>8-1-1</b>の医療相談ラインは130以上の言語に対応し、<b>2-1-1</b>のコミュニティサービス案内も十数言語での案内があります。診察の場でお子さんに通訳をさせるのは避けてください——医療用語の誤訳は実際の健康被害につながりますし、子どもに背負わせるには重すぎる責任です。銀行、学校、法律相談窓口も電話通訳を手配できることが多く、頼むことは決して迷惑ではありません——最初からあなたのために用意されているサービスです。自分の言語名を英語で紙に書いて持ち歩く（「Mandarin」「Tagalog」「Tigrinya」など）と、依頼がスムーズになります。</p>
<h3>🧾 収入がゼロの年でも確定申告を</h3>
<p>カナダの給付金の多くは自分で申請するものではなく、<em>確定申告の内容から自動計算</em>されます。GST/HSTクレジット、カナダ児童手当（CCB）、多くの州の補助は前年の申告に基づいて自動的に支払われます。つまり<b>収入がまったくない年でも申告しないと何も受け取れず</b>、後から遡って請求するのはずっと手間がかかります。申告シーズンは通常2月に始まり、個人の期限は4月30日です。収入が少なく状況がシンプルな場合（住民、留学生、給付受給者の多くが該当します）、CRAが支援する<b>無料税務クリニック</b>（Community Volunteer Income Tax Program）が無料で代行してくれます。<a href="https://www.canada.ca/en/revenue-agency/services/tax/individuals/community-volunteer-income-tax-program.html" target="_blank" rel="noopener">CRAのサイト</a>で郵便番号から検索できます。最初の申告は多くの場合、オンライン提出が使えるようになる前に一度郵送する必要があります。</p>
<h3>💼 仕事、履歴書、資格の認定</h3>
<p>ここでは多くの国と異なる仕組みが3つあり、皆がつまずくポイントでもあります：</p>
<p><b>1. 履歴書の形式が違います。</b> カナダの履歴書は通常1〜2ページで、<b>写真・年齢・性別・婚姻状況・身分証番号は一切載せません</b>——載せるとむしろ書類選考で外されることがあります。差別リスクに見える要素を雇用主が避けるためです。職務内容の羅列より具体的な成果や数字を前面に出し、応募先ごとにカバーレターを書き直してください。</p>
<p><b>2.「カナダでの経験」というジレンマ。</b> 多くの求人が現地経験を求めますが、来たばかりでは当然まだありません。よくある突破口は：まず橋渡し的な仕事に就いて現地の推薦者を得ること、ボランティア活動（カナダではボランティアは真剣に評価され、履歴書に堂々と書けます）、そして定住支援機関が行う就労相談と<b>メンター制度</b>を使い、同じ分野で既に活躍している人と組んでもらうことです。</p>
<p><b>3. 資格と規制対象の専門職。</b> 海外の学位そのものは有効ですが、学校や一部の雇用主は<b>資格評価</b>（WESなどの機関によるレポート）を求めます。さらに重要なのは、医師・看護師・薬剤師・教師・会計士・エンジニア・弁護士・電気工・配管工は<b>規制対象の専門職</b>だという点です——該当の州規制機関から免許を得るまで働くことができず、試験や実務研修が必要で1年から数年かかることもあります。該当する分野であれば、1年間申請に落ち続けてからではなく、来た最初の数週間のうちに問い合わせを始めてください。無料の履歴書添削、模擬面接、業界説明会は定住支援機関の標準的なサービスです。</p>

UI.ko.guideProv=`<h3>⚕️ BC주 건강보험(MSP + BC Services Card)</h3>
<p>BC주의 공공 의료보험은 MSP(Medical Services Plan)라고 합니다. <a href="https://www2.gov.bc.ca/gov/content/health/health-drug-coverage/msp/bc-residents/enrolment" target="_blank" rel="noopener">Health Insurance BC 웹사이트</a>를 통해 BC Services Card를 신청하세요. <b>대기 기간은 이 주의 거주자가 된 달의 남은 기간에 두 달을 더한 기간</b>으로, 최대 3개월에 가깝습니다. 이 기간에는 진료비와 응급실 비용을 전액 본인이 부담하므로, 도착 <em>전에</em> 민간 의료보험을 들어 공백을 메우는 것이 좋습니다(대부분의 보험은 기왕증을 보장하지 않으니 해당 조항을 꼭 확인하세요). 캐나다 다른 주에서 이주하는 경우, 대기 기간이 끝날 때까지 이전 주의 보험을 유지하세요. 대기 시계는 <b>신청한 시점</b>부터 돌아가므로 도착 첫날 신청하고 미루지 마세요. 2020년 1월부터 MSP는 가입 거주자에게 월 보험료를 받지 않습니다.</p>
<h3>🩺 가정의를 구하지 못할 때</h3>
<p>이곳의 가정의 부족은 전반적인 문제로, 평생 이곳에 산 주민들도 가정의가 없는 경우가 많습니다. 주민만 겪는 차별이 아닙니다. 올바른 절차는 주 단위 대기자 명단인 <b>Health Connect Registry</b>에 등록하는 것입니다. <a href="https://www.healthlinkbc.ca/find-care/health-connect-registry" target="_blank" rel="noopener">HealthLink BC</a>에서 온라인으로 몇 분이면 등록되고, <b>8-1-1</b>로 전화하면 모국어로 등록할 수 있습니다(130개 이상 언어 지원). 개인건강번호(PHN), 주소, 전화번호, 이메일이 필요합니다. 기다리는 동안에도 이용할 의료는 있습니다. <b>8-1-1</b>은 24시간 간호사·약사·영양사와 연결되고, <b>Urgent and Primary Care Centre</b>는 응급은 아니지만 당일 진료가 필요한 경우를 맡으며, <b>워크인 클리닉</b>은 일반적인 질환을 봅니다. BC주에서는 동네 약사가 일부 경증 질환에 처방하고 예방접종도 할 수 있습니다. 병원 응급실과 911은 진짜 응급 상황을 위한 것입니다. 이 모든 경우에 무료 통역을 요청할 수 있다는 점을 기억하세요(앞 절 참조).</p>
<h3>🚗 운전면허, 자동차보험, 겨울용 타이어</h3>
<p>BC주 운전면허는 ICBC에서 관리합니다. 많은 국가/지역의 운전면허는 직접 교환하거나 운전 경력에 따라 도로주행시험이 일부 면제될 수 있습니다. <a href="https://www.icbc.com/driver-licensing/new-to-bc" target="_blank" rel="noopener">ICBC의 "New to BC" 페이지</a>에서 상호 인정 협약 대상인지 확인하세요. 현지에서 운전 교습을 받으려면 지도의 「분류 → 운전학원」에서 찾을 수 있습니다. 주민이 자주 손해를 보는 두 가지가 있습니다. <b>첫째, 보험 경력</b>입니다. 본국에서 무사고로 보낸 여러 해는, 이전 보험사가 영어로 발급한 사고이력 증명서(claims history letter)를 가져와야만 인정됩니다. 없으면 초보 운전자로 분류되어 가장 비싼 보험료를 내게 되며, 이 서류는 출국 후보다 출국 전에 받는 편이 훨씬 쉽습니다. <b>둘째, 겨울용 타이어</b>입니다. BC주의 산악 고속도로 대부분은 매년 10월 1일부터 3월 31일까지(일부 구간은 4월 30일까지) 겨울용 타이어를 의무화합니다. 합법적인 겨울용 타이어에는 M+S 표시 또는 삼봉설상(three-peaked mountain/snowflake) 마크가 있어야 하고, 트레드 깊이가 최소 3.5mm여야 합니다. 사계절 타이어가 곧 겨울용 타이어인 것은 아닙니다. 경찰이 실제로 단속하고 벌금이 부과되며, 산길에서는 되돌아가라는 지시를 받을 수도 있습니다.</p>
<h3>🎒 자녀 학교 등록과 언어 지원</h3>
<p>{CITY}는 {SD} 학군에 속하며, 공립학교는 주소지에 따라 배정됩니다. <a href="{SD_URL}" target="_blank" rel="noopener">{SD} 공식 학군 조회 도구</a>에 주소를 입력해 해당 학교를 확인한 후, 학교 또는 학군 사무소에 연락해 등록 절차를 진행하세요. 보통 출생증명서/여권, 예방접종 기록, 주소 증명, 이민 서류가 필요합니다. 학부모가 가장 알아야 할 세 가지가 있습니다. <b>첫째, 영어는 입학 조건이 아닙니다.</b> 학교는 ELL(English Language Learner) 지원을 제공합니다. 아이는 원래 학년에 배치되고 그와 병행해 추가 언어 지원을 받으며, 영어 때문에 학년이 내려가지 않습니다. <b>둘째, 학교 안에 무료 정착지원 담당자가 있습니다.</b> SWIS(Settlement Workers in Schools)는 신규 이민 가정을 위한 무료 서비스로, 학교 제도를 설명하고 서류 작성과 학부모 상담을 돕고 방과후 자원을 연결하며 통역도 준비해 줍니다. <b>셋째, 학교와 가정 사이의 연락이 많은 나라보다 훨씬 잦습니다.</b> 이메일, 학교 앱, 학부모 면담이 모두 중요합니다. 읽을 수 없는 문서가 있으면 번역이 필요하다고 말하세요. 학교는 자녀에 관한 정보를 보호자가 이해할 수 있게 전달할 의무가 있습니다.</p>
<h3>🏠 임대: 법이 보장하는 최저선</h3>
<p>보증금(damage deposit)은 법적으로 <b>임대료의 절반</b>이 상한이며(반려동물이 있으면 반려동물 보증금으로 반 달치를 더 받을 수 있음), 그 이상의 추가 보증금은 요구할 수 없습니다. 임대료는 <b>12개월에 한 번만</b> 인상할 수 있고, 공식 양식(RTB-7)으로 <b>세 달 전</b>에 서면 통지해야 하며, 2026년 법정 인상 상한은 <b>2.3%</b>입니다. 상한을 넘거나 적법한 통지 없이 통보된 인상은 받아들일 의무가 없습니다. 퇴거 통지 기간, 집주인이 집에 들어오려면 24시간 전 서면 통지를 해야 한다는 규정 등은 <a href="https://www2.gov.bc.ca/gov/content/housing-tenancy/residential-tenancies" target="_blank" rel="noopener">BC주 임차인 권익보호처(RTB)</a>가 정하며, 분쟁 시 <b>1-800-665-8779</b>로 문의하세요. 주민이 자주 빠지는 함정 셋: <b>임대 사기</b> — 아무도 직접 만나지 않은 채 "지금 다른 도시에 있다"며 보증금 송금을 요구하는 매물은 거의 모두 사기입니다. 반드시 직접 방문하고, 집주인 본인이나 면허가 있는 중개인을 만나고, 서면 임대차계약서를 받은 뒤에 돈을 보내세요. <b>현지 신용기록이 없는 문제</b> — 신용보고서 대신 고용 제안서, 은행 잔고 증명, 보증인, 또는 몇 달치 선납을 제시할 수 있습니다(선납 임대료는 보증금이 아니며, 법이 요구하는 것도 아닙니다). <b>구두 약속</b> — 수리, 공과금 포함, 반려동물 허용 등은 모두 계약서에 적어야 합니다. 구두 약속은 분쟁에서 증명하기가 거의 불가능합니다. 입주할 때와 퇴거할 때 집주인과 함께 서면 상태점검서(condition inspection report)를 작성하세요. 나중에 보증금을 돌려받을 때 가장 강력한 증거가 됩니다.</p>
<h3>⚖️ 법률 문제와 법률 지원 받기</h3>
<p>법률 문제가 생겼다고 반드시 변호사를 선임해야 하는 것은 아닙니다. BC주에는 무료 또는 저비용으로 이용할 수 있는 여러 경로가 있습니다. <b>Legal Aid BC</b>(법률 지원 BC)는 소득 기준을 충족하는 사람들을 위해 가족법, 형사 변호, 이민/난민 관련 법률 지원을 제공합니다({CITY} 지역 전화 <b>250-314-1900</b>, 주 전체 상담전화 <b>1-866-577-2525</b>, legalaid.bc.ca). {CITY}에는 <b>Okanagan Thompson Legal Clinic</b>(220-301 Victoria St, 전화 236-425-9121)이라는 실제 법률 클리닉이 있어 가족법, 사회부조/장애수당, 실업보험, 채무, 임대 분쟁 등에 대해 무료 또는 저비용 지원을 제공합니다(지도의 「분류 → 법률 지원」에서 확인 가능). <b>Access Pro Bono BC</b>(604-878-7400, accessprobono.ca)는 저소득층, 55세 이상 노인, 장애인, 이민자/난민에게 무료 법률 상담과 연계 서비스를 제공합니다. 5,000달러 미만의 소액 청구 소송이나 콘도/공동주택 분쟁은 변호사 없이 <b>BC 민사분쟁해결심판원(CRT)</b>(1-844-322-2292)을 통해 온라인으로 처리할 수 있습니다. 임금 체불 등 직장 관련 분쟁은 <b>BC주 노동기준처</b>(1-833-236-3700)에 문의하세요.</p>
<h3>🛡️ 차별·괴롭힘·부당한 대우를 겪었다면</h3>
<p><b>인종, 피부색, 출신지, 혈통, 종교, 억양에 따라붙는 편견, 성별, 나이, 장애, 성적 지향</b> 때문에 <b>채용과 직장에서, 집을 구할 때, 또는 일반에 열려 있는 모든 서비스(상점, 식당, 학교, 병원, 버스)</b>에서 다르게 취급받았다면, 이는 BC주에서 위법이며 공식 진정 절차가 있습니다. 그리고 <b>변호사도, 유창한 영어도 필요하지 않습니다.</b></p>
<p><b>첫째, 기록하세요.</b> 가능하면 그날 안에 날짜, 시각, 장소, 그 자리에 있던 사람, 상대가 실제로 한 말(기억나는 만큼 그대로), 그리고 본인이 한 대답을 적어 두세요. 문자, 이메일, 채용 공고, 임대 광고, 대화 기록을 보관하세요. 나중에 기억을 되살려 적은 메모도 유효하며, 빨리 적을수록 신빙성이 높습니다.</p>
<p><b>둘째, 경로를 고르세요.</b> <b>BC 인권심판원(BC Human Rights Tribunal)</b>에 진정을 제기하세요. 전화 <b>1-888-440-8844</b>, 온라인 제출 가능, <b>무료</b>이며, 사건 발생일로부터 <b>1년의 기한</b>이 있습니다(기한을 넘기면 별도의 사유가 필요합니다). 그러니 미루지 마세요. 제기 여부가 망설여지거나 서류 작성에 도움이 필요하면, <b>BC 인권 클리닉(BC Human Rights Clinic)</b>이 자격 요건을 갖춘 진정인에게 무료 법률 지원과 대리를 제공합니다. 직장에서 벌어졌고 임금·근로시간·해고와 관련된다면 <b>BC주 노동기준처</b>(1-833-236-3700)에도 함께 신고할 수 있습니다. 혐오 발언, 협박, 폭력이 있었다면 형사 사안이므로 경찰에 신고하세요(응급 911, 비응급 번호는 다음 절 참조).</p>
<p><b>"이게 차별이 맞나?" 싶을 때.</b> 많은 주민이 스스로를 의심합니다. 순서에서 밀리고, 유난히 느린 말투로 대해지고, "그런데 원래 어디 출신이냐"는 질문을 반복해서 받고, 보낸 이력서가 아무 응답 없이 사라집니다. 어떤 것은 무심한 편견이고 어떤 것은 위법한 차별 대우이며, 그 경계는 당사자 입장에서 늘 분명하지 않습니다. <b>2-1-1</b>에 전화해 모국어로 상황을 설명하고 연계를 받아도 되고, 지역 이민자 지원 기관의 정착 담당자를 한 번 만나 보아도 좋습니다. 그들은 비슷한 사례를 아주 많이 봐 왔고, 공식 진정이 필요한 일인지 상대의 관리자와 이야기하면 될 일인지 판단하는 데 도움을 줄 수 있습니다. <b>어느 쪽이든, 혼자 삭여야 하는 일은 아닙니다.</b></p>
<h3>🎓 유학생을 위한 안내</h3>
<p><b>근로 시간:</b> 유효한 학생비자를 가지고 지정교육기관(DLI)에 풀타임으로 등록해 이미 수업을 시작했다면, 학기 중에는 교외에서 <b>주 24시간</b>까지 일할 수 있고, 학교 정규 방학(여름·겨울 방학, 리딩 위크) 중에는 시간 제한 없이 일할 수 있습니다. 첫 근무 전에 SIN이 있어야 합니다. 한도를 넘겨 일하면 비자 조건 위반이 되어 학생 신분을 잃거나 출국 명령으로 이어질 수 있습니다. "몇 시간쯤 더 해도 아무도 확인 안 한다"는 말을 믿지 마세요. 고용주의 급여 기록이 곧 기록입니다.</p>
<p><b>의료보험:</b> 유학생도 이곳에서 보험 가입이 의무입니다. 학교는 보통 도착 후 첫 몇 달간 민간보험(GuardMe 등)에 자동 가입시키고, 그 이후에는 본인이 MSP를 신청해 승인되면 전환해야 합니다. 사람들이 무보험 상태가 되는 지점이 바로 이 두 보험 사이의 공백이니, 오리엔테이션 주간에 두 시점을 반드시 확인하세요. 대부분의 캠퍼스에는 학생회의 치과·추가 의료 플랜도 있으며, 기본으로 가입되고 정해진 기간 안에만 탈퇴할 수 있습니다.</p>
<p><b>신분과 졸업 후:</b> 졸업후취업비자(PGWP) 자격은 전공 과정의 종류와 기간, 그리고 학교에 따라 달라지고, 규정이 최근 몇 년간 여러 차례 바뀌었습니다. <a href="https://www.canada.ca/en/immigration-refugees-citizenship.html" target="_blank" rel="noopener">IRCC 웹사이트</a>와 학교 국제처의 최신 안내를 기준으로 삼으세요. 몇 년 전 선배의 경험이나 유학원의 구두 약속에 의존하면 안 됩니다. 학생비자 연장은 만료 몇 달 전부터 준비하세요.</p>
<p><b>학업과 마음 건강:</b> 캐나다 강의실은 수업 참여, 조별 과제, 그리고 <b>출처 표기</b>를 매우 중요하게 봅니다. 출처를 밝히지 않고 베끼는 것은 학문적 부정행위이며, 결과가 이민 신분에까지 영향을 줄 만큼 무거울 수 있습니다. 일부 국가에서 관행적으로 넘어가는 것과는 크게 다르므로, 첫 학기에 학교의 인용 규정을 확실히 익히세요. 학업 상담, 글쓰기 센터, 심리 상담은 대개 이미 등록금에 포함되어 있습니다. 이용하는 것은 흠이 아닙니다.</p>
<h3>🍲 돈이 부족하거나 일이 잘못되었을 때</h3>
<p>정착 초기에 현금이 빠듯한 것은 매우 흔한 일이며, 부끄러움 없이 도움을 청할 수 있는 경로가 촘촘히 마련되어 있습니다. <b>푸드뱅크</b>는 가구 구성원의 신분증을 제시하면 식품을 제공하며, 이민 신분을 따지지 않습니다(현지 정보는 다음 절과 지도에 있습니다). <b>2-1-1</b>은 캐나다의 지역사회 서비스 연계 전화로, 무료이고 비밀이 보장되며 십여 개 언어로 이용할 수 있습니다. 어떤 어려움인지 말하면 그 문제를 다루는 지역 기관을 알려 줍니다. 집세, 식품, 보육, 가정폭력, 정신건강, 노인 서비스 모두 물어볼 수 있습니다. 집세 자체가 문제라면 2-1-1이나 지역 기관에 <b>Rent Bank</b>(퇴거를 막기 위한 소액 상환형 대출)에 대해 물어보세요. 자격이 되는 저소득 주민은 주정부의 <b>Income Assistance</b>(사회부조)를 신청할 수 있습니다. 공과금은 회사에 전화해 분납을 요청하세요. 이 대화는 공급이 끊긴 뒤보다 끊기기 전에 훨씬 잘 풀립니다. 한 가지 주의할 점: 푸드뱅크나 지역 사회복지 서비스를 이용하는 것은 이민 신청과는 별개의 사안이지만, 일부 비자 유형에는 관련 조건이 있습니다. 확실하지 않다면 두려움 때문에 굶지 말고, 먼저 정착지원 기관이나 법률 지원 기관에 무료로 문의하세요.</p>

`;UI.ja.guideProv=`<h3>⚕️ BC州の医療保険（MSP + BC Services Card）</h3>
<p>BC州の公的医療制度はMSP（Medical Services Plan）といいます。<a href="https://www2.gov.bc.ca/gov/content/health/health-drug-coverage/msp/bc-residents/enrolment" target="_blank" rel="noopener">Health Insurance BCのウェブサイト</a>からBC Services Cardを申請してください。<b>待機期間は、居住者になった月の残り日数に、まるまる2か月を加えた期間</b>——最長で3か月近くになることもあります。この間の診察や救急対応は全額自己負担になるため、到着<em>前</em>に民間の医療保険に加入して空白期間をカバーしてください（多くの保険は既往症を除外しているので、その条項は必ず読んでください）。カナダの他州から移ってきた場合は、待機期間が終わるまで以前の州の保険を維持してください。時計は<b>申請した瞬間</b>から動き出すので、後回しにせず到着当日に申請しましょう。2020年1月以降、MSPは加入者から月額保険料を徴収していません。</p>
<h3>🩺 かかりつけ医が見つからないとき</h3>
<p>家庭医の不足はこの地域全体の問題で、長年住んでいる住民の多くもかかりつけ医を持っていません。あなたが特別に不利な扱いを受けているわけではありません。正しい手順は、州の待機者リストである<b>Health Connect Registry</b>に登録することです：<a href="https://www.healthlinkbc.ca/find-care/health-connect-registry" target="_blank" rel="noopener">HealthLink BC</a>から数分でオンライン登録できるほか、<b>8-1-1</b>に電話して自分の言語で登録することもできます（130以上の言語に対応）。個人健康保険番号（PHN）、住所、電話番号、メールアドレスが必要です。待っている間も医療から見放されるわけではありません——<b>8-1-1</b>は24時間、看護師・薬剤師・栄養士につながり、<b>Urgent and Primary Care Centre</b>は緊急ではない当日対応の症状を、<b>walk-inクリニック</b>は日常的な体調不良を診てくれます。BC州の薬剤師は一部の軽度の症状について処方や予防接種を行うこともでき、本当の緊急時は救急外来か911です。これらすべてで無料通訳を依頼できることも忘れないでください（前節参照）。</p>
<h3>🚗 運転免許、保険、冬用タイヤ</h3>
<p>BC州の運転免許はICBCが管轄しています。多くの国の免許はそのまま交換できるか、運転経験に応じて実技試験の一部が免除されることがあります——<a href="https://www.icbc.com/driver-licensing/new-to-bc" target="_blank" rel="noopener">ICBCの「New to BC」ページ</a>で自分の免許が相互協定の対象か確認してください。地元で教習を受けたい場合は「カテゴリー→自動車教習所」を見てください。住民がよく損をする点が2つあります：<b>保険加入歴</b>——海外での無事故運転歴は、以前の保険会社から英語の事故歴証明書を取り寄せた場合にのみ有効です。それがないと保険初心者として最も高い保険料で査定され、その証明書は出発前に取得する方がずっと簡単です。そして<b>冬用タイヤ</b>——BC州のほとんどの山岳道路では10月1日から3月31日まで（一部は4月30日まで延長）冬用タイヤの装着が義務付けられています。適合するタイヤにはM+Sの表示か、三つの山と雪の結晶のマークがあり、溝の深さが3.5mm以上必要です。オールシーズンタイヤは自動的に冬用タイヤとはみなされません。警察の取り締まりがあり、違反すると罰金の対象になるほか、山岳道路では引き返しを命じられることもあります。</p>
<h3>🎒 学校の入学手続きと言語サポート</h3>
<p>{CITY}は{SD}学区に属しています。公立学校は自宅住所によって割り当てられるため、<a href="{SD_URL}" target="_blank" rel="noopener">{SD}の学区検索ツール</a>で地元の学校を調べ、その学校または学区事務局に連絡して登録してください。通常、出生証明書／パスポート、予防接種の記録、住所証明、移民関連書類が必要です。保護者が特に知っておきたいことが3つあります：<b>1. 英語力は入学の条件ではありません。</b> 学校にはELL（English Language Learner）支援があり、お子さんは学年相応のクラスに在籍しながら追加の言語サポートを受けます。言語を理由に学年を下げられることはありません。<b>2. 学校には無料の定住支援員がいます。</b> SWIS（Settlement Workers in Schools）は住民家庭のための無料サービスで、学校制度の仕組みを説明し、書類作成や保護者面談に付き添い、地域の活動につなげ、通訳の手配もしてくれます。<b>3. 学校と家庭のやり取りは、多くの国より頻繁です。</b> メール、学校専用アプリ、保護者面談はどれも重要です。読めないものがあれば「翻訳が必要です」とはっきり伝えてください。お子さんに関する情報を保護者が理解できる形にするのは学校側の義務です。</p>
<h3>🏠 賃貸住宅：法律が保障する最低ライン</h3>
<p>敷金の上限は法律で<b>家賃の半月分</b>と決まっています（ペットを飼う場合はペット敷金としてさらに半月分まで上乗せ可能）。それ以上の追加の敷金を家主が要求することはできません。家賃の値上げは<b>12か月に1回まで</b>で、公式書式（RTB-7）による<b>まる3か月前</b>の書面通知が必要です。2026年の上限は<b>2.3%</b>で、これを超える値上げや、適切な通知のない値上げに応じる義務はありません。通知期間や、家主が入室の24時間前までに書面で通知しなければならないという規則は<a href="https://www2.gov.bc.ca/gov/content/housing-tenancy/residential-tenancies" target="_blank" rel="noopener">BC州賃貸住宅局（RTB）</a>が定めています。トラブルの際は<b>1-800-665-8779</b>へ。住民が陥りやすい3つの罠：<b>賃貸詐欺</b>——一度も会わずに「今出張中で」といった理由で先に敷金の送金を求める物件情報は、ほぼ確実に詐欺です。必ず内見し、家主または正規の仲介業者に会い、お金を動かす前に書面の賃貸契約を交わしてください。<b>現地の信用履歴がない場合</b>——採用通知書、預金残高証明、保証人、数か月分の家賃前払いなどで代替できます（前払い家賃は法律上「敷金」ではなく、家主が要求する義務もないことに注意してください）。<b>口約束</b>——修繕、光熱費込み、ペット可などはすべて書面の契約書に明記してください。口約束はトラブルになったときにほぼ証明できません。入居時・退去時には家主と一緒に書面での状態確認レポートを作成しましょう。敷金を取り戻したいときに最も強力な証拠になります。</p>
<h3>⚖️ 法律問題と法律扶助の受け方</h3>
<p>法律の助けが必要でも、必ずしも弁護士費用を払う必要はありません——BC州には無料または低額の選択肢がいくつもあります。<b>Legal Aid BC</b>は家族法、刑事弁護、移民・難民関連について、所得要件を満たす人を対象にカバーしています——{CITY}の窓口<b>250-314-1900</b>、州全体の窓口<b>1-866-577-2525</b>、legalaid.bc.ca。{CITY}には実店舗の法律相談所<b>Okanagan Thompson Legal Clinic</b>（220-301 Victoria St、236-425-9121）があり、家族法、生活保護・障害者給付、雇用保険、債務、賃貸トラブルについて無料または低額の相談ができます（この地図の「カテゴリー→法律扶助」参照）。<b>Access Pro Bono BC</b>（604-878-7400、accessprobono.ca）は低所得者、55歳以上の高齢者、障害のある人、移民・難民に無料の法律相談と紹介を提供しています。5,000ドル未満の少額訴訟やマンション（strata/condo）に関する紛争は、弁護士なしで<b>BC Civil Resolution Tribunal</b>（1-844-322-2292）を通じてオンラインで解決できます。未払い賃金などの職場トラブルは<b>BC州労働基準局</b>（1-833-236-3700）へ。</p>
<h3>🛡️ 差別・ハラスメント・不当な扱いを受けたとき</h3>
<p><b>人種、肌の色、出身地、出自、宗教、訛りに対する思い込み、性別、年齢、障害、性的指向</b>を理由に扱いを変えられた場合——<b>採用や職場、住宅の賃貸、あるいは店・レストラン・学校・病院・バスなど一般に開かれたサービス</b>のどこであっても——それはBC州の法律違反であり、正式な申立の方法があります。<b>弁護士も流暢な英語も必要ありません。</b></p>
<p><b>ステップ1：記録に残す。</b> できればその日のうちに、日付・時間・場所・その場にいた人・実際に言われた言葉（できる限り正確に）・自分が返した言葉を書き留めてください。テキストメッセージ、メール、求人広告、物件広告も保存を。後から記憶を頼りに書いたメモでも有効ですが、早く書くほど証拠としての重みが増します。</p>
<p><b>ステップ2：申立先を選ぶ。</b> <b>BC州人権審判所</b>（<b>1-888-440-8844</b>）に申し立てます。オンラインで申請でき、<b>無料</b>で、出来事から<b>1年の期限</b>があります（期限を過ぎた申立には別途理由の説明が必要）ので、先延ばしにしないでください。申し立てるべきか迷う場合や書き方の助けが必要な場合、<b>BC Human Rights Clinic</b>が対象者に無料の法律支援と代理を提供します。職場での出来事で賃金・労働時間・解雇が関わる場合は、<b>BC州労働基準局</b>（1-833-236-3700）と並行して進められます。ヘイトスピーチ、脅迫、暴力が伴う場合は刑事事件です——警察に通報してください（緊急時は911、非緊急番号は次節）。</p>
<p><b>「これは本当に差別なのか」ということについて。</b> 多くの住民が自分を疑ってしまいます——後回しにされる、極端にゆっくり話しかけられる、「本当はどこの出身か」と繰り返し聞かれる、履歴書を送っても音沙汰がない、など。無意識の偏見であることもあれば、違法な差別的扱いであることもあり、その境界は渦中にいると見えにくいものです。<b>2-1-1</b>に電話して自分の言語で状況を説明し紹介を受けるか、地元の移民支援機関の定住支援員に一度相談してみてください。彼らはこうしたケースを数多く見てきており、正式な申立が必要か、それとも上司との会話で済むかを一緒に判断してくれます。<b>いずれにせよ、これはあなたひとりで抱え込むべきことではありません。</b></p>
<h3>🎓 留学生の方へ</h3>
<p><b>労働時間：</b> 有効な就学許可を持ち、指定学習機関（DLI）でフルタイムに在籍し、すでに授業が始まっていれば、学期中はキャンパス外で週<b>24時間まで</b>働くことができ、規定の休暇期間（夏休み、冬休み、リーディングウィーク）中は時間の制限なく働けます。初出勤前にSINが必要です。上限を超えて働くと就学許可の条件違反となり、学生としての身分を失ったり、退去処分につながったりすることがあります——「数時間の超過なら誰も見ていない」という言葉は信じないでください。雇用主の給与記録がそのまま証拠になります。</p>
<p><b>医療保険：</b> 留学生もここでの保険加入が必須です。多くの教育機関は最初の数か月、自動的に民間保険（GuardMeなど）に加入させ、その後自分でMSPを申請し、承認され次第切り替える形になります。この2つの間の空白期間で無保険になってしまう人が多いので、オリエンテーション週間で両方の日付を必ず確認してください。多くのキャンパスには学生自治会の追加医療・歯科プランがデフォルトで適用されており、期限内であれば脱退することもできます。</p>
<p><b>在留資格と卒業後の生活：</b> 卒業後就労許可（PGWP）の対象になるかどうかは、プログラムの種類・期間や在籍する教育機関によって決まり、近年ルールが何度も変更されています。3年前に友人がした通りにするのでも、リクルーターの口約束を信じるのでもなく、<a href="https://www.canada.ca/en/immigration-refugees-citizenship.html" target="_blank" rel="noopener">IRCCのウェブサイト</a>と留学生課の最新の説明を頼りにしてください。就学許可の延長手続きは、期限が切れる数か月前から始めましょう。</p>
<p><b>学業と心身の健康：</b> カナダの授業では授業参加、グループワーク、そして<b>引用のルール</b>が重視されます。出典を示さない引用は学術不正にあたり、在留資格に影響するほど重い処分になることもあります——一部の国での慣習とは大きく異なるため、最初の学期のうちに学校の引用ルールを確認しておいてください。学修アドバイジング、ライティングセンター、カウンセリングは通常すでに学費に含まれています。利用してもマイナス評価にはなりません。</p>
<h3>🍲 お金が足りないとき、うまくいかないとき</h3>
<p>最初の数か月は資金が厳しくなるのがごく普通で、恥ずかしさを感じずに助けを求める方法はいくつもあります。<b>フードバンク</b>は世帯構成員の身分証明書があれば食料を提供し、在留資格による選別は行いません（詳細は次節と地図をご覧ください）。<b>2-1-1</b>はカナダのコミュニティサービス案内窓口で、無料・匿名・十数言語対応です。状況を伝えれば、家賃、食料、保育、家庭内暴力、メンタルヘルス、高齢者サービスなど、どの機関が担当かを教えてくれます。家賃そのものが問題なら、2-1-1や地元の支援機関に<b>Rent Bank</b>（立ち退きを防ぐための少額の返済型融資）について尋ねてください。条件を満たす低所得の住民は州の<b>生活保護（Income Assistance）</b>を申請できます。公共料金については、滞納になる前に事業者に電話して分割払いの相談をする方が、停止された後より圧倒的にスムーズです。一点だけ注意：フードバンクや地域の福祉サービスの利用は在留資格の申請とは別の話ですが、一部の許可区分には関係する条件があるものもあります。不安な場合は、空腹を我慢する前にまず定住支援機関や法律扶助に無料相談してください。</p>

UI.ko.guideCA2=`<h3>☎️ 주요 연락처 한눈에</h3>
<p><b>911</b>——경찰/화재/구급, 생명이 위급할 때. 연결되면 주소부터 말하세요. <b>8-1-1</b>——HealthLink BC 비응급 건강 상담, 24시간 간호사 연결, 요청하면 130개 이상 언어 통역. <b>2-1-1</b>——지역사회·사회복지 서비스 연계(집세, 식품, 보육, 노인, 가정폭력, 정신건강). 무료·비밀 보장·다국어. <b>988</b>——전국 자살예방 위기 상담 전화, 통화와 문자 모두 가능. <b>1-877-228-2557</b>——의료 통역 예약. <b>1-800-665-8779</b>——BC주 임차인 권익보호처(RTB). <b>1-833-236-3700</b>——BC주 노동기준처(임금, 근로시간, 해고). <b>1-888-440-8844</b>——BC 인권심판원(차별 진정). <b>1-800-563-0808</b>——VictimLinkBC, 가정폭력 및 범죄 피해자 지원, 24시간, 110개 이상 언어. <b>250-828-3000</b>——지역 RCMP 경찰 비응급 신고. 대부분의 정부 서비스는 "interpreter"(통역)를 요청할 수 있어, 유창한 영어를 구사하지 못해도 업무를 처리할 수 있습니다.</p>
<h3>🧭 어디에 물어야 할지 모를 때: 문제별 담당처</h3>
<p>주민이 가장 흔히 겪는 어려움은 서비스가 없어서가 아니라, 그 일을 어느 기관이 맡는지 몰라서 생깁니다. 아래 목록이 대부분의 상황을 덮습니다.</p>
<p><b>체류 신분, 비자, 초청, 시민권</b> → IRCC(canada.ca)가 유일한 공식 출처입니다. 복잡한 사안은 공인 이민 컨설턴트(RCIC)나 변호사에게, 비용이 부담되면 먼저 Legal Aid BC에 문의하세요. 소셜미디어 단톡방의 경험담에 의존하지 마세요. 규정은 해마다 바뀝니다.<br>
<b>SIN, 고용보험(EI), 연금(CPP/OAS)</b> → Service Canada (1-800-622-6232).<br>
<b>세금, 아동수당(CCB), GST 환급</b> → 캐나다 국세청 CRA (1-800-959-8281). 신고 자체는 무료 세무 클리닉에서.<br>
<b>건강보험카드, 진료, 예방접종, 정신건강</b> → 8-1-1(24시간, 통역 가능). 가정의가 없으면 Health Connect Registry에 등록.<br>
<b>임대 분쟁, 보증금, 임대료 인상, 퇴거</b> → RTB 1-800-665-8779. 무료 법률 조언은 Access Pro Bono.<br>
<b>임금 체불, 부당해고, 초과근무 미지급</b> → BC주 노동기준처 1-833-236-3700.<br>
<b>차별 또는 괴롭힘</b> → BC 인권심판원 1-888-440-8844(1년 기한).<br>
<b>학교 등록, 전학, 영어 지원, 읽을 수 없는 안내문</b> → 학교 자체 + SWIS(학교 내 정착지원 담당자) + 학군 사무소.<br>
<b>운전면허, 자동차보험, 사고 보상</b> → ICBC.<br>
<b>공과금, 인터넷, 청구 분쟁</b> → 해당 회사 고객센터. 청구서를 낼 수 없으면 연체 전에 전화해 분납을 요청하세요.<br>
<b>"이게 무슨 종류의 문제인지조차 모르겠다"</b> → <b>2-1-1</b>에 전화하거나 지역 이민자 지원 기관을 직접 찾아가세요. 문제를 분류해 주는 것이 바로 이 두 곳의 존재 이유입니다.</p>
<p>어디에나 통하는 세 가지 원칙: <b>첫째, 공식 웹사이트(.gc.ca 또는 .bc.ca로 끝나는 주소)부터 확인하세요.</b> 사설 업체나 포럼의 정보는 오래되었거나 이해관계가 얽혀 있는 경우가 많습니다. <b>둘째, 즉시 송금을 요구하거나 기프트카드로 내라고 하거나 체포·추방하겠다고 위협하는 전화는 모두 사기입니다.</b> 끊고, 공식 사이트에 적힌 번호로 직접 다시 걸어 확인하세요. <b>셋째, 날짜와 통화한 담당자 이름, 접수번호를 적어 두세요.</b> 이곳의 많은 절차는 여러 번 연락해야 하며, 그 메모가 두 번째 통화를 훨씬 수월하게 만듭니다.</p>
<h3>🤝 외로움, 향수, 그리고 진짜로 속하게 되는 일</h3>
<p>이민 경험에서 가장 적게 이야기되면서도 가장 보편적인 부분은 비자나 구직이 아니라 <b>몇 달 뒤에 찾아오는 외로움</b>입니다. 나와 모두 사이에 한 겹 놓인 언어, 알아듣지 못하는 농담, 0으로 되돌아간 직업적 정체성, 시차와 거리 때문에 서서히 얇아지는 본국의 관계들. 이것은 당신이 약해서도, 적응에 실패해서도 아닙니다. 거의 모든 이민자가 지나는 단계이고, 보통 첫 1~2년이 가장 힘듭니다.</p>
<p><b>정신건강 지원은 무료이고 비밀이 보장됩니다.</b> <b>8-1-1</b>에 전화해 지역 정신건강 서비스를 문의하고 모국어 통역을 요청할 수 있습니다. <b>988</b>은 전국 위기 상담 전화로 통화와 문자 모두 가능합니다. 캐나다정신건강협회(CMHA) 지역 지부는 무료 또는 저비용 상담과 그룹 프로그램을 운영합니다. 대학생은 교내에서 무료 상담을 받을 수 있고, 일부 기관은 이민자를 대상으로 모국어 상담을 제공합니다. 이런 서비스를 이용해도 이민 신분에는 아무런 영향이 없습니다.</p>
<p><b>현실적으로, 이곳 사람들이 실제로 친구를 만드는 경로는 상당히 정해져 있습니다.</b> 도서관의 무료 프로그램과 회화 모임, 커뮤니티센터의 취미 강좌, 자녀 학교의 학부모 모임과 스포츠 팀, 종교시설(상당수가 동향 커뮤니티 센터 역할도 합니다), 자원봉사(외로움과 "캐나다 경력 없음" 문제를 동시에 푸는 가장 효율적인 방법입니다), 그리고 정착지원 기관이 여는 주민 모임과 친구 매칭 프로그램입니다. 캐나다의 사교는 처음에는 많은 나라보다 느리고 얕은 편입니다. 인사만 하는 이웃이 차가운 것이 아니고, 퇴근 후 곧장 집으로 가는 동료가 당신을 배제하는 것도 아닙니다. 같은 고정 활동에서 몇 달간 반복해 마주쳐야 관계가 데워집니다. <b>꾸준히, 시간 맞춰 나타나는 것</b>이 영어 실력보다 더 큰 역할을 합니다.</p>
<p><b>억양과 정체성에 대해 분명히 해 둘 것이 두 가지 있습니다.</b> 첫째, 당신의 억양은 결함이 아닙니다. 이 나라 인구의 5분의 1 이상이 해외에서 태어났고, 억양이 있는 영어는 예외가 아니라 이곳의 기본값입니다. "영어가 완벽해지면 나가야지" 하고 미루면 대개 고립만 길어집니다. 둘째, 어떤 자리에서 실제로 다르게 대우받는다고 느꼈다면 그 감각은 진지하게 다뤄질 가치가 있고 공식 경로도 있습니다(앞의 "차별" 절 참조). 동시에 그 경험이 이 도시 전체에 대한 판단이 될 필요는 없습니다. 일상적인 상호작용의 대다수는 그렇지 않습니다.</p>
<p><b>그리고 완전히 동화되지 않아도 된다고 스스로에게 허락하세요.</b> 모국 음식을 해 먹고, 자기 명절을 지키고, 본국 가족과 가깝게 지내고, 이곳에서 같은 출신의 공동체를 찾는 것 — 어느 것도 통합의 실패가 아닙니다. 오히려 오래 머무는 일을 가능하게 하는 뿌리인 경우가 많습니다. 통합이란 원래의 자신을 지우고 다른 사람을 설치하는 일이 아닙니다.</p>
<p style="margin-top:14px;color:var(--sub-ink);font-size:11.5px;">위 내용은 공개된 정보를 종합해 정리한 입문 참고 자료이며, 구체적인 정책은 공식 웹사이트 또는 전화 확인을 기준으로 합니다. 정책은 변경될 수 있습니다.</p>
`;UI.ja.guideCA2=`<h3>☎️ よく使う電話番号一覧</h3>
<p><b>911</b>——警察・消防・救急、命に関わる緊急時。まず住所を伝えてください。<b>8-1-1</b>——HealthLink BCの非緊急医療相談、24時間看護師が対応、依頼すれば130以上の言語で通訳可能。<b>2-1-1</b>——コミュニティ・福祉サービスの案内（家賃、食料、保育、高齢者、家庭内暴力、メンタルヘルス）。無料・匿名・多言語対応。<b>988</b>——全国自殺予防相談窓口。電話またはテキストメッセージで。<b>1-877-228-2557</b>——医療通訳の予約。<b>1-800-665-8779</b>——BC州賃貸住宅局。<b>1-833-236-3700</b>——BC州労働基準局（賃金、労働時間、解雇）。<b>1-888-440-8844</b>——BC州人権審判所（差別に関する訴え）。<b>1-800-563-0808</b>——VictimLinkBC、家庭内暴力・犯罪被害者支援、24時間、110以上の言語対応。<b>250-828-3000</b>——地元RCMP（警察）の非緊急窓口。ほとんどの政府サービスは依頼すれば通訳を用意してくれるので、流暢な英語がなくても手続きは可能です。</p>
<h3>🧭 どこに聞けばいいか分からないとき：問題別の相談先</h3>
<p>住民が最もよくぶつかる困難は「サービスがない」ことではなく、「どこが担当なのか分からない」ことです。以下でだいたいの状況をカバーできます：</p>
<p><b>在留資格、ビザ、スポンサー、市民権</b> → IRCC（canada.ca）が唯一の正式な情報源です。複雑なケースは正規の移民コンサルタント（RCIC）や弁護士に、費用が心配なら先にLegal Aid BCに相談を。SNSの投稿は当てにしないでください——ルールは毎年変わります。<br>
<b>SIN、雇用保険、CPP／OAS年金</b> → Service Canada（1-800-622-6232）。<br>
<b>税金、カナダ児童手当、GSTクレジット</b> → カナダ歳入庁（1-800-959-8281）。申告作業自体は無料税務クリニックへ。<br>
<b>医療保険証、受診、予防接種、メンタルヘルス</b> → 8-1-1（24時間、通訳あり）。かかりつけ医がいなければHealth Connect Registryに登録を。<br>
<b>賃貸トラブル、敷金、家賃値上げ、立ち退き</b> → RTB 1-800-665-8779。無料法律相談はAccess Pro Bonoへ。<br>
<b>未払い賃金、不当解雇、未払い残業代</b> → BC州労働基準局 1-833-236-3700。<br>
<b>差別・ハラスメント</b> → BC州人権審判所 1-888-440-8844（申立期限は1年）。<br>
<b>学校の入学・転校、英語支援、読めない書類</b> → まず学校自体、それにSWIS（学校定住支援員）と学区事務局。<br>
<b>運転免許、自動車保険、事故対応</b> → ICBC。<br>
<b>公共料金、インターネット、請求のトラブル</b> → 各事業者のカスタマーライン。支払いが難しければ延滞になる前に電話して分割の相談を。<br>
<b>「そもそも何の問題か分からない」</b> → <b>2-1-1</b>に電話するか、地元の移民支援機関を訪ねてください。振り分け（トリアージ）こそがこの2つの窓口の役目です。</p>
<p>すべてに共通する3つの原則：<b>1. まず公式サイトを見る</b>（.gc.caや.bc.caで終わるアドレス）。仲介業者や掲示板の情報は古かったり、利害が絡んでいたりします。<b>2. 即時の支払いやギフトカードでの支払いを要求する、逮捕や強制送還をちらつかせる電話は詐欺です</b>——一度切って、公式サイトに載っている番号にかけ直してください。<b>3. 日付、話した相手の名前、参照番号を書き留める</b>——ここでの手続きの多くは複数回のやり取りが必要で、そのメモが次の連絡をスムーズにします。</p>
<h3>🤝 孤独、ホームシック、そして本当の意味で馴染むこと</h3>
<p>移住であまり語られないのに最も普遍的なのは、ビザや仕事探しではなく<b>数か月後にやってくる孤独感</b>です——言葉の壁、通じない冗談、ゼロにリセットされた仕事上の立場、時差の向こうで少しずつ薄れていく母国の友人関係。それは弱さでも、適応できていないことの証でもありません。移民のほとんどがこの時期を通り、最初の1〜2年が一番つらいのが普通です。</p>
<p><b>メンタルヘルスの支援はここでは無料で、内容も守られます。</b> <b>8-1-1</b>に電話すれば地域のメンタルヘルスサービスについて聞け、自分の言語での通訳も依頼できます。<b>988</b>は全国共通の危機相談窓口で電話でもテキストメッセージでも利用できます。地元のカナダ精神保健協会（CMHA）支部は無料・低額のカウンセリングやグループを運営しており、大学生はキャンパスで無料カウンセリングを受けられ、移民向けに母語でカウンセリングを行う機関もあります。これらを利用しても在留資格には一切影響しません。</p>
<p><b>実際に人と知り合うきっかけは、ここではかなりパターンが決まっています。</b> 無料の図書館プログラムや会話サークル、コミュニティセンターの講座、子どもの学校の保護者会やスポーツチーム、宗教施設（母国コミュニティの拠点を兼ねていることも多い）、そしてボランティア活動——孤独と「カナダでの経験がない」という2つの課題を同時に解決できる、最も効率のよい方法です。さらに定住支援機関が開く住民同士の交流会や友人マッチングも。カナダ人の付き合い方は最初、多くの国よりゆっくりで淡白に見えます。挨拶だけの隣人は冷たいわけではなく、仕事終わりにまっすぐ帰る同僚も排除しているわけではありません。ここでの友情は、同じ活動で何度も顔を合わせるうちに、数か月かけて温まっていくのが普通です。英語の上手さより、<b>繰り返し、時間通りに顔を出すこと</b>の方が効きます。</p>
<p><b>訛りとアイデンティティについて、はっきり言っておきたいことが2つあります。</b> ひとつ目、あなたの訛りは欠点ではありません——この国の人口の5分の1以上が海外生まれで、訛りのある英語はここでは例外ではなく標準です。「英語が完璧になってから」と先延ばしにすると、孤立の期間が延びるだけのことが多いです。ふたつ目、もし実際に扱いの違いを感じる場面があれば、その感覚は真剣に受け止める価値があり、正式な相談窓口もあります（前述の「差別」の項参照）——ただしそれが街全体への印象を決める必要はありません。日々のやり取りの大部分はそうではないからです。</p>
<p><b>また、完全に同化しなくてもよいと自分に許可を出してください。</b> 自国の料理を作る、自国の行事を続ける、故郷の家族と近い関係を保つ、ここで自分の出身コミュニティを見つける——どれも「馴染めていない」ことにはなりません。むしろそれこそが、ここに留まり続けるための根っこになることがほとんどです。馴染むということは、これまでの自分を消して誰か別の人になることではありません。</p>
<p style="margin-top:14px;color:var(--sub-ink);font-size:11.5px;">これは公開情報に基づく一般的な出発点のまとめです——制度は変わることがあるため、必ず公式サイトまたは電話で最新の内容をご確認ください。</p>

os para hogares que lo necesitan, presentando una identificación por cada miembro del hogar; no se revisa la situación migratoria. Familias y padres solos por un lado, personas solas y parejas por otro, en días distintos, con un horario más temprano para mayores de 60 años y una pausa al mediodía. Confirme horarios y frecuencia en el sitio web o por teléfono.","ko":"⭐ 도움이 필요한 가구에 식품을 제공하며, 가구 구성원 각자의 신분증을 제시하면 됩니다. 이민 신분은 확인하지 않습니다. 가족·한부모 가구와 1인·부부 가구가 서로 다른 요일에 방문하고, 60세 이상 노인은 더 이른 시간대가 있으며 점심 무렵 휴식 시간이 있습니다. 정확한 시간과 이용 횟수는 홈페이지나 전화로 확인하세요.","ja":"⭐生活に困っている世帯への食料支援、世帯全員分の身分証提示で利用可、移民ステータスは問われない。家族・ひとり親世帯と単身・カップル世帯で利用日が分かれ、60歳以上のシニアには早い時間帯があり、昼は休止時間もある。最新の時間帯と利用頻度は公式サイトまたは電話で確認を"},"src":"stub-pending-verify","precision":"low","v":"2026-09-07","id":"8857cba0","t":["free","multi"]},{"n":"St. Andrew's on the Square","c":"heritage","g":"sk","lat":50.675,"lng":-120.338,"a":"159 Seymour St","w":"https://www.kamloops.ca/recreation-culture/culture-heritage/heritage-buildings/st-andrews-square","note":{"zh":"建于1887年，是全市最古老的公共建筑，晚期维多利亚哥特复兴风格。1991年险被拆除，1996年由市政府买下修复并连同旁边的广场重新向公众开放；2026年完成又一轮大修后重开，现作为活动与文化场地使用。开放时间随活动安排变动，前往前请查官网。","en":"Built in 1887 and the city's oldest public building, in late Victorian Gothic Revival style. Saved from demolition in 1991, bought and restored by the City in 1996 and reopened to the public along with the square beside it; it reopened again in 2026 after a further major restoration, and is used as an events and cultural venue. Opening depends on what is booked, so check the website before going.","fr":"Construit en 1887, c'est le plus ancien bâtiment public de la ville, de style néogothique victorien tardif. Sauvé de la démolition en 1991, acheté et restauré par la Ville en 1996 puis rouvert au public avec la place attenante; il a rouvert de nouveau en 2026 après une autre restauration majeure et sert de lieu d'événements et de culture. L'ouverture dépend des réservations : vérifiez le site avant de vous déplacer.","es":"Construido en 1887, es el edificio público más antiguo de la ciudad, de estilo neogótico victoriano tardío. Se salvó de la demolición en 1991, la Ciudad lo compró y restauró en 1996 y lo reabrió al público junto con la plaza contigua; volvió a reabrir en 2026 tras otra restauración importante y se usa como sede de eventos y actividades culturales. La apertura depende de lo que esté reservado: consulte el sitio web antes de ir.","ko":"1887년에 지어진 이 도시에서 가장 오래된 공공 건축물로, 후기 빅토리아 고딕 리바이벌 양식입니다. 1991년 철거 위기를 넘긴 뒤 1996년 시가 매입·복원해 옆 광장과 함께 다시 공개했고, 2026년 대규모 보수를 마치고 재개관해 행사·문화 공간으로 쓰입니다. 개방 여부는 예약 일정에 따라 달라지므로 방문 전 홈페이지를 확인하세요.","ja":"1887年建造、市内最古の公共建築でヴィクトリア朝後期ゴシック・リバイバル様式。1991年に取り壊しの危機を免れ、1996年に市が買い取って修復し、隣接する広場とともに一般公開。2026年にはさらなる大規模改修を経て再オープンし、イベント・文化施設として利用されている。開館は予約状況によるため、訪問前に公式サイトを確認"},"src":"stub-pending-verify","precision":"low","v":"2026-09-07","id":"a60de679","t":["scenic","history","culture"]},{"n":"The Old Courthouse","c":"heritage","g":"sk","lat":50.675,"lng":-120.339,"a":"7 Seymour St W","w":"https://www.kamloops.ca/recreation-culture/culture-heritage/heritage-buildings/old-courthouse","note":{"zh":"1909年落成的三层法院旧址，现归市政府所有，作为艺术、文化与社区活动的场地使用，本地艺术组织在此办展览与演出。是否开放取决于当期活动，前往前请查官网。","en":"A three-storey courthouse completed in 1909, now owned by the City and used as a hub for arts, culture and community events, with local arts organisations running exhibitions and performances here. Whether it is open depends on what is on, so check the website before going.","fr":"Un palais de justice de trois étages achevé en 1909, aujourd'hui propriété de la Ville et utilisé comme pôle des arts, de la culture et des activités communautaires; des organismes artistiques locaux y présentent expositions et spectacles. L'ouverture dépend de la programmation : vérifiez le site avant de vous déplacer.","es":"Un juzgado de tres plantas terminado en 1909, hoy propiedad de la Ciudad y usado como centro de arte, cultura y actividades comunitarias, donde organizaciones artísticas locales realizan exposiciones y funciones. Que esté abierto depende de la programación: consulte el sitio web antes de ir.","ko":"1909년에 완공된 3층짜리 옛 법원 건물로, 현재는 시 소유이며 예술·문화·지역 행사 공간으로 쓰입니다. 지역 예술 단체가 이곳에서 전시와 공연을 엽니다. 개방 여부는 그때의 프로그램에 따라 달라지므로 방문 전 홈페이지를 확인하세요.","ja":"1909年完成の3階建て旧裁判所、現在は市が所有し、芸術、文化、地域イベントの拠点として利用。地元の芸術団体が展示、公演を行っている。開館状況はその時のイベント次第のため、訪問前に公式サイトを確認"},"src":"stub-pending-verify","precision":"low","v":"2026-09-07","id":"ca483553","t":["scenic","history","culture"]}];

<h3>🏙️ 关于{CITY}</h3>
<p>{CITY}（甘露市）位于{PROV}内陆南部，坐落在North Thompson River与South Thompson River交汇处，是Tk'emlúps te Secwépemc（Secwepemc/舒斯瓦普原住民族）的传统领地。全市人口约9.8万（2021年人口普查），连都会区约12.7万人。气候是典型的半干旱大陆性气候，夏季炎热干燥（7月平均高温约27-28°C），冬季寒冷（1月平均低温约-7至-8°C），降水明显少于温哥华等沿海地区。因投入大量体育场馆设施、常年承办各类业余体育赛事，{CITY}素有"加拿大锦标赛之都（Tournament Capital of Canada）"之称。本地经济主要依托Thompson Rivers University（TRU大学）、林木加工、矿业、区域医疗中心及旅游业。</p>
<h3>🧭 落地第一站：本地居民服务</h3>
<p>如果你刚到、只来得及做一件事，那就是联系 <b>{CITY} Immigrant Services</b>（448 Tranquille Road，电话 778-470-6101 或 1-866-672-0855，办公时间周一至周五 8:30–16:30；地图「分类 → 政务移民」可查看位置）。这是本地的定居服务机构，服务免费，主要包括：</p>
<p><b>免费英语课（LINC）</b>——面向17岁以上、身份为永久居民/难民/确认在永居通道上的居民，周一至周四开课，上午、下午、晚上均有班次，另有远程学习和英语会话小组；符合条件的学员上课期间还提供免费学龄前托儿。<b>定居与融入辅导</b>——帮你理解表格、政府信件、预约流程。<b>就业服务</b>——简历修改、模拟面试、职业导师配对。<b>SWIS学校移民服务</b>——面向{SD}学区新移民家庭的免费服务，帮孩子适应学校、陪同家长会、协助填表并可安排传译。<b>传译与翻译</b>——需要时主动提出即可。</p>
<p>另外两个高频入口：<b>公共图书馆</b>（地图「分类 → 图书馆」）提供免费借书卡、公共电脑与打印、儿童活动和成人英语会话角，是居民最省钱的落脚点之一；<b>2-1-1</b> 电话可以直接用母语描述困难，由对方帮你转介到本地对口机构。</p>
<h3>🚌 没有车怎么在这里生活</h3>
<p>{CITY}地形起伏大、居住区分散，市中心与North Shore、Sahali、Aberdeen、Valleyview、Brocklehurst、Westsyde之间距离不近，坡度也不小——刚来的人很容易低估"看起来只有两公里"实际走起来的难度。<b>{TRANSIT}</b> 运营本地公交（本工具的「🚌 公交」面板收录了全部常规线路和站点，可离线查看），学生、长者有优惠票种；市府的 <b>KamPASS（可负担交通）</b> 计划为低收入居民提供补贴月票，申请与 <b>ARCH（可负担康乐）</b> 计划共用同一份表格，需要经由指定的转介机构提交。<b>ARCH</b> 本身则让符合条件的低收入居民以大幅折扣使用市属泳池、健身与康乐设施——对刚落地、还没有稳定收入的家庭来说，这两项是最值得先去问的本地福利。冬天等车请预留时间：坡道结冰时公交会延误，路面盐化后也很滑。</p>
<h3>🎓 在TRU读书或陪读</h3>
<p>Thompson Rivers University（TRU）是本市最大的教育机构，也是大量国际学生落地后的第一个"社区"。校内通常有国际学生办公室（负责签证、保险、迎新）、学术辅导与写作中心、免费心理咨询、学生会的补充医疗与牙科计划、以及各国同学会——这些多数已包含在学费里，不用白不用。TRU的校园在Sahali一带，有多条公交线路直达；学期内校园周边的租房需求很紧张，建议尽早开始找。留学生的打工时数、保险衔接、毕业工签等规则见上一节「留学生须知」，并以学校国际部当期公告为准。带孩子来陪读的家长，也可以同时联系上文的定居服务机构，孩子的入学与语言支持走的是同一套流程。</p>
<h3>🌡️ 本地的四季，和两件外地人常低估的事</h3>
<p><b>夏天：干热与山火烟霾。</b>本地夏季白天常达30°C以上且非常干燥，体感与湿热气候完全不同，最容易出问题的是脱水和晒伤——随身带水、避开午后强晒。更需要提前知道的是<b>山火季（大约7到9月）</b>：{PROV}内陆在山火季可能出现持续数日的烟霾，空气质量指数飙升，此时应关窗、减少户外运动、有呼吸道疾病或哮喘的人尤其要备好药物并留意官方空气质量健康指数（AQHI）通报。这不是每年都严重，但值得提前做心理准备。</p>
<p><b>冬天：雪、冰和黑得早。</b>本地冬季气温常在零下，路面结冰、坡道打滑是常态。三件必备：<b>真正的冬靴</b>（要有防滑鞋底，运动鞋在冰面上非常危险）、<b>分层保暖的衣服</b>（内层排汗、中层保暖、外层防风防水，比一件厚外套有效得多）、以及<b>合规的冬季轮胎</b>（见上一节的法规说明）。另外，冬至前后本地下午四点多天就黑了，日照骤减引起情绪低落（季节性情绪失调）在北方城市很常见——尽量白天出门晒太阳、保持运动、必要时向医生咨询，这是可以处理的问题，不是"自己不够坚强"。</p>
<h3>💰 本地省钱与免费资源</h3>
<p><b>食物支援：</b>{CITY} Food Bank（171 Wilson Street，电话 250-376-2252）向有需要的家庭发放食物，凭家庭每位成员的身份证件即可，家庭/单亲与单身/夫妇分不同日子领取，长者60岁以上有提前时段——具体时段请致电或查官网确认。<b>康乐与交通补贴：</b>见上文 ARCH 与 KamPASS。<b>免费与低价活动：</b>公共图书馆的活动、市属公园与步道、夏季的免费戏水乐园、社区中心的低价课程。<b>二手：</b>本地二手店（地图「分类 → 二手店」）是家具、冬装、儿童用品最划算的来源，刚落地置办全屋物品时能省下很大一笔。<b>超市省钱：</b>大型连锁超市多在每周三或周四更新特价传单，亚洲超市（地图「分类 → 亚洲超市」）在米面调料和特定蔬菜上通常明显便宜；多数超市有自有品牌，同类商品价格常低两到三成。</p>

<h3>🏙️ About {CITY}</h3>
<p>{CITY} sits in the southern Interior of British Columbia, at the confluence of the North Thompson and South Thompson Rivers, on the traditional territory of the Tk'emlúps te Secwépemc (Secwepemc Nation). The city's population is roughly 98,000 (2021 Census), about 127,000 across the metro area. The climate is semi-arid: hot, dry summers (average July highs around 27–28°C) and cold winters (average January lows around -7 to -8°C), with much less precipitation than coastal BC cities like Vancouver. {CITY} is nicknamed the "Tournament Capital of Canada" thanks to its extensive sports facilities and the many amateur tournaments it hosts each year. The local economy centres on Thompson Rivers University (TRU), forestry, mining, a regional hospital hub, and tourism.</p>
<h3>🧭 Your First Stop: Local Settlement Services</h3>
<p>If you've just arrived and have time for exactly one thing, make it <b>{CITY} Immigrant Services</b> (448 Tranquille Road; 778-470-6101 or 1-866-672-0855; Monday–Friday 8:30–16:30; find it under Category → Gov/Immigration on this map). It is the local settlement agency, its services are free, and they include:</p>
<p><b>Free English classes (LINC)</b> — for residents 17 and older who are permanent residents, refugees, or on a confirmed path to permanent residency; classes run Monday to Thursday with morning, afternoon and evening sections, plus home study and conversation circles, and free preschool childcare during class for eligible participants. <b>Settlement and integration support</b> — help understanding forms, government letters and appointment processes. <b>Employment services</b> — résumé review, mock interviews, mentorship matching. <b>SWIS (Settlement Workers in Schools)</b> — a free service for resident families in the {SD} district that helps children settle into school, supports parents at meetings, assists with forms, and can arrange interpretation. <b>Interpretation and translation</b> — just ask.</p>
<p>Two other high-value doors: the <b>public library</b> (Category → Libraries) gives you a free card, public computers and printing, children's programmes and adult conversation circles — one of the cheapest footholds a resident has; and <b>2-1-1</b>, where you can describe your situation in your own language and be referred to the right local agency.</p>
<h3>🚌 Living Here Without a Car</h3>
<p>{CITY} is spread out and genuinely hilly. Downtown, North Shore, Sahali, Aberdeen, Valleyview, Brocklehurst and Westsyde are not close together, and the grades are steep — residents routinely underestimate how hard a "only two kilometres" walk turns out to be. <b>{TRANSIT}</b> runs the local buses (the 🚌 Transit panel in this tool holds every regular route and stop and works offline), with reduced fares for students and seniors. The city's <b>KamPASS</b> affordable-transit programme provides subsidised passes for low-income residents; it shares one application form with the <b>ARCH</b> (Affordable Recreation for Community Health) programme and is submitted through a designated referring agency. ARCH itself lets eligible low-income residents use city pools, fitness and recreation facilities at a steep discount. For a family that has just landed without steady income, those two are the first local benefits worth asking about. Allow extra time waiting for a bus in winter: icy grades cause delays, and salted pavement is slippery.</p>
<h3>🎓 Studying at TRU, or Coming With Someone Who Does</h3>
<p>Thompson Rivers University (TRU) is the city's largest educational institution and, for many international students, the first community they land in. Campuses normally have an international student office (permits, insurance, orientation), academic advising and a writing centre, free counselling, a students' union extended health and dental plan, and country and culture clubs — most of it already covered by tuition, so use it. The campus sits in the Sahali area with several bus routes serving it; rental demand around campus tightens sharply before each term, so start looking early. Work-hour limits, the insurance handover and post-graduation permits are covered in "For International Students" above — always check your international office's current notice. Parents who came along with a student can contact the settlement agency above at the same time: enrolling children and arranging language support runs through exactly the same process.</p>
<h3>🌡️ The Four Seasons Here — and Two Things Outsiders Underestimate</h3>
<p><b>Summer: dry heat and wildfire smoke.</b> Daytime highs regularly pass 30°C and the air is very dry, which feels nothing like humid heat; dehydration and sunburn are what actually catch people out, so carry water and stay out of the afternoon sun. The thing worth knowing in advance is <b>wildfire season (roughly July to September)</b>: the BC Interior can get days of heavy smoke with air quality indexes spiking. Close windows, cut back outdoor exercise, and if you or your children have asthma or a respiratory condition, keep medication on hand and watch the official Air Quality Health Index. It isn't severe every year, but it's worth being mentally prepared for.</p>
<p><b>Winter: snow, ice, and early darkness.</b> Winter temperatures sit below freezing for long stretches, and icy roads and slick hills are normal. Three essentials: <b>real winter boots</b> with a grippy sole (running shoes on ice are genuinely dangerous), <b>layered clothing</b> (a wicking base, an insulating middle, a windproof/waterproof shell — far more effective than one thick coat), and <b>legal winter tires</b> (see the rules in the previous section). Also, around the solstice it is dark here by shortly after 4pm. Low mood from the sharp drop in daylight — seasonal affective disorder — is common in northern cities. Get outside in daylight, keep moving, and talk to a doctor if it's affecting you. It's a treatable condition, not a failure of willpower.</p>
<h3>💰 Local Money-Savers and Free Resources</h3>
<p><b>Food support:</b> the {CITY} Food Bank (171 Wilson Street, 250-376-2252) distributes food to households in need on presentation of ID for each household member; families/single parents and singles/couples attend on different days, and seniors 60+ have an earlier slot — phone or check the website for current times. <b>Recreation and transit subsidies:</b> ARCH and KamPASS, above. <b>Free and cheap things to do:</b> library programmes, city parks and trails, the free summer splash parks, and low-cost community centre classes. <b>Second-hand:</b> local thrift stores (Category → Thrift Stores) are the best value for furniture, winter clothing and children's gear, and will save a serious amount when you're furnishing a whole home at once. <b>Groceries:</b> the big chains refresh their weekly flyer deals midweek; Asian markets (Category → Asian Market) are usually distinctly cheaper for rice, flour, seasonings and certain vegetables; and most supermarkets have a house brand running 20–30% below the equivalent name brand.</p>

<h3>🏙️ À propos de {CITY}</h3>
<p>{CITY} se trouve dans le sud de l'Intérieur de la Colombie-Britannique, au confluent des rivières North Thompson et South Thompson, sur le territoire traditionnel des Tk'emlúps te Secwépemc (Nation Secwepemc). La population de la ville est d'environ 98 000 habitants (recensement de 2021), et d'environ 127 000 pour la région métropolitaine. Le climat est semi-aride : étés chauds et secs (maximales moyennes de juillet autour de 27–28 °C) et hivers froids (minimales moyennes de janvier autour de -7 à -8 °C), avec bien moins de précipitations que les villes côtières comme Vancouver. {CITY} est surnommée la « Tournament Capital of Canada » en raison de ses nombreuses installations sportives et des tournois amateurs qu'elle accueille chaque année. L'économie locale repose sur Thompson Rivers University (TRU), la foresterie, les mines, un pôle hospitalier régional et le tourisme.</p>
<h3>🧭 Votre premier arrêt : les services d'accueil locaux</h3>
<p>Si vous venez d'arriver et n'avez le temps que d'une seule démarche, faites celle-ci : contactez <b>{CITY} Immigrant Services</b> (448 Tranquille Road; 778-470-6101 ou 1-866-672-0855; du lundi au vendredi, 8 h 30 à 16 h 30; à trouver sous Catégorie → Gouv/Immigration sur cette carte). C'est l'organisme d'accueil local, ses services sont gratuits, et ils comprennent :</p>
<p><b>Des cours d'anglais gratuits (LINC)</b> — pour les résidents de 17 ans et plus qui sont résidents permanents, réfugiés ou sur une voie confirmée vers la résidence permanente; cours du lundi au jeudi, en matinée, en après-midi et en soirée, plus l'étude à domicile et des cercles de conversation, avec garde d'enfants d'âge préscolaire gratuite pendant les cours pour les participants admissibles. <b>Soutien à l'établissement et à l'intégration</b> — aide à comprendre les formulaires, les lettres officielles et la prise de rendez-vous. <b>Services d'emploi</b> — révision de CV, entrevues simulées, jumelage avec un mentor. <b>SWIS (intervenants en établissement dans les écoles)</b> — service gratuit pour les familles nouvellement arrivées du district {SD} : aide à l'adaptation scolaire des enfants, accompagnement des parents aux rencontres, appui aux formulaires, organisation d'un interprète. <b>Interprétation et traduction</b> — il suffit de demander.</p>
<p>Deux autres portes très utiles : la <b>bibliothèque publique</b> (Catégorie → Bibliothèques) offre une carte gratuite, des ordinateurs et de l'impression, des activités pour enfants et des cercles de conversation pour adultes — l'un des points d'appui les moins coûteux pour un résident; et le <b>2-1-1</b>, où vous pouvez décrire votre situation dans votre langue et être orienté vers le bon organisme local.</p>
<h3>🚌 Vivre ici sans voiture</h3>
<p>{CITY} est étendue et vraiment vallonnée. Le centre-ville, North Shore, Sahali, Aberdeen, Valleyview, Brocklehurst et Westsyde ne sont pas proches les uns des autres, et les pentes sont fortes — les résidents sous-estiment couramment ce que représente une marche « de deux kilomètres seulement ». <b>{TRANSIT}</b> exploite les autobus locaux (le panneau 🚌 Transport de cet outil contient toutes les lignes régulières et tous les arrêts, et fonctionne hors ligne), avec des tarifs réduits pour étudiants et aînés. Le programme municipal <b>KamPASS</b> (transport abordable) offre des laissez-passer subventionnés aux résidents à faible revenu; il partage un seul formulaire avec le programme <b>ARCH</b> (Affordable Recreation for Community Health) et se soumet par l'entremise d'un organisme référent désigné. ARCH permet aux résidents admissibles à faible revenu d'utiliser les piscines et les installations municipales de sport et de loisir à prix fortement réduit. Pour une famille qui vient d'arriver sans revenu stable, ce sont les deux premières aides locales à demander. Prévoyez du temps supplémentaire à l'arrêt en hiver : les pentes glacées causent des retards et la chaussée salée est glissante.</p>
<h3>🎓 Étudier à TRU, ou accompagner quelqu'un qui y étudie</h3>
<p>Thompson Rivers University (TRU) est le plus grand établissement d'enseignement de la ville et, pour beaucoup d'étudiants internationaux, la première communauté où ils atterrissent. On y trouve normalement un bureau des étudiants internationaux (permis, assurance, accueil), du conseil pédagogique et un centre de rédaction, du counselling gratuit, un régime complémentaire santé et dentaire de l'association étudiante, ainsi que des clubs par pays et par culture — la plupart déjà compris dans vos frais de scolarité : servez-vous-en. Le campus est dans le secteur Sahali, desservi par plusieurs lignes d'autobus; la demande locative autour du campus se resserre nettement avant chaque session, alors commencez tôt vos recherches. Les limites d'heures de travail, la transition d'assurance et les permis postdiplôme sont traités plus haut dans « Pour les étudiants internationaux » — vérifiez toujours l'avis courant de votre bureau international. Les parents venus accompagner un étudiant peuvent contacter en parallèle l'organisme d'accueil ci-dessus : l'inscription scolaire des enfants et le soutien linguistique passent exactement par le même processus.</p>
<h3>🌡️ Les quatre saisons ici — et deux choses que l'on sous-estime</h3>
<p><b>L'été : chaleur sèche et fumée des feux de forêt.</b> Les maximales dépassent régulièrement 30 °C et l'air est très sec, ce qui n'a rien à voir avec une chaleur humide; ce sont la déshydratation et les coups de soleil qui surprennent les gens : emportez de l'eau et évitez le soleil de l'après-midi. Ce qu'il faut surtout savoir d'avance, c'est la <b>saison des feux (environ de juillet à septembre)</b> : l'Intérieur de la province peut connaître plusieurs jours de fumée dense, avec des indices de qualité de l'air qui montent en flèche. Fermez les fenêtres, réduisez l'exercice extérieur et, si vous ou vos enfants souffrez d'asthme ou d'une affection respiratoire, gardez les médicaments à portée et surveillez la Cote air santé officielle. Ce n'est pas grave chaque année, mais il vaut mieux s'y préparer mentalement.</p>
<p><b>L'hiver : neige, glace et nuit tôt.</b> Les températures restent sous zéro de longues périodes, et routes verglacées et côtes glissantes sont la norme. Trois essentiels : de <b>vraies bottes d'hiver</b> à semelle antidérapante (des espadrilles sur la glace sont réellement dangereuses), des <b>vêtements en couches</b> (couche de base respirante, couche isolante, coquille coupe-vent et imperméable — bien plus efficace qu'un seul manteau épais) et des <b>pneus d'hiver conformes</b> (voir la réglementation à la section précédente). Aussi : autour du solstice, il fait nuit ici peu après 16 h. La baisse d'humeur causée par la chute de luminosité — le trouble affectif saisonnier — est courante dans les villes nordiques. Sortez à la lumière du jour, bougez, et parlez-en à un médecin si cela vous affecte. C'est une condition qui se traite, pas un manque de volonté.</p>
<h3>💰 Économiser ici et ressources gratuites</h3>
<p><b>Aide alimentaire :</b> la <b>{CITY} Food Bank</b> (171 Wilson Street, 250-376-2252) distribue de la nourriture aux ménages dans le besoin sur présentation d'une pièce d'identité par membre du ménage; familles et parents seuls d'un côté, personnes seules et couples de l'autre, à des jours différents, avec une plage plus tôt pour les 60 ans et plus — téléphonez ou consultez le site pour les heures à jour. <b>Subventions loisirs et transport :</b> ARCH et KamPASS, ci-dessus. <b>Activités gratuites ou peu coûteuses :</b> les programmes de la bibliothèque, les parcs et sentiers municipaux, les jeux d'eau gratuits l'été, et les cours à faible coût des centres communautaires. <b>Seconde main :</b> les magasins d'occasion locaux (Catégorie → Magasins d'occasion) offrent le meilleur rapport qualité-prix pour les meubles, les vêtements d'hiver et les articles pour enfants, et font économiser beaucoup quand on équipe un logement entier d'un coup. <b>Épicerie :</b> les grandes chaînes renouvellent leurs circulaires en milieu de semaine; les épiceries asiatiques (Catégorie → Épicerie asiat.) sont nettement moins chères pour le riz, la farine, les assaisonnements et certains légumes; et la plupart des supermarchés ont une marque maison de 20 à 30 % moins chère que la marque équivalente.</p>
