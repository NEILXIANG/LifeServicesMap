<h3>🏙️ Sobre {CITY}</h3>
<p>{CITY} se encuentra en el sur del Interior de Columbia Británica, en la confluencia de los ríos North Thompson y South Thompson, en el territorio tradicional de los Tk'emlúps te Secwépemc (Nación Secwepemc). La población de la ciudad es de aproximadamente 98,000 habitantes (Censo de 2021), y de unos 127,000 en el área metropolitana. El clima es semiárido: veranos calurosos y secos (máximas medias de julio en torno a 27–28 °C) e inviernos fríos (mínimas medias de enero en torno a -7 a -8 °C), con mucha menos precipitación que las ciudades costeras como Vancouver. {CITY} es apodada la "Tournament Capital of Canada" por sus amplias instalaciones deportivas y los muchos torneos amateur que acoge cada año. La economía local se apoya en Thompson Rivers University (TRU), la silvicultura, la minería, un centro hospitalario regional y el turismo.</p>
<h3>🧭 Su primera parada: los servicios locales de asentamiento</h3>
<p>Si acaba de llegar y solo tiene tiempo para una gestión, que sea esta: contacte a <b>{CITY} Immigrant Services</b> (448 Tranquille Road; 778-470-6101 o 1-866-672-0855; de lunes a viernes, 8:30–16:30; búsquelo en Categoría → Gobierno/Inmigración en este mapa). Es la agencia local de asentamiento, sus servicios son gratuitos e incluyen:</p>
<p><b>Clases de inglés gratuitas (LINC)</b> — para residentes de 17 años o más que sean residentes permanentes, refugiados o estén en una vía confirmada hacia la residencia permanente; clases de lunes a jueves, en turnos de mañana, tarde y noche, además de estudio a distancia y círculos de conversación, con cuidado infantil preescolar gratuito durante las clases para participantes que califiquen. <b>Apoyo de asentamiento e integración</b> — ayuda para entender formularios, cartas oficiales y procesos de cita. <b>Servicios de empleo</b> — revisión de currículum, entrevistas simuladas, emparejamiento con mentores. <b>SWIS (trabajadores de asentamiento en escuelas)</b> — servicio gratuito para familias residentes del distrito {SD}: ayuda a los niños a adaptarse a la escuela, acompaña a los padres en las reuniones, apoya con los formularios y puede gestionar interpretación. <b>Interpretación y traducción</b> — basta con pedirlo.</p>
<p>Otras dos puertas muy útiles: la <b>biblioteca pública</b> (Categoría → Bibliotecas) le da una tarjeta gratuita, computadoras e impresión, actividades infantiles y círculos de conversación para adultos — uno de los apoyos más económicos que tiene un residente; y el <b>2-1-1</b>, donde puede describir su situación en su idioma y ser derivado a la agencia local adecuada.</p>
<h3>🚌 Vivir aquí sin auto</h3>
<p>{CITY} es extensa y realmente empinada. El centro, North Shore, Sahali, Aberdeen, Valleyview, Brocklehurst y Westsyde no están cerca entre sí, y las pendientes son fuertes: los residentes subestiman habitualmente lo que supone una caminata "de solo dos kilómetros". <b>{TRANSIT}</b> opera los autobuses locales (el panel 🚌 Transporte de esta herramienta contiene todas las rutas regulares y paradas, y funciona sin conexión), con tarifas reducidas para estudiantes y personas mayores. El programa municipal <b>KamPASS</b> (transporte asequible) ofrece pases subvencionados a residentes de bajos ingresos; comparte un mismo formulario con el programa <b>ARCH</b> (Affordable Recreation for Community Health) y se presenta a través de una agencia derivadora designada. ARCH permite a los residentes de bajos ingresos que califiquen usar piscinas e instalaciones municipales de deporte y recreación con un fuerte descuento. Para una familia que acaba de llegar sin ingresos estables, esas dos son las primeras ayudas locales por las que conviene preguntar. Deje tiempo extra esperando el autobús en invierno: las cuestas heladas provocan retrasos y el pavimento salado resbala.</p>
<h3>🎓 Estudiar en TRU, o acompañar a quien estudia</h3>
<p>Thompson Rivers University (TRU) es la mayor institución educativa de la ciudad y, para muchos estudiantes internacionales, la primera comunidad en la que aterrizan. Los campus suelen tener una oficina de estudiantes internacionales (permisos, seguro, orientación), asesoría académica y centro de escritura, consejería gratuita, un plan complementario de salud y dental del sindicato estudiantil, y clubes por país y cultura — casi todo ya cubierto por su matrícula, así que úselo. El campus está en la zona de Sahali, con varias rutas de autobús; la demanda de alquiler alrededor del campus se tensa mucho antes de cada semestre, así que empiece a buscar temprano. Los límites de horas de trabajo, el cambio de seguro y los permisos posgraduación se tratan más arriba en "Para estudiantes internacionales" — consulte siempre el aviso vigente de su oficina internacional. Los padres que acompañan a un estudiante pueden contactar en paralelo a la agencia de asentamiento mencionada: matricular a los niños y gestionar el apoyo lingüístico sigue exactamente el mismo proceso.</p>
<h3>🌡️ Las cuatro estaciones aquí — y dos cosas que se subestiman</h3>
<p><b>Verano: calor seco y humo de incendios forestales.</b> Las máximas superan con regularidad los 30 °C y el aire es muy seco, lo que no se parece en nada al calor húmedo; lo que de verdad sorprende a la gente es la deshidratación y las quemaduras solares, así que lleve agua y evite el sol de la tarde. Lo que conviene saber de antemano es la <b>temporada de incendios (aproximadamente de julio a septiembre)</b>: el Interior de la provincia puede tener días de humo denso con índices de calidad del aire disparados. Cierre ventanas, reduzca el ejercicio al aire libre y, si usted o sus hijos tienen asma o una afección respiratoria, tenga los medicamentos a mano y siga el Índice de Calidad del Aire y Salud oficial. No es grave todos los años, pero conviene estar mentalmente preparado.</p>
<p><b>Invierno: nieve, hielo y oscuridad temprana.</b> Las temperaturas se mantienen bajo cero durante largos períodos, y las calzadas heladas y las cuestas resbaladizas son lo normal. Tres esenciales: <b>botas de invierno de verdad</b> con suela antideslizante (las zapatillas deportivas sobre hielo son realmente peligrosas), <b>ropa por capas</b> (una capa base que transpire, una capa aislante y una exterior cortavientos e impermeable — mucho más eficaz que un solo abrigo grueso) y <b>neumáticos de invierno legales</b> (vea la normativa en la sección anterior). Además, cerca del solsticio aquí ya es de noche poco después de las 16:00. El bajón anímico por la caída brusca de luz — el trastorno afectivo estacional — es común en las ciudades del norte. Salga con luz de día, manténgase en movimiento y hable con un médico si le está afectando. Es una condición tratable, no una falta de voluntad.</p>
<h3>💰 Ahorrar aquí y recursos gratuitos</h3>
<p><b>Apoyo alimentario:</b> el <b>{CITY} Food Bank</b> (171 Wilson Street, 250-376-2252) reparte alimentos a hogares que lo necesitan presentando una identificación por cada miembro del hogar; familias y padres solos por un lado, y personas solas y parejas por otro, acuden en días distintos, y hay un horario más temprano para mayores de 60 años — llame o consulte el sitio web para los horarios vigentes. <b>Subsidios de recreación y transporte:</b> ARCH y KamPASS, arriba. <b>Actividades gratuitas o baratas:</b> los programas de la biblioteca, los parques y senderos municipales, los juegos de agua gratuitos en verano y los cursos económicos de los centros comunitarios. <b>Segunda mano:</b> las tiendas de segunda mano locales (Categoría → Tiendas de segunda mano) son lo mejor en relación calidad-precio para muebles, ropa de invierno y artículos infantiles, y ahorran muchísimo cuando hay que equipar una casa entera de golpe. <b>Supermercado:</b> las grandes cadenas renuevan sus ofertas semanales a mitad de semana; los mercados asiáticos (Categoría → Mercado asiático) suelen ser bastante más baratos en arroz, harina, condimentos y ciertas verduras; y la mayoría de los supermercados tienen marca propia entre un 20 y un 30 % por debajo de la marca equivalente.</p>

<h3>🏙️ {CITY} 소개</h3>
<p>{CITY}는 브리티시컬럼비아(BC)주 남부 내륙에 위치하며, North Thompson강과 South Thompson강이 합류하는 지점에 자리잡고 있습니다. Tk'emlúps te Secwépemc(Secwepemc 원주민 부족)의 전통 영토이기도 합니다. 시 인구는 약 9만8천명(2021년 인구조사 기준), 광역권 인구는 약 12만7천명입니다. 기후는 반건조 대륙성 기후로, 여름은 덥고 건조하며(7월 평균 최고기온 약 27~28°C) 겨울은 춥고(1월 평균 최저기온 약 -7~-8°C), 밴쿠버 같은 해안 도시보다 강수량이 훨씬 적습니다. 스포츠 시설이 풍부하고 해마다 다양한 아마추어 대회를 개최해 "캐나다의 토너먼트 수도(Tournament Capital of Canada)"라는 별칭으로 불립니다. 지역 경제는 Thompson Rivers University(TRU), 임업, 광업, 지역 거점 병원, 관광이 중심입니다.</p>
<h3>🧭 첫 번째 목적지: 지역 정착지원 서비스</h3>
<p>막 도착해서 딱 한 가지만 할 시간이 있다면, <b>{CITY} Immigrant Services</b>(448 Tranquille Road, 전화 778-470-6101 또는 1-866-672-0855, 월~금 8:30~16:30, 지도의 「분류 → 정부/이민」에서 확인)에 연락하는 것을 권합니다. 이곳이 지역 정착지원 기관이며, 서비스는 무료입니다. 주요 내용은 다음과 같습니다.</p>
<p><b>무료 영어 수업(LINC)</b> — 17세 이상으로 영주권자, 난민, 또는 영주권 경로가 확정된 주민 대상. 월~목 오전·오후·저녁반이 있고, 원격 학습과 회화 모임도 있으며, 자격이 되는 참가자에게는 수업 중 미취학 아동 무료 돌봄을 제공합니다. <b>정착·적응 상담</b> — 서류, 정부 공문, 예약 절차를 이해하도록 돕습니다. <b>취업 서비스</b> — 이력서 첨삭, 모의 면접, 멘토 매칭. <b>SWIS(학교 내 정착지원 담당자)</b> — {SD} 학군의 신규 이민 가정을 위한 무료 서비스로, 자녀의 학교 적응을 돕고 학부모 면담에 동행하며 서류 작성을 지원하고 통역도 준비해 줍니다. <b>통역·번역</b> — 필요하면 요청하시면 됩니다.</p>
<p>또 하나 자주 쓰이는 두 곳: <b>공공도서관</b>(「분류 → 도서관」)은 무료 대출카드, 공용 컴퓨터와 인쇄, 어린이 프로그램과 성인 영어 회화 모임을 제공하는, 주민에게 가장 비용이 적게 드는 거점 중 하나입니다. 그리고 <b>2-1-1</b>에 전화하면 모국어로 상황을 설명하고 알맞은 지역 기관으로 연계받을 수 있습니다.</p>
<h3>🚌 차 없이 이곳에서 살기</h3>
<p>{CITY}는 넓게 퍼져 있고 언덕이 실제로 가파릅니다. 다운타운, North Shore, Sahali, Aberdeen, Valleyview, Brocklehurst, Westsyde는 서로 가깝지 않고 경사도 큽니다. 새로 온 사람들은 "겨우 2km"짜리 도보가 실제로 얼마나 힘든지 흔히 과소평가합니다. <b>{TRANSIT}</b>가 지역 버스를 운영하며(이 도구의 「🚌 대중교통」 패널에 모든 정규 노선과 정류장이 들어 있고 오프라인에서도 볼 수 있습니다), 학생과 노인에게는 할인 요금이 적용됩니다. 시의 <b>KamPASS</b>(저렴한 교통) 프로그램은 저소득 주민에게 보조 정기권을 제공하며, <b>ARCH</b>(Affordable Recreation for Community Health) 프로그램과 신청서를 함께 쓰고 지정된 연계 기관을 통해 제출합니다. ARCH는 자격이 되는 저소득 주민이 시립 수영장과 체육·여가 시설을 큰 폭으로 할인된 요금에 이용할 수 있게 해 줍니다. 안정된 수입이 아직 없는 갓 도착한 가정이라면 이 두 가지를 가장 먼저 문의해 볼 만합니다. 겨울에는 버스 대기 시간을 넉넉히 잡으세요. 언덕이 얼면 운행이 지연되고, 염화칼슘을 뿌린 노면도 미끄럽습니다.</p>
<h3>🎓 TRU에서 공부하거나, 학생과 함께 온 경우</h3>

<h3>🏙️ {CITY}について</h3>
<p>{CITY}はブリティッシュコロンビア州南部の内陸に位置し、North Thompson川とSouth Thompson川が合流する地点にあります。Tk'emlúps te Secwépemc（Secwepemc先住民族）の伝統的な領域でもあります。市の人口は約9万8千人（2021年国勢調査）、都市圏全体では約12万7千人です。気候は半乾燥で、夏は暑く乾燥し（7月の平均最高気温は27〜28°C前後）、冬は寒く（1月の平均最低気温は-7〜-8°C前後）、バンクーバーなど沿岸都市に比べて降水量がかなり少なめです。スポーツ施設が充実し、毎年数多くのアマチュア大会が開催されることから「カナダのトーナメント首都（Tournament Capital of Canada）」の愛称で呼ばれています。地元経済の中心はThompson Rivers University（TRU）、林業、鉱業、地域の拠点病院、そして観光です。</p>
<h3>🧭 最初に訪ねるべき場所：地域の定住支援サービス</h3>
<p>到着直後にひとつだけ行動できるとしたら、<b>{CITY} Immigrant Services</b>（448 Tranquille Road、電話778-470-6101または1-866-672-0855、月〜金8:30〜16:30、この地図の「カテゴリー→行政・移民」から探せます）に連絡してください。ここが地域の定住支援機関で、サービスはすべて無料、内容は以下の通りです。</p>
<p><b>無料英語クラス（LINC）</b>——17歳以上で永住者、難民、または永住への道筋が確定している住民が対象。月〜木曜に午前・午後・夜間のクラスがあり、自宅学習や会話サークルも用意されています。対象者には受講中の未就学児の無料託児もあります。<b>定住・生活適応サポート</b>——書類、政府からの通知、予約手続きの理解を手伝います。<b>就労支援サービス</b>——履歴書の添削、模擬面接、メンター紹介。<b>SWIS（学校定住支援員）</b>——{SD}学区の住民家庭向けの無料サービスで、子どもの学校生活への適応、保護者面談への同席、書類作成の補助、通訳の手配まで行います。<b>通訳・翻訳</b>——必要であれば申し出るだけで利用できます。</p>
<p>もう2つ、費用対効果の高い窓口があります。<b>公共図書館</b>（カテゴリー→図書館）は無料の利用カード、公共パソコンと印刷、子ども向けプログラム、大人向けの英会話サークルを提供しており、住民にとって最も安上がりな足がかりのひとつです。そして<b>2-1-1</b>に電話すれば、自分の言語で状況を説明し、適切な地元機関を紹介してもらえます。</p>
<h3>🚌 車なしでここで暮らす</h3>
<p>{CITY}は市域が広く、実際に坂が多い街です。ダウンタウン、North Shore、Sahali、Aberdeen、Valleyview、Brocklehurst、Westsydeは互いに離れていて起伏も急なため、住民は「たった2キロ」の徒歩がどれほど大変か、たいてい甘く見積もっています。<b>{TRANSIT}</b>が市内バスを運行しており（このツールの「🚌バス路線」パネルにはすべての定期路線と停留所が入っていて、オフラインでも使えます）、学生と高齢者には割引運賃があります。市の<b>KamPASS</b>（低価格交通プログラム）は低所得の住民に割引パスを提供しており、<b>ARCH</b>（Affordable Recreation for Community Health）プログラムと申請書を共有し、指定の紹介機関を通じて申し込みます。ARCH自体は、対象となる低所得住民が市営プール、フィットネス、レクリエーション施設を大幅割引で利用できる制度です。安定した収入がまだない到着したばかりの家庭にとっては、まずこの2つを問い合わせる価値があります。冬はバス待ちの時間に余裕を持たせてください——凍結した坂道は遅延を招き、融雪剤をまいた路面も滑りやすくなります。</p>

<h3>🌡️ この街の四季——外から来た人が見落としがちな2つのこと</h3>
<p><b>夏：乾いた暑さと山火事の煙。</b>日中の最高気温が30°Cを超える日が多く、空気はとても乾燥しているため、湿気を伴う暑さとはまったく体感が異なります。実際に人を悩ませるのは脱水と日焼けなので、水を持ち歩き、午後の強い日差しを避けてください。事前に知っておく価値があるのは<b>山火事シーズン（おおむね7月〜9月）</b>です。BC州内陸部では数日間濃い煙に包まれ、大気質指数が急上昇することがあります。窓を閉め、屋外での運動を控え、本人やお子さんに喘息や呼吸器疾患があれば薬を手元に用意し、公式のAir Quality Health Indexを確認してください。毎年深刻になるわけではありませんが、心構えをしておく価値はあります。</p>

<h3>💰 地元で節約する方法と無料の資源</h3>

// CITY — every fact that changes when this map is rebuilt for another city.
// Anything city-specific belongs here, never inline in the code or the prose.
// Text elsewhere uses {CITY} {PROV} {TRANSIT} {SD} {DATE} placeholders, expanded
// by tpl() at render time, so a new city means editing this block and the data —
// not hunting through five languages of copy.
// ---------------------------------------------------------------------------
const DATA_VERSION='2026.09.08a';
// city → country basics → province specifics → country reference
const GUIDE_ORDER=['guideCity','guideCA1','guideProv','guideCA2'];
// Stated once, rendered everywhere. Change this line to change the terms.
const LICENCE={id:'CC BY-NC 4.0', url:'https://creativecommons.org/licenses/by-nc/4.0/'};
// Single source of truth for the verification date. It used to be written out by
// hand in five different note strings, which is how they drift apart.
const VERIFIED='2026-08-30';
// Bus routes are not hand-collected: they come from the operator's GTFS feed, and
// every stop name and coordinate in BR was re-checked against this edition of it.
// Routes 8, 11, 12 and 15 are absent from the feed — Kamloops does not run them.
const BUS_SOURCE={feed:'BC Transit GTFS', edition:'2026-08-29', stopsChecked:475};
function verifiedDate(l){
  const [y,m,d]=VERIFIED.split('-').map(Number);
  const mn=UI[l].months[m-1];
  if(l==='zh')return y+'年'+m+'月'+d+'日';
  if(l==='ko')return y+'년 '+m+'월 '+d+'일';
  if(l==='ja')return y+'年'+m+'月'+d+'日';
  if(l==='en')return mn+' '+d+', '+y;
  if(l==='fr')return d+' '+mn+' '+y;
  return d+' de '+mn+' de '+y;
}
// Expands the {CITY}/{PROV}/{TRANSIT}/{SD}/{DATE} placeholders used throughout the
// translated copy. One function so a new city can never half-replace a name.
function tpl(str,l){
  if(!str)return str;
  return str
    .replace(/\{CITY\}/g,CITY.name[l])
    .replace(/\{PROV\}/g,CITY.prov[l])
    .replace(/\{TRANSIT_URL\}/g,CITY.transit.url)
    .replace(/\{TRANSIT\}/g,CITY.transit.name)
    .replace(/\{SD_URL\}/g,CITY.schoolDistrict.url)
    .replace(/\{SD\}/g,CITY.schoolDistrict.name)
    .replace(/\{CONTACT\}/g,CITY.contact)
    .replace(/\{LIC_URL\}/g,LICENCE.url)
    .replace(/\{LIC\}/g,LICENCE.id)
    .replace(/\{VER\}/g,DATA_VERSION)
    .replace(/\{DATE\}/g,verifiedDate(l));
}
// Builds the guide's index from whatever headings the four guide tiers happen to

// a modal makes the browser write to location.hash, which on a back-press closes
// something the reader did not ask to close.
function buildGuideToc(){
  const body=document.getElementById('guideBody');
  if(!body)return;
  const hs=[...body.querySelectorAll('h3')];

    el.id='gs-'+i;
    const b=document.createElement('button');
    b.className='guide-toc-btn';b.type='button';

const toastEl=document.getElementById('toast');
let toastTimer=null;
function showToast(msg){
  if(!toastEl)return;
  clearTimeout(toastTimer);
  toastEl.textContent=msg;toastEl.hidden=false;
  // Two rAFs so the browser paints the [hidden]->block change before the opacity
  // transition starts; one is sometimes not enough for it to register as a change.
  requestAnimationFrame(()=>requestAnimationFrame(()=>toastEl.classList.add('show')));
  toastTimer=setTimeout(()=>{
    toastEl.classList.remove('show');
    setTimeout(()=>{if(!toastEl.classList.contains('show'))toastEl.hidden=true;},200);
  },1600);
}
// === P0-D ERR-01 — global error trap =====================================
// Without this a Leaflet crash or a JSON.parse on bad data leaves the user
// staring at a half-broken map with no clue. Surface a non-blocking toast
// in the active language and ship the error to Analytics Engine as
// js_error so the failure pattern is visible from the dashboard too.
// The _reportError helper swallows its own failures so an error inside
// the error reporter cannot loop back into the error reporter.
(function installGlobalErrorTrap(){
  function _reportError(kind,payload){
    try{trackEvent('js_error',Object.assign({kind:kind},payload||{}));}catch(_){}
  }
  window.addEventListener('error',function(ev){
    var msg=(ev&&ev.message?String(ev.message):'(no message)').slice(0,160);
    var src=(ev&&ev.filename?String(ev.filename):'').split('/').slice(-2).join('/');
    var line=ev&&ev.lineNumber?ev.lineNumber:0;
    var col=ev&&ev.columnNumber?ev.columnNumber:0;
    _reportError('error',{msg:msg,src:src,line:line,col:col});
    try{if(typeof showToast==='function'&&UI&&UI[L_]&&UI[L_].errorHint)showToast(UI[L_].errorHint);}catch(_){}
  });
  window.addEventListener('unhandledrejection',function(ev){
    var r=ev&&ev.reason;
    var msg=r&&r.message?String(r.message):r?String(r):'(unknown)';
    _reportError('promise',{msg:String(msg).slice(0,160)});
    try{if(typeof showToast==='function'&&UI&&UI[L_]&&UI[L_].errorHint)showToast(UI[L_].errorHint);}catch(_){}
  });
})();
function toggleFav(el,ev){
  // Rewriting the popup detaches this very button, so the click would otherwise
  // finish bubbling to the map and Leaflet would close the popup under the user.
  if(ev&&ev.stopPropagation)ev.stopPropagation();
  const idx=+el.dataset.i,key=P[idx].id,u=UI[L_];
  const act=favorites.has(key)?'remove':'add';
  if(favorites.has(key)){favorites.delete(key);el.textContent='☆';el.classList.remove('active');}
  else{favorites.add(key);el.textContent='★';el.classList.add('active');}
  trackEvent('fav_toggle',{id:key,action:act,cat:P[idx].c,reg:P[idx].g});
  // The button survives this click, so its own state has to be updated in place —
  // the rewritten popup HTML below only takes effect on the next open.
  const now=favorites.has(key);
  el.setAttribute('aria-pressed',now);
  el.setAttribute('aria-label',now?u.favRemove:u.favAdd);
  // The star's own colour change was the only feedback a tap ever got — too subtle
  // to trust, which is what invited a second, undoing tap. This is deliberately the
  // only place in the app that raises a toast.
  showToast(now?u.favAddedMsg:u.favRemovedMsg);
  saveFavorites();
  // The marker's bound popup HTML is what Leaflet re-renders on every open, so it
  // has to be rewritten too — otherwise closing and reopening showed a stale ☆.
  const m=M[idx];
  if(m)m.setPopupContent(popup(m.data,idx));
  if(!panelFavEl.hidden)renderFavList();
  updateFavBadge();
}
function updateFavBadge(){

// Wraps just the phone-number-looking part of a string in a tel: link, leaving any
// trailing note (an email, an office name in brackets, etc.) as plain text.
function phoneHtml(str){
  return str.replace(/(\d{3}[-\s]?\d{3}[-\s]?\d{4})/, m=>'<a href="tel:'+m.replace(/[^\d]/g,'')+'">'+m+'</a>');
}
// ---- structured opening hours -> localised text -------------------------
// Hours are stored as data ({r:[[dayFrom,dayTo,openMin,closeMin,approx]], a:24h,
// s:service times, k:keyed message, q:qualifier, se:season) rather than as a
// pre-written Chinese string, so every language renders them from the same source.
function fmtClock(min,l){
  const wrapped=min%1440, h=Math.floor(wrapped/60), m=wrapped%60;
  if(l==='en'){const ap=h<12?'AM':'PM',hh=(h%12)||12;return hh+(m?':'+String(m).padStart(2,'0'):'')+' '+ap;}
  if(l==='fr')return h+' h'+(m?' '+String(m).padStart(2,'0'):'');
  return h+':'+String(m).padStart(2,'0');
}
function fmtDays(d1,d2,l){
  const u=UI[l];
  if(d1===1&&d2===7)return u.dAll;
  if(d1===6&&d2===7)return u.dWk;
  if(d1===d2)return u.d[d1-1];
  return u.d[d1-1]+u.dsep+u.d[d2-1];
}
function fmtHours(h,l){
  if(!h)return '';
  const u=UI[l];
  if(typeof h==='string')return h;
  const bits=[];
  if(h.a)bits.push(u.h24);
  if(h.k&&u[h.k])bits.push(u[h.k]);
  (h.r||[]).forEach(([d1,d2,o,c,ap])=>{
    const day=fmtDays(d1,d2,l);
    if(o===null)bits.push(day);
    else if(c===null)bits.push(day+' '+fmtClock(o,l)+' '+u.fromT);
    else bits.push(day+' '+fmtClock(o,l)+u.tsep+(ap?u.approx+' ':'')+fmtClock(c,l));
  });
  if(h.s&&h.s.length)bits.push(u.lSvc+u.colon+h.s.map(([d,t])=>u.d[d-1]+' '+fmtClock(t,l)).join(' / '));
  // Closed days are stated, not merely implied by their absence from the ranges.
  if((h.r||[]).length&&!h.a&&!h.k){
    const covered=new Set();
    h.r.forEach(([d1,d2])=>{for(let d=d1;d<=d2;d++)covered.add(d);});
    const shut=[1,2,3,4,5,6,7].filter(d=>!covered.has(d));
    if(shut.length&&shut.length<7){
      const weekendOnly=shut.length===2&&shut[0]===6&&shut[1]===7;
      bits.push(u.closedLabel+u.colon+(weekendOnly?u.dWk:shut.map(d=>u.d[d-1]).join(u.listSep)));
    }
  }
  let out=bits.join(' · ');
  if(h.se)out=u[h.se==='summer'?'seSummer':'seWinter']+' '+out;
  if(h.q&&u[h.q])out+=' ('+u[h.q]+')';
  return out;
}
// Entry stamps are stored as YYYY-MM and shown in the reader's own conventions,
// so they read consistently with the dated disclaimer rather than as raw data.
function fmtStamp(v,l){
  const [y,m]=v.split('-').map(Number);
  const mn=UI[l].months[m-1];
  if(l==='zh')return y+'年'+m+'月';
  if(l==='ko')return y+'년 '+m+'월';
  if(l==='ja')return y+'年'+m+'月';
  if(l==='en')return mn+' '+y;
  if(l==='fr')return mn+' '+y;
  return mn+' de '+y;
}

// A fourth, lowest tier (2026-09-07). Entries added to fill a coverage gap but
// not yet phone-verified were carrying src="stub-pending-verify", which no tier
// recognised — srcHTML() then rendered no chip at all, so the least-checked rows
// on the map were the only ones showing no provenance whatsoever. Making the
// tier explicit keeps the maintainer's own marker and, more importantly, tells
// the reader to call first. export-open.py still exports only official+own, so
// these stay out of the shareable subset until they are promoted.
const SRC_KINDS={official:['srcOfficial','srcOfficialTip'],
                 places:['srcPlaces','srcPlacesTip'],
                 own:['srcOwn','srcOwnTip'],
                 'stub-pending-verify':['srcStub','srcStubTip']};
function srcHTML(p,u){
  const kind=SRC_KINDS[p.src];
  if(!kind)return '';
  return '<span class="pv-src src-'+String(p.src).split('-')[0]+'" title="'+u[kind[1]].replace(/"/g,'&quot;')+'">'
    +u.lSource+': '+u[kind[0]]+'</span> · ';
}
function popup(p,idx){
  const u=UI[L_];
  const starChar=favorites.has(p.id)?'★':'☆',starActive=favorites.has(p.id)?' active':'';
  // A screen reader could hear the star but not whether it was on. The label
  // states the action, aria-pressed states the current value.
  const faved=favorites.has(p.id);
  // The name is the one thing every reader opened the popup for, so it leads —
  // the category/region tags used to sit above it, which put metadata ahead of the
  // primary fact. They now sit as a supporting line right under the name instead.
  let b='<div class="pt">'+p.n+'<button class="fav-star'+starActive+'" data-i="'+idx+'" onclick="toggleFav(this,event)" aria-pressed="'+faved+'" aria-label="'+(faved?u.favRemove:u.favAdd)+'">'+starChar+'</button></div>';
  b+='<div class="ptags"><span class="tag" style="background:'+catColour(p.c)+'">'+catLabel(p.c)+'</span><span class="tag tag2">'+regLabel(p.g)+'</span>';
  // A qualifier that used to sit inside the Chinese name ("（韩餐）") is data now,
  // so every language gets it instead of a parenthetical it cannot read.
  if(p.tag&&u[p.tag])b+='<span class="tag tag3">'+u[p.tag]+'</span>';
  b+='</div>';
  // The theme pills are the discovery surface for the second axis: someone who
  // never opens the filter panel still learns that this park counts as "free" and
  // "kids & family", and that those words are things the map can be filtered by.
  if(p.t&&p.t.length){
    b+='<div class="pv-themes">'+TORDER.filter(k=>p.t.indexOf(k)>=0)
      .map(k=>'<span class="pv-theme">'+TIC[k]+' '+themeLabel(k)+'</span>').join('')+'</div>';
  }
  b+='<div class="pr">'+p.a+'</div>';
  if(p.precision==='low')b+='<div class="pv-approx">'+u.lowPrecision+'</div>';
  if(p.sameComplex&&p.sameComplex.length){
    const sibs=p.sameComplex.map(id=>P.find(x=>x.id===id)).filter(Boolean);
    if(sibs.length)b+='<div class="pv-approx">'+u.sameComplexLabel
      +sibs.map(x=>x.n+' ('+catLabel(x.c)+')').join(' · ')+'</div>';
  }
  if(p.p)b+='<div class="pr"><span class="pl">'+u.lPhone+'</span>'+phoneHtml(p.p)
    +(p.pq&&u[p.pq]?' <span class="pq">('+u[p.pq]+')</span>':'')+'</div>';
  if(p.e)b+='<div class="pr"><span class="pl">'+u.lEmail+'</span><a href="mailto:'+p.e+'">'+p.e+'</a></div>';
  // Saying nothing about hours reads as "no hours"; say which it is instead.
  const hTxt=p.h?fmtHours(p.h,L_):(CITY.openAir.indexOf(p.c)>=0?u.hOnSite:u.hUnknown);
  b+='<div class="pr"><span class="pl">'+u.lHours+'</span>'+hTxt+'</div>';
  const nTxt=noteText(p);
  if(nTxt)b+='<div class="pn">'+nTxt+'</div>';
  // This per-place "checked on" date and the page-wide "Last verified" date in
  // Data Notes measure two different things (this one record vs. the whole
  // dataset) — a tooltip says so here rather than leaving the reader to notice
  // they don't always match.
  b+='<div class="pv">'+srcHTML(p,u)+(p.v?'<span class="pv-verified" title="'+u.lVerifiedTip.replace(/"/g,'&quot;')+'">'+u.lVerified+' '+fmtStamp(p.v,L_)+'</span> · ':'')
    +'<a class="pv-report" href="'+reportHref(p)+'">'+u.reportIssue+'</a></div>';
  // Destination is the place name + address (not raw lat/lng) so the map app shows
  // a real, readable place to navigate to instead of a confusing pair of numbers.
  // A destination string with no civic number ("Cooney Bay") makes the maps app
  // guess; fall back to the exact coordinates in that case.
  const hasCivic=/\d/.test(p.a||'');
  const dest=hasCivic?encodeURIComponent(p.n+', '+p.a+CITY.navSuffix)
                     :(p.lat+','+p.lng);
  const phoneDigits=p.p?(p.p.match(/\d{3}[-\s]?\d{3}[-\s]?\d{4}/)||[])[0]:null;
  b+='<div class="pact">';
  // data-cta lets the global click delegate below record the strongest possible
  // intent signal — a tap on the call/web/navigate button — without sprinkling
  // trackEvent calls into this render function (one of the popup's two phone
  // digits forms already runs through it).
  b+='<a class="pact-btn primary" data-cta="nav" data-pid="'+p.id+'" data-pcat="'+p.c+'" href="https://www.google.com/maps/dir/?api=1&destination='+dest+'" target="_blank" rel="noopener"><span class="pact-ic">🧭</span>'+u.lNav+'</a>';
  if(phoneDigits)b+='<a class="pact-btn" data-cta="call" data-pid="'+p.id+'" data-pcat="'+p.c+'" href="tel:'+phoneDigits.replace(/[^\d]/g,'')+'"><span class="pact-ic">📞</span>'+u.lCall+'</a>';
  if(p.w)b+='<a class="pact-btn" data-cta="web" data-pid="'+p.id+'" data-pcat="'+p.c+'" href="'+p.w+'" target="_blank" rel="noopener"><span class="pact-ic">🌐</span>'+u.lWeb2+'</a>';
  b+='</div>';
  return b;
}

// 250 pins at the default zoom used to pile into an unreadable clump over downtown,
// and exactly-co-located places (a pharmacy and a clinic in one building) hid each
// other completely. Clustering fixes both: counts at low zoom, spiderfied pins at high.
// If the cluster plugin fails to load, markers fall back to going straight on the map.
let cluster=null;
if(typeof L.markerClusterGroup==='function'){
  cluster=L.markerClusterGroup({
    showCoverageOnHover:false,
    spiderfyDistanceMultiplier:1.6,
    maxClusterRadius:z=>z>=16?24:z>=14?45:60,
    iconCreateFunction:c=>{
      const n=c.getChildCount(),size=n<10?'s':n<40?'m':'l';
      // The number was already visible, but what it means ("N places — tap to
      // expand") lived only in the aria-label, invisible to a sighted mouse user
      // who never triggers a screen reader. A native title tooltip surfaces the
      // same sentence on hover without needing more room in a 34px circle.
      const label=UI[L_].clusterLabel(n);
      return L.divIcon({html:'<div class="kcluster '+size+'" role="img" aria-label="'+label+'" title="'+label.replace(/"/g,'&quot;')+'">'+n+'</div>',className:'',
        iconSize:null,iconAnchor:[size==='s'?17:size==='m'?21:25,size==='s'?17:size==='m'?21:25]});
    }
  });
  map.addLayer(cluster);
}
function markerHome(){return cluster||map;}
// A marker inside a collapsed cluster cannot just be told to open its popup —
// the cluster has to expand to it first.
function focusMarker(m,zoom){
  if(cluster&&cluster.hasLayer(m)){cluster.zoomToShowLayer(m,()=>m.openPopup());}
  else{if(zoom)map.setView(m.getLatLng(),zoom);m.openPopup();}
}
function showMarker(m){const h=markerHome();if(!h.hasLayer(m))h.addLayer(m);}
function hideMarker(m){const h=markerHome();if(h.hasLayer(m))h.removeLayer(m);}
P.forEach((p,idx)=>{

  // of this data and should not have to find the filter panel first.
  const themes=(d.t||[]).map(k=>themeLabel(k).toLowerCase());

  if(name.includes(q))return 80;

// The URL has quietly carried the current language/area/category/search/route for
// several rounds now (writeURLState), but nothing ever told a reader that copying
// the address bar sends someone else straight to this same view — a "here are the
// banks on the North Shore, in Korean" link was possible but undiscoverable. This
// button makes the existing feature visible instead of adding a new one.
// ---------------------------------------------------------------------------
// Sharing. The button used to copy the link outright; it now opens a sheet,
// because "share" means WhatsApp to a reader from Delhi, LINE in Osaka,
// KakaoTalk in Seoul and WeChat in Chinese-speaking households — and the copy
// is still the first thing in the sheet, so the old one-click habit costs one
// extra tap rather than breaking.
//
// Only platforms with a real, documented share-a-link endpoint get a button.
// WeChat, TikTok and KakaoTalk have none: WeChat expects a QR scan on desktop
// or a server-signed JS-SDK inside its own browser, TikTok's Share Kit takes
// video/photo through a registered app rather than a URL, and KakaoTalk needs
// its SDK and an app key. navigator.share covers all three on a phone, because
// the OS sheet lists whatever the reader has installed, so that is offered
// first and the sheet says plainly what to do on a desktop.
// ---------------------------------------------------------------------------
const SHARE_TARGETS=[
  {k:'whatsapp', ic:'💬', name:'WhatsApp', url:(u,t)=>'https://wa.me/?text='+encodeURIComponent(t+' '+u)},
  {k:'facebook', ic:'📘', name:'Facebook', url:(u)=>'https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(u)},
  {k:'x',        ic:'✖️', name:'X',        url:(u,t)=>'https://twitter.com/intent/tweet?url='+encodeURIComponent(u)+'&text='+encodeURIComponent(t)},
  {k:'telegram', ic:'✈️', name:'Telegram', url:(u,t)=>'https://t.me/share/url?url='+encodeURIComponent(u)+'&text='+encodeURIComponent(t)},
  {k:'line',     ic:'🟢', name:'LINE',     url:(u)=>'https://social-plugins.line.me/lineit/share?url='+encodeURIComponent(u)},
  {k:'email',    ic:'✉️', name:null, label:'shareEmail', url:(u,t)=>'mailto:?subject='+encodeURIComponent(t)+'&body='+encodeURIComponent(u)},
  {k:'sms',      ic:'📱', name:null, label:'shareSms',   url:(u,t)=>'sms:?&body='+encodeURIComponent(t+' '+u)}
];

function copyShareLink(){
  const u=UI[L_],href=location.href;
  trackEvent('share_click',{stage:'intent',target:'copy'});
  let copied=false;
  try{
    const ta=document.createElement('textarea');
    ta.value=href;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    copied=document.execCommand('copy');
    document.body.removeChild(ta);
  }catch(e){}
  if(copied){trackEvent('share_click',{stage:'result',target:'copy',copied:true,method:'execCommand'});showToast(u.linkCopied);return;}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(href).then(
      ()=>{trackEvent('share_click',{stage:'result',target:'copy',copied:true,method:'clipboard'});showToast(u.linkCopied);},
      ()=>{trackEvent('share_click',{stage:'result',target:'copy',copied:false,method:'clipboard'});});
  }else{
    // Both paths unavailable — the click produced nothing, so record it rather
    // than let the failure rate look like zero.
    trackEvent('share_click',{stage:'result',target:'copy',copied:false,method:'none'});
  }
}

function isKeyStop(name){ return CITY.keyStop.test(name); }
function labelRect(el,pt){
  // Leaflet centres a stop tooltip above its point. Measure the element we are
  // actually going to show rather than assuming a fixed radius: "Lansdowne Exch
  // Bay I" needs roughly three times the clearance of "8th St", and a single
  // fixed distance can only be right for one of them.
  const w=el?el.offsetWidth:60, h=el?el.offsetHeight:14;
  return {l:pt.x-w/2-2, r:pt.x+w/2+2, t:pt.y-h-8, b:pt.y+2};
}
function rectsClear(a,b){
  return a.r<b.l||b.r<a.l||a.b<b.t||b.b<a.t;
}
function clusterRects(){
  // The labels also have to clear the place-cluster bubbles: a stop name sitting
  // on top of a "59" is unreadable in both directions, and this layer was never
  // considered before.
  const out=[];
  document.querySelectorAll('.kcluster, .leaflet-marker-icon.marker-cluster').forEach(el=>{
    const r=el.getBoundingClientRect();
    if(!r.width)return;
    const box=map.getContainer().getBoundingClientRect();
    out.push({l:r.left-box.left-2,r:r.right-box.left+2,t:r.top-box.top-2,b:r.bottom-box.top+2});
  });
  return out;
}
// Shared by bus-stop labels and the P1-F landmark labels: given a list of
// {marker,lat,lng,name} items each already carrying a permanent tooltip, decide
// which currently have room and hide the rest. `forceFn(item,idx,items)` marks
// items that must always try to claim space first (bus routes use it for the
// first/last stop and any named terminus; landmarks pass none — with only a
// handful of them, none needs to jump the queue over the others).
function computeLabelVisibility(items,forceFn){
  if(!items.length)return;
  // Measure first, decide second. A label hidden by the previous pass reports
  // offsetWidth 0, so measuring in place made every hidden label look tiny,
  // "fit" anywhere, and reappear on top of its neighbour — the labels oscillated
  // instead of settling. Everything is made visible for the measuring pass and
  // only then hidden.
  const entries=[];
  items.forEach((item,idx)=>{
    const tt=item.marker.getTooltip();
    const el=tt&&tt.getElement();
    if(el)el.style.display='';
    let pt=null;
    try{pt=map.latLngToContainerPoint([item.lat,item.lng]);}catch(e){}
    entries.push({idx,el,pt,txt:item.name,force:forceFn?forceFn(item,idx,items):false});
  });
  entries.forEach(e=>{
    if(!e.el||!e.pt){e.rect=null;return;}
    e.rect=labelRect(e.el,e.pt);
  });
  // Against another label, any touch at all is disqualifying — two names on top of
  // each other are unreadable in both directions. Against a cluster bubble the bar
  // is lower: the bubbles are big and numerous, and vetoing every label that merely
  // grazes one left just 3 of 31 names on screen. Only a bite out of the middle of
  // the text actually costs legibility, so clusters block a label at 30% coverage.
  const overlapFrac=(a,b)=>{
    const w=Math.min(a.r,b.r)-Math.max(a.l,b.l), h=Math.min(a.b,b.b)-Math.max(a.t,b.t);
    if(w<=0||h<=0)return 0;
    const area=(a.r-a.l)*(a.b-a.t);
    return area>0?(w*h)/area:0;
  };
  const clusters=clusterRects();
  const show=new Set();
  // Forced items are the anchors a reader orients by, so they always claim their
  // space first — processing in list order used to let an ordinary item take a
  // slot a forced one then drew over.
  const placed=[];
  // A loop bus route can pass the same exchange bay twice, so two forced labels
  // carry the identical name and land on top of each other. The second one adds
  // nothing a reader can use, so it is dropped rather than smudged over the first.
  entries.forEach(e=>{
    if(!e.force||!e.rect)return;
    const dup=placed.some(t=>!rectsClear(e.rect,t)&&t.txt===e.txt);
    if(dup)return;
    e.rect.txt=e.txt; show.add(e.idx); placed.push(e.rect);
  });
  entries.forEach(e=>{
    if(e.force||!e.rect)return;
    if(!placed.every(t=>rectsClear(e.rect,t)))return;             // never touch another label
    if(clusters.some(c=>overlapFrac(e.rect,c)>0.30))return;       // and don't sit on a bubble
    placed.push(e.rect);show.add(e.idx);
  });
  entries.forEach(e=>{ if(e.el)e.el.style.display=show.has(e.idx)?'':'none'; });
}
