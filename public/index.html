<style id="app-css">
  :root{--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK SC",sans-serif;
         --ink:#202124;--sub-ink:#5f6368;--paper:#f8f9fa;--card:#ffffff;--line:#dadce0;--accent:#1a73e8;--accent-text:#1967d2;--sage:#188038;}
  /* Dark mode was added on 2026-09-05 and removed again on 2026-09-07 at the
     owner's request: this page is one light surface with a light OSM basemap
     inside it, and re-skinning only the chrome we own left the map itself
     bright white in the middle of a dark frame. Declaring the page light-only
     also stops browsers and in-app webviews (WeChat's especially) from applying
     their own automatic dark transform, which is what produces unreadable
     light-on-light text. If dark mode is ever wanted again it has to cover the
     tile layer too, not just the panels. */
  :root{color-scheme:light;}
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased;}
  /* every interactive control is a real <button> for keyboard access; these rules
     strip the browser's default button chrome so the visual design is unchanged */
  .lang-btn,.preset-chip,.reg-btn,.cat-btn,.cat-group-label,.bus-item,.af-clear,
  .af-chip .x,.rt-name,.rt-remove,.panel-close,.search-clear{
    font-family:inherit;font-size:inherit;color:inherit;text-align:inherit;-webkit-appearance:none;appearance:none;}
  .cat-group-label,.bus-item,.reg-btn,.cat-btn,.preset-chip{width:auto;}
  .af-chip .x,.rt-remove,.search-clear,.panel-close,.af-clear,.rt-name,.grp-check,.grp-expand,.fav-star{background:none;border:none;}
  /* type=search draws its own clear button; the page supplies one, so hide the native one */
  input[type=search]::-webkit-search-cancel-button,
  input[type=search]::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--font);}
  header{padding:26px 20px 4px;position:relative;}
  h1{font-family:var(--font);font-size:clamp(20px,3vw,27px);margin:0 0 5px;font-weight:500;letter-spacing:0;padding-right:265px;}
  .sub{display:none;}
  .lang-sw{position:absolute;top:24px;right:20px;display:flex;gap:2px;background:#f1f3f4;border-radius:9px;padding:2px;}
  .lang-btn{padding:5px 12px;border-radius:7px;border:none;background:transparent;font-size:12px;cursor:pointer;font-weight:590;color:var(--sub-ink);transition:all .15s cubic-bezier(.4,0,.2,1);}
  .lang-btn.active{background:var(--card);color:var(--accent-text);box-shadow:0 1px 2px 0 rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);}
  .header-links{position:absolute;top:60px;right:20px;display:flex;align-items:center;gap:14px;}
  .feedback-link{font-size:11.5px;font-weight:600;color:var(--accent-text);text-decoration:none;padding:7px 3px;}
  .note-toggle{position:relative;font-family:inherit;font-size:11.5px;font-weight:600;color:var(--accent-text);text-decoration:none;background:none;border:none;padding:7px 3px;margin:0;cursor:pointer;}
  .feedback-link:hover,.note-toggle:hover{text-decoration:underline;}
  /* 2026-09-07: restoring the "there is something new" affordance. The change log
     is real and maintained, but it sits at the very bottom of the newcomer guide —
     measured at 12x the panel's own height of scrolling — so a returning reader
     had no way to find out anything had changed. A dot on the button and a jump
     link at the top of the guide are the cheapest honest fix. */
  .hl-dot{position:absolute;top:3px;right:0;width:8px;height:8px;border-radius:50%;
    background:#e0483e;border:1.5px solid var(--card);pointer-events:none;}
  .guide-jump{display:inline-block;margin:0 0 14px;font-size:12.5px;font-weight:600;
    color:var(--accent-text);text-decoration:none;border:1px solid var(--line);
    border-radius:999px;padding:7px 13px;background:var(--card);}
  .guide-jump:hover{border-color:var(--accent);}

  .sec-label{padding:2px 0 7px;font-family:var(--font);font-size:11.5px;font-weight:600;color:var(--sage);letter-spacing:.2px;}
  /* unified filter toolbar — identical on every breakpoint */
  .ftoolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;row-gap:6px;padding:12px 20px 0;}
  .filter-btn{background:var(--accent);color:#fff;border:none;border-radius:20px;padding:9px 12px 9px 14px;font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:7px;cursor:pointer;white-space:nowrap;transition:filter .15s cubic-bezier(.4,0,.2,1);box-shadow:0 1px 2px 0 rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);}
  .filter-btn:hover{filter:brightness(.94);}
  .filter-btn svg{flex:0 0 auto;display:block;}
  .filter-btn .chev{font-size:9px;transition:transform .18s;opacity:.9;}
  .filter-btn.open .chev{transform:rotate(180deg);}
  .filter-btn .badge{background:#fff;color:var(--accent-text);border-radius:999px;font-size:10.5px;padding:1px 6px;font-weight:800;}
  .status{font-size:12.5px;color:var(--ink);font-weight:590;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:4px 2px;}
  .fbicon{font-size:12px;line-height:1;}
  .reset-btn{font-size:12px;color:var(--accent-text);font-weight:700;background:none;border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:16px;cursor:pointer;padding:6px 12px;white-space:nowrap;display:flex;align-items:center;gap:4px;}
  .reset-btn[hidden]{display:none;}
  .reset-btn.idle{color:var(--sub-ink);border-color:var(--line);}
  .reset-btn:hover{background:color-mix(in srgb,var(--accent) 8%,transparent);}
  /* A bare "·" explained only by a hover title was invisible on touch, which is
     most of this app's traffic — the word itself is now the visible cue, sourced
     from a data attribute JS sets per language, at full opacity so it stays AA. */
  .preset-chip.adjusted::after{content:attr(data-adj-label);margin-left:5px;font-weight:700;}
  .qp-row{padding:11px 20px 0;position:relative;}
  .qp-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-bottom:7px;}
  .qp-head .sec-label{padding-bottom:0;}
  /* A plain transparent-to-paper fade reads as scrollable only if you already know
     to look for it — against an off-white background it is nearly invisible (a
     first-time user testing this could barely see it even zoomed in). It is now
     opacity-gated by .has-more, which JS sets only while there is genuinely more to
     scroll to (so it never lingers once the row is scrolled to its end, or shows at
     all when every chip already fits), and paired with a small chevron so the cue
     doesn't depend on noticing a soft edge. */
  .qp-row::after{content:'';position:absolute;right:0;top:29px;bottom:2px;width:40px;
    background:linear-gradient(to right,transparent,var(--paper) 65%);
    pointer-events:none;opacity:0;transition:opacity .2s;}
  .qp-row.has-more::after{opacity:1;}
  .qp-row::before{content:'\203a';position:absolute;right:7px;top:29px;bottom:2px;
    display:flex;align-items:center;font-size:17px;font-weight:800;color:var(--sub-ink);
    pointer-events:none;opacity:0;transition:opacity .2s;z-index:1;}
  .qp-row.has-more::before{opacity:.85;}
  .fhint{padding:5px 20px 0;font-size:11px;color:var(--sub-ink);}
  .active-filters{display:flex;flex-wrap:wrap;gap:6px;padding:9px 20px 0;}
  .active-filters[hidden],.fhint[hidden]{display:none;}
  .active-filters:empty{display:none;}
  .fhint:empty{display:none;}
  .af-chip{display:flex;align-items:center;gap:6px;padding:5px 8px 5px 12px;border-radius:16px;background:color-mix(in srgb,var(--accent) 9%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent-text);font-size:11.5px;font-weight:600;}
  .af-chip .x{width:15px;height:15px;border-radius:50%;background:color-mix(in srgb,var(--accent) 16%,transparent);display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;line-height:1;}
  .af-chip .x:hover{background:var(--accent);color:#fff;}
  .af-clear{font-size:11.5px;color:var(--sub-ink);text-decoration:underline;cursor:pointer;padding:5px 2px;}
  /* region row — horizontal scroll, same component on all breakpoints */
  .reg-row{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 12px;}
  .reg-btn{flex:0 0 auto;padding:7px 14px;border-radius:20px;border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);background:color-mix(in srgb,var(--accent) 7%,var(--card));font-size:12.5px;cursor:pointer;font-weight:590;color:var(--accent-text);user-select:none;white-space:nowrap;transition:all .15s;}
  .reg-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  /* panel sections — one visual system shared by quick-picks / area / category */
  .psec{padding-bottom:15px;margin-bottom:15px;border-bottom:1px solid var(--line);}
  .psec:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
  /* Area and Bus Routes are both flat, single-purpose lists; Favorites' only
     wrinkle (export/import) explains itself inline. Category is the one panel with
     real hidden structure — collapsed groups, a group checkbox that means "all of
     these", a partial-selection state — so it's the one panel that gets an
     upfront line explaining the two gestures, rather than making every panel
     carry a hint most of them don't need. */
  .cat-panel-hint{margin:0 0 10px;font-size:11.5px;line-height:1.55;color:var(--sub-ink);}
  .cat-utils-inline{display:flex;justify-content:flex-end;margin-bottom:8px;}
  .cat-utils{font-size:11px;color:var(--sub-ink);display:flex;gap:6px;align-items:center;}
  .cat-util-btn{cursor:pointer;font-weight:700;color:var(--accent-text);background:none;border:none;font-family:inherit;font-size:inherit;padding:0;}
  /* quick picks */
  .preset-row{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px;margin:0 -20px;padding-left:20px;padding-right:34px;}
  .preset-row::-webkit-scrollbar{display:none;}
  .preset-chip{flex:0 0 auto;white-space:nowrap;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;transition:all .15s;}
  .preset-chip:hover{background:#f1f3f4;border-color:color-mix(in srgb,var(--sage) 35%,var(--line));}
  .preset-chip.active{background:var(--sage);border-color:var(--sage);color:#fff;}
  /* category accordion */
  .cat-wrap{display:flex;flex-direction:column;gap:7px;}
  .cat-group{border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden;}
  .cat-group-label{display:flex;align-items:center;gap:8px;padding:10px 12px;margin:0;font-family:var(--font);font-size:12px;font-weight:600;color:var(--ink);letter-spacing:.1px;cursor:pointer;user-select:none;}
  .grp-expand{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:none;border:none;padding:0;cursor:pointer;font:inherit;color:inherit;text-align:left;}
  .cat-group-label .grp-name{flex:1;min-width:0;}
  .cat-group-label .grp-count{font-size:10.5px;font-weight:700;color:var(--accent-text);white-space:nowrap;}
  .grp-check{width:16px;height:16px;padding:0;background:none;border-radius:5px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10px;line-height:1;flex:0 0 auto;color:#fff;cursor:pointer;font-weight:800;}
  .grp-check.all{background:var(--sage);border-color:var(--sage);}
  .grp-check.none{background:transparent;}
  .grp-check.partial{background:color-mix(in srgb,var(--sage) 55%,var(--card));border-color:var(--sage);color:var(--ink);}
  .cat-group-label .car{font-size:10px;color:var(--sub-ink);transition:transform .15s;flex:0 0 auto;}
  .cat-group.open .cat-group-label .car{transform:rotate(90deg);}
  .cat-grid{display:none;flex-wrap:wrap;gap:5px;padding:0 10px 10px;}
  .cat-group.open .cat-grid{display:flex;}
  .cat-btn{flex:0 0 auto;display:flex;flex-direction:row;align-items:center;gap:3px;padding:6px 10px;border-radius:8px;border:1px solid color-mix(in srgb,var(--bc) 28%,transparent);background:color-mix(in srgb,var(--bc) 10%,var(--card));cursor:pointer;user-select:none;transition:all .13s;font-size:11.5px;font-weight:600;color:var(--bc);white-space:nowrap;min-height:32px;}
  .cat-btn .icon{font-size:13px;line-height:1;}
  .cat-btn.active{background:var(--bc);border-color:var(--bc);color:#fff;box-shadow:0 1px 2px 0 rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);}
  .cat-btn .cnt{font-size:10.5px;font-weight:500;color:var(--sub-ink);}
  .cat-btn.active .cnt{color:#fff;}
  /* Zero in the selected area(s) — kept in the list (see renderCats) rather than
     removed, so it reads as "none here" instead of "not tracked". Colour, not
     opacity, does the muting so the text itself never drops below AA contrast. */
  .cat-btn.zero{background:var(--card);border-color:var(--line);color:var(--sub-ink);cursor:help;}
  .cat-btn.zero .icon{filter:grayscale(1);}
  #map{height:64vh;height:64dvh;min-height:400px;width:calc(100% - 40px);margin:14px 20px 0;border-radius:8px;border:1px solid var(--line);box-shadow:0 1px 2px 0 rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);}
  /* Leaflet's control container is z-index:1000 and lives outside the map's pane
     stack, so at 1000 it tied with the overlay and DOM order decided — the zoom
     buttons and the attribution link stayed clickable through an open modal.
     1200 clears every Leaflet layer (max 1000). */
  /* filter panel shell — content identical, only container adapts by breakpoint */
  .backdrop{position:fixed;inset:0;background:rgba(32,33,36,.4);display:none;z-index:1200;pointer-events:none;}
  .backdrop.open{display:flex;}
  .panel{background:var(--card);display:flex;flex-direction:column;box-shadow:0 1px 3px 0 rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15);pointer-events:auto;}
  /* The grab area is 22px tall so a thumb can find it; only the 4px bar shows. */
  .panel-grab{padding:9px 0 9px;flex:0 0 auto;cursor:grab;touch-action:none;display:flex;justify-content:center;}
  .panel-grab:active{cursor:grabbing;}
  /* A little darker than the border colour it used to share, since a plain
     var(--line) bar reads as decorative trim rather than a handle to grab. */
  .panel-handle{width:36px;height:4px;background:color-mix(in srgb,var(--sub-ink) 45%,var(--line));border-radius:99px;flex:0 0 auto;}
  .panel.dragging{transition:none;}
  /* A brief nudge the first time a sheet opens on a touch-sized screen, so the
     handle's draggability is felt once rather than relying on a static bar to be
     read as an affordance. prefers-reduced-motion already disables all animation
     globally, so this backs off automatically for anyone who asked for that. */
  @keyframes panelGrabHint{0%,100%{transform:translateY(0);}35%{transform:translateY(5px);}60%{transform:translateY(-1px);}}
  .panel-grab.hint .panel-handle{animation:panelGrabHint .9s ease-in-out;background:var(--sub-ink);}
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 10px;border-bottom:1px solid var(--line);flex:0 0 auto;}
  .panel-title{font-family:var(--font);font-weight:500;font-size:14.5px;}
  .panel-close{font-size:18px;color:var(--sub-ink);cursor:pointer;line-height:1;padding:4px;background:none;border:none;font-family:inherit;}
  .panel-body{overflow-y:auto;padding:14px 18px 6px;flex:1 1 auto;}
  .apply-bar{padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);flex:0 0 auto;}
  .apply-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;}
  @media(max-width:900px){
    .backdrop{align-items:flex-end;}
    .backdrop.open{pointer-events:auto;}
    .panel{width:100%;max-height:80vh;max-height:80dvh;border-radius:16px 16px 0 0;
      transition:transform .22s cubic-bezier(.2,.8,.3,1);}
  }
  @media(min-width:901px){
    .backdrop{background:transparent;align-items:flex-start;justify-content:flex-start;}
    .panel{position:absolute;top:132px;left:20px;width:460px;max-height:min(72vh,640px);border-radius:14px;border:1px solid var(--line);}
    .panel-grab{display:none;}
  }
  .footer{padding:14px 20px 28px;font-size:11.5px;color:var(--sub-ink);line-height:1.75;max-width:860px;}
  .footer a{color:var(--accent-text);}
  /* 911/8-1-1/RCMP used to run visually indistinguishable from the routine
     school-catchment and transit links above it — the one line here someone
     might need in a hurry now stands out, in its own tinted line rather than
     blended into the source citations. */
  .footer-emergency{display:inline-block;margin-top:4px;padding:3px 9px;border-radius:6px;
    background:#fdecea;color:#a02622;font-weight:700;}
  .footer-emergency b{color:inherit;}
  .footer-privacy{opacity:.78;font-size:11px;display:inline-block;margin-top:4px;}
  .leaflet-popup-content-wrapper{border-radius:10px;background:var(--card);}
  .leaflet-popup-content{font-size:12.5px;line-height:1.55;min-width:0;width:min(305px,calc(100vw - 72px));margin:11px 13px;color:var(--ink);}
  .bus-indicator{display:none;align-items:center;gap:8px;margin:0 20px 10px;padding:8px 12px;border-radius:10px;background:color-mix(in srgb,var(--accent) 8%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 25%,var(--line));font-size:12.5px;font-weight:600;color:var(--ink);}
  .bus-indicator.show{display:flex;}
  .bus-indicator .x{cursor:pointer;color:var(--sub-ink);font-weight:700;margin-left:auto;padding:0 4px;}
  .bus-list{display:flex;flex-direction:column;gap:6px;}
  .bus-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;transition:all .15s;}
  .bus-item:hover{background:#f1f3f4;}
  .bus-item.active{background:color-mix(in srgb,var(--accent) 10%,var(--card));border-color:var(--accent);}
  .bus-item .dot{width:14px;height:14px;border-radius:50%;flex:0 0 auto;}
  .bus-item .rt-num{font-weight:700;font-size:13px;min-width:22px;}
  .bus-item .rt-name{flex:1;min-width:0;font-size:12.5px;color:var(--sub-ink);}
  .bus-item .rt-count{font-size:10.5px;color:var(--accent-text);font-weight:700;white-space:nowrap;}
  .fav-empty{color:var(--sub-ink);font-size:12.5px;padding:20px 4px;text-align:center;line-height:1.7;}
  .fav-tag{color:var(--sub-ink);font-size:11px;}
  .fav-item .rt-remove{font-size:13px;color:var(--sub-ink);cursor:pointer;padding:2px 4px;flex:0 0 auto;}
  .fav-item .rt-remove:hover{color:#c0392b;}
  .search-bar{display:flex;align-items:center;gap:8px;margin:12px 20px 0;padding:9px 14px;background:var(--card);border:1px solid var(--line);border-radius:10px;max-width:420px;}
  .search-bar input{border:none;outline:none;flex:1;font-size:13px;font-family:inherit;color:var(--ink);background:transparent;min-width:0;}
  .search-ic{font-size:13px;opacity:.6;flex:0 0 auto;}
  .search-clear{cursor:pointer;opacity:.5;font-size:12px;padding:2px 4px;flex:0 0 auto;}
  .search-clear:hover{opacity:1;}
  @media(max-width:600px){.search-bar{margin:10px 10px 0;max-width:none;}}
  .fav-star{background:none;border:none;cursor:pointer;font-size:16px;line-height:1;padding:0 0 0 6px;vertical-align:middle;color:#f2a900;}
  .fav-star:hover{transform:scale(1.15);}
  #guideBackdrop,#noteBackdrop{align-items:center!important;justify-content:center!important;background:rgba(32,33,36,.5);pointer-events:none;}
  #guideBackdrop.open,#noteBackdrop.open{pointer-events:auto;}
  .guide-modal{background:var(--card);display:flex;flex-direction:column;box-shadow:0 1px 3px 0 rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15);border-radius:14px;width:600px;max-width:92vw;max-height:82vh;margin:auto;pointer-events:auto;}
  .guide-head{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);flex:0 0 auto;}
  .guide-body{overflow-y:auto;padding:16px 22px 26px;flex:1 1 auto;font-size:13px;line-height:1.75;color:var(--ink);}
  .guide-body h3{font-size:14.5px;margin:20px 0 8px;font-family:var(--font);}
  .guide-body h3:first-child{margin-top:0;}
  .guide-body p{margin:0 0 8px;}
  .guide-body ul{margin:0 0 8px;padding-left:20px;}
  .guide-body li{margin:4px 0;}
  .guide-body a{color:var(--accent-text);}
  .leaflet-tooltip.stop-label{background:rgba(255,255,255,.92);border:1px solid rgba(0,0,0,.12);border-radius:4px;padding:1px 5px;font-size:9.5px;font-weight:600;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15);white-space:nowrap;}
  .leaflet-tooltip.stop-label::before{display:none;}
  .pt{font-family:var(--font);font-size:14px;font-weight:500;margin:2px 0 3px;}
  .ptags{margin:0 0 6px;}
  .tag{display:inline-block;font-size:9.5px;font-weight:600;padding:2px 8px;border-radius:6px;margin:0 3px 5px 0;color:#fff;}
  .tag2{background:#5f6368;}
  .tag3{background:transparent;color:var(--sub-ink);border:1px solid var(--line);}
  .pr{margin:4px 0;}
  .pl{color:var(--sub-ink);display:inline-block;min-width:38px;padding-right:6px;}
  .pq{color:var(--sub-ink);font-size:11px;}
  .pv{font-size:11px;color:var(--sub-ink);margin-top:7px;}
  .licence-line{color:var(--sub-ink);}
  .pv-report{color:var(--accent-text);text-decoration:none;}
  .pv-report:hover{text-decoration:underline;}
  /* marker clustering — CSS inlined rather than pulled from a second CDN file */
  .leaflet-cluster-anim .leaflet-marker-icon,.leaflet-cluster-anim .leaflet-marker-shadow{transition:transform .3s ease-out,opacity .3s ease-in;}
  .leaflet-cluster-spider-leg{transition:stroke-dashoffset .3s ease-out,stroke-opacity .3s ease-in;}
  .kcluster{background:var(--accent);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:var(--font);font-weight:600;border:2.5px solid #fff;cursor:pointer;
    box-shadow:0 1px 3px rgba(60,64,67,.4),0 3px 8px rgba(60,64,67,.25);}
  .kcluster.s{width:34px;height:34px;font-size:12.5px;}
  .kcluster.m{width:42px;height:42px;font-size:13.5px;background:#1558b0;}
  .kcluster.l{width:50px;height:50px;font-size:14.5px;background:#0d47a1;}
  /* Search used to bypass the Area/Category filters entirely, which is why this
     state used to dim them here — a tap did nothing visible, so dimming was the
     honest signal. Search now narrows within whatever is filtered instead, so
     Area/Category and Quick Picks stay fully live (and undimmed) while searching. */
  .search-note{padding:6px 20px 0;font-size:11.5px;color:var(--accent-text);font-weight:600;}
  .search-note:empty{display:none;}
  .empty-state{margin:14px 20px 0;padding:18px 20px;background:var(--card);border:1px solid var(--line);
    border-radius:10px;font-size:13px;color:var(--sub-ink);line-height:1.7;text-align:center;}
  .empty-state[hidden]{display:none;}
  /* Pinch-zoom covers this on a phone, and 44px of permanent chrome over the map
     corner costs more there than the buttons are worth. */
  @media(max-width:600px){.leaflet-control-zoom{display:none;}}
  .pv-src{display:inline-block;padding:1px 6px;border-radius:5px;font-size:10.5px;
    background:#eef2f7;color:#4b5b6b;cursor:help;}
  .pv-verified{cursor:help;}
  .pv-src.src-official{background:#e6f4ea;color:#1e6b38;}
  .pv-src.src-own{background:#fff3d6;color:#7a5c00;}
  .pv-src.src-stub{background:#fde8e6;color:#8c2f22;}
  .fav-io{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);}
  .fav-io-note{margin:0 0 9px;font-size:11.5px;color:var(--sub-ink);line-height:1.6;}
  .fav-io-row{display:flex;gap:8px;flex-wrap:wrap;}
  .fav-io-btn{font-size:12px;font-weight:600;color:var(--accent-text);background:var(--card);
    border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:16px;
    padding:7px 14px;cursor:pointer;}
  .fav-io-btn:hover{background:color-mix(in srgb,var(--accent) 8%,transparent);}
  .fav-io-box{width:100%;margin-top:9px;padding:8px 10px;font-size:11.5px;line-height:1.5;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink);
    background:var(--card);border:1px solid var(--line);border-radius:8px;resize:vertical;}
  .fav-io-msg{margin:8px 0 0;font-size:11.5px;color:var(--sage);min-height:1em;}
  /* Leaflet adds this class when maxHeight kicks in; keep the scroll inside it. */
  .leaflet-popup-scrolled{overscroll-behavior:contain;border-bottom:none;}
  .privacy-note{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line);}
  .offline-note{position:absolute;left:56px;right:12px;top:12px;z-index:900;
    padding:8px 32px 8px 12px;background:#fef7e0;border:1px solid #fde293;
    border-radius:8px;font-size:12px;color:#7a5c00;line-height:1.55;
    box-shadow:0 2px 10px rgba(0,0,0,.14);}
  .offline-note[hidden]{display:none;}
  .offline-x{position:absolute;top:3px;right:4px;padding:4px 6px;background:none;border:none;
    color:#7a5c00;font-size:14px;line-height:1;cursor:pointer;border-radius:6px;}
  .offline-x:hover{background:#fdecc0;border:none;}
  /* left:56px keeps it clear of Leaflet's zoom control, which sits above it. */
  @media(min-width:901px){.offline-note{left:auto;right:16px;max-width:340px;}}
  /* The full note reads fine once, but it sat over the map's busiest spot
     indefinitely — on a short phone it blanketed the markers a reader most wants to
     tap. After a few seconds it shrinks to a small badge in the emptiest corner
     (bottom-left: the zoom control owns top-left, the attribution owns bottom-right)
     and stays reachable — the message is one tap away, not gone. Two-class
     specificity (.offline-note.compact) beats the plain .offline-note rules above
     and the >=901px override, so this wins at every width without touching them. */
  .offline-note.compact{left:12px;right:auto;top:auto;bottom:12px;
    width:38px;height:38px;padding:0;border-radius:50%;
    display:flex;align-items:center;justify-content:center;cursor:pointer;max-width:none;}
  .offline-note.compact:hover{background:#fdecc0;}
  .offline-note.compact::before{content:'📴';font-size:16px;line-height:1;}
  .offline-note.compact #offlineText,.offline-note.compact .offline-x{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  /* Tapping the star to favourite a place changed only a 16px glyph's colour —
     easy to miss, which invited a second tap that silently undid the first. This
     is the one, short, unmissable confirmation for that action (and only that
     action: it is not a general notification system). Fixed to the viewport so it
     reads the same whether the popup is at the top or bottom of the screen, and
     pointer-events:none so it never blocks the tap that follows it. */
  .toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,8px);z-index:1300;
    background:#202124;color:#fff;font-size:12.5px;font-weight:600;
    padding:9px 16px;border-radius:20px;box-shadow:0 2px 10px rgba(0,0,0,.25);
    pointer-events:none;opacity:0;transition:opacity .18s,transform .18s;
    max-width:calc(100vw - 40px);text-align:center;}
  .toast[hidden]{display:none;}
  .toast.show{opacity:1;transform:translate(-50%,0);}
  .empty-state p{margin:0 0 10px;}
  .empty-state p:last-child{margin-bottom:0;}
  .empty-btn{font-family:inherit;font-size:12.5px;font-weight:600;color:#fff;background:var(--accent);
    border:none;border-radius:18px;padding:8px 18px;cursor:pointer;}
  .empty-btn:hover{filter:brightness(.94);}
  .bus-coverage{padding:10px 4px 2px;font-size:11.5px;color:var(--sub-ink);line-height:1.65;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px;}
  /* Comfortable targets where a finger is the pointer. Scoped to coarse pointers so
     the desktop toolbar keeps its tuned geometry, and expressed as min-height plus
     centring rather than extra padding, which would reflow the rows. */
  @media(pointer:coarse){
    .lang-btn,.header-links a,.filter-btn,.reset-btn,.preset-chip,.reg-btn,
    .cat-btn,.bus-item,.note-toggle,.cat-util-btn,.af-chip{min-height:44px;}
    .lang-btn,.filter-btn,.reset-btn,.preset-chip,.reg-btn,.cat-btn{
      display:inline-flex;align-items:center;}
    /* The language buttons were tall enough but only ~39px wide. Five at 44px plus
       gaps is 232px, which still fits a 320px phone. */
    .lang-btn{min-width:44px;justify-content:center;}
    /* Below 600px these drop to icon-only (see the max-width:600px block), which
       would otherwise shrink the tap target to just the emoji's own width — well
       under the 44px floor. min-width plus centring keeps the target full-size
       whether it holds an icon alone or an icon and a label. */
    .header-links a,.note-toggle{display:inline-flex;align-items:center;justify-content:center;min-width:44px;}
    .panel-close,.search-clear,.offline-x,.fav-star{min-width:44px;min-height:44px;
      display:inline-flex;align-items:center;justify-content:center;}
    .search-bar{padding-top:12px;padding-bottom:12px;}
  }
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{
      transition-duration:0.01ms !important;
      animation-duration:0.01ms !important;
      animation-iteration-count:1 !important;
      scroll-behavior:auto !important;
    }
  }
  /* WCAG 2.1 §2.4.1 Bypass Blocks: a keyboard-only escape hatch at the very top
     of the DOM that becomes visible only while focused. It jumps focus straight
     to the map area so the first Tab after activation lands in content rather
     than re-traversing every header button. -9999px is the classic off-screen
     trick; clamp() is cleaner but unreliable inside the <iframe>s some assistive
     tech still uses. */
  .skip-link{position:absolute;left:-9999px;top:8px;background:var(--accent);
    color:#fff;padding:10px 14px;border-radius:6px;font-weight:600;font-size:13px;
    z-index:99999;text-decoration:none;box-shadow:0 2px 6px rgba(0,0,0,.2);
    /* 2026-09-07: was 104x39 on a phone — the one control still under the 44px
       minimum. It is a real target the moment it takes focus, so give it the
       same floor as every other control rather than exempting it. */
    display:inline-flex;align-items:center;min-height:44px;box-sizing:border-box;}
  .skip-link:focus,.skip-link:focus-visible{left:8px;outline:3px solid #fff;
    outline-offset:2px;}
  /* visually-hidden but still readable by assistive tech — the canonical "sr-only"
     recipe (1px clip + absolute positioning + zero-size box, none of which is
     display:none, which would actually hide the text from screen readers too). */
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  /* High-contrast users on Windows or macOS get a forced-colour border so the
     geometry doesn't collapse to invisible. The UA supplies Highlight/ButtonText,
     we add a transparent fallback for browsers that don't honour the query. */
  @media (forced-colors: active){
    .filter-btn,.reset-btn,.preset-chip,.lang-btn,.reg-btn,.cat-btn,.apply-btn,
    .empty-btn,.skip-link,.panel-close,.search-clear,.offline-x,.fav-star{
      border:2px solid ButtonText;
    }
    :focus-visible{outline:3px solid Highlight;}
  }
  .pn{color:var(--sub-ink);margin-top:5px;font-size:11.5px;}
  .pr a[href^="tel:"]{color:var(--accent-text);text-decoration:none;font-weight:600;}
  /* popup action row — Directions / Call / Website as three same-size buttons,
     mirroring Google Maps' own place-card action bar rather than mixed link styles */
  .pact{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .pact-btn{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:6px 10px;border-radius:14px;text-decoration:none;white-space:nowrap;background:var(--card);color:var(--accent-text);border:1px solid var(--line);}
  .pact-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  .pact-ic{font-size:12px;line-height:1;}
  @media(max-width:600px){

    /* wrap, not clip — a 4th link (Share) here should never be able to run off

    /* Four labelled links no longer fit one row on a phone once translated (French/

    /* language switcher and the three utility links share one compact band, and

    .fhint{padding:3px 12px 0;font-size:10.5px;line-height:1.2;}
    .search-note{padding:5px 12px 0;}
    .empty-state{margin:10px 12px 0;padding:14px 16px;}
    /* whatever is left after the chrome, with a floor so it is never a sliver */
    #map{height:auto;flex:1 1 auto;min-height:min(58vh,420px);min-height:min(58dvh,420px);width:calc(100% - 24px);margin:10px 12px 0;}
    body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}
    /* flex items default to min-width:auto, which let the horizontally-scrolling

       scrolling row itself */
    .qp-head{display:none;}

    .preset-row{gap:6px;margin:0 -12px;padding-left:12px;padding-right:26px;}
    .preset-chip{padding:7px 11px;font-size:11.5px;}
    .qp-row::after{right:0;top:2px;bottom:2px;width:30px;}
    .qp-row::before{right:5px;top:2px;bottom:2px;font-size:15px;}
  }
  @media(max-width:480px){
    .ftoolbar{flex-wrap:wrap;row-gap:6px;}
    .status{order:3;flex:1 1 100%;}
    .reset-btn{order:2;margin-left:auto;}
  }
  @media(max-width:400px){.ftoolbar{gap:6px;}.filter-btn{padding:8px 9px 8px 11px;font-size:11.5px;gap:5px;}.reset-btn{padding:6px 9px;}}
  /* Short screens: the chrome above the map adds up. On a 320x568 phone the header,
     search bar, toolbar (three rows once French wraps), quick picks and the hint left
     the map starting at 387px — below the middle of the viewport. Raising the touch
     targets to 44px made that worse, so the vertical rhythm is tightened here to pay
     for it. Nothing is removed except the first-run hint, which has served its purpose
     by the time someone is on a screen this tight.
     Targets stay at 44px: shrinking them back is not an acceptable trade. */
  @media(max-height:680px) and (max-width:600px){
    header{padding-top:6px;padding-bottom:0;gap:6px 10px;}
    h1{font-size:15.5px;margin-top:0;}
    .search-bar{margin-top:6px;}
    .ftoolbar{padding-top:8px;row-gap:5px;}
    .qp-row{padding-top:5px;}
    .fhint{display:none;}
    /* The count shared a row with nothing else and cost a whole line. Let it sit
       beside Reset and truncate rather than wrap — the Area button already shows
       which regions are on, so the tail of this sentence is the least useful pixel
       on the screen. */
    .status{order:2;flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;
      text-overflow:ellipsis;}
    .reset-btn{order:3;margin-left:0;}
    #map{margin-top:6px;}

       24px floor. On a 320x568 screen, honouring Apple's 44pt across four rows of
       chrome pushed the map to 409px, leaving a quarter of the viewport for the thing
       the page exists to show. That is the guideline working against its own purpose. */
    @media(pointer:coarse){
      .lang-btn,.header-links a,.filter-btn,.reset-btn,.preset-chip,.reg-btn,
      .cat-btn,.note-toggle,.cat-util-btn,.af-chip{min-height:36px;}
      .lang-btn{min-width:36px;}

      .search-clear{min-width:36px;min-height:36px;}
      .search-bar{padding-top:3px;padding-bottom:3px;}
    }
  }

UI.zh.privacyNote='🔒 隐私：本页面不收集姓名、邮箱、电话、精确位置这类个人身份信息，收藏夹只存在你自己的浏览器里。为了了解哪些功能真正有用，页面会发送匿名使用数据，内容包括你点开了哪些地点、用了哪些功能，以及在搜索框里输入的文字（会先去掉连续数字并截断，用来判断大家在找什么）。同时会有一个在你浏览器本地随机生成的标识符，它保存在浏览器里、下次再来仍然是同一个，用来区分回访，但不与任何身份信息关联，也不跨站点或跨设备追踪；不写 Cookie，服务端不记录 IP 地址。这些请求在浏览器开发者工具的网络面板里可以逐条看到全部内容（/api/event）。页面加载时还会向另外两个第三方发出请求：地图底图（OpenStreetMap 的瓦片服务器），以及 Cloudflare Web Analytics 的统计脚本（static.cloudflareinsights.com，不写 Cookie、不做个人追踪，只汇总访问量等指标）。这两者在请求过程中都会看到你的 IP —— 前者是所有网页地图的共同机制。断网时除底图外全部功能照常可用。';

UI.en.privacyNote='🔒 Privacy: this page does not collect identifying information such as your name, email, phone number or precise location, and your favourites stay in your own browser. To understand which parts are actually useful it does send anonymous usage data — which places you open, which features you use, and the text you type into the search box (digit runs stripped and truncated, so it shows what people look for rather than an address). It also uses a random identifier generated locally in your browser; it is stored there and stays the same on your next visit so return use can be told apart, but it is not linked to any identity and does not track you across sites or devices. No cookies are set and no IP address is recorded on the server. You can inspect every one of these requests in full in your browser\'s DevTools Network panel (/api/event). Two other third parties receive a request when the page loads: OpenStreetMap\'s tile servers for the map imagery, and Cloudflare Web Analytics (static.cloudflareinsights.com — no cookies, no individual tracking, aggregate visit counts only). Both see your IP address in the process; for the map that is the same as any web map. Offline, everything but the imagery still works.';

UI.fr.privacyNote='🔒 Confidentialité : cette page ne recueille pas d\'informations identifiantes comme votre nom, courriel, téléphone ou position précise, et vos favoris restent dans votre propre navigateur. Pour savoir quelles parties servent vraiment, elle envoie des données d\'usage anonymes — les lieux que vous ouvrez, les fonctions que vous utilisez, et le texte saisi dans la recherche (suites de chiffres retirées et texte tronqué). Elle utilise aussi un identifiant aléatoire généré localement dans votre navigateur; il y est conservé et reste le même à votre prochaine visite afin de distinguer les retours, sans être lié à une identité ni vous suivre entre sites ou appareils. Aucun témoin (cookie) n\'est déposé et aucune adresse IP n\'est enregistrée côté serveur. Vous pouvez inspecter chacune de ces requêtes dans l\'onglet Réseau des outils de développement (/api/event). Deux autres tiers reçoivent une requête au chargement : les serveurs de tuiles d\'OpenStreetMap pour le fond de carte, et Cloudflare Web Analytics (static.cloudflareinsights.com — sans témoins, sans suivi individuel, uniquement des totaux de visites). Les deux voient alors votre adresse IP; pour la carte, c\'est le cas de toute carte web. Hors ligne, tout fonctionne sauf le fond de carte.';

UI.zh.catPanelHint='点组名展开查看子分类；勾选整组前的方框可一次选中该组。这里每个分类的颜色和图标都和地图上的图钉一致——这份列表也可以当图例查阅。一个都不勾选时会显示全部分类；勾选是"只看这些"，并不是"隐藏这些"——没有单独隐藏某个分类的功能，只能缩小到你勾选的那几个。生活服务/医疗/住房/购物餐饮这四组默认展开，是因为新居民最先用到，其余分组默认收起。';
UI.zh.catZeroHint='当前选择的区域内没有这个分类的地点（换个区域或选"全部区域"可能会有）。';
UI.zh.busPanelHint='选中一条线路会把它画在地图上，和当前显示的其他地点共存——不会筛选或隐藏它们；再点一次线路（或点提示条上的✕）可以取消选中。';
UI.en.clearCatFilter='✕ Clear category filter';UI.en.doneBtn='Done';UI.en.presetAdjusted='adjusted by hand';UI.en.presetAdjustedShort='(edited)';
UI.en.catPanelHint='Tap a group name to see its subcategories; check the box before a group to select all of it at once. Each category\'s colour and icon here match its pins on the map — this list doubles as the map legend. With nothing checked, every category shows; checking one narrows the map to just that — there\'s no way to hide a single category, only to narrow to the ones you check. Services, Health, Housing and Shopping & Dining start open because newcomers reach for them first; every other group starts collapsed.';
UI.en.catZeroHint='None of this category in the areas currently selected — try a different area, or "All Areas".';
UI.en.busPanelHint='Selecting a route draws it on the map alongside whatever places are already showing — it doesn\'t filter or hide them. Tap it again, or the ✕ on the indicator, to remove it.';
UI.fr.clearCatFilter='✕ Effacer le filtre de catégorie';UI.fr.doneBtn='Terminé';UI.fr.presetAdjusted='ajusté manuellement';UI.fr.presetAdjustedShort='(modifié)';
UI.fr.catPanelHint='Touchez le nom d’un groupe pour voir ses sous-catégories; cochez la case devant un groupe pour le sélectionner en entier. La couleur et l’icône de chaque catégorie ici correspondent à ses repères sur la carte — cette liste sert aussi de légende. Rien coché = tout s’affiche; cocher une catégorie restreint la carte à celle-ci seulement — il n’y a pas moyen de masquer une catégorie, seulement de restreindre à celles cochées. Services, Santé, Logement et Achats et repas s’ouvrent par défaut parce que ce sont ceux dont les nouveaux arrivants ont le plus besoin; les autres groupes restent repliés.';
UI.fr.catZeroHint='Aucun lieu de cette catégorie dans les secteurs actuellement sélectionnés — essayez un autre secteur, ou « Tous les secteurs ».';
UI.fr.busPanelHint='Sélectionner une ligne la trace sur la carte à côté des lieux déjà affichés — elle ne les filtre ni ne les masque. Touchez-la de nouveau, ou le ✕ sur l’indicateur, pour la retirer.';
UI.es.clearCatFilter='✕ Quitar filtro de categoría';UI.es.doneBtn='Listo';UI.es.presetAdjusted='ajustado manualmente';UI.es.presetAdjustedShort='(editado)';
UI.es.catPanelHint='Toque el nombre de un grupo para ver sus subcategorías; marque la casilla junto a un grupo para seleccionarlo por completo. El color y el icono de cada categoría aquí coinciden con sus marcadores en el mapa — esta lista también sirve como leyenda. Sin nada marcado, se muestran todas las categorías; marcar una restringe el mapa solo a esa — no hay forma de ocultar una categoría, solo de restringir a las que marque. Servicios, Salud, Vivienda y Compras y restaurantes empiezan abiertos porque son los que más buscan los recién llegados; el resto empieza colapsado.';
UI.es.catZeroHint='No hay lugares de esta categoría en las zonas seleccionadas actualmente — pruebe otra zona, o "Todas las zonas".';
UI.es.busPanelHint='Seleccionar una ruta la dibuja en el mapa junto a los lugares que ya se muestran — no los filtra ni los oculta. Tóquela de nuevo, o el ✕ del indicador, para quitarla.';
UI.ko.clearCatFilter='✕ 분류 필터 해제';UI.ko.doneBtn='완료';UI.ko.presetAdjusted='수동으로 조정됨';UI.ko.presetAdjustedShort='(수정됨)';
UI.ko.catPanelHint='그룹 이름을 탭하면 하위 분류가 표시됩니다. 그룹 앞의 상자에 표시하면 그룹 전체가 한 번에 선택됩니다. 여기 표시된 각 분류의 색상과 아이콘은 지도 위 핀과 동일합니다 — 이 목록은 범례로도 활용할 수 있습니다. 아무것도 선택하지 않으면 모든 분류가 표시됩니다. 하나를 선택하면 그 분류만 좁혀서 보여줍니다 — 특정 분류만 숨기는 기능은 없고, 선택한 분류로만 좁힐 수 있습니다.생활 서비스·의료·주거·쇼핑·외식 네 그룹은 신규 정착민이 가장 먼저 찾기 때문에 기본으로 펼쳐져 있고, 나머지 그룹은 접혀 있습니다.';
UI.ko.catZeroHint='현재 선택한 지역에는 이 분류의 장소가 없습니다 — 다른 지역이나 "전체 지역"을 선택해 보세요.';
UI.ko.busPanelHint='노선을 선택하면 현재 표시된 다른 장소들과 함께 지도에 그려집니다 — 필터링하거나 숨기지 않습니다. 다시 탭하거나 표시줄의 ✕를 누르면 선택이 해제됩니다.';

UI.zh.guideCA1=`<h3>🛬 刚落地最先做的几件事</h3>
<p>建议按这个顺序办：先办手机SIM卡方便联络，再申请SIN社保卡（找工作/报税必须），然后申请BC省健康卡（有等待期，越早申请越好），最后再开银行账户和办驾照。</p>
<h3>🪪 SIN社会保险号（Social Insurance Number）</h3>
<p>找工作、报税、申请多数政府福利都需要SIN号。可以在<a href="https://www.canada.ca/en/employment-social-development/services/sin.html" target="_blank" rel="noopener">Service Canada官网</a>在线申请，或前往本地Service Canada服务点现场办理（本工具「分类 → 政务移民」里可以找到地址）。免费办理，通常当场或几天内拿到。</p>
<h3>🏦 开银行账户</h3>
<p>本地主要银行（TD、CIBC、BMO、Scotiabank等）大多有"新居民欢迎账户"，通常首年减免月费、可用护照+移民/学签文件直接开户，无需本地信用记录。建议带好护照、移民文件（PR卡/学签/工签）、SIN卡（如已办好）前往网点。地图「分类 → 银行」里能找到附近网点。</p>
<h3>📱 手机与网络</h3>
<p>加拿大主要运营商有Rogers/Telus/Bell及其子品牌（Fido、Koodo、Virgin Plus等），子品牌套餐通常更便宜。建议先办预付费SIM卡应急，落地稳定后再考虑签约套餐（可能需要信用记录或押金）。</p>

`;
UI.zh.guideProv=`<h3>⚕️ BC省健康卡（MSP + BC Services Card）</h3>
<p>BC省的公共医疗保险叫MSP（Medical Services Plan），新居民需要通过<a href="https://www2.gov.bc.ca/gov/content/health/health-drug-coverage/msp/bc-residents/enrolment" target="_blank" rel="noopener">Health Insurance BC官网</a>申请BC Services Card。注意：新登陆通常有最长3个月的等待期，这期间建议购买临时旅游/访客医疗保险覆盖空窗期。看家庭医生、去医院急诊时都需要出示这张卡。</p>
<h3>🚗 驾照</h3>
<p>BC省驾照由ICBC负责。多数国家/地区的驾照可以直接换领或凭驾龄减免部分路考，具体政策请查<a href="https://www.icbc.com/driver-licensing/new-to-bc" target="_blank" rel="noopener">ICBC官网"New to BC"页面</a>确认自己是否符合互认协议。本地考驾照可以在地图「分类 → 驾校」里找。</p>
<h3>🎒 子女入学</h3>
<p>{CITY}属于{SD}学区，公立学校按住址划片，可用<a href="{SD_URL}" target="_blank" rel="noopener">{SD}官方划片查询工具</a>输入住址确认对应学校，再联系学校或学区办理登记入学，通常需要出生证明/护照、疫苗接种记录、住址证明等文件。</p>
<h3>🏠 租房要点</h3>
<p>BC省租房押金（damage deposit）法律上限是半个月租金，房东不能额外收取"押一付三"之类的费用；退租通知、加租规则等受<a href="https://www2.gov.bc.ca/gov/content/housing-tenancy/residential-tenancies" target="_blank" rel="noopener">BC省租客维权处（RTB）</a>保护，遇到纠纷可以拨打RTB电话 <b>1-800-665-8779</b> 咨询，不要单凭房东口头说法。</p>
<h3>⚖️ 法律问题与法律援助</h3>
<p>遇到法律问题不代表一定要花钱请律师，BC省有多个免费/低门槛渠道：<b>Legal Aid BC</b>（法律援助BC）覆盖家庭法、刑事辩护、移民/难民等收入受限人群的法律援助，本地电话 <b>250-314-1900</b>，省内热线 <b>1-866-577-2525</b>，官网legalaid.bc.ca；{CITY}本地有一家实体法律诊所 <b>Okanagan Thompson Legal Clinic</b>（220-301 Victoria St，电话236-425-9121），提供家庭法协助、社会救助/伤残津贴、失业保险、债务、租房纠纷等方面的免费/低成本帮助（地图「分类 → 法律援助」可查看）；<b>Access Pro Bono BC</b>（604-878-7400，accessprobono.ca）为低收入人群、55岁以上长者、残障人士、移民/难民提供免费法律咨询与转介；金额5000加元以下的小额索赔及公寓/共管物业纠纷可通过<b>BC民事解决法庭CRT</b>（1-844-322-2292）在线处理，无需律师；工资/工时等职场纠纷找<b>BC省劳工标准处</b>（1-833-236-3700）；遭遇歧视可联系<b>BC人权仲裁庭</b>（1-888-440-8844）。</p>

`;
UI.zh.guideCA2=`<h3>☎️ 常用号码/常见问题</h3>
<p><b>911</b>——报警/火警/救护车紧急情况；<b>8-1-1</b>——非紧急健康咨询热线，可要求中文翻译服务；<b>250-828-3000</b>——本地RCMP警察非紧急报案。多数政府服务电话可要求"interpreter"/传译服务，不需要自己讲流利英语也能办事。</p>
<p style="margin-top:14px;color:var(--sub-ink);font-size:11.5px;">以上内容为综合公开信息整理的入门参考，具体政策以官方网站/致电确认为准，如有变动以官方信息为准。</p>
`;
UI.en.guideCA1=`<h3>🛬 First Things to Do After You Arrive</h3>
<p>A practical order: get a phone SIM first so you can be reached, then apply for your SIN (needed for work and taxes), then apply for your BC health card (there is a waiting period, so start early), and finally open a bank account and sort out your driver's licence.</p>
<h3>🪪 Social Insurance Number (SIN)</h3>
<p>You need a SIN to work, file taxes, and access most government benefits. Apply online at <a href="https://www.canada.ca/en/employment-social-development/services/sin.html" target="_blank" rel="noopener">Service Canada's website</a>, or in person at a local Service Canada office (look under Category → Gov/Immigration on this map). It's free, and usually issued the same day or within a few days.</p>
<h3>🏦 Opening a Bank Account</h3>
<p>Major banks here (TD, CIBC, BMO, Scotiabank, etc.) usually offer "newcomer welcome" accounts with no monthly fee for the first year, openable with your passport plus immigration/study/work permit documents — no local credit history required. Bring your passport, immigration documents (PR card/study or work permit), and your SIN card (if you have it) to a branch. Find nearby branches under Category → Banks on this map.</p>
<h3>📱 Phone & Internet</h3>
<p>Major carriers are Rogers/Telus/Bell and their budget sub-brands (Fido, Koodo, Virgin Plus, etc.), which are usually cheaper. Consider a prepaid SIM first for immediate needs, then switch to a contract plan once settled (contracts may require credit history or a deposit).</p>

`;
UI.en.guideProv=`<h3>⚕️ BC Health Coverage (MSP + BC Services Card)</h3>
<p>BC's public health plan is called MSP (Medical Services Plan). Apply for your BC Services Card through the <a href="https://www2.gov.bc.ca/gov/content/health/health-drug-coverage/msp/bc-residents/enrolment" target="_blank" rel="noopener">Health Insurance BC website</a>. Note there is typically up to a 3-month waiting period for new residents — consider temporary visitor/travel health insurance to cover that gap. You'll need this card for family doctor visits and hospital/emergency care.</p>
<h3>🚗 Driver's Licence</h3>
<p>BC driver's licences are administered by ICBC. Licences from many countries can be exchanged directly, or may qualify for reduced road-test requirements based on driving experience — check the <a href="https://www.icbc.com/driver-licensing/new-to-bc" target="_blank" rel="noopener">ICBC "New to BC" page</a> to see if your licence qualifies under a reciprocal agreement. To take lessons locally, see Category → Driving School.</p>
<h3>🎒 Enrolling Children in School</h3>
<p>{CITY} is in School District 73 ({SD}). Public schools are assigned by home address — use the <a href="{SD_URL}" target="_blank" rel="noopener">{SD} catchment finder</a> to find your local school, then contact the school or district to register. You'll typically need a birth certificate/passport, immunization records, and proof of address.</p>
<h3>🏠 Renting Basics</h3>
<p>In BC, a damage deposit is legally capped at half a month's rent — landlords cannot demand extra deposits beyond that. Notice periods, rent increase rules, and other tenant protections are set out by the <a href="https://www2.gov.bc.ca/gov/content/housing-tenancy/residential-tenancies" target="_blank" rel="noopener">BC Residential Tenancy Branch (RTB)</a>. If a dispute comes up, call the RTB at <b>1-800-665-8779</b> rather than relying only on what a landlord tells you.</p>
<h3>⚖️ Legal Issues & Getting Legal Aid</h3>
<p>Needing legal help doesn't always mean paying for a lawyer — BC has several free or low-cost options. <b>Legal Aid BC</b> covers family law, criminal defence, and immigration/refugee matters for income-qualified people — {CITY} line <b>250-314-1900</b>, provincial line <b>1-866-577-2525</b>, legalaid.bc.ca. {CITY} has a physical legal clinic, the <b>Okanagan Thompson Legal Clinic</b> (220-301 Victoria St, 236-425-9121), offering free/low-cost help with family law, income assistance/disability benefits, EI, debt, and tenancy issues (see Category → Legal Aid on this map). <b>Access Pro Bono BC</b> (604-878-7400, accessprobono.ca) offers free legal advice and referrals for low-income people, seniors 55+, people with disabilities, and immigrants/refugees. Small claims disputes under $5,000 and strata/condo disputes can be handled online, without a lawyer, through the <b>BC Civil Resolution Tribunal</b> (1-844-322-2292). Unpaid wages or other workplace disputes go to the <b>BC Employment Standards Branch</b> (1-833-236-3700), and discrimination complaints go to the <b>BC Human Rights Tribunal</b> (1-888-440-8844).</p>

`;
UI.en.guideCA2=`<h3>☎️ Key Numbers & Common Questions</h3>
<p><b>911</b> — police/fire/ambulance emergencies. <b>8-1-1</b> — non-emergency health advice line; you can ask for interpretation in your language. <b>250-828-3000</b> — local RCMP non-emergency line. Most government services can provide an interpreter on request, so fluent English isn't required to get things done.</p>
<p style="margin-top:14px;color:var(--sub-ink);font-size:11.5px;">This is a general starting-point summary based on public information — always confirm current policy on the official websites or by phone, as rules can change.</p>
`;
UI.fr.guideCA1=`<h3>🛬 Les premières choses à faire à l'arrivée</h3>
<p>Un ordre pratique : obtenez d'abord une carte SIM pour être joignable, puis demandez votre NAS (nécessaire pour travailler et faire vos impôts), puis votre carte santé de la C.-B. (il y a un délai d'attente, donc commencez tôt), et enfin ouvrez un compte bancaire et réglez votre permis de conduire.</p>
<h3>🪪 Numéro d'assurance sociale (NAS)</h3>
<p>Le NAS est nécessaire pour travailler, produire vos impôts et accéder à la plupart des prestations gouvernementales. Faites la demande en ligne sur le site de <a href="https://www.canada.ca/fr/emploi-developpement-social/services/numero-assurance-sociale.html" target="_blank" rel="noopener">Service Canada</a>, ou en personne dans un bureau local (voir Catégorie → Gouv/Immigration sur cette carte). C'est gratuit, généralement délivré le jour même ou en quelques jours.</p>
<h3>🏦 Ouvrir un compte bancaire</h3>
<p>Les grandes banques (TD, CIBC, BMO, Scotiabank, etc.) offrent souvent des comptes « bienvenue nouveaux arrivants » sans frais mensuels la première année, ouvrables avec passeport et documents d'immigration (carte RP, permis d'études ou de travail) — aucun historique de crédit local requis. Apportez passeport, documents d'immigration et votre carte NAS (si obtenue) à une succursale. Voir les succursales sous Catégorie → Banques sur cette carte.</p>
<h3>📱 Téléphone et internet</h3>
<p>Les grands fournisseurs sont Rogers/Telus/Bell et leurs marques économiques (Fido, Koodo, Virgin Plus, etc.), souvent moins chères. Envisagez d'abord une carte SIM prépayée, puis un forfait avec contrat une fois installé (un contrat peut exiger un historique de crédit ou un dépôt).</p>

`;
UI.fr.guideProv=`<h3>⚕️ Couverture santé de la C.-B. (MSP + carte Services de la C.-B.)</h3>
<p>Le régime public de santé de la C.-B. s'appelle MSP (Medical Services Plan). Faites votre demande de carte Services de la C.-B. sur le site de <a href="https://www2.gov.bc.ca/gov/content/health/health-drug-coverage/msp/bc-residents/enrolment" target="_blank" rel="noopener">Health Insurance BC</a>. Notez qu'il y a généralement un délai d'attente pouvant aller jusqu'à 3 mois pour les nouveaux résidents — pensez à une assurance santé voyage temporaire pour couvrir cette période. Cette carte est nécessaire pour voir un médecin de famille ou aller à l'urgence.</p>
<h3>🚗 Permis de conduire</h3>
<p>Les permis de conduire de la C.-B. sont gérés par ICBC. Les permis de nombreux pays peuvent être échangés directement, ou donner droit à un examen de route allégé selon l'expérience de conduite — consultez la page <a href="https://www.icbc.com/driver-licensing/new-to-bc" target="_blank" rel="noopener">« New to BC » d'ICBC</a> pour vérifier les ententes de réciprocité. Pour des cours de conduite locaux, voir Catégorie → Auto-école.</p>
<h3>🎒 Inscription scolaire des enfants</h3>
<p>{CITY} fait partie du district scolaire {SD}. Les écoles publiques sont assignées selon l'adresse — utilisez l'<a href="{SD_URL}" target="_blank" rel="noopener">outil de recherche d'école {SD}</a> pour trouver votre école, puis contactez l'école ou le district pour l'inscription. Il faut généralement un certificat de naissance/passeport, le carnet de vaccination et une preuve d'adresse.</p>
<h3>🏠 L'essentiel sur la location</h3>
<p>En C.-B., le dépôt de garantie est plafonné par la loi à un demi-mois de loyer — un propriétaire ne peut pas exiger davantage. Les préavis, les règles de hausse de loyer et les autres protections des locataires relèvent de la <a href="https://www2.gov.bc.ca/gov/content/housing-tenancy/residential-tenancies" target="_blank" rel="noopener">Residential Tenancy Branch (RTB) de la C.-B.</a> En cas de litige, appelez la RTB au <b>1-800-665-8779</b> plutôt que de vous fier uniquement à ce que dit le propriétaire.</p>
<h3>⚖️ Questions juridiques et aide juridique</h3>
<p>Avoir besoin d'aide juridique ne signifie pas toujours payer un avocat — la C.-B. offre plusieurs options gratuites ou à faible coût. <b>Legal Aid BC</b> couvre le droit de la famille, la défense criminelle et les questions d'immigration/réfugiés pour les personnes à revenu limité — ligne de {CITY} <b>250-314-1900</b>, ligne provinciale <b>1-866-577-2525</b>, legalaid.bc.ca. {CITY} a une clinique juridique physique, l'<b>Okanagan Thompson Legal Clinic</b> (220-301 Victoria St, 236-425-9121), offrant une aide gratuite ou à faible coût en droit de la famille, aide au revenu/prestations d'invalidité, assurance-emploi, dettes et questions de location (voir Catégorie → Aide juridique sur cette carte). <b>Access Pro Bono BC</b> (604-878-7400, accessprobono.ca) offre des conseils juridiques gratuits et des recommandations pour les personnes à faible revenu, les aînés de 55 ans et plus, les personnes handicapées et les immigrants/réfugiés. Les petites créances de moins de 5 000 $ et les litiges de copropriété peuvent être traités en ligne, sans avocat, via le <b>Tribunal de résolution civile de la C.-B. (CRT)</b> (1-844-322-2292). Les salaires impayés ou autres litiges en milieu de travail relèvent de la <b>Direction des normes d'emploi de la C.-B.</b> (1-833-236-3700), et les plaintes de discrimination relèvent du <b>Tribunal des droits de la personne de la C.-B.</b> (1-888-440-8844).</p>

`;
UI.fr.guideCA2=`<h3>☎️ Numéros utiles et questions fréquentes</h3>
<p><b>911</b> — urgences police/incendie/ambulance. <b>8-1-1</b> — ligne de conseils santé non urgents; vous pouvez demander un interprète. <b>250-828-3000</b> — ligne non urgente de la GRC locale. La plupart des services gouvernementaux peuvent fournir un interprète sur demande — un anglais courant n'est pas nécessaire.</p>
<p style="margin-top:14px;color:var(--sub-ink);font-size:11.5px;">Ce résumé est basé sur des informations publiques générales à titre de point de départ — vérifiez toujours la politique actuelle sur les sites officiels ou par téléphone, car les règles peuvent changer.</p>
`;
UI.es.guideCA1=`<h3>🛬 Primeras cosas por hacer al llegar</h3>
<p>Un orden práctico: primero consiga una SIM para poder ser contactado, luego solicite su SIN (necesario para trabajar y declarar impuestos), después su tarjeta de salud de BC (hay un período de espera, así que empiece pronto), y finalmente abra una cuenta bancaria y resuelva su licencia de conducir.</p>
<h3>🪪 Número de Seguro Social (SIN)</h3>
<p>Necesita un SIN para trabajar, declarar impuestos y acceder a la mayoría de los beneficios gubernamentales. Solicítelo en línea en el <a href="https://www.canada.ca/en/employment-social-development/services/sin.html" target="_blank" rel="noopener">sitio web de Service Canada</a>, o en persona en una oficina local de Service Canada (vea Categoría → Gobierno/Inmigración en este mapa). Es gratuito y generalmente se emite el mismo día o en pocos días.</p>
<h3>🏦 Abrir una cuenta bancaria</h3>
<p>Los principales bancos aquí (TD, CIBC, BMO, Scotiabank, etc.) suelen ofrecer cuentas de "bienvenida para recién llegados" sin cuota mensual el primer año, que se pueden abrir con su pasaporte y documentos de inmigración (tarjeta de residencia permanente, permiso de estudios o trabajo) — no se requiere historial crediticio local. Lleve su pasaporte, documentos de inmigración y su tarjeta SIN (si ya la tiene) a una sucursal. Encuentre sucursales cercanas en Categoría → Bancos en este mapa.</p>
<h3>📱 Teléfono e internet</h3>
<p>Los principales operadores son Rogers/Telus/Bell y sus submarcas económicas (Fido, Koodo, Virgin Plus, etc.), que suelen ser más baratas. Considere primero una SIM prepagada para necesidades inmediatas, y luego cambie a un plan con contrato una vez establecido (los contratos pueden requerir historial crediticio o un depósito).</p>

`;
UI.es.guideProv=`<h3>⚕️ Cobertura de salud de BC (MSP + tarjeta Services Card)</h3>
<p>El plan público de salud de BC se llama MSP (Medical Services Plan). Solicite su tarjeta BC Services Card a través del <a href="https://www2.gov.bc.ca/gov/content/health/health-drug-coverage/msp/bc-residents/enrolment" target="_blank" rel="noopener">sitio web de Health Insurance BC</a>. Tenga en cuenta que suele haber un período de espera de hasta 3 meses para nuevos residentes — considere un seguro de salud temporal para cubrir ese período. Necesitará esta tarjeta para visitas al médico de familia y atención hospitalaria/de urgencias.</p>
<h3>🚗 Licencia de conducir</h3>
<p>Las licencias de conducir de BC son administradas por ICBC. Las licencias de muchos países pueden canjearse directamente, o calificar para requisitos reducidos de examen de manejo según la experiencia — consulte la página <a href="https://www.icbc.com/driver-licensing/new-to-bc" target="_blank" rel="noopener">"New to BC" de ICBC</a> para ver si su licencia califica bajo un acuerdo recíproco. Para tomar clases localmente, vea Categoría → Autoescuela.</p>
<h3>🎒 Inscripción escolar de los niños</h3>
<p>{CITY} pertenece al Distrito Escolar 73 ({SD}). Las escuelas públicas se asignan según la dirección — use el <a href="{SD_URL}" target="_blank" rel="noopener">buscador de zona escolar de {SD}</a> para encontrar su escuela local, luego contacte a la escuela o al distrito para inscribirse. Generalmente necesitará certificado de nacimiento/pasaporte, registro de vacunación y comprobante de domicilio.</p>
<h3>🏠 Lo esencial sobre el alquiler</h3>
<p>En BC, el depósito de garantía está legalmente limitado a medio mes de alquiler — los propietarios no pueden exigir depósitos adicionales. Los períodos de aviso, las reglas de aumento de renta y otras protecciones para inquilinos están establecidas por la <a href="https://www2.gov.bc.ca/gov/content/housing-tenancy/residential-tenancies" target="_blank" rel="noopener">Oficina de Arrendamientos Residenciales de BC (RTB)</a>. Si surge una disputa, llame a la RTB al <b>1-800-665-8779</b> en lugar de confiar solo en lo que le diga el propietario.</p>
<h3>⚖️ Problemas legales y cómo obtener ayuda legal</h3>
<p>Necesitar ayuda legal no siempre significa pagar un abogado — BC tiene varias opciones gratuitas o de bajo costo. <b>Legal Aid BC</b> cubre derecho de familia, defensa criminal e inmigración/refugiados para personas que califican por ingresos — línea de {CITY} <b>250-314-1900</b>, línea provincial <b>1-866-577-2525</b>, legalaid.bc.ca. {CITY} tiene una clínica legal física, la <b>Okanagan Thompson Legal Clinic</b> (220-301 Victoria St, 236-425-9121), que ofrece ayuda gratuita o de bajo costo en derecho de familia, asistencia social/beneficios por discapacidad, seguro de desempleo, deudas y disputas de arrendamiento (vea Categoría → Ayuda legal en este mapa). <b>Access Pro Bono BC</b> (604-878-7400, accessprobono.ca) ofrece asesoría legal gratuita y referencias para personas de bajos ingresos, personas mayores de 55 años, personas con discapacidad e inmigrantes/refugiados. Las demandas de menor cuantía por debajo de $5,000 y las disputas de condominios pueden resolverse en línea, sin abogado, a través del <b>Tribunal de Resolución Civil de BC (CRT)</b> (1-844-322-2292). Los salarios impagos u otras disputas laborales van a la <b>Dirección de Normas Laborales de BC</b> (1-833-236-3700), y las quejas por discriminación van al <b>Tribunal de Derechos Humanos de BC</b> (1-888-440-8844).</p>

UI.ko.guideCA1=`<h3>🛬 도착 후 가장 먼저 해야 할 일</h3>
<p>추천 순서: 먼저 연락이 가능하도록 휴대폰 SIM 카드를 개통하고, 다음으로 SIN(사회보험번호)을 신청합니다(취업/세금 신고에 필수). 그 다음 BC주 건강보험카드를 신청하세요(대기 기간이 있으니 최대한 빨리 신청하는 것이 좋습니다). 마지막으로 은행 계좌를 개설하고 운전면허를 처리합니다.</p>
<h3>🪪 사회보험번호(SIN)</h3>
<p>취업, 세금 신고, 대부분의 정부 혜택 신청에 SIN이 필요합니다. <a href="https://www.canada.ca/en/employment-social-development/services/sin.html" target="_blank" rel="noopener">Service Canada 웹사이트</a>에서 온라인으로 신청하거나, 지역 Service Canada 사무소를 방문해 직접 신청할 수 있습니다(이 지도의 「분류 → 정부/이민」에서 위치를 찾을 수 있습니다). 무료이며 보통 당일 또는 며칠 내에 발급됩니다.</p>
<h3>🏦 은행 계좌 개설</h3>
<p>현지 주요 은행(TD, CIBC, BMO, Scotiabank 등)은 대부분 "신규 정착민 환영 계좌"를 제공하며, 첫 해 월 수수료가 면제되고 여권과 이민/학생비자/취업비자 서류만으로 개설 가능해 현지 신용기록이 필요 없습니다. 여권, 이민 서류(영주권 카드/학생비자/취업비자), SIN 카드(있는 경우)를 지참해 지점을 방문하세요. 지도의 「분류 → 은행」에서 근처 지점을 찾을 수 있습니다.</p>
<h3>📱 휴대폰과 인터넷</h3>
<p>캐나다의 주요 통신사는 Rogers/Telus/Bell과 이들의 저가 브랜드(Fido, Koodo, Virgin Plus 등)로, 저가 브랜드가 대체로 더 저렴합니다. 우선 선불 SIM 카드로 급한 용무를 처리한 뒤, 정착 후 안정되면 약정 요금제를 고려하세요(약정에는 신용기록이나 보증금이 필요할 수 있습니다).</p>

`;
UI.ko.guideProv=`<h3>⚕️ BC주 건강보험(MSP + BC Services Card)</h3>
<p>BC주의 공공 의료보험은 MSP(Medical Services Plan)라고 합니다. <a href="https://www2.gov.bc.ca/gov/content/health/health-drug-coverage/msp/bc-residents/enrolment" target="_blank" rel="noopener">Health Insurance BC 웹사이트</a>를 통해 BC Services Card를 신청하세요. 신규 정착민은 보통 최대 3개월의 대기 기간이 있으니, 이 기간을 대비해 임시 여행자/방문자 의료보험 가입을 고려하는 것이 좋습니다. 가정의 진료나 응급실 방문 시 이 카드가 필요합니다.</p>
<h3>🚗 운전면허</h3>
<p>BC주 운전면허는 ICBC에서 관리합니다. 많은 국가/지역의 운전면허는 직접 교환하거나 운전 경력에 따라 도로주행시험이 일부 면제될 수 있습니다. <a href="https://www.icbc.com/driver-licensing/new-to-bc" target="_blank" rel="noopener">ICBC의 "New to BC" 페이지</a>에서 상호 인정 협약 대상인지 확인하세요. 현지에서 운전 교습을 받으려면 지도의 「분류 → 운전학원」에서 찾을 수 있습니다.</p>
<h3>🎒 자녀 학교 등록</h3>
<p>{CITY}는 {SD} 학군에 속하며, 공립학교는 주소지에 따라 배정됩니다. <a href="{SD_URL}" target="_blank" rel="noopener">{SD} 공식 학군 조회 도구</a>에 주소를 입력해 해당 학교를 확인한 후, 학교 또는 학군 사무소에 연락해 등록 절차를 진행하세요. 보통 출생증명서/여권, 예방접종 기록, 주소 증명 서류가 필요합니다.</p>
<h3>🏠 임대 관련 기본 정보</h3>
<p>BC주에서 보증금(damage deposit)은 법적으로 임대료의 절반을 초과할 수 없으며, 집주인은 이를 초과하는 추가 보증금을 요구할 수 없습니다. 퇴거 통지, 임대료 인상 규정 등은 <a href="https://www2.gov.bc.ca/gov/content/housing-tenancy/residential-tenancies" target="_blank" rel="noopener">BC주 임차인 권익보호처(RTB)</a>의 보호를 받습니다. 분쟁이 발생하면 집주인의 말만 믿지 말고 RTB 전화 <b>1-800-665-8779</b>로 문의하세요.</p>
<h3>⚖️ 법률 문제와 법률 지원 받기</h3>
<p>법률 문제가 생겼다고 반드시 변호사를 선임해야 하는 것은 아닙니다. BC주에는 무료 또는 저비용으로 이용할 수 있는 여러 경로가 있습니다. <b>Legal Aid BC</b>(법률 지원 BC)는 소득 기준을 충족하는 사람들을 위해 가족법, 형사 변호, 이민/난민 관련 법률 지원을 제공합니다({CITY} 지역 전화 <b>250-314-1900</b>, 주 전체 상담전화 <b>1-866-577-2525</b>, legalaid.bc.ca). {CITY}에는 <b>Okanagan Thompson Legal Clinic</b>(220-301 Victoria St, 전화 236-425-9121)이라는 실제 법률 클리닉이 있어 가족법, 사회부조/장애수당, 실업보험, 채무, 임대 분쟁 등에 대해 무료 또는 저비용 지원을 제공합니다(지도의 「분류 → 법률 지원」에서 확인 가능). <b>Access Pro Bono BC</b>(604-878-7400, accessprobono.ca)는 저소득층, 55세 이상 노인, 장애인, 이민자/난민에게 무료 법률 상담과 연계 서비스를 제공합니다. 5,000달러 미만의 소액 청구 소송이나 콘도/공동주택 분쟁은 변호사 없이 <b>BC 민사분쟁해결심판원(CRT)</b>(1-844-322-2292)을 통해 온라인으로 처리할 수 있습니다. 임금 체불 등 직장 관련 분쟁은 <b>BC주 노동기준처</b>(1-833-236-3700)에, 차별 문제는 <b>BC 인권심판원</b>(1-888-440-8844)에 문의하세요.</p>

`;

UI.zh.guideCity=`
<h3>🏙️ 关于{CITY}</h3>
<p>{CITY}（甘露市）位于BC省内陆南部，坐落在North Thompson River与South Thompson River交汇处，是Tk'emlúps te Secwépemc（Secwepemc/舒斯瓦普原住民族）的传统领地。全市人口约9.8万（2021年人口普查），连都会区约12.7万人。气候是典型的半干旱大陆性气候，夏季炎热干燥（7月平均高温约27-28°C），冬季寒冷（1月平均低温约-7至-8°C），降水明显少于温哥华等沿海地区。因投入大量体育场馆设施、常年承办各类业余体育赛事，{CITY}素有"加拿大锦标赛之都（Tournament Capital of Canada）"之称。本地经济主要依托Thompson Rivers University（TRU大学）、林木加工、矿业、区域医疗中心及旅游业。</p>

`;
UI.en.guideCity=`
<h3>🏙️ About {CITY}</h3>
<p>{CITY} sits in the southern Interior of British Columbia, at the confluence of the North Thompson and South Thompson Rivers, on the traditional territory of the Tk'emlúps te Secwépemc (Secwepemc Nation). The city's population is roughly 98,000 (2021 Census), about 127,000 across the metro area. The climate is semi-arid: hot, dry summers (average July highs around 27–28°C) and cold winters (average January lows around -7 to -8°C), with much less precipitation than coastal BC cities like Vancouver. {CITY} is nicknamed the "Tournament Capital of Canada" thanks to its extensive sports facilities and the many amateur tournaments it hosts each year. The local economy centres on Thompson Rivers University (TRU), forestry, mining, a regional hospital hub, and tourism.</p>

`;

<h3>🏙️ Sobre {CITY}</h3>
<p>{CITY} se encuentra en el sur del Interior de Columbia Británica, en la confluencia de los ríos North Thompson y South Thompson, en el territorio tradicional de los Tk'emlúps te Secwépemc (Nación Secwepemc). La población de la ciudad es de aproximadamente 98,000 habitantes (Censo de 2021), y de unos 127,000 en el área metropolitana. El clima es semiárido: veranos calurosos y secos (máximas promedio de julio alrededor de 27-28°C) e inviernos fríos (mínimas promedio de enero alrededor de -7 a -8°C), con mucha menos precipitación que ciudades costeras de BC como Vancouver. {CITY} es conocida como la "Capital de Torneos de Canadá" (Tournament Capital of Canada) gracias a sus amplias instalaciones deportivas y los numerosos torneos amateur que organiza cada año. La economía local se basa en Thompson Rivers University (TRU), la silvicultura, la minería, un centro hospitalario regional y el turismo.</p>

<h3>🏙️ {CITY} 소개</h3>

  {v:'2026.09.07b',

       '恢复「记住你选过的语言」：手动切换后会记在浏览器里，下次不带 ?lang= 参数打开仍是你选的语言。链接里明确带的 ?lang= 依然优先。此前这个功能在改版中丢失，每次重开都会退回浏览器语言',
       '恢复「有更新」提示：更新记录其实一直在维护，但它排在新居民指南的最底部——实测要滚约 12 倍面板高度才看得到，回访的人根本无从知道改过什么。现在指南按钮上有红点（打开一次即消失，版本变化后再出现），指南顶部有一键跳转链接',
       '分类配色修复：医院与亚洲超市此前图钉色和文字色完全相同，汽车维修与法律援助的文字色也相同——而分类面板本身是当作地图图例用的，颜色撞车会让图例失效。另外出租车/室内儿童乐园/租房中介三个颜色与白字对比度低于代码自己声明的 4.5:1，一并调深',

   en:['Bus stop labels are measured by the width the text actually takes again. The check had been reduced to a fixed 58-pixel distance, but a long name like "Lansdowne Exch Bay I" needs roughly three times the clearance of a short one, and across the 14 routes labels were drawing over each other. Two subtler faults went with it: a label hidden by the previous pass reports a width of 0, so it looked like it fit anywhere and kept popping back; and a loop route that passes the same exchange bay twice stacked two identical names on the same spot. Overlaps across all 14 routes are now zero, and more stop names are visible than before',
       'The language you pick is remembered again — switch manually and the next visit without ?lang= opens in that language; an explicit ?lang= in a shared link still wins. This had been lost in a rewrite, so every reopen fell back to the browser language',
       'The "something changed" cue is back. The change log is maintained but sits at the very bottom of the newcomer guide — measured at about 12x the panel height of scrolling — so a returning reader had no way to discover it. The guide button now carries a dot (cleared once opened, back when the version changes) and the guide opens with a jump link to it',
       'Category colour repairs: Medical and Asian Market had identical pin and text colours, as did Auto Repair and Legal Aid — and the category panel is explicitly offered as the map legend, which collisions break. Taxi, Indoor Play and Rental agents also sat below the 4.5:1 on white that the colour table itself promises, and were darkened',

  {v:'2026.09.07',
   zh:['修复整页文案空白：2026-09-05 新增的 4 条记录用了 CI 里不存在的分类 key（rec/community/cafe/liquor），popup() 取 CI[分类][语言] 抛异常，而所有弹窗是在启动时一次性构建的，于是这一条坏记录让初始化循环中途死掉——标题、按钮文字、快捷选择、地点计数全部没写进页面，只剩一个空壳。同一批改动里还有第二个被它掩盖的崩溃：面板焦点陷阱那行 backdrop.addEventListener 写在 const backdrop 声明之前，触发暂时性死区。两个都已修复',
       '正式新增两个分类：☕咖啡店、🍷酒类专卖（五种语言标签、地图图钉色、文字安全色、归入购物餐饮组）。Westsyde Community Hall 按 DATA-SCHEMA 定义归入既有的「社区中心」；「Westsyde Pool & Fitness Centre」和一条重复的「Westsyde Centennial Park」是与既有记录同地址的重复条目，已删除',
       '新增第四档来源标签「未核实（建议致电确认）」：补覆盖缺口时新增、尚未逐项电话核实的记录，此前带着 CI 不认识的 src 值，结果一个来源标签都不显示——最没核实的记录反而看起来最干净。现在会明确提示读者先打电话确认，且这些记录仍然不会进入对外开放的数据子集',
       '删除深色模式：只给面板换肤、地图底图仍是亮的，深色边框里嵌一块白地图并不好看；同时页面显式声明为 light-only，微信等内置浏览器的自动深色转换不会再把文字变成看不见的浅色',
       '修复源数据文件被自动编辑改坏的两处：地点数组丢了赋值前缀（const P 那一句）（任何重新构建都会得到空地图）、文件头注释被拼接成一行',
       'deploy.sh 增加静态校验闸门：validate.py 不通过就不部署。9-05 那次上线的 19 项校验失败，validate.py 本来全都能查出来，只是从来没被放进部署路径'],
   en:['Fixed the blank-interface bug: four records added on 2026-09-05 used category keys absent from CI (rec/community/cafe/liquor). popup() reads CI[category][lang], every popup is built in one pass at start-up, and so a single bad row killed the init loop midway — title, button labels, Quick Picks and the place count were never written, leaving an empty shell. A second crash in the same batch was masked by the first: the panel focus-trap line called backdrop.addEventListener above the const backdrop declaration, a temporal-dead-zone ReferenceError. Both fixed',
       'Two categories added properly: ☕ Cafés and 🍷 Liquor Stores (labels in five languages, a map-pin colour, a text-safe colour meeting 4.5:1 on white, and membership of the Shopping & Dining group). Westsyde Community Hall moves into the existing Community Centre category, which is where DATA-SCHEMA already puts halls; "Westsyde Pool & Fitness Centre" and a second "Westsyde Centennial Park" duplicated existing records at the same address and were removed',
       'A fourth source tier — "Unverified — call ahead". Entries added to fill coverage gaps but not yet phone-checked were carrying a src value no tier recognised, so they rendered no provenance chip at all: the least-verified rows looked the cleanest. They now tell the reader to confirm first, and still stay out of the openly-licensed export',
       'Dark mode removed: it re-skinned only the chrome we own while the OSM basemap stayed bright, which put a white map inside a dark frame. The page now declares itself light-only, which also stops in-app browsers (WeChat especially) applying an automatic dark transform that turned text unreadable',
       'Repaired two corruptions a bad automated edit left in the data file: the places array had lost the assignment that names it (any rebuild would have produced an empty map) and the header comment had been joined into one line',
       'deploy.sh now runs validate.py as a hard gate. All 19 failures that shipped on 09-05 were things validate.py already catches — it simply was never part of the deploy path']},
  {v:'2026.09.05b',
   zh:['埋点可区分维护者流量与真实用户：以 ?debug=1 打开页面的所有事件，以及每次部署后的自动化冒烟测试，都会标记 env:dev 并写入独立的数据列。分析时用 double2=0 只看真实用户，避免测试用的假地点 ID 混进「最常查看的地点」排名。分享按钮的埋点拆成 stage:intent（点击意图）与 stage:result（复制结果）两次记录——此前只发一条 copied:false 表示点击，回溯数据时被误读成一半的复制失败率'],
   en:['Analytics can now separate maintainer traffic from real usage: any event from a page opened with ?debug=1, plus the automated post-deploy smoke test, is tagged env:dev and written to its own numeric column. Filter on double2=0 to see real users only, so hand-rolled test place IDs stop polluting the "most viewed places" ranking. The share button now logs two distinct events — stage:intent (the click) and stage:result (the copy outcome) — where it previously emitted a bare copied:false for the click, which read back as a 50% failure rate even though every copy succeeded']},
  {v:'2026.09.05',
   zh:['埋点接入 Cloudflare Analytics Engine（Phase A 上线）：trackEvent() 内部从「仅写 localStorage」改为「同时通过 navigator.sendBeacon 把事件发到 /api/event，Worker 写入 Analytics Engine」；25 处调用点全部不动。新增匿名会话 ID（kamloopsSid，localStorage 持久化）让服务端能识别同一浏览器的多次会话。搜索词脱敏规则保持不变；footer 加了一行小字说明匿名统计'],
   en:['Click tracking upgraded to Phase A: trackEvent() now both writes to localStorage AND fires navigator.sendBeacon("/api/event") on every call, where the Cloudflare Worker records the row in Analytics Engine. All 25 call sites stay unchanged. Added an anonymous session ID (kamloopsSid in localStorage) so server-side queries can stitch events from the same browser. Search-query sanitisation is unchanged; the footer now carries a one-line privacy note']},
  {v:'2026.09.04c',
   zh:['新增点击埋点（本地版）：18 类事件统一走 trackEvent(type, props) 抽象——搜索、搜索无结果、分类（含 × 清除）、区域、快捷选择（含全部清除）、语言、收藏、面板打开/关闭、地图标记查看/关闭、popup 内导航/电话/网站按钮、分享、重置；本机 localStorage，?debug=1 可查看计数与导出 JSON；Phase A 接入 Cloudflare Analytics Engine 时只改 trackEvent 内部实现，调用点不动',
       '搜索词在埋点层做脱敏：去除连续 3 位以上数字串并截断到 24 字符（Phase A 上传时将不含人名/电话/地址）'],
   en:['Click tracking added (Phase B / local-only): 19 event types now flow through one trackEvent(type, props) helper — search, search-empty, category (incl. × chip clear), region, preset (incl. clear all), language, favorite, panel open/close, marker view/close, in-popup nav/call/web buttons, share, reset. 25 call sites in total (share_click uses 4 branches to cover execCommand / clipboard / failure paths). Stored on this device only; open ?debug=1 to see counts and export JSON. Phase A replaces the helper\'s internals with a sendBeacon — all 25 call sites stay untouched.',
       'Search queries are sanitised before storage: digit runs ≥3 chars are stripped and the term is capped at 24 characters, so Phase A server-side payloads cannot carry phone numbers, addresses or names']},

// 250 pins at the default zoom used to pile into an unreadable clump over downtown,

      // The number was already visible, but what it means ("N places — tap to

// Search looks at everything a person might plausibly type: the name, the street
// address, the category label *in the language they are reading*, and the notes.
// Matching only name+address meant a Korean reader searching "은행" got nothing.
function noteText(d){
  const nt=d.note;
  if(!nt)return '';
  if(typeof nt==='string')return nt;
  return nt[L_]||nt.en||nt.zh||'';
}
// Scores a place against the query instead of returning a flat yes/no, so results
// can be ordered by how well they match rather than dumped in data order.
// Field order below is the ranking: name-prefix beats name-contains beats category,
// and notes — the longest, noisiest field — rank last.
function matchScore(d,q){
  const name=d.n.toLowerCase(), addr=(d.a||'').toLowerCase();
  const cat=catLabel(d.c).toLowerCase(), reg=regLabel(d.g).toLowerCase();
  const note=(noteText(d)||'').toLowerCase();
  const tag=(d.tag&&UI[L_][d.tag]?UI[L_][d.tag]:'').toLowerCase();
  if(name.startsWith(q))return 100;
  if(name.includes(q))return 80;
  if(cat.startsWith(q)||cat.includes(q))return 60;
  if(tag&&tag.includes(q))return 50;
  if(addr.includes(q))return 40;
  if(reg.includes(q))return 30;
  // Notes are long prose, so a hit inside one only counts for a query with enough
  // information in it. Two CJK/Hangul characters are a whole word; two Latin
  // letters are not — so the threshold differs by script rather than raw length.
  if(note.includes(q)){
    const cjk=/[\u3400-\u9fff\uac00-\ud7af\u3040-\u30ff]/.test(q);
    return q.length>=(cjk?2:4)?10:0;
  }
  return 0;
}
const MIN_QUERY=2;
function apply(){let v=0;
  // WCAG 2.4.4 / 4.1.3: capture the previous visible count so we can decide
  // whether to re-announce to the polite live region. Re-announcing on every
  // filter tweak would be noisy; only doing it when v genuinely changes is
  // both correct (the user actually sees a different map) and quiet.
  const prevVisible=lastVisible;
  const searching=!!searchTerm;
  const totalR=Object.keys(RI).length;
  // Search used to silently bypass the Area/Category filters — a "bank" search
  // while North Shore was selected quietly searched the whole city, which read as
  // the filter having stopped working rather than as intended behaviour. Search now
  // narrows within whatever is already filtered, the way typing into a filtered
  // spreadsheet does, so a filter chip stays true for as long as it's on screen.
  const filtered=aR.size<totalR||aC.size>0;
  const bounds=[];
  M.forEach(m=>{
    const sc=searching?matchScore(m.data,searchTerm):0;
    m.score=sc;
    const inFilter=(aC.size===0||aC.has(m.ck))&&aR.has(m.gk);
    const s=searching?(sc>0&&inFilter):inFilter;
    if(s){showMarker(m);v++;bounds.push([m.data.lat,m.data.lng]);}else{hideMarker(m);}});
  const u=UI[L_];
  const st=document.getElementById('statusText');
  if(searching){
    st.textContent=u.searchResultsN(v);
    if(v>0&&v<=40){map.fitBounds(bounds,{padding:[50,50],maxZoom:16});}
    if(v===1){const only=M.find(m=>m.score>0);if(only)focusMarker(only,16);}
  }else{
    // On a short, narrow screen this line has to share a row with Reset, and the
    // count is the half worth keeping — which regions are on is already visible on
    // the Area button. The full sentence stays in the title attribute.
    st.textContent=u.showing(v,P.length)+(TIGHT.matches?'':' · '+regionLabel());
  }
  st.title=searching?st.textContent:(u.showing(v,P.length)+' · '+regionLabel());
  document.getElementById('applyBtn').textContent=u.doneBtn;
  lastVisible=v;
  updatePanelTitle();
  const totalC=Object.keys(CI).length;
  const areaBadge=document.getElementById('areaBadge');
  if(aR.size<totalR){areaBadge.hidden=false;areaBadge.textContent=aR.size;}else{areaBadge.hidden=true;}
  const catBadge=document.getElementById('catBadge');
  if(aC.size>0){catBadge.hidden=false;catBadge.textContent=aC.size;}else{catBadge.hidden=true;}
  const dims=(aR.size===totalR?0:1)+(aC.size>0?1:0);
  document.getElementById('resetBtn').hidden=false;
  // Area/Category and Quick Picks stay fully live while searching now, so nothing
  // dims them any more, and the active-filter chips stay visible too — they are
  // still true. The one thing worth saying is that a filter is narrowing the
  // search itself, since that's easy to miss if you set the filter a while ago.
  document.getElementById('searchNote').textContent=
    searching?(filtered?u.searchActive:''):(searchRaw?u.searchTooShort:'');
  renderActiveFilters();
  updatePresetActive();
  lastDims=dims;
  // Polite live announcement only when the visible count actually moved. Tools
  // that listen (VoiceOver/NVDA) will queue and read this without barge-in, and
  // because the element is .sr-only it never affects sighted layout.
  if(v!==prevVisible&&(v===0||prevVisible===0||Math.abs(v-prevVisible)>=3)){
    const ann=document.getElementById('a11yAnnounce');
    if(ann)ann.textContent=u.aResultsAnnounce(v,P.length);
  }
  updateResetState();
  writeURLState();
  renderEmptyState(v,searching,filtered);

function clusterRects(){
