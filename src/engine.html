  {v:'2026.09.07c',
   zh:['新增分享面板：过去点「分享」只是把链接复制到剪贴板，现在会打开一个面板，可以直接发到 WhatsApp、Facebook、X、Telegram、LINE、邮件、短信，复制链接仍然排在第一个。手机上会多出「用系统分享」——调用手机自带的分享面板，里面列出的是你自己装了的 App，微信、KakaoTalk、TikTok 都能直接选到。分享出去的链接依然带着当前的语言、区域、分类和搜索词。',
       '关于微信和 TikTok：它们没有提供「分享网页链接」的接口——微信在电脑上要扫码、在自家浏览器里要用需服务端签名的 JS-SDK，TikTok 的 Share Kit 是通过注册应用推送视频/图片而不是网址。所以面板里不做它们的按钮（做了也点不动），而是在说明里写清楚：手机用系统分享可直达微信，电脑上复制链接后粘贴。韩国的 KakaoTalk 同理。',
       '分享埋点按平台细分：新增 share_open（打开面板，并记录该设备是否支持系统分享），share_click 沿用原有的 intent/result 两段式，但加上了 target 字段（copy / whatsapp / facebook / x / telegram / line / email / sms / native）。系统分享还会区分「分享成功」和「用户取消」——取消是正常结果而非失败，混在一起会让成功率失真。'],
   en:['A share sheet. The Share button used to copy the link and stop there; it now opens a panel that sends straight to WhatsApp, Facebook, X, Telegram, LINE, email or Messages, with Copy link still first. On a phone there is also "Share via your device", which opens the OS share sheet — that lists the apps the reader actually has installed, so WeChat, KakaoTalk and TikTok are all reachable there. The shared link still carries the current language, area, category and search.',
       'On WeChat and TikTok: neither offers a share-a-link endpoint. WeChat expects a QR scan on desktop or a server-signed JS-SDK inside its own browser, and TikTok Share Kit pushes video or photos through a registered app rather than a URL. Rather than add buttons that could not work, the sheet says plainly what to do: use the device share sheet on a phone to reach WeChat directly, or copy the link and paste it on a computer. KakaoTalk is the same.',
       'Share telemetry is now per destination: share_open records opening the sheet and whether the device supports the native sheet; share_click keeps the existing intent/result staging and adds a target field (copy / whatsapp / facebook / x / telegram / line / email / sms / native). The native path also separates a completed share from a dismissed one — dismissing is a normal outcome, and folding it into failures would distort the success rate.']},
  {v:'2026.09.07b',
   zh:['公交站名标签重新按文字实际宽度做碰撞检测：此前退回成了「固定 58 像素距离」，长站名（如 Lansdowne Exch Bay I）需要的间距是短站名的三倍，一个固定值不可能同时正确，14 条线路实测有多处标签互相压字。同时修掉两个更隐蔽的问题——被隐藏的标签宽度读数为 0，会被误判成「放得下」而反复弹回来；以及同一条环线两次经过同一换乘站时，两个同名标签直接叠在一起。现在 14 条线路标签互压为 0，显示的站名反而更多',
       '恢复「记住你选过的语言」：手动切换后会记在浏览器里，下次不带 ?lang= 参数打开仍是你选的语言。链接里明确带的 ?lang= 依然优先。此前这个功能在改版中丢失，每次重开都会退回浏览器语言',
       '恢复「有更新」提示：更新记录其实一直在维护，但它排在新居民指南的最底部——实测要滚约 12 倍面板高度才看得到，回访的人根本无从知道改过什么。现在指南按钮上有红点（打开一次即消失，版本变化后再出现），指南顶部有一键跳转链接',
       '分类配色修复：医院与亚洲超市此前图钉色和文字色完全相同，汽车维修与法律援助的文字色也相同——而分类面板本身是当作地图图例用的，颜色撞车会让图例失效。另外出租车/室内儿童乐园/租房中介三个颜色与白字对比度低于代码自己声明的 4.5:1，一并调深',
       '「跳到主内容」快捷链接的高度从 39 像素提到 44 像素，这是全站最后一个未达触控标准的控件',
       '隐私说明改写：此前把上传内容列成「事件类型＋时间戳＋会话 ID」三项，但实际上搜索框里输入的文字也会上传（去掉连续数字并截断后）；那个标识符也不是一次性的，它存在浏览器里、下次访问仍是同一个。现在如实说明，不再用封闭式列举'],
   en:['Bus stop labels are measured by the width the text actually takes again. The check had been reduced to a fixed 58-pixel distance, but a long name like "Lansdowne Exch Bay I" needs roughly three times the clearance of a short one, and across the 14 routes labels were drawing over each other. Two subtler faults went with it: a label hidden by the previous pass reports a width of 0, so it looked like it fit anywhere and kept popping back; and a loop route that passes the same exchange bay twice stacked two identical names on the same spot. Overlaps across all 14 routes are now zero, and more stop names are visible than before',
       'The language you pick is remembered again — switch manually and the next visit without ?lang= opens in that language; an explicit ?lang= in a shared link still wins. This had been lost in a rewrite, so every reopen fell back to the browser language',
       'The "something changed" cue is back. The change log is maintained but sits at the very bottom of the newcomer guide — measured at about 12x the panel height of scrolling — so a returning reader had no way to discover it. The guide button now carries a dot (cleared once opened, back when the version changes) and the guide opens with a jump link to it',
       'Category colour repairs: Medical and Asian Market had identical pin and text colours, as did Auto Repair and Legal Aid — and the category panel is explicitly offered as the map legend, which collisions break. Taxi, Indoor Play and Rental agents also sat below the 4.5:1 on white that the colour table itself promises, and were darkened',
       'The skip-to-content link grew from 39 to 44 pixels tall — the last control on the page still under the touch-target minimum',
       'Privacy note rewritten. It listed what is uploaded as "event type + timestamp + session ID", but the text typed into the search box is also sent (digit runs stripped, truncated), and the identifier is not per-visit: it lives in your browser and stays the same next time. It now says so plainly instead of giving a closed list']},
  {v:'2026.09.07',
   zh:['修复整页文案空白：2026-09-05 新增的 4 条记录用了 CI 里不存在的分类 key（rec/community/cafe/liquor），popup() 取 CI[分类][语言] 抛异常，而所有弹窗是在启动时一次性构建的，于是这一条坏记录让初始化循环中途死掉——标题、按钮文字、快捷选择、地点计数全部没写进页面，只剩一个空壳。同一批改动里还有第二个被它掩盖的崩溃：面板焦点陷阱那行 backdrop.addEventListener 写在 const backdrop 声明之前，触发暂时性死区。两个都已修复',
       '正式新增两个分类：☕咖啡店、🍷酒类专卖（五种语言标签、地图图钉色、文字安全色、归入购物餐饮组）。Westsyde Community Hall 按 DATA-SCHEMA 定义归入既有的「社区中心」；「Westsyde Pool & Fitness Centre」和一条重复的「Westsyde Centennial Park」是与既有记录同地址的重复条目，已删除',
       '新增第四档来源标签「未核实（建议致电确认）」：补覆盖缺口时新增、尚未逐项电话核实的记录，此前带着 CI 不认识的 src 值，结果一个来源标签都不显示——最没核实的记录反而看起来最干净。现在会明确提示读者先打电话确认，且这些记录仍然不会进入对外开放的数据子集',
       '删除深色模式：只给面板换肤、地图底图仍是亮的，深色边框里嵌一块白地图并不好看；同时页面显式声明为 light-only，微信等内置浏览器的自动深色转换不会再把文字变成看不见的浅色',
       '修复源数据文件被自动编辑改坏的两处：地点数组丢了赋值前缀（const P 那一句）（任何重新构建都会得到空地图）、文件头注释被拼接成一行',
       'deploy.sh 增加静态校验闸门：validate.py 不通过就不部署。9-05 那次上线的 19 项校验失败，validate.py 本来全都能查出来，只是从来没被放进部署路径'],
   en:['Fixed the blank-interface bug: four records added on 2026-09-05 used category keys absent from CI (rec/community/cafe/liquor). popup() reads CI[category][lang], every popup is built in one pass at start-up, and so a single bad row killed the init loop midway — title, button labels, Quick Picks and the place count were never written, leaving an empty shell. A second crash in the same batch was masked by the first: the panel focus-trap line called backdrop.addEventListener above the const backdrop declaration, a temporal-dead-zone ReferenceError. Both fixed',
       'Two categories added properly: ☕ Cafés and 🍷 Liquor Stores (labels in five languages, a map-pin colour, a text-safe colour meeting 4.5:1 on white, and membership of the Shopping & Dining group). Westsyde Community Hall moves into the existing Community Centre category, which is where DATA-SCHEMA already puts halls; "Westsyde Pool & Fitness Centre" and a second "Westsyde Centennial Park" duplicated existing records at the same address and were removed',
       'A fourth source tier — "Unverified — call ahead". Entries added to fill coverage gaps but not yet phone-checked were carrying a src value no tier recognised, so they rendered no provenance chip at all: the least-verified rows looked the cleanest. They now tell the reader to confirm first, and still stay out of the openly-licensed export',
       'Dark mode removed: it re-skinned only the chrome we own while the OSM basemap stayed bright, which put a white map inside a dark frame. The page now declares itself light-only, which also stops in-app browsers (WeChat especially) applying an automatic dark transform that turned text unreadable',
       'Repaired two corruptions a bad automated edit left in the data file: the places array had lost the assignment that names it (any rebuild would have produced an empty map) and the header comment had been joined into one line',
       'deploy.sh now runs validate.py as a hard gate. All 19 failures that shipped on 09-05 were things validate.py already catches — it simply was never part of the deploy path']},
  {v:'2026.09.05b',
   zh:['埋点可区分维护者流量与真实用户：以 ?debug=1 打开页面的所有事件，以及每次部署后的自动化冒烟测试，都会标记 env:dev 并写入独立的数据列。分析时用 double2=0 只看真实用户，避免测试用的假地点 ID 混进「最常查看的地点」排名。分享按钮的埋点拆成 stage:intent（点击意图）与 stage:result（复制结果）两次记录——此前只发一条 copied:false 表示点击，回溯数据时被误读成一半的复制失败率'],
   en:['Analytics can now separate maintainer traffic from real usage: any event from a page opened with ?debug=1, plus the automated post-deploy smoke test, is tagged env:dev and written to its own numeric column. Filter on double2=0 to see real users only, so hand-rolled test place IDs stop polluting the "most viewed places" ranking. The share button now logs two distinct events — stage:intent (the click) and stage:result (the copy outcome) — where it previously emitted a bare copied:false for the click, which read back as a 50% failure rate even though every copy succeeded']},
  {v:'2026.09.05',
   zh:['埋点接入 Cloudflare Analytics Engine（Phase A 上线）：trackEvent() 内部从「仅写 localStorage」改为「同时通过 navigator.sendBeacon 把事件发到 /api/event，Worker 写入 Analytics Engine」；25 处调用点全部不动。新增匿名会话 ID（kamloopsSid，localStorage 持久化）让服务端能识别同一浏览器的多次会话。搜索词脱敏规则保持不变；footer 加了一行小字说明匿名统计'],
   en:['Click tracking upgraded to Phase A: trackEvent() now both writes to localStorage AND fires navigator.sendBeacon("/api/event") on every call, where the Cloudflare Worker records the row in Analytics Engine. All 25 call sites stay unchanged. Added an anonymous session ID (kamloopsSid in localStorage) so server-side queries can stitch events from the same browser. Search-query sanitisation is unchanged; the footer now carries a one-line privacy note']},
  {v:'2026.09.04c',
   zh:['新增点击埋点（本地版）：18 类事件统一走 trackEvent(type, props) 抽象——搜索、搜索无结果、分类（含 × 清除）、区域、快捷选择（含全部清除）、语言、收藏、面板打开/关闭、地图标记查看/关闭、popup 内导航/电话/网站按钮、分享、重置；本机 localStorage，?debug=1 可查看计数与导出 JSON；Phase A 接入 Cloudflare Analytics Engine 时只改 trackEvent 内部实现，调用点不动',
       '搜索词在埋点层做脱敏：去除连续 3 位以上数字串并截断到 24 字符（Phase A 上传时将不含人名/电话/地址）'],
   en:['Click tracking added (Phase B / local-only): 19 event types now flow through one trackEvent(type, props) helper — search, search-empty, category (incl. × chip clear), region, preset (incl. clear all), language, favorite, panel open/close, marker view/close, in-popup nav/call/web buttons, share, reset. 25 call sites in total (share_click uses 4 branches to cover execCommand / clipboard / failure paths). Stored on this device only; open ?debug=1 to see counts and export JSON. Phase A replaces the helper\'s internals with a sendBeacon — all 25 call sites stay untouched.',
       'Search queries are sanitised before storage: digit runs ≥3 chars are stripped and the term is capped at 24 characters, so Phase A server-side payloads cannot carry phone numbers, addresses or names']},
  {v:'2026.09.04b',
   zh:['接入 Cloudflare Web Analytics：无 cookie、不追踪个体用户，统计浏览量 / 来源 / 设备 / 加载性能等维度（数据 24-48 小时后可看）'],
   en:['Cloudflare Web Analytics integrated — cookie-free, no individual tracking; tracks page views, referrers, devices and load performance (data visible 24-48h after integration)']},
  {v:'2026.09.04a',
   zh:['界面语言默认值恢复为硬编码英文——只有 URL 显式带 ?lang= 时才会切到其他语言，不再读取浏览器的语言设置（避免"分享链接给不同语言用户"的不可预测行为）'],
   en:['Interface language default is back to hard-coded English — only an explicit ?lang= in the URL switches to another language (no longer reads the browser\'s language, which made the result unpredictable when a link was shared across users)']},
  {v:'2026.08.31e',
   zh:['搜索原本会完全绕开已选的区域/分类筛选；现在会在筛选范围内缩小结果，筛选范围内搜不到时会明确说明原因，并提供一键清除筛选',
       '"快捷选择"里的🧳选项原叫"新居民必看"，和顶部📖"新居民指南"按钮撞名——已改名为"新居民必备"',
       '区域内数量为0的分类原本会从分类面板直接消失，容易被误解成"这个工具根本不收录这类地点"——现在会保留在列表里，显示"(0)"并变灰，附悬停说明',
       '首次使用的提示语补充说明了搜索、快捷选择（可多选、会自动帮你选分类）和区域/分类筛选之间的关系',
       '界面语言默认值原本硬编码为英文——现在会先读取浏览器语言设置（链接里带的 ?lang= 仍然优先）',
       '分类筛选面板的说明文字里加了一句：这份列表的颜色/图标和地图图钉一一对应，可以当图例用',
       '弹窗信息顺序调整：地点名称排到最前面，分类/区域标签移到名称下方，不再抢在名字前面',
       '收藏的"导出/导入"改名为"复制代码/导入代码"，并明确说明不会下载文件，只是一串可以复制粘贴的文字',
       '公交面板新增一句说明：选中线路只是把它画在地图上，和当前显示的地点共存，不会筛选或隐藏它们',
       '"数据说明"从一整段文字拆成三个带标题的小节（数据来源与覆盖范围 / 实用提醒 / 核实日期与免责声明），文字内容本身一字未改',
       '弹窗里地点自己的"信息核实于"日期新增悬停说明，指出它和"数据说明"里的整体核实日期是两回事',
       '三色来源标签中"第三方地图数据"这一档，把"建议致电确认"直接写进标签本身，不用再悬停才能看到',
       '地图上的聚合圆圈新增悬停提示，说明数字含义和点击可展开',
       '"快捷选择"支持多选这件事写进了提示语；手动调整过的芯片原本只有一个"·"符号加悬停提示，现在直接显示"(已调整)"文字',
       '分类筛选面板说明补充：不勾选＝显示全部，勾选＝只看这些，没有单独隐藏某个分类的功能',
       '"重置"按钮加了悬停说明，指出它不仅重置筛选，也会清空搜索/公交线路选择并让地图回到初始视角',
       '页脚里的 911/8-1-1/RCMP 紧急电话原本和普通的资料来源链接挤在一起——现在用醒目的浅红色单独标出',
       '新增"🔗分享"按钮：一键复制当前链接（带着语言、筛选和搜索词）——这个能力其实一直都在，只是从没有入口',
       '面板顶部的拖动手柄第一次打开时会轻轻晃动一下，提示它可以往下拖动关闭',
       '自查时发现：新增的"分享"按钮让顶部四个链接在手机宽度下换行成两行，挤掉了地图的可视高度，在部分语言/尺寸组合下跌破了既定下限；同时变长的首次提示语在中等高度的手机上也多占了一行。已将四个链接在窄屏下收成纯图标（保留可点击区域与朗读文字），并收紧了提示语的行距——20 项手机宽高×语言组合全部恢复达标，触控热区也重新量过，全部不小于 44px'],
   en:['Search used to bypass the active Area/Category filters entirely; it now narrows within them, and a search that finds nothing purely because of the filter says so, with a one-tap way to clear it',
       'The 🧳 Quick Pick was labelled "Newcomer Guide" — identical to the 📖 Newcomer Guide button in the header. Renamed to "Newcomer Essentials" so the two are no longer indistinguishable',
       'Categories with zero matches in the selected area(s) used to vanish from the Category panel, reading as "not tracked" rather than "none here" — they now stay listed, muted, with a (0) count and an explanatory tooltip',
       'The first-run hint now explains how Search, Quick Picks (multi-select, sets Category for you) and Area/Category relate to each other',
       'The interface language defaulted to English regardless of the browser’s own language — it now reads the browser’s language first (an explicit ?lang= link still wins)',
       'The Category panel’s hint now says its colours/icons double as the map’s legend',
       'Popup layout reordered: the place name now leads, with the category/region tags underneath it rather than above it',
       'Favourites "Export/Import" renamed to "Copy Code/Import Code", and the note now says explicitly that no file is downloaded — it’s text you paste back in',
       'The Bus Routes panel gained a line explaining that selecting a route only draws it alongside whatever places are showing — it doesn’t filter or hide them',
       'Data Notes split from one paragraph into three labelled sections — Source & Coverage / Practical Notes / Last Verified & Disclaimer — with the legal wording itself unchanged',
       'The popup’s per-place "Verified" date now carries a tooltip explaining it’s a different thing from the page-wide "Last verified" date in Data Notes',
       'The "Third-party map data" source tier now says "— call ahead" directly in the visible label, not only in a hover tooltip',
       'Map cluster bubbles gained a hover tooltip spelling out what the number means and that they’re clickable',
       'The Quick Picks hint now says you can combine any number of them; a manually-adjusted preset chip now shows "(edited)" as real text instead of only a "·" with a hover title',
       'The Category panel’s hint now states plainly that nothing checked shows everything, and checking narrows — there’s no way to hide a single category',
       'The Reset button gained a tooltip explaining it clears search and the bus route too, and returns the map view, not just the filters',
       'The footer’s 911/8-1-1/RCMP line used to look like just another source citation — it now sits in its own tinted line, visually separated from the routine links',
       'Added a 🔗 Share button that copies a link to exactly the current view (language, filters, search) — the URL already carried all of this, it just never had a visible way to use it',
       'The bottom sheet’s drag handle gives a brief one-time nudge the first time a panel opens on a phone, hinting that it can be dragged down to dismiss',
       'Caught in verification: the new Share button pushed the header’s four links onto two lines at phone widths, eating into the map’s share of the screen and dropping it below the tested floor for several language/size combinations; the lengthened first-run hint added a similar line at medium phone heights. Both four links now collapse to icon-only below 600px (full names remain for screen readers) and the hint’s line spacing was tightened — all 20 tested phone width/height/language combinations pass again, and every tap target was re-measured at 44px or larger']},
  {v:'2026.08.31d',
   zh:['首次使用测试发现的十一个问题，逐一修复：快捷选择行原本几乎看不出能左右滑，六个分类因此形同隐形——现在滑动条纹清晰可见，且只在真的还有内容时才显示',
       '收藏一个地点原本只有一个 16px 图标变色作为反馈，容易误以为没点中而再点一次、白白取消收藏——现在会弹出一条简短提示',
       '"地图加载不出来"的提示条原本一直盖住地图最显眼的位置；6 秒后自动收成右下角一个小圆点，点一下可展开',
       '搜索时快捷选择的按钮看起来还能点，其实早已被忽略——现在会同步变灰',
       '所有弹出面板（新居民指南、数据说明、地区/分类/公交/收藏）原本背景页面会跟着一起滚动——现已锁定，这也让公交面板里"为何跳过 8/11/12 号线"的说明终于能被滚动到',
       '公交路线选中后，多个站名标签会互相压字——现在会避开所有已显示的标签，而不仅仅是紧邻的前一个',
       '分类筛选面板新增一行说明：点组名展开子分类，勾选组前的框可整组选中',
       '数据说明页新增一处分段，把公交/票价信息和公寓/营业时间提醒分开成段',
       '收藏为空时，"导入"区域原本没有任何说明——现在补充了一句解释它是给换设备的人用的',
       '筛选提示语补上了对快捷选择行的提示',
       '用回归测试自查时，发现这一轮改动本身弄坏了一处测试：离线提示条的测试原本直接改它的显示状态，绕过了新加的"自动收起"记录，导致测试踩到真实代码根本不会出现的状态而报错——已改为让测试调用和真实代码一样的函数，并单独为收起后的小圆点补了测试'],
   en:['Eleven problems found in a first-time-user pass, fixed one by one: the Quick Picks row barely hinted it could scroll, so six of nine categories were effectively invisible — the fade and arrow are now genuinely visible, and only appear while there truly is more to scroll to',
       'Favouriting a place gave no feedback beyond a 16px icon changing colour, which invited a second tap that silently un-favourited it — a brief confirmation now appears',
       'The "map imagery can\'t load" banner used to sit over the busiest part of the map indefinitely; it now shrinks to a small corner badge after 6 seconds and expands again on tap',
       'Quick Picks chips still looked tappable during a search even though the results notice said filters were being ignored — they now grey out to match',
       'Every overlay (Newcomer Guide, Data Notes, and the Area/Category/Bus Routes/Favorites sheet) let the page underneath scroll along with it — now locked, which also finally makes the Bus Routes panel\'s existing "why 8/11/12 are missing" note reachable by scrolling',
       'Bus stop labels on a selected route could overlap each other; each label now keeps clear of every label already shown, not just the previous one in sequence',
       'The Category filter panel — the one overlay with real hidden structure — gained a one-line hint on the two gestures it needs (tap a group to expand, check its box to select it whole)',
       'Data Notes gained one more paragraph break, separating the transit/fare aside from the apartment-rent reminder',
       'The empty Favourites panel showed an Import box with no explanation of why — it now says plainly that it\'s for a code exported from another device',
       'The filter hint text now mentions the Quick Picks row, not just Area/Category',
       'Self-check via the regression suite caught one thing this round\'s own work broke: its test for the offline banner set the element\'s visibility directly, which skipped the new auto-compact bookkeeping and started failing on a stale state the real code never actually produces — fixed by having the test call the same function every real caller uses, and a dedicated check was added for the compact badge itself']},
  {v:'2026.08.31c',

  {v:'2026.08.30',
   zh:['全部 250 处地点的营业时间改为结构化数据，五种语言分别渲染，并明确标出休息日',

       '新增韩语；222 条备注补齐英文，法/西/韩回退到英文',
       '分类筛选逻辑改为「未筛选 / 只看选中项」，不再是反向的排除逻辑',

       '纠错入口带上地点名称、编号、分类与数据版本',
       '地址栏记录当前语言、区域、分类与搜索词，链接可直接分享',

  const wrapped=min%1440, h=Math.floor(wrapped/60), m=wrapped%60;
  if(l==='en'){const ap=h<12?'AM':'PM',hh=(h%12)||12;return hh+(m?':'+String(m).padStart(2,'0'):'')+' '+ap;}

function fmtHours(h,l){

  if(h.k&&u[h.k])bits.push(u[h.k]);
  (h.r||[]).forEach(([d1,d2,o,c,ap])=>{
    const day=fmtDays(d1,d2,l);
    if(o===null)bits.push(day);
    else if(c===null)bits.push(day+' '+fmtClock(o,l)+' '+u.fromT);
    else bits.push(day+' '+fmtClock(o,l)+u.tsep+(ap?u.approx+' ':'')+fmtClock(c,l));

// Scores a place against the query instead of returning a flat yes/no, so results
// can be ordered by how well they match rather than dumped in data order.
// Field order below is the ranking: name-prefix beats name-contains beats category,
// and notes — the longest, noisiest field — rank last.
function matchScore(d,q){
  const name=d.n.toLowerCase(), addr=(d.a||'').toLowerCase();
  const cat=catLabel(d.c).toLowerCase(), reg=regLabel(d.g).toLowerCase();
  const note=(noteText(d)||'').toLowerCase();
  const tag=(d.tag&&UI[L_][d.tag]?UI[L_][d.tag]:'').toLowerCase();
  if(name.startsWith(q))return 100;
  if(name.includes(q))return 80;
  if(cat.startsWith(q)||cat.includes(q))return 60;
  if(tag&&tag.includes(q))return 50;
  if(addr.includes(q))return 40;
  if(reg.includes(q))return 30;
  // Notes are long prose, so a hit inside one only counts for a query with enough
  // information in it. Two CJK/Hangul characters are a whole word; two Latin
  // letters are not — so the threshold differs by script rather than raw length.
  if(note.includes(q)){
    const cjk=/[\u3400-\u9fff\uac00-\ud7af\u3040-\u30ff]/.test(q);
    return q.length>=(cjk?2:4)?10:0;
  }
  return 0;
}

function apply(){let v=0;

  // filter tweak would be noisy; only doing it when v genuinely changes is
  // both correct (the user actually sees a different map) and quiet.
  const prevVisible=lastVisible;
  const searching=!!searchTerm;
  const totalR=Object.keys(RI).length;
  // Search used to silently bypass the Area/Category filters — a "bank" search
  // while North Shore was selected quietly searched the whole city, which read as
  // the filter having stopped working rather than as intended behaviour. Search now
  // narrows within whatever is already filtered, the way typing into a filtered
  // spreadsheet does, so a filter chip stays true for as long as it's on screen.
  const filtered=aR.size<totalR||aC.size>0;
  const bounds=[];
  M.forEach(m=>{
    const sc=searching?matchScore(m.data,searchTerm):0;
    m.score=sc;
    const inFilter=(aC.size===0||aC.has(m.ck))&&aR.has(m.gk);
    const s=searching?(sc>0&&inFilter):inFilter;
    if(s){showMarker(m);v++;bounds.push([m.data.lat,m.data.lng]);}else{hideMarker(m);}});
  const u=UI[L_];
  const st=document.getElementById('statusText');
  if(searching){
    st.textContent=u.searchResultsN(v);
    if(v>0&&v<=40){map.fitBounds(bounds,{padding:[50,50],maxZoom:16});}
    if(v===1){const only=M.find(m=>m.score>0);if(only)focusMarker(only,16);}
  }else{
    // On a short, narrow screen this line has to share a row with Reset, and the
    // count is the half worth keeping — which regions are on is already visible on
    // the Area button. The full sentence stays in the title attribute.
    st.textContent=u.showing(v,P.length)+(TIGHT.matches?'':' · '+regionLabel());
  }
  st.title=searching?st.textContent:(u.showing(v,P.length)+' · '+regionLabel());
  document.getElementById('applyBtn').textContent=u.doneBtn;
  lastVisible=v;
  updatePanelTitle();
  const totalC=Object.keys(CI).length;
  const areaBadge=document.getElementById('areaBadge');
  if(aR.size<totalR){areaBadge.hidden=false;areaBadge.textContent=aR.size;}else{areaBadge.hidden=true;}
  const catBadge=document.getElementById('catBadge');
  if(aC.size>0){catBadge.hidden=false;catBadge.textContent=aC.size;}else{catBadge.hidden=true;}
  const dims=(aR.size===totalR?0:1)+(aC.size>0?1:0);
  document.getElementById('resetBtn').hidden=false;
  // Area/Category and Quick Picks stay fully live while searching now, so nothing
  // dims them any more, and the active-filter chips stay visible too — they are
  // still true. The one thing worth saying is that a filter is narrowing the
  // search itself, since that's easy to miss if you set the filter a while ago.
  document.getElementById('searchNote').textContent=
    searching?(filtered?u.searchActive:''):(searchRaw?u.searchTooShort:'');
  renderActiveFilters();
  updatePresetActive();
  lastDims=dims;
  // Polite live announcement only when the visible count actually moved. Tools
  // that listen (VoiceOver/NVDA) will queue and read this without barge-in, and
  // because the element is .sr-only it never affects sighted layout.
  if(v!==prevVisible&&(v===0||prevVisible===0||Math.abs(v-prevVisible)>=3)){
    const ann=document.getElementById('a11yAnnounce');

// ---------------------------------------------------------------------------
// Sharing. The button used to copy the link outright; it now opens a sheet,
// because "share" means WhatsApp to a reader from Delhi, LINE in Osaka,
// KakaoTalk in Seoul and WeChat in Chinese-speaking households — and the copy
// is still the first thing in the sheet, so the old one-click habit costs one
// extra tap rather than breaking.

function labelRect(el,pt){
  // Leaflet centres a stop tooltip above its point. Measure the element we are
  // actually going to show rather than assuming a fixed radius: "Lansdowne Exch
  // Bay I" needs roughly three times the clearance of "8th St", and a single
  // fixed distance can only be right for one of them.
  const w=el?el.offsetWidth:60, h=el?el.offsetHeight:14;
  return {l:pt.x-w/2-2, r:pt.x+w/2+2, t:pt.y-h-8, b:pt.y+2};
}
function rectsClear(a,b){
  return a.r<b.l||b.r<a.l||a.b<b.t||b.b<a.t;
}
function clusterRects(){
  // The labels also have to clear the place-cluster bubbles: a stop name sitting
  // on top of a "59" is unreadable in both directions, and this layer was never
  // considered before.
  const out=[];
  document.querySelectorAll('.kcluster, .leaflet-marker-icon.marker-cluster').forEach(el=>{
    const r=el.getBoundingClientRect();
    if(!r.width)return;
    const box=map.getContainer().getBoundingClientRect();
    out.push({l:r.left-box.left-2,r:r.right-box.left+2,t:r.top-box.top-2,b:r.bottom-box.top+2});
  });
  return out;
}
function updateStopLabelVisibility(){
  if(!busStopMarkers.length)return;
  // Measure first, decide second. A label hidden by the previous pass reports
  // offsetWidth 0, so measuring in place made every hidden label look tiny,
  // "fit" anywhere, and reappear on top of its neighbour — the labels oscillated
  // instead of settling. Everything is made visible for the measuring pass and
  // only then hidden.
  const entries=[];
  busStopMarkers.forEach((item,idx)=>{
    const tt=item.marker.getTooltip();
    const el=tt&&tt.getElement();
    if(el)el.style.display='';
    let pt=null;
    try{pt=map.latLngToContainerPoint([item.lat,item.lng]);}catch(e){}
    entries.push({idx,el,pt,txt:item.name,
                  force:idx===0||idx===busStopMarkers.length-1||isKeyStop(item.name)});
  });
  entries.forEach(e=>{
    if(!e.el||!e.pt){e.rect=null;return;}
    // Leaflet centres the tooltip above the point; use the width the text really
    // takes, since "Lansdowne Exch Bay I" needs about three times the clearance
    // of "8th St" and one fixed radius cannot be right for both.
    const w=e.el.offsetWidth||60, h=e.el.offsetHeight||14;
    e.rect={l:e.pt.x-w/2-2, r:e.pt.x+w/2+2, t:e.pt.y-h-8, b:e.pt.y+2};
  });
  const clear=(a,b)=>a.r<b.l||b.r<a.l||a.b<b.t||b.b<a.t;
  // Against another label, any touch at all is disqualifying — two names on top of
  // each other are unreadable in both directions. Against a cluster bubble the bar
  // is lower: the bubbles are big and numerous, and vetoing every label that merely
  // grazes one left just 3 of 31 names on screen. Only a bite out of the middle of
  // the text actually costs legibility, so clusters block a label at 30% coverage.
  const overlapFrac=(a,b)=>{
    const w=Math.min(a.r,b.r)-Math.max(a.l,b.l), h=Math.min(a.b,b.b)-Math.max(a.t,b.t);
    if(w<=0||h<=0)return 0;
    const area=(a.r-a.l)*(a.b-a.t);
    return area>0?(w*h)/area:0;
  };
  // Stop names also have to clear the place-cluster bubbles: a name drawn over a
  // "59" makes both unreadable, and that layer was never taken into account.
  const box=map.getContainer().getBoundingClientRect();
  const taken=[];
  document.querySelectorAll('.kcluster').forEach(el=>{
    const r=el.getBoundingClientRect();
    if(r.width)taken.push({l:r.left-box.left-2,r:r.right-box.left+2,t:r.top-box.top-2,b:r.bottom-box.top+2});
  });
  const clusters=taken.slice();   // clusters only; labels get appended below
  const show=new Set();
  // Terminals and exchanges are the anchors a reader orients by, so they are
  // always drawn and always claim their space first — processing in route order
  // used to let an ordinary stop take a slot a terminus then drew over.
  const placed=[];
  // A loop route can pass the same exchange bay twice, so two forced labels carry
  // the identical name and land on top of each other. The second one adds nothing
  // a reader can use, so it is dropped rather than smudged over the first.
  entries.forEach(e=>{
    if(!e.force||!e.rect)return;
    const dup=placed.some(t=>!clear(e.rect,t)&&t.txt===e.txt);
    if(dup)return;
    e.rect.txt=e.txt; show.add(e.idx); placed.push(e.rect);
  });
  entries.forEach(e=>{
    if(e.force||!e.rect)return;
    if(!placed.every(t=>clear(e.rect,t)))return;                 // never touch another label
    if(clusters.some(c=>overlapFrac(e.rect,c)>0.30))return;      // and don't sit on a bubble
    placed.push(e.rect);show.add(e.idx);
  });
  entries.forEach(e=>{ if(e.el)e.el.style.display=show.has(e.idx)?'':'none'; });
}

function parseFavCode(txt){
  const t=(txt||'').trim();
  if(t.indexOf(FAV_CODE_PREFIX)!==0)return null;
  const live=new Set(P.map(p=>p.id));
  // Unknown ids are dropped rather than rejected: a code exported from an older
  // edition should still restore whatever it can instead of failing whole.
  const ids=t.slice(FAV_CODE_PREFIX.length).split('.')
    .map(v=>FAV_MIGRATE[v]||v).filter(v=>live.has(v));
  return ids;
}

// ---------------------------------------------------------------------------
// Swipe the bottom sheet down to dismiss it. The handle has been drawn at the top
// of this panel all along, which reads as a promise that it can be dragged; until
// now it could not be, which is worse than having no handle. Pointer events cover
// touch and mouse with one path.
// Desktop (>=901px) uses an anchored dropdown, not a sheet, so the grab area is
// hidden there and this never arms.
(function panelDrag(){
  const grab=document.getElementById('panelGrab');
  if(!grab||!window.PointerEvent)return;
  let startY=0,startT=0,dy=0,dragging=false;
  const CLOSE_PX=90, FLICK_VELOCITY=0.5;   // px, and px per ms
  function end(commit){
    if(!dragging)return;
    dragging=false;
    panel.classList.remove('dragging');
    panel.style.transform='';
    if(commit)closePanel();
  }
  grab.addEventListener('pointerdown',e=>{
    if(window.innerWidth>900)return;
    dragging=true;startY=e.clientY;startT=e.timeStamp;dy=0;
    panel.classList.add('dragging');
    try{grab.setPointerCapture(e.pointerId);}catch(err){/* capture is a nicety */}
  });
  grab.addEventListener('pointermove',e=>{
    if(!dragging)return;
    dy=Math.max(0,e.clientY-startY);          // downward only
    panel.style.transform='translateY('+dy+'px)';
  });
  grab.addEventListener('pointerup',e=>{
    const dt=Math.max(1,e.timeStamp-startT);
    end(dy>CLOSE_PX||(dy>24&&dy/dt>FLICK_VELOCITY));
  });
  // A cancelled pointer (an incoming call, the browser taking over the gesture)
  // must restore the panel, never close it — the user did not ask for that.
  grab.addEventListener('pointercancel',()=>end(false));
})();

  searchTerm=raw.length>=MIN_QUERY?raw:'';
  searchClearEl.hidden=!raw;
  if(searchTerm&&!wasSearching)preSearchView={c:map.getCenter(),z:map.getZoom()};
  if(!searchTerm&&preSearchView){map.setView(preSearchView.c,preSearchView.z);preSearchView=null;}
  // Track what users actually type — only the queries that exceeded the noise
  // threshold (MIN_QUERY), since shorter matches only ever return "everything".
  if(raw.length>=MIN_QUERY)trackEvent('search_run',{q:raw,len:raw.length});
  apply();
  // "What did users look for and find nothing?" is the single most actionable
  // dataset the app produces — it points directly at content gaps. apply() set
  // lastVisible to the post-filter result count, so a search with a real term
  // that produced zero matches is one extra trackEvent, paired with search_run
  // by timestamp for funnel reports.
  if(searchTerm&&lastVisible===0){
    const totalR=Object.keys(RI).length;
    trackEvent('search_empty',{q:raw,len:raw.length,filters:{areas:aR.size<totalR,cat:aC.size>0,route:!!selectedRoute}});
  }
}
searchInputEl.oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(runSearch,260);};
searchInputEl.onkeydown=(e)=>{
  if(e.key==='Enter'){clearTimeout(searchTimer);runSearch();}
  if(e.key==='Escape'&&searchInputEl.value){searchInputEl.value='';clearTimeout(searchTimer);runSearch();}
};
searchClearEl.onclick=()=>{
  searchInputEl.value='';clearTimeout(searchTimer);runSearch();searchInputEl.focus();
};
const guideBackdropEl=document.getElementById('guideBackdrop');
// Every overlay (the two centred modals here, and the four bottom-sheet panels in
// openPanel/closePanel below) sits on a position:fixed backdrop, but fixed
// positioning alone does not stop the page underneath from scrolling — a wheel or
// touch gesture that lands on the dimmed area outside the modal's own scroll
// region falls through to the document, since nothing there is a scroll container.
// The result: reading the Newcomer Guide with a mouse wheel or a swipe could drag
// the whole page (header, quick picks) along with it. Locking body scroll while
// any overlay is open — reference-counted, so two overlays cannot unlock each
// other early — fixes that for all six.
let scrollLockCount=0,savedScrollY=0;
function lockBodyScroll(){
  if(scrollLockCount===0){
    savedScrollY=window.scrollY||window.pageYOffset||0;
    document.body.style.position='fixed';
    document.body.style.top=(-savedScrollY)+'px';
    document.body.style.left='0';document.body.style.right='0';document.body.style.width='100%';
  }
  scrollLockCount++;
}
function unlockBodyScroll(){
  scrollLockCount=Math.max(0,scrollLockCount-1);
  if(scrollLockCount===0){
    document.body.style.position='';document.body.style.top='';
    document.body.style.left='';document.body.style.right='';document.body.style.width='';
    window.scrollTo(0,savedScrollY);
  }
}
// Modal plumbing shared by the guide and the data notes: remember what had focus,
// move focus inside, keep Tab within the dialog, restore focus on close.
let lastFocused=null;
function openModal(back){
  lastFocused=document.activeElement;
  back.classList.add('open');
  lockBodyScroll();
  const first=back.querySelector('.panel-close');
  if(first)first.focus();
}
function closeModal(back){
  back.classList.remove('open');
  unlockBodyScroll();
  if(lastFocused&&lastFocused.focus)lastFocused.focus();
  lastFocused=null;
}
function trapTab(e,back){
  if(e.key!=='Tab')return;
  const f=[...back.querySelectorAll('button,a[href],input,[tabindex]:not([tabindex="-1"])')]
          .filter(el=>el.offsetParent!==null);
  if(!f.length)return;
  const first=f[0],last=f[f.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
}
const LAST_SEEN_KEY='kamloopsSeenVersion';
function hasUnseenUpdate(){
  try{return localStorage.getItem(LAST_SEEN_KEY)!==DATA_VERSION;}catch(e){return false;}
}
function markGuideSeen(){try{localStorage.setItem(LAST_SEEN_KEY,DATA_VERSION);}catch(e){}}
function updateGuideDot(){
  const d=document.getElementById('guideUpdateDot');
  if(d)d.hidden=!hasUnseenUpdate();
}
document.getElementById('guideToggle').onclick=()=>{
  markGuideSeen();updateGuideDot();openModal(guideBackdropEl);
};
// The jump link lives inside innerHTML that setLang() rewrites, so it is handled
// by delegation rather than a listener that would be thrown away on each render.
document.getElementById('guideBody').addEventListener('click',(e)=>{
  const a=e.target.closest&&e.target.closest('.guide-jump');
  if(!a)return;
  e.preventDefault();
  const t=document.getElementById('changelog-anchor');
  if(t)t.scrollIntoView({behavior:'smooth',block:'start'});
});
updateGuideDot();
document.getElementById('guideClose').onclick=()=>closeModal(guideBackdropEl);
guideBackdropEl.onclick=(e)=>{if(e.target===guideBackdropEl)closeModal(guideBackdropEl);};
guideBackdropEl.addEventListener('keydown',e=>trapTab(e,guideBackdropEl));

// Expand every placeholder once, for every language, before the first render.
// Doing it per render site would mean any site I forget silently ships "{CITY}".
// ---------------------------------------------------------------------------
// URL state. A filtered view is the thing people want to send each other
// ("here are the banks on the North Shore, in Korean"), and until now every
// share opened the default view. ?city= is reserved now, while there are no
// links in circulation to break, even though only one city exists.
// Favourites deliberately stay out of the URL — they are personal, not shareable.
// ---------------------------------------------------------------------------
let urlWriteBlocked=true;
// `obj[key]` is truthy for anything inherited from Object.prototype, so a plain
// truth test let ?lang=constructor and ?route=toString through the validation and
// blanked the page. Only own keys are real data.
function owns(obj,k){return typeof k==='string'&&Object.prototype.hasOwnProperty.call(obj,k);}
function readURLState(){
  let q;
  try{q=new URLSearchParams(location.search);}catch(e){return null;}
  if(q.get('city')&&q.get('city')!==CITY.key)return null; // a link for another city
  const out={};
  const lang=q.get('lang');
  if(owns(UI,lang))out.lang=lang;
  const r=(q.get('r')||'').split(',').filter(k=>owns(RI,k));
  if(r.length)out.regions=r;
  const c=(q.get('c')||'').split(',').filter(k=>owns(CI,k));
  if(c.length)out.cats=c;
  const qq=(q.get('q')||'').trim();
  if(qq)out.q=qq;
  const rt=q.get('route');
  if(owns(BR,rt))out.route=rt;
  return out;
}
function writeURLState(){
  if(urlWriteBlocked)return;
  try{
    const q=new URLSearchParams();
    q.set('city',CITY.key);
    if(L_!=='en')q.set('lang',L_);
    if(aR.size&&aR.size<Object.keys(RI).length)q.set('r',[...aR].join(','));
    if(aC.size)q.set('c',[...aC].join(','));
    if(searchTerm)q.set('q',searchInputEl.value.trim());
    if(selectedRoute)q.set('route',selectedRoute);
    // replaceState, not pushState: filtering is not navigation and should not
    // fill the back button with dozens of intermediate states
    history.replaceState(null,'',location.pathname+'?'+q.toString()+location.hash);
  }catch(e){/* file:// and sandboxed frames disallow this; the app works regardless */}
}
(function expandUI(){
  Object.keys(UI).forEach(l=>{
    Object.keys(UI[l]).forEach(k=>{
      if(typeof UI[l][k]==='string')UI[l][k]=tpl(UI[l][k],l);
    });
  });
})();
wireFavIO();
// #map has no measured height until layout runs; take the real one now.
setTimeout(syncPanPad,0);
// P1-A ONB-02 (2026-09-05): a first-time visitor with no stored choice falls
// back to navigator.languages instead of bare 'en' — zh users on zh devices
// were bouncing off English before noticing the language buttons.
//
// 2026-09-07, settled after this had been flipped three times: keep the browser
// guess. The objection to it was that an English speaker whose browser merely
// lists zh somewhere would land on Chinese — but detectLang() returns the FIRST
// entry of navigator.languages that we support, so ['en-US','zh-CN'] resolves to
// en and only ['zh-CN',...] resolves to zh. Verified all four paths in a browser:
//   ['en-US','zh-CN'] -> en      ['zh-CN','en-US'] -> zh
//   ['de-DE']         -> en      zh browser + a saved choice of fr -> fr
// So the guess is only ever the reader's own first preference, and an explicit
// choice still beats it. Please do not swap this back to a hard-coded 'en'
// without a concrete case where the first-preference rule gets it wrong.
// 2026-09-07: the explicit choice a returning reader already made is restored
// ahead of that guess. It had been dropped in the September rewrite, so someone
// who switched to 中文 landed back on the browser guess every single visit.
// Precedence is: ?lang= in the link  >  what you picked last time  >  browser
// language  >  English.
const LANG_KEY='kamloopsLang';
function getStoredLang(){
  try{const v=localStorage.getItem(LANG_KEY);return owns(UI,v)?v:null;}catch(e){return null;}
}
function setStoredLang(l){try{localStorage.setItem(LANG_KEY,l);}catch(e){}}
function detectLang(){
  const cands=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||''];
  for(let i=0;i<cands.length;i++){
    const base=(cands[i]||'').toLowerCase().split('-')[0];
    if(owns(UI,base))return base;
  }
  return 'en';
}
(function applyURLState(){
  const st=readURLState();
  if(st){
    if(st.regions){aR=new Set(st.regions);}
    if(st.cats){aC=new Set(st.cats);}
    if(st.q){searchInputEl.value=st.q;searchRaw=st.q.toLowerCase();
      if(st.q.length>=MIN_QUERY)searchTerm=st.q.toLowerCase();
      searchClearEl.hidden=false;}
  }
  // URL ?lang= 永远胜出；其次是上次手动选过的语言（记在 localStorage 里）；
  // 再次才按 navigator.languages 猜；都没有则退回英文。
  setLang(st&&st.lang?st.lang:(getStoredLang()||detectLang()));
  if(st&&st.route)renderRoute(st.route,true);
  urlWriteBlocked=false;
  writeURLState();
  // session_start is the denominator every other rate is measured against:
  // without it "12 sessions" only counts people who happened to click something,
  // and a visitor who loaded the map, found nothing, and left is invisible.
  // Fires once per page load, after URL state is applied, so lang/region/cats
  // reflect what the visitor actually landed on.
  trackEvent('session_start',{
    ver:DATA_VERSION,
    lang:L_,
    ref:document.referrer?(new URL(document.referrer)).host:'direct'
  });
})();
