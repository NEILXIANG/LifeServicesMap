UI.en.guideProv=`<h3>⚕️ BC Health Coverage (MSP + BC Services Card)</h3>
<p>BC's public health plan is called MSP (Medical Services Plan). Apply for your BC Services Card through the <a href="https://www2.gov.bc.ca/gov/content/health/health-drug-coverage/msp/bc-residents/enrolment" target="_blank" rel="noopener">Health Insurance BC website</a>. <b>The wait period is the remainder of the month you become a resident plus two more full months</b> — close to three months at worst. During it, doctor visits and emergency care are billed to you in full, so arrange private medical insurance <em>before</em> you arrive to cover the gap (most policies exclude pre-existing conditions — read that clause). If you're moving from another Canadian province, keep your previous provincial plan until the wait ends. The clock starts when you <b>apply</b>, so apply on your first day rather than later. Since January 2020, MSP charges enrolled residents no monthly premium.</p>
<h3>🩺 When You Can't Find a Family Doctor</h3>
<p>The shortage of family doctors here is general — plenty of lifelong residents don't have one either. Nobody is singling you out. The proper step is to join the <b>Health Connect Registry</b>, the provincial waitlist: register online in a few minutes at <a href="https://www.healthlinkbc.ca/find-care/health-connect-registry" target="_blank" rel="noopener">HealthLink BC</a>, or call <b>8-1-1</b> and register in your own language (130+ languages available). You'll need your Personal Health Number (PHN), address, phone and email. While you wait, you are not without care: <b>8-1-1</b> puts you through to nurses, pharmacists and dietitians 24 hours a day; an <b>Urgent and Primary Care Centre</b> handles same-day non-emergencies; a <b>walk-in clinic</b> covers routine illness; community pharmacists in BC can prescribe for a list of minor ailments and give vaccinations; and hospital emergency or 911 is for genuine emergencies. Remember you can request a free interpreter for any of these (see the previous section).</p>
<h3>🚗 Driver's Licence, Insurance and Winter Tires</h3>
<p>BC driver's licences are administered by ICBC. Licences from many countries can be exchanged directly, or may qualify for reduced road-test requirements based on driving experience — check the <a href="https://www.icbc.com/driver-licensing/new-to-bc" target="_blank" rel="noopener">ICBC "New to BC" page</a> to see if your licence qualifies under a reciprocal agreement. To take lessons locally, see Category → Driving School. Two things residents routinely lose money on: <b>insurance history</b> — your years of claim-free driving abroad only count if you bring a claims-history letter in English from your previous insurer; without it you are rated as a brand-new driver at the highest premium, and that letter is far easier to obtain before you leave than after. And <b>winter tires</b> — most BC mountain highways require them from October 1 to March 31, with some routes extended to April 30. A legal winter tire carries either the M+S marking or the three-peaked mountain/snowflake symbol and has at least 3.5 mm of tread. All-seasons are not automatically winter tires; police do check, fines apply, and on a mountain route you can be turned back.</p>
<h3>🎒 School Enrolment and Language Support</h3>
<p>{CITY} is in the {SD} school district. Public schools are assigned by home address — use the <a href="{SD_URL}" target="_blank" rel="noopener">{SD} catchment finder</a> to find your local school, then contact the school or district to register. You'll typically need a birth certificate/passport, immunization records, proof of address, and your immigration documents. Three things parents most need to know: <b>1. English is not an entry requirement.</b> Schools provide ELL (English Language Learner) support: your child is placed in their normal grade level and receives extra language help alongside it, not held back for language. <b>2. There are free settlement workers inside the schools.</b> SWIS (Settlement Workers in Schools) is a free service specifically for resident families — it explains how the school system works, helps with forms and parent-teacher meetings, connects you to activities, and can arrange interpretation. <b>3. School-home communication is more frequent than in many countries.</b> Email, school apps and parent meetings all matter; if you can't read something, say that you need translation. The school has an obligation to make information about your child understandable to you.</p>
<h3>🏠 Renting: The Floor the Law Gives You</h3>
<p>A damage deposit is legally capped at <b>half a month's rent</b> (plus up to half a month more as a pet deposit if you have a pet); beyond that, a landlord cannot demand extra deposits. Rent can be raised <b>only once every 12 months</b>, requires <b>three full months</b> of written notice on the official form (RTB-7), and the 2026 maximum allowable increase is <b>2.3%</b> — you are not obliged to pay an increase above the cap or given without proper notice. Notice periods, and the rule that a landlord must give 24 hours' written notice before entering, are set by the <a href="https://www2.gov.bc.ca/gov/content/housing-tenancy/residential-tenancies" target="_blank" rel="noopener">BC Residential Tenancy Branch (RTB)</a>; call <b>1-800-665-8779</b> for disputes. Three traps residents fall into: <b>rental scams</b> — a listing where you never meet anyone and are asked to wire a deposit because "I'm out of town" is almost always fraud; view the unit in person, meet the landlord or a licensed agent, and get a written tenancy agreement before any money moves. <b>No local credit history</b> — offer a job offer letter, bank statements, a guarantor, or several months paid up front instead (note that prepaid rent is not a deposit and is not required of you by law). <b>Verbal promises</b> — repairs, utilities included, pets allowed: put all of it in the written agreement, because a verbal promise is nearly impossible to prove in a dispute. Do a written condition inspection report with the landlord at move-in and move-out; it is the strongest evidence you will have when you want the deposit back.</p>
<h3>⚖️ Legal Issues & Getting Legal Aid</h3>
<p>Needing legal help doesn't always mean paying for a lawyer — BC has several free or low-cost options. <b>Legal Aid BC</b> covers family law, criminal defence, and immigration/refugee matters for income-qualified people — {CITY} line <b>250-314-1900</b>, provincial line <b>1-866-577-2525</b>, legalaid.bc.ca. {CITY} has a physical legal clinic, the <b>Okanagan Thompson Legal Clinic</b> (220-301 Victoria St, 236-425-9121), offering free/low-cost help with family law, income assistance/disability benefits, EI, debt, and tenancy issues (see Category → Legal Aid on this map). <b>Access Pro Bono BC</b> (604-878-7400, accessprobono.ca) offers free legal advice and referrals for low-income people, seniors 55+, people with disabilities, and immigrants/refugees. Small claims disputes under $5,000 and strata/condo disputes can be handled online, without a lawyer, through the <b>BC Civil Resolution Tribunal</b> (1-844-322-2292). Unpaid wages or other workplace disputes go to the <b>BC Employment Standards Branch</b> (1-833-236-3700).</p>
<h3>🛡️ If You Face Discrimination, Harassment or Unfair Treatment</h3>
<p>If you are treated differently because of your <b>race, colour, place of origin, ancestry, religion, assumptions attached to your accent, sex, age, disability or sexual orientation</b> — in <b>hiring and at work, in renting a home, or in any service open to the public</b> (a shop, restaurant, school, hospital, bus) — that is against the law in BC, there is a formal route to complain, and <b>you need neither a lawyer nor fluent English to use it</b>.</p>
<p><b>Step one: write it down.</b> That day if possible: date, time, place, who was present, what was actually said in their words as best you recall, and what you said back. Keep texts, emails, the job posting, the rental ad, the chat log. A note written from memory afterwards still counts — the sooner it's written, the more weight it carries.</p>
<p><b>Step two: pick the route.</b> File with the <b>BC Human Rights Tribunal</b>, <b>1-888-440-8844</b>. You can file online, it is <b>free</b>, and there is a <b>one-year time limit</b> from the event (late complaints need a separate justification), so don't sit on it. If you're unsure whether to file, or want help writing it, the <b>BC Human Rights Clinic</b> provides free legal assistance and representation to eligible complainants. If it happened at work and involves wages, hours or dismissal, the <b>BC Employment Standards Branch</b> (1-833-236-3700) can run in parallel. If it involved hate speech, threats or violence, that is criminal — call the police (911 for emergencies; the non-emergency number is in the next section).</p>
<p><b>On "is this even discrimination?"</b> Many residents second-guess themselves — being skipped over, spoken to very slowly, asked repeatedly where you're <em>really</em> from, sending out résumés into silence. Some of it is unthinking bias; some of it is unlawful differential treatment; the line isn't always obvious from inside it. You can call <b>2-1-1</b>, describe what happened in your own language and be referred, or sit down once with a settlement worker at a local immigrant-services agency — they have seen a great many versions of this and can help you judge whether it's a formal complaint or a conversation with someone's manager. <b>Either way, it is not something you have to absorb alone.</b></p>
<h3>🎓 For International Students</h3>
<p><b>Work hours:</b> With a valid study permit, enrolled full-time at a designated learning institution (DLI), and having started studies, you may work off campus up to <b>24 hours per week</b> during academic terms, and unlimited hours during scheduled breaks (summer, winter, reading week). You need a SIN before your first shift. Working beyond the limit breaches your permit conditions and can cost you your student status or lead to removal — do not believe anyone who tells you "a few extra hours are never checked"; your employer's payroll record <em>is</em> the record.</p>
<p><b>Medical insurance:</b> Students must be insured here too. Your institution normally enrols you automatically in private coverage (such as GuardMe) for your first months, after which you apply for MSP yourself and switch over once approved. The gap between the two is where people get caught uninsured — confirm both dates during orientation week. Most campuses also have a students' union extended health and dental plan you're opted into by default, with a limited window to opt out.</p>
<p><b>Status and life after graduation:</b> Eligibility for a Post-Graduation Work Permit (PGWP) depends on the type and length of your programme and on your institution, and the rules have changed repeatedly in recent years. Rely on the <a href="https://www.canada.ca/en/immigration-refugees-citizenship.html" target="_blank" rel="noopener">IRCC website</a> and your international office's current briefing — not on what a friend did three years ago or on a recruiter's verbal promise. Start any study-permit extension months before it expires.</p>
<p><b>Academics and wellbeing:</b> Canadian classrooms weigh class participation, group work and <b>citation</b> heavily. Copying without attribution is academic misconduct, and consequences can be severe enough to affect your immigration status — this differs sharply from what is tolerated in some countries, so learn your school's citation rules in your first term. Academic advising, the writing centre and counselling are usually already covered by your tuition. Using them is not a mark against you.</p>
<h3>🍲 When Money Runs Short, or Something Goes Wrong</h3>
<p>Cash being tight in the first months is extremely common, and there is a whole set of ways to ask for help without humiliation. <b>Food banks</b> hand out food on presentation of ID for household members and do not screen by immigration status (local details are in the next section and on the map). <b>2-1-1</b> is Canada's community-services referral line — free, confidential, available in more than a dozen languages: describe the problem and they tell you which local agency handles it, whether that's rent, food, childcare, family violence, mental health or seniors' services. If rent itself is the problem, ask 2-1-1 or a local agency about a <b>Rent Bank</b> (a small repayable loan to prevent eviction). Low-income residents who qualify can apply for provincial <b>Income Assistance</b>. For utility bills, phone the company and ask for a payment arrangement — that conversation goes much better before a disconnection than after. One caution: using a food bank or local social services is a separate matter from your immigration application, but a few permit categories do have relevant conditions — if you're unsure, ask a settlement agency or legal aid for free advice first, rather than going hungry out of fear.</p>

UI.en.guideCA2=`<h3>☎️ Key Numbers at a Glance</h3>
<p><b>911</b> — police/fire/ambulance, for life-threatening emergencies; give the address first. <b>8-1-1</b> — HealthLink BC non-emergency health advice, nurses answering 24 hours a day, interpretation in 130+ languages on request. <b>2-1-1</b> — referral to community and social services (rent, food, childcare, seniors, family violence, mental health); free, confidential, multilingual. <b>988</b> — the national Suicide Crisis Helpline; call or text. <b>1-877-228-2557</b> — booking a medical interpreter. <b>1-800-665-8779</b> — BC Residential Tenancy Branch. <b>1-833-236-3700</b> — BC Employment Standards Branch (wages, hours, dismissal). <b>1-888-440-8844</b> — BC Human Rights Tribunal (discrimination complaints). <b>1-800-563-0808</b> — VictimLinkBC, support for victims of family violence and crime, 24 hours, 110+ languages. <b>250-828-3000</b> — local RCMP non-emergency line. Most government services can provide an interpreter on request, so fluent English isn't required to get things done.</p>
<h3>🧭 Not Sure Who to Ask? Match the Problem to the Door</h3>
<p>The most common resident difficulty isn't a lack of services — it's not knowing which body handles a given thing. This list covers most situations:</p>
<p><b>Status, visas, sponsorship, citizenship</b> → IRCC (canada.ca) is the only authoritative source; for a complicated case use a licensed immigration consultant (RCIC) or a lawyer, and if money is tight ask Legal Aid BC first. Don't rely on posts in social-media groups: the rules change every year.<br>
<b>SIN, Employment Insurance, CPP/OAS pensions</b> → Service Canada (1-800-622-6232).<br>
<b>Taxes, Canada Child Benefit, GST credit</b> → Canada Revenue Agency (1-800-959-8281); for the filing itself, a free tax clinic.<br>
<b>Health card, seeing a doctor, vaccines, mental health</b> → 8-1-1 (24 hours, interpreters available); if you have no family doctor, join the Health Connect Registry.<br>
<b>Tenancy disputes, deposits, rent increases, eviction</b> → RTB 1-800-665-8779; for free legal advice, Access Pro Bono.<br>
<b>Unpaid wages, unfair dismissal, unpaid overtime</b> → BC Employment Standards Branch 1-833-236-3700.<br>
<b>Discrimination or harassment</b> → BC Human Rights Tribunal 1-888-440-8844 (one-year limit).<br>
<b>School enrolment, transfers, English support, letters you can't read</b> → the school itself, plus SWIS (settlement workers in schools) and the district office.<br>
<b>Driver's licence, car insurance, accident claims</b> → ICBC.<br>
<b>Utilities, internet, billing disputes</b> → the utility's own customer line; if you can't pay a bill, phone before it's overdue and ask for an arrangement.<br>
<b>"I don't even know what kind of problem this is"</b> → call <b>2-1-1</b>, or walk into a local immigrant-services agency. Triage is exactly what those two exist to do.</p>
<p>Three rules that hold across all of it: <b>1. Start at the official website</b> (addresses ending .gc.ca or .bc.ca); agency and forum information is often out of date or has a stake in your decision. <b>2. Any call demanding immediate payment, payment in gift cards, or threatening you with arrest or deportation is a scam</b> — hang up and call back on the number printed on the official site. <b>3. Write down the date, the name of the person you spoke to, and any reference number</b>; many processes here take several contacts, and those notes are what make the second call go well.</p>
<h3>🤝 Loneliness, Homesickness, and Actually Belonging</h3>
<p>The least-discussed and most universal part of migrating isn't the visa or the job hunt — it's <b>the loneliness that arrives a few months in</b>: a layer of language between you and everyone, jokes you don't get, a professional identity that was reset to zero, friendships back home slowly thinning across a time difference. That isn't fragility and it isn't failure to adapt; almost every immigrant passes through it, and the first year or two is usually the hardest part.</p>
<p><b>Mental-health support here is free and confidential.</b> Call <b>8-1-1</b> to ask about local mental-health services and request an interpreter in your language; <b>988</b> is the national crisis line by phone or text; the local branch of the Canadian Mental Health Association (CMHA) runs free and low-cost counselling and groups; university students have free counselling on campus; and some agencies offer counselling specifically for immigrants, in their own language. Using any of it does not affect your immigration status.</p>
<p><b>Practically, the ways people here actually meet each other are quite predictable:</b> free library programmes and conversation circles; community-centre classes; your children's school parent groups and sports teams; places of worship (many of which double as a home-country community centre); volunteering — by far the most efficient move, because it addresses the loneliness and the "no Canadian experience" problem at the same time; and the resident socials and friendship-matching that settlement agencies run. Canadian sociability tends to be slower and shallower at first than in many countries: a neighbour who only says hello isn't being cold, and colleagues going straight home after work isn't exclusion. Friendships here usually warm up after months of repeatedly meeting in the same fixed activity. <b>Turning up, repeatedly, on time</b> matters more than how good your English is.</p>
<p><b>Two things worth saying plainly about accent and identity.</b> First, your accent is not a defect — more than a fifth of this country's population was born abroad, and accented English is the norm here rather than the exception; postponing things until your English is "ready" usually just extends the isolation. Second, if you do feel treated differently in some settings, that perception deserves to be taken seriously and there are formal channels for it (see "discrimination", above) — and it also doesn't have to define your reading of the whole city, because the large majority of daily interactions are not that.</p>
<p><b>Also, give yourself permission not to fully assimilate.</b> Cooking your own food, keeping your own holidays, staying close to family back home, finding your own diaspora community here — none of that is a failure to integrate. It's usually the root system that makes staying possible at all. Integrating is not deleting who you were and installing someone else.</p>
<p style="margin-top:14px;color:var(--sub-ink);font-size:11.5px;">This is a general starting-point summary based on public information — always confirm current policy on the official websites or by phone, as rules can change.</p>

UI.fr.guideCA1=`<h3>🛬 Vos deux premières semaines, dans l'ordre</h3>
<p>1️⃣ Carte SIM (pour qu'on puisse vous joindre) → 2️⃣ NAS (obligatoire pour travailler, déclarer vos impôts, recevoir des prestations) → 3️⃣ Demande de couverture santé provinciale (il y a un délai d'attente : faites-la dès le jour de votre arrivée) → 4️⃣ Ouverture d'un compte bancaire → 5️⃣ Logement et adresse fixe → 6️⃣ Inscription scolaire des enfants → 7️⃣ Permis de conduire. Ces étapes dépendent les unes des autres : sans NAS vous ne pouvez pas être payé légalement, beaucoup de démarches exigent une adresse fixe, et le compte à rebours de la couverture santé ne démarre qu'à la demande. Avant de partir, numérisez passeport, visa et documents d'immigration, acte de naissance, acte de mariage, diplômes et relevés de notes, carnet de vaccination, et gardez-en une copie sur votre téléphone et dans le nuage — on vous les redemandera sans cesse pendant six mois, et faire rééditer un original depuis l'étranger prend souvent des mois.</p>
<h3>🪪 Numéro d'assurance sociale (NAS)</h3>
<p>Le NAS est nécessaire pour travailler, produire vos impôts et accéder à la plupart des prestations gouvernementales. Faites la demande en ligne sur le site de <a href="https://www.canada.ca/fr/emploi-developpement-social/services/numero-assurance-sociale.html" target="_blank" rel="noopener">Service Canada</a>, ou en personne dans un bureau local (voir Catégorie → Gouv/Immigration sur cette carte). C'est gratuit, généralement délivré le jour même ou en quelques jours. Le NAS est une donnée d'identité à vie : hors employeur, banque et organismes gouvernementaux, refusez à quiconque vous le demande. Les arnaques téléphoniques se faisant passer pour le fisc ou l'immigration, qui réclament votre NAS et un paiement immédiat, comptent parmi les fraudes les plus courantes visant les résidents — jamais un vrai service gouvernemental ne vous menace d'arrestation au téléphone ni ne demande un paiement en cartes-cadeaux ou en cryptomonnaie.</p>
<h3>🏦 Ouvrir un compte bancaire</h3>
<p>Les grandes banques (TD, CIBC, BMO, Scotiabank, etc.) offrent souvent des comptes « bienvenue résidents » sans frais mensuels la première année, ouvrables avec passeport et documents d'immigration (carte RP, permis d'études ou de travail) — aucun historique de crédit local requis. Apportez passeport, documents d'immigration et votre carte NAS (si obtenue) à une succursale. Voir les succursales sous Catégorie → Banques sur cette carte. Posez trois questions au comptoir : comment les frais mensuels sont annulés, combien de transactions gratuites par mois, et le coût d'un virement international. Les banques diffèrent beaucoup sur ces trois points, et ce sont les frais que vous paierez chaque mois pendant des années.</p>
<h3>💳 Bâtir un dossier de crédit à partir de zéro</h3>
<p>Au Canada, louer un logement, obtenir un forfait de téléphone, financer une voiture et parfois même une vérification d'emploi passent par une enquête de crédit. Un résident n'a pas un <em>mauvais</em> crédit — il n'a <em>aucun dossier</em> : le système ne vous trouve pas, et les demandes sont refusées peu importe ce que vous possédiez ou gagniez dans votre pays. Le démarrage le plus rapide est une <b>carte de crédit garantie</b> (vous déposez une somme qui devient votre limite, l'approbation est quasi automatique) ou une carte d'entrée de gamme pour résidents. Ensuite, mettez-y une petite dépense régulière et <b>remboursez le solde entier à temps chaque mois</b> ; six à douze mois suffisent à créer un dossier de base. Quatre pièges fréquents : ne payer que le « paiement minimum » (intérêts très élevés, et cela n'aide pas votre cote), utiliser toute la limite (visez moins de 30 % environ), demander plusieurs cartes en peu de temps (chaque enquête ferme coûte des points), et manquer un paiement — un seul retard peut rester des années au dossier. Vous pouvez demander gratuitement votre propre dossier chez Equifax et TransUnion ; le faire une fois par an permet aussi de détecter une usurpation d'identité.</p>
<h3>📱 Téléphone et internet</h3>
<p>Les grands fournisseurs sont Rogers/Telus/Bell et leurs marques économiques (Fido, Koodo, Virgin Plus, etc.), souvent moins chères. Envisagez d'abord une carte SIM prépayée, puis un forfait avec contrat une fois installé (un contrat peut exiger un historique de crédit ou un dépôt). Avant de signer, vérifiez la durée du contrat, le tarif de dépassement de données, et si un « téléphone gratuit » vous enferme dans deux ans de forfait coûteux.</p>
<h3>🗣️ Si votre anglais n'est pas courant : vous avez droit à un interprète gratuit</h3>
<p>C'est le droit le moins utilisé des résidents. Par l'entremise du Provincial Language Service, le système de santé public de la province offre <b>l'interprétation gratuite dans plus de 200 langues, 24 heures sur 24, sans frais pour les patients ni leur famille</b>. Au moment de prendre rendez-vous ou à l'accueil, dites simplement : « I need an interpreter. I speak ______. » En cas d'urgence, la ligne est le <b>1-877-228-2557</b>. La ligne santé <b>8-1-1</b> couvre plus de 130 langues, et la ligne de services communautaires <b>2-1-1</b> offre de l'aiguillage dans une douzaine. N'utilisez pas votre enfant comme interprète en consultation médicale : une erreur de terme médical a de vraies conséquences, et c'est un poids injuste pour un enfant. Banques, écoles et cliniques juridiques peuvent aussi organiser une interprétation téléphonique — demander n'est pas déranger, c'est utiliser un service prévu pour vous. Un bout de papier portant le nom de votre langue en anglais (« Mandarin », « Tagalog », « Tigrinya ») accélère la demande.</p>
<h3>🧾 Produisez une déclaration de revenus même avec un revenu nul</h3>
<p>Beaucoup de prestations canadiennes ne se demandent pas — elles se <em>calculent à partir de votre déclaration</em>. Le crédit pour la TPS/TVH, l'Allocation canadienne pour enfants (ACE) et la plupart des suppléments provinciaux sont versés automatiquement d'après la déclaration de l'année précédente. Autrement dit : <b>même une année sans aucun revenu, il faut déclarer, sinon vous ne recevez rien</b>, et réclamer rétroactivement est bien plus lourd. La saison s'ouvre généralement en février, l'échéance des particuliers est le 30 avril. Si votre revenu est modeste et votre situation simple — ce qui décrit la plupart des résidents, des étudiants et des prestataires — une <b>clinique d'impôts gratuite</b> appuyée par l'ARC (Programme communautaire des bénévoles en matière d'impôts) la produira gratuitement pour vous ; cherchez par code postal sur le <a href="https://www.canada.ca/fr/agence-revenu/services/impot/particuliers/programme-communautaire-benevoles-matiere-impots.html" target="_blank" rel="noopener">site de l'ARC</a>. Une première déclaration doit habituellement être postée sur papier avant que la production en ligne vous soit ouverte.</p>
<h3>💼 Emploi, CV et reconnaissance des diplômes</h3>
<p>Trois choses fonctionnent autrement ici qu'ailleurs, et c'est là que les gens bloquent :</p>
<p><b>1. Le format du CV est différent.</b> Un CV canadien fait généralement 1 à 2 pages et ne comporte <b>ni photo, ni âge, ni sexe, ni état civil, ni numéro d'identité</b> — les inclure peut faire écarter votre CV, les employeurs évitant tout ce qui ressemble à un risque de discrimination. Mettez en avant des résultats chiffrés plutôt qu'une liste de tâches, et réécrivez la lettre de présentation pour chaque poste.</p>
<p><b>2. Le cercle vicieux de l'« expérience canadienne ».</b> Beaucoup d'offres exigent une expérience locale que, par définition, vous n'avez pas encore. Les voies habituelles : accepter un emploi de transition pour obtenir des références locales ; faire du bénévolat (au Canada, il compte vraiment et se met sur le CV) ; et utiliser le counselling d'emploi et le <b>jumelage avec un mentor</b> des organismes d'accueil, qui vous associe à une personne établie dans votre domaine.</p>
<p><b>3. Diplômes et professions réglementées.</b> Votre diplôme étranger est valide, mais les écoles et certains employeurs demanderont une <b>évaluation des diplômes</b> (rapport d'un organisme comme WES). Surtout : médecins, infirmières, pharmaciens, enseignants, comptables, ingénieurs, avocats, électriciens et plombiers exercent des <b>professions réglementées</b> — il faut obtenir un permis de l'ordre professionnel provincial, ce qui peut exiger examens et stage supervisé et prendre d'un à plusieurs ans. Si c'est votre domaine, renseignez-vous dès les premières semaines plutôt qu'après une année de refus. Révision de CV, entrevues simulées et présentations sectorielles sont des services courants et gratuits des organismes d'accueil.</p>

UI.fr.guideProv=`<h3>⚕️ Couverture santé de la C.-B. (MSP + carte BC Services)</h3>
<p>Le régime public de santé de la C.-B. s'appelle MSP (Medical Services Plan). Faites votre demande de carte BC Services sur le site de <a href="https://www2.gov.bc.ca/gov/content/health/health-drug-coverage/msp/bc-residents/enrolment" target="_blank" rel="noopener">Health Insurance BC</a>. <b>Le délai d'attente correspond au reste du mois où vous devenez résident, plus deux mois complets</b> — près de trois mois au pire. Pendant ce temps, consultations et urgences vous sont facturées en entier : souscrivez une assurance médicale privée <em>avant</em> d'arriver pour couvrir la période (la plupart des polices excluent les affections préexistantes — lisez cette clause). Si vous venez d'une autre province canadienne, conservez votre régime précédent jusqu'à la fin du délai. Le compte à rebours démarre à la <b>demande</b> : faites-la dès le premier jour. Depuis janvier 2020, le MSP n'exige plus de prime mensuelle des résidents inscrits.</p>
<h3>🩺 Quand vous ne trouvez pas de médecin de famille</h3>
<p>La pénurie de médecins de famille est générale ici — beaucoup de résidents de longue date n'en ont pas non plus. Personne ne vous vise en particulier. La bonne démarche est de s'inscrire au <b>Health Connect Registry</b>, la liste d'attente provinciale : inscription en ligne en quelques minutes sur <a href="https://www.healthlinkbc.ca/find-care/health-connect-registry" target="_blank" rel="noopener">HealthLink BC</a>, ou par téléphone au <b>8-1-1</b> dans votre langue (plus de 130 langues). Il faut votre numéro personnel de santé (PHN), votre adresse, votre téléphone et votre courriel. En attendant, vous n'êtes pas sans soins : le <b>8-1-1</b> vous met en contact avec des infirmières, pharmaciens et diététistes 24 heures sur 24 ; un <b>Urgent and Primary Care Centre</b> traite le non-urgent le jour même ; une <b>clinique sans rendez-vous</b> couvre les maladies courantes ; en C.-B., les pharmaciens communautaires peuvent prescrire pour une liste d'affections mineures et vacciner ; l'urgence hospitalière et le 911 sont pour les vraies urgences. Rappel : vous pouvez demander un interprète gratuit pour tout cela (section précédente).</p>
<h3>🚗 Permis, assurance et pneus d'hiver</h3>
<p>Les permis de conduire de la C.-B. sont gérés par ICBC. Les permis de nombreux pays peuvent être échangés directement, ou donner droit à un examen de route allégé selon l'expérience — consultez la page <a href="https://www.icbc.com/driver-licensing/new-to-bc" target="_blank" rel="noopener">« New to BC » d'ICBC</a> pour vérifier les ententes de réciprocité. Pour des cours de conduite locaux, voir Catégorie → Auto-école. Deux postes où les résidents perdent régulièrement de l'argent : <b>l'historique d'assurance</b> — vos années sans sinistre à l'étranger ne comptent que si vous rapportez une lettre d'historique de réclamations en anglais de votre ancien assureur ; sans elle, vous êtes tarifé comme un conducteur débutant, au tarif le plus élevé, et cette lettre est bien plus facile à obtenir avant le départ qu'après. Et <b>les pneus d'hiver</b> — la plupart des routes de montagne de la C.-B. les exigent du 1er octobre au 31 mars, certaines jusqu'au 30 avril. Un pneu d'hiver conforme porte la mention M+S ou le symbole de la montagne à trois pics et du flocon, avec au moins 3,5 mm de sculpture. Les quatre-saisons ne sont pas automatiquement des pneus d'hiver ; la police vérifie, des amendes s'appliquent, et sur une route de montagne on peut vous faire rebrousser chemin.</p>
<h3>🎒 Inscription scolaire et soutien linguistique</h3>
<p>{CITY} fait partie du district scolaire {SD}. Les écoles publiques sont assignées selon l'adresse — utilisez l'<a href="{SD_URL}" target="_blank" rel="noopener">outil de recherche d'école {SD}</a> pour trouver votre école, puis contactez l'école ou le district pour l'inscription. Il faut généralement un certificat de naissance/passeport, le carnet de vaccination, une preuve d'adresse et vos documents d'immigration. Trois choses que les parents doivent savoir : <b>1. L'anglais n'est pas une condition d'admission.</b> Les écoles offrent un soutien ELL (English Language Learner) : l'enfant est placé dans son niveau normal et reçoit en parallèle une aide linguistique — on ne le fait pas redoubler pour la langue. <b>2. Des intervenants en établissement travaillent gratuitement dans les écoles.</b> SWIS (Settlement Workers in Schools) s'adresse spécifiquement aux familles nouvellement arrivées : explication du système scolaire, aide aux formulaires et aux rencontres parents-enseignants, orientation vers les activités, organisation d'un interprète. <b>3. La communication école-famille est plus fréquente que dans bien des pays.</b> Courriels, applications scolaires et rencontres comptent ; si vous ne comprenez pas un document, dites que vous avez besoin d'une traduction. L'école a l'obligation de vous rendre compréhensible ce qui concerne votre enfant.</p>
<h3>🏠 Location : le plancher que la loi vous garantit</h3>
<p>Le dépôt de garantie est plafonné par la loi à <b>un demi-mois de loyer</b> (plus, le cas échéant, un demi-mois de dépôt pour animal) ; au-delà, le propriétaire ne peut rien exiger. Le loyer ne peut être augmenté qu'<b>une fois tous les 12 mois</b>, avec un préavis écrit de <b>trois mois complets</b> sur le formulaire officiel (RTB-7), et la hausse maximale permise en 2026 est de <b>2,3 %</b> — vous n'avez pas à payer une augmentation supérieure au plafond ou signifiée sans préavis conforme. Les préavis, et la règle voulant qu'un propriétaire donne un avis écrit de 24 heures avant d'entrer, relèvent de la <a href="https://www2.gov.bc.ca/gov/content/housing-tenancy/residential-tenancies" target="_blank" rel="noopener">Residential Tenancy Branch (RTB) de la C.-B.</a> ; en cas de litige, appelez le <b>1-800-665-8779</b>. Trois pièges classiques : <b>les arnaques à la location</b> — une annonce où vous ne rencontrez personne et où l'on vous demande de virer un dépôt parce que « je suis à l'étranger » est presque toujours une fraude ; visitez sur place, rencontrez le propriétaire ou un agent agréé, obtenez un bail écrit avant tout paiement. <b>L'absence d'historique de crédit local</b> — proposez une lettre d'embauche, des relevés bancaires, un garant, ou plusieurs mois payés d'avance (à noter : un loyer payé d'avance n'est pas un dépôt, et la loi ne vous l'impose pas). <b>Les promesses verbales</b> — réparations, charges comprises, animaux permis : mettez tout dans le bail écrit, car le verbal est presque impossible à prouver. Faites avec le propriétaire un rapport écrit d'état des lieux à l'entrée et à la sortie : c'est votre meilleure preuve pour récupérer le dépôt.</p>
<h3>⚖️ Questions juridiques et aide juridique</h3>
<p>Avoir besoin d'aide juridique ne signifie pas toujours payer un avocat — la C.-B. offre plusieurs options gratuites ou à faible coût. <b>Legal Aid BC</b> couvre le droit de la famille, la défense criminelle et les questions d'immigration/réfugiés pour les personnes à revenu limité — ligne de {CITY} <b>250-314-1900</b>, ligne provinciale <b>1-866-577-2525</b>, legalaid.bc.ca. {CITY} a une clinique juridique physique, l'<b>Okanagan Thompson Legal Clinic</b> (220-301 Victoria St, 236-425-9121), offrant une aide gratuite ou à faible coût en droit de la famille, aide au revenu/prestations d'invalidité, assurance-emploi, dettes et questions de location (voir Catégorie → Aide juridique sur cette carte). <b>Access Pro Bono BC</b> (604-878-7400, accessprobono.ca) offre des conseils juridiques gratuits et des recommandations pour les personnes à faible revenu, les aînés de 55 ans et plus, les personnes handicapées et les immigrants/réfugiés. Les petites créances de moins de 5 000 $ et les litiges de copropriété peuvent être traités en ligne, sans avocat, via le <b>Tribunal de résolution civile de la C.-B. (CRT)</b> (1-844-322-2292). Les salaires impayés ou autres litiges en milieu de travail relèvent de la <b>Direction des normes d'emploi de la C.-B.</b> (1-833-236-3700).</p>
<h3>🛡️ En cas de discrimination, de harcèlement ou de traitement injuste</h3>
<p>Si vous êtes traité différemment en raison de votre <b>race, couleur, lieu d'origine, ascendance, religion, des préjugés liés à votre accent, de votre sexe, âge, handicap ou orientation sexuelle</b> — à l'<b>embauche et au travail, dans la location d'un logement, ou dans tout service offert au public</b> (commerce, restaurant, école, hôpital, autobus) — c'est illégal en C.-B., il existe une voie de plainte formelle, et <b>vous n'avez besoin ni d'un avocat ni d'un anglais courant</b> pour l'emprunter.</p>
<p><b>Première étape : écrivez-le.</b> Le jour même si possible : date, heure, lieu, personnes présentes, les mots exacts autant que vous vous en souvenez, et votre réponse. Conservez textos, courriels, l'offre d'emploi, l'annonce de location, la conversation. Une note rédigée de mémoire après coup compte aussi — plus elle est rapide, plus elle pèse.</p>
<p><b>Deuxième étape : choisissez la voie.</b> Déposez une plainte au <b>Tribunal des droits de la personne de la C.-B.</b>, <b>1-888-440-8844</b>. Le dépôt se fait en ligne, il est <b>gratuit</b>, et il existe un <b>délai d'un an</b> à compter des faits (au-delà, il faut une justification distincte) : ne tardez pas. Si vous hésitez ou souhaitez de l'aide pour rédiger, la <b>BC Human Rights Clinic</b> offre une assistance juridique et une représentation gratuites aux plaignants admissibles. Si les faits sont survenus au travail et touchent le salaire, les heures ou un congédiement, la <b>Direction des normes d'emploi</b> (1-833-236-3700) peut être saisie en parallèle. S'il y a eu propos haineux, menaces ou violence, c'est du ressort criminel : appelez la police (911 en urgence ; le numéro non urgent figure à la section suivante).</p>
<p><b>« Est-ce vraiment de la discrimination ? »</b> Beaucoup de résidents doutent d'eux-mêmes — être ignoré, se faire parler très lentement, s'entendre demander sans cesse d'où l'on vient <em>vraiment</em>, envoyer des CV dans le vide. Une partie relève du préjugé irréfléchi, une autre d'une différence de traitement illégale, et la frontière n'est pas toujours nette vue de l'intérieur. Vous pouvez appeler le <b>2-1-1</b>, raconter dans votre langue et être orienté, ou rencontrer une fois un intervenant en établissement d'un organisme d'accueil : ils en ont vu de nombreuses versions et peuvent vous aider à juger s'il s'agit d'une plainte formelle ou d'une conversation à avoir avec un supérieur. <b>Dans tous les cas, ce n'est pas à vous seul de l'encaisser.</b></p>
<h3>🎓 Pour les étudiants internationaux</h3>
<p><b>Heures de travail :</b> avec un permis d'études valide, inscrit à temps plein dans un établissement désigné (EED) et vos études commencées, vous pouvez travailler hors campus jusqu'à <b>24 heures par semaine</b> pendant les sessions, et sans limite durant les congés prévus au calendrier (été, hiver, semaine de lecture). Il faut un NAS avant le premier quart de travail. Dépasser la limite viole les conditions du permis et peut coûter votre statut d'étudiant, voire mener à un renvoi — ne croyez personne qui affirme que « quelques heures de plus, personne ne vérifie » : la paie de votre employeur <em>est</em> la preuve.</p>
<p><b>Assurance médicale :</b> les étudiants doivent aussi être assurés ici. L'établissement vous inscrit normalement d'office à une assurance privée (GuardMe, par exemple) pour vos premiers mois ; ensuite, c'est à vous de demander le MSP et de basculer une fois approuvé. C'est entre les deux que des étudiants se retrouvent sans couverture — faites confirmer les deux dates dès la semaine d'accueil. La plupart des campus ont aussi un régime complémentaire soins dentaires et santé de l'association étudiante, auquel on est inscrit par défaut, avec une courte fenêtre pour se retirer.</p>
<p><b>Statut et après le diplôme :</b> l'admissibilité au permis de travail postdiplôme (PTPD) dépend du type et de la durée du programme et de l'établissement, et les règles ont changé à plusieurs reprises ces dernières années. Fiez-vous au site d'<a href="https://www.canada.ca/fr/immigration-refugies-citoyennete.html" target="_blank" rel="noopener">IRCC</a> et au breffage à jour de votre bureau international — pas à l'expérience d'un ami il y a trois ans ni à la promesse verbale d'un recruteur. Préparez toute prolongation de permis plusieurs mois avant l'échéance.</p>
<p><b>Études et bien-être :</b> les classes canadiennes accordent beaucoup de poids à la participation, au travail d'équipe et à la <b>citation des sources</b>. Copier sans attribution constitue une inconduite académique, dont les conséquences peuvent aller jusqu'à toucher votre statut d'immigration — cela diffère nettement de ce qui est toléré dans certains pays : apprenez les règles de citation de votre école dès la première session. Le conseil pédagogique, le centre de rédaction et les services de counselling sont généralement déjà compris dans vos frais de scolarité. Les utiliser n'est pas un aveu de faiblesse.</p>
<h3>🍲 Quand l'argent manque ou qu'un imprévu survient</h3>
<p>Manquer de liquidités les premiers mois est extrêmement fréquent, et il existe tout un réseau pour demander de l'aide sans humiliation. Les <b>banques alimentaires</b> distribuent de la nourriture sur présentation d'une pièce d'identité par membre du ménage et ne filtrent pas selon le statut d'immigration (détails locaux à la section suivante et sur la carte). Le <b>2-1-1</b> est la ligne d'aiguillage vers les services communautaires — gratuite, confidentielle, offerte dans plus d'une douzaine de langues : décrivez le problème et on vous dira quel organisme local s'en occupe, qu'il s'agisse de loyer, de nourriture, de garde d'enfants, de violence familiale, de santé mentale ou de services aux aînés. Si c'est le loyer lui-même, demandez au 2-1-1 ou à un organisme local ce qu'il en est d'une <b>Rent Bank</b> (petit prêt remboursable pour éviter une éviction). Les résidents à faible revenu admissibles peuvent demander l'<b>aide au revenu</b> provinciale. Pour les factures de services publics, téléphonez et demandez une entente de paiement — cette conversation se passe bien mieux avant une interruption qu'après. Une mise en garde : recourir à une banque alimentaire ou aux services sociaux locaux est une question distincte de votre demande d'immigration, mais quelques catégories de permis comportent des conditions pertinentes — dans le doute, demandez d'abord un avis gratuit à un organisme d'accueil ou à l'aide juridique, plutôt que de vous priver de manger par crainte.</p>

UI.fr.guideCA2=`<h3>☎️ Numéros utiles en un coup d'œil</h3>
<p><b>911</b> — police/incendie/ambulance, pour les urgences vitales; donnez l'adresse en premier. <b>8-1-1</b> — HealthLink BC, conseils santé non urgents, infirmières 24 h sur 24, interprétation dans plus de 130 langues sur demande. <b>2-1-1</b> — aiguillage vers les services communautaires et sociaux (loyer, nourriture, garde d'enfants, aînés, violence familiale, santé mentale); gratuit, confidentiel, multilingue. <b>988</b> — Ligne d'aide en cas de crise de suicide, par téléphone ou texto. <b>1-877-228-2557</b> — réservation d'un interprète médical. <b>1-800-665-8779</b> — Residential Tenancy Branch de la C.-B. <b>1-833-236-3700</b> — Normes d'emploi de la C.-B. (salaires, heures, congédiement). <b>1-888-440-8844</b> — Tribunal des droits de la personne de la C.-B. (discrimination). <b>1-800-563-0808</b> — VictimLinkBC, soutien aux victimes de violence familiale et de crimes, 24 h sur 24, plus de 110 langues. <b>250-828-3000</b> — ligne non urgente de la GRC locale. La plupart des services gouvernementaux peuvent fournir un interprète sur demande — un anglais courant n'est pas nécessaire.</p>
<h3>🧭 Vous ne savez pas à qui vous adresser? Associez le problème à la bonne porte</h3>
<p>La difficulté la plus courante des résidents n'est pas le manque de services, c'est de ne pas savoir quel organisme s'occupe de quoi. Cette liste couvre l'essentiel :</p>
<p><b>Statut, visas, parrainage, citoyenneté</b> → IRCC (canada.ca) est la seule source faisant autorité; pour un dossier complexe, un consultant en immigration agréé (CRIC) ou un avocat, et si l'argent manque, demandez d'abord à Legal Aid BC. Ne vous fiez pas aux publications de groupes sur les réseaux sociaux : les règles changent chaque année.<br>
<b>NAS, assurance-emploi, RPC/SV</b> → Service Canada (1-800-622-6232).<br>
<b>Impôts, Allocation canadienne pour enfants, crédit TPS</b> → Agence du revenu du Canada (1-800-959-8281); pour la déclaration elle-même, une clinique d'impôts gratuite.<br>
<b>Carte santé, voir un médecin, vaccins, santé mentale</b> → 8-1-1 (24 h sur 24, interprètes disponibles); sans médecin de famille, inscrivez-vous au Health Connect Registry.<br>
<b>Litiges de location, dépôts, hausses de loyer, éviction</b> → RTB 1-800-665-8779; pour un avis juridique gratuit, Access Pro Bono.<br>
<b>Salaires impayés, congédiement injustifié, heures supplémentaires non payées</b> → Normes d'emploi de la C.-B. 1-833-236-3700.<br>
<b>Discrimination ou harcèlement</b> → Tribunal des droits de la personne de la C.-B. 1-888-440-8844 (délai d'un an).<br>
<b>Inscription scolaire, transferts, soutien en anglais, lettres incompréhensibles</b> → l'école elle-même, plus SWIS (intervenants en établissement dans les écoles) et le bureau du district.<br>
<b>Permis de conduire, assurance auto, réclamations</b> → ICBC.<br>
<b>Services publics, internet, litiges de facturation</b> → la ligne clientèle du fournisseur; si vous ne pouvez pas payer, téléphonez avant l'échéance et demandez une entente.<br>
<b>« Je ne sais même pas de quel genre de problème il s'agit »</b> → appelez le <b>2-1-1</b>, ou entrez dans un organisme local d'accueil des immigrants. Le tri, c'est précisément leur raison d'être.</p>
<p>Trois règles valables partout : <b>1. Commencez par le site officiel</b> (adresses se terminant par .gc.ca ou .bc.ca); l'information des agences privées et des forums est souvent périmée ou intéressée. <b>2. Tout appel exigeant un paiement immédiat, un paiement en cartes-cadeaux, ou vous menaçant d'arrestation ou d'expulsion est une fraude</b> — raccrochez et rappelez au numéro figurant sur le site officiel. <b>3. Notez la date, le nom de la personne à qui vous avez parlé et tout numéro de référence</b>; beaucoup de démarches exigent plusieurs contacts, et ce sont ces notes qui font bien aller le deuxième appel.</p>
<h3>🤝 Solitude, mal du pays et appartenance réelle</h3>
<p>La part la moins discutée et la plus universelle de l'émigration n'est ni le visa ni la recherche d'emploi : c'est <b>la solitude qui arrive après quelques mois</b> — une couche de langue entre vous et tout le monde, des blagues qui vous échappent, une identité professionnelle remise à zéro, des amitiés du pays qui s'effilochent lentement à travers le décalage horaire. Ce n'est ni de la fragilité ni un échec d'adaptation : presque tous les immigrants traversent cela, et la première ou la deuxième année est généralement la plus dure.</p>
<p><b>Le soutien en santé mentale est gratuit et confidentiel.</b> Appelez le <b>8-1-1</b> pour vous informer des services locaux et demander un interprète dans votre langue; le <b>988</b> est la ligne de crise nationale, par téléphone ou texto; la section locale de l'Association canadienne pour la santé mentale (ACSM) offre du counselling et des groupes gratuits ou à faible coût; les étudiants universitaires ont du counselling gratuit sur le campus; et certains organismes offrent du counselling destiné aux immigrants, dans leur langue. Y recourir n'a aucun effet sur votre statut d'immigration.</p>
<p><b>Concrètement, les façons dont les gens se rencontrent ici sont assez prévisibles :</b> activités gratuites et cercles de conversation en bibliothèque; cours des centres communautaires; groupes de parents et équipes sportives de l'école de vos enfants; lieux de culte (souvent aussi des centres communautaires du pays d'origine); le bénévolat — de loin le plus efficace, puisqu'il règle en même temps la solitude et le problème de « l'expérience canadienne »; et les rencontres pour résidents et les jumelages d'amitié des organismes d'accueil. La sociabilité canadienne est souvent plus lente et plus superficielle au départ que dans bien des pays : un voisin qui se contente de dire bonjour n'est pas froid, et des collègues qui rentrent directement après le travail ne vous excluent pas. Les liens se réchauffent après des mois de rencontres répétées dans la même activité fixe. <b>Se présenter, régulièrement, à l'heure</b> compte plus que la qualité de votre anglais.</p>
<p><b>Deux choses à dire clairement sur l'accent et l'identité.</b> D'abord, votre accent n'est pas un défaut — plus d'un cinquième de la population de ce pays est née à l'étranger, et l'anglais avec un accent y est la norme, pas l'exception; attendre que votre anglais soit « prêt » ne fait généralement que prolonger l'isolement. Ensuite, si vous vous sentez traité différemment dans certains contextes, ce ressenti mérite d'être pris au sérieux et il existe des voies formelles (voir « discrimination », plus haut) — sans que cela doive définir votre lecture de toute la ville, car la grande majorité des interactions quotidiennes n'est pas de cet ordre.</p>
<p><b>Et donnez-vous le droit de ne pas vous assimiler entièrement.</b> Cuisiner vos plats, garder vos fêtes, rester proche de votre famille au pays, trouver ici votre communauté d'origine — rien de tout cela n'est un refus d'intégration. C'est le plus souvent le système racinaire qui rend le fait de rester possible. S'intégrer, ce n'est pas effacer qui l'on était pour installer quelqu'un d'autre.</p>
<p style="margin-top:14px;color:var(--sub-ink);font-size:11.5px;">Ce résumé est basé sur des informations publiques générales à titre de point de départ — vérifiez toujours la politique actuelle sur les sites officiels ou par téléphone, car les règles peuvent changer.</p>

UI.es.guideCA1=`<h3>🛬 Sus primeras dos semanas, en orden</h3>
<p>1️⃣ Tarjeta SIM (para que puedan localizarle) → 2️⃣ SIN (obligatorio para trabajar, declarar impuestos y recibir beneficios) → 3️⃣ Solicitar la cobertura de salud provincial (hay período de espera: solicítela el mismo día que llegue) → 4️⃣ Abrir una cuenta bancaria → 5️⃣ Vivienda y dirección fija → 6️⃣ Matricular a los niños → 7️⃣ Licencia de conducir. Estos pasos dependen entre sí: sin SIN no puede cobrar legalmente, muchos trámites exigen dirección fija, y el reloj de la cobertura de salud solo arranca cuando usted solicita. Antes de viajar, escanee pasaporte, visa y papeles de inmigración, acta de nacimiento, acta de matrimonio, títulos y certificados de notas, y cartilla de vacunación, y guarde copias en el teléfono y en la nube — se los pedirán una y otra vez durante seis meses, y reponer un original desde el extranjero suele tardar meses.</p>
<h3>🪪 Número de Seguro Social (SIN)</h3>
<p>Necesita un SIN para trabajar, declarar impuestos y acceder a la mayoría de los beneficios gubernamentales. Solicítelo en línea en el <a href="https://www.canada.ca/en/employment-social-development/services/sin.html" target="_blank" rel="noopener">sitio web de Service Canada</a>, o en persona en una oficina local de Service Canada (vea Categoría → Gobierno/Inmigración en este mapa). Es gratuito y generalmente se emite el mismo día o en pocos días. El SIN es un dato de identidad de por vida: fuera de su empleador, su banco y los organismos gubernamentales, niéguese a darlo. Las estafas telefónicas que se hacen pasar por la agencia tributaria o por inmigración, exigen su SIN y un pago inmediato, están entre los fraudes más comunes contra los residentes — ninguna oficina real le amenaza con arresto por teléfono ni pide pagos en tarjetas de regalo o criptomonedas.</p>
<h3>🏦 Abrir una cuenta bancaria</h3>
<p>Los principales bancos aquí (TD, CIBC, BMO, Scotiabank, etc.) suelen ofrecer cuentas de "bienvenida para residentes" sin cuota mensual el primer año, que se pueden abrir con su pasaporte y documentos de inmigración (tarjeta de residencia permanente, permiso de estudios o trabajo) — no se requiere historial crediticio local. Lleve su pasaporte, documentos de inmigración y su tarjeta SIN (si ya la tiene) a una sucursal. Encuentre sucursales cercanas en Categoría → Bancos en este mapa. Haga tres preguntas en el mostrador: cómo se exonera la cuota mensual, cuántas transacciones gratuitas incluye al mes y cuánto cuesta una transferencia internacional. Los bancos difieren mucho en los tres puntos, y son cargos que pagará todos los meses durante años.</p>
<h3>💳 Construir historial crediticio desde cero</h3>
<p>En Canadá, alquilar vivienda, contratar un plan de teléfono, financiar un auto y a veces hasta una verificación laboral implican una consulta de crédito. Un residente no tiene <em>mal</em> crédito — no tiene <em>expediente</em>: el sistema no le encuentra, y las solicitudes se rechazan sin importar lo que tuviera o ganara en su país. La forma más rápida de empezar es una <b>tarjeta de crédito garantizada</b> (usted deposita una cantidad que se convierte en su límite, así la aprobación es casi automática) o una tarjeta inicial para residentes. Después ponga en ella un gasto pequeño y habitual y <b>pague el saldo completo a tiempo cada mes</b>; de seis a doce meses así crean un expediente básico. Cuatro trampas frecuentes: pagar solo el "pago mínimo" (intereses muy altos y no mejora su puntaje), usar todo el límite (conviene mantenerse por debajo del 30 % aproximadamente), pedir varias tarjetas en poco tiempo (cada consulta dura resta puntos) y no pagar a tiempo — un solo atraso puede quedar registrado durante años. Puede pedir gratis su propio informe a Equifax y a TransUnion; hacerlo una vez al año también sirve para detectar suplantación de identidad.</p>
<h3>📱 Teléfono e internet</h3>
<p>Los principales operadores son Rogers/Telus/Bell y sus submarcas económicas (Fido, Koodo, Virgin Plus, etc.), que suelen ser más baratas. Considere primero una SIM prepagada para necesidades inmediatas, y luego cambie a un plan con contrato una vez establecido (los contratos pueden requerir historial crediticio o un depósito). Antes de firmar, revise la duración del contrato, la tarifa por exceso de datos y si un "teléfono gratis" le ata a dos años de plan caro.</p>
<h3>🗣️ Si su inglés no es fluido: tiene derecho a un intérprete gratuito</h3>
<p>Es el derecho más desaprovechado que tienen los residentes. A través del Provincial Language Service, el sistema público de salud de la provincia ofrece <b>interpretación gratuita en más de 200 idiomas, las 24 horas, sin costo para el paciente ni su familia</b>. Al pedir la cita o en recepción, diga simplemente: "I need an interpreter. I speak ______." Para urgencias, la línea es <b>1-877-228-2557</b>. La línea de salud <b>8-1-1</b> cubre más de 130 idiomas, y la línea comunitaria <b>2-1-1</b> ofrece derivaciones en una docena. Por favor no use a su hijo como intérprete en una consulta médica: un término médico mal traducido tiene consecuencias reales, y es una carga injusta para un niño. Bancos, escuelas y clínicas legales también suelen poder gestionar interpretación telefónica — pedirlo no es molestar, es usar un servicio que ya existe para usted. Llevar un papelito con el nombre de su idioma en inglés ("Mandarin", "Tagalog", "Tigrinya") agiliza la petición.</p>
<h3>🧾 Declare impuestos aunque su ingreso sea cero</h3>
<p>Muchos beneficios canadienses no se solicitan — se <em>calculan a partir de su declaración</em>. El crédito por GST/HST, el Beneficio por Hijos de Canadá (CCB) y la mayoría de los suplementos provinciales se pagan automáticamente según la declaración del año anterior. Es decir: <b>incluso en un año sin ningún ingreso conviene declarar, o no recibirá nada</b>, y reclamarlo después es mucho más trabajoso. La temporada suele abrir en febrero, con fecha límite del 30 de abril para personas físicas. Si su ingreso es modesto y su situación es simple — que describe a la mayoría de residentes, estudiantes y personas con beneficios — una <b>clínica de impuestos gratuita</b> respaldada por la CRA (Community Volunteer Income Tax Program) la presentará por usted sin cargo; busque por código postal en el <a href="https://www.canada.ca/en/revenue-agency/services/tax/individuals/community-volunteer-income-tax-program.html" target="_blank" rel="noopener">sitio de la CRA</a>. La primera declaración suele enviarse en papel por correo antes de que se le habilite la presentación en línea.</p>
<h3>💼 Empleo, currículum y reconocimiento de títulos</h3>
<p>Tres cosas funcionan distinto aquí, y son donde la gente se atasca:</p>
<p><b>1. El formato del currículum es diferente.</b> Un currículum canadiense suele tener 1–2 páginas y no lleva <b>foto, edad, sexo, estado civil ni número de identidad</b> — incluirlos puede hacer que lo descarten, porque los empleadores evitan cualquier cosa que parezca riesgo de discriminación. Destaque resultados con cifras concretas en lugar de una lista de funciones, y reescriba la carta de presentación para cada vacante.</p>
<p><b>2. El círculo vicioso de la "experiencia canadiense".</b> Muchas vacantes piden experiencia local que, por definición, todavía no tiene. Las salidas habituales: aceptar un empleo puente para conseguir referencias locales; hacer voluntariado (en Canadá cuenta de verdad y va en el currículum); y usar la orientación laboral y el <b>emparejamiento con un mentor</b> de las agencias de asentamiento, que le vincula con alguien establecido en su sector.</p>
<p><b>3. Títulos y profesiones reguladas.</b> Su título extranjero es válido, pero las escuelas y algunos empleadores pedirán una <b>evaluación de credenciales</b> (un informe de una agencia como WES). Más importante: médicos, enfermeras, farmacéuticos, docentes, contadores, ingenieros, abogados, electricistas y plomeros ejercen <b>profesiones reguladas</b> — no puede ejercer hasta que el colegio profesional provincial le habilite, lo que puede implicar exámenes y práctica supervisada y tardar de uno a varios años. Si ese es su campo, empiece a averiguar en sus primeras semanas y no tras un año de rechazos. Revisión de currículum, entrevistas simuladas y charlas sectoriales son servicios habituales y gratuitos en las agencias de asentamiento.</p>

UI.es.guideProv=`<h3>⚕️ Cobertura de salud de BC (MSP + tarjeta Services Card)</h3>
<p>El plan público de salud de BC se llama MSP (Medical Services Plan). Solicite su tarjeta BC Services Card a través del <a href="https://www2.gov.bc.ca/gov/content/health/health-drug-coverage/msp/bc-residents/enrolment" target="_blank" rel="noopener">sitio web de Health Insurance BC</a>. <b>El período de espera es lo que reste del mes en que usted pasa a ser residente, más dos meses completos</b> — cerca de tres meses en el peor caso. Durante ese tiempo, las consultas y las urgencias se le facturan por completo, así que contrate un seguro médico privado <em>antes</em> de llegar para cubrir el hueco (la mayoría de las pólizas excluyen condiciones preexistentes: lea esa cláusula). Si se muda desde otra provincia canadiense, conserve su plan anterior hasta que termine la espera. El reloj arranca cuando usted <b>solicita</b>, así que solicite el primer día. Desde enero de 2020, el MSP no cobra prima mensual a los residentes inscritos.</p>
<h3>🩺 Cuando no encuentra médico de familia</h3>
<p>La escasez de médicos de familia aquí es general: muchos residentes de toda la vida tampoco tienen uno. No es que a usted lo estén tratando distinto. El paso correcto es inscribirse en el <b>Health Connect Registry</b>, la lista de espera provincial: en línea, en pocos minutos, en <a href="https://www.healthlinkbc.ca/find-care/health-connect-registry" target="_blank" rel="noopener">HealthLink BC</a>, o llamando al <b>8-1-1</b> para inscribirse en su propio idioma (más de 130 idiomas). Necesitará su Número Personal de Salud (PHN), dirección, teléfono y correo. Mientras espera, no se queda sin atención: el <b>8-1-1</b> le comunica con enfermeras, farmacéuticos y dietistas las 24 horas; un <b>Urgent and Primary Care Centre</b> atiende lo no urgente el mismo día; una <b>clínica sin cita</b> cubre dolencias corrientes; en BC los farmacéuticos comunitarios pueden recetar para una lista de afecciones menores y vacunar; y la urgencia hospitalaria o el 911 son para emergencias reales. Recuerde que puede pedir intérprete gratuito para todo esto (sección anterior).</p>
<h3>🚗 Licencia, seguro y neumáticos de invierno</h3>
<p>Las licencias de conducir de BC son administradas por ICBC. Las licencias de muchos países pueden canjearse directamente, o calificar para requisitos reducidos de examen según la experiencia — consulte la página <a href="https://www.icbc.com/driver-licensing/new-to-bc" target="_blank" rel="noopener">"New to BC" de ICBC</a> para ver si su licencia califica bajo un acuerdo recíproco. Para tomar clases localmente, vea Categoría → Autoescuela. Dos cosas en las que los residentes pierden dinero de forma rutinaria: <b>el historial de seguro</b> — sus años sin siniestros en el extranjero solo cuentan si trae una carta de historial de reclamaciones en inglés de su aseguradora anterior; sin ella le tarifan como conductor novato, la prima más cara, y esa carta es mucho más fácil de obtener antes de salir que después. Y <b>los neumáticos de invierno</b> — la mayoría de las carreteras de montaña de BC los exigen del 1 de octubre al 31 de marzo, y algunas rutas hasta el 30 de abril. Un neumático de invierno legal lleva la marca M+S o el símbolo de la montaña de tres picos con copo de nieve, y al menos 3,5 mm de dibujo. Los "all-season" no son automáticamente neumáticos de invierno; la policía revisa, hay multas, y en una ruta de montaña pueden hacerle dar la vuelta.</p>
<h3>🎒 Matrícula escolar y apoyo lingüístico</h3>
<p>{CITY} pertenece al distrito escolar {SD}. Las escuelas públicas se asignan según la dirección — use el <a href="{SD_URL}" target="_blank" rel="noopener">buscador de zona escolar de {SD}</a> para encontrar su escuela local, luego contacte a la escuela o al distrito para inscribirse. Generalmente necesitará certificado de nacimiento/pasaporte, registro de vacunación, comprobante de domicilio y sus documentos de inmigración. Tres cosas que los padres más necesitan saber: <b>1. El inglés no es requisito de admisión.</b> Las escuelas ofrecen apoyo ELL (English Language Learner): su hijo va al grado que le corresponde y recibe ayuda lingüística adicional en paralelo; no se le retrasa de grado por el idioma. <b>2. Hay trabajadores de asentamiento gratuitos dentro de las escuelas.</b> SWIS (Settlement Workers in Schools) es un servicio gratuito específico para familias residentes: explica cómo funciona el sistema escolar, ayuda con formularios y reuniones de padres, conecta con actividades y puede gestionar interpretación. <b>3. La comunicación escuela-familia es más frecuente que en muchos países.</b> Los correos, las aplicaciones escolares y las reuniones importan; si no entiende algo, diga que necesita traducción. La escuela tiene la obligación de hacerle comprensible la información sobre su hijo.</p>
<h3>🏠 Alquiler: el mínimo que le garantiza la ley</h3>
<p>El depósito de garantía está legalmente limitado a <b>medio mes de alquiler</b> (más otro medio mes de depósito por mascota, si la tiene); más allá de eso, el propietario no puede exigir depósitos adicionales. La renta solo puede subirse <b>una vez cada 12 meses</b>, exige <b>tres meses completos</b> de aviso escrito en el formulario oficial (RTB-7), y el aumento máximo permitido en 2026 es del <b>2,3 %</b> — no está obligado a pagar un aumento por encima del tope o notificado sin el aviso debido. Los plazos de aviso, y la regla de que el propietario debe avisar por escrito con 24 horas antes de entrar, los fija la <a href="https://www2.gov.bc.ca/gov/content/housing-tenancy/residential-tenancies" target="_blank" rel="noopener">Oficina de Arrendamientos Residenciales de BC (RTB)</a>; para disputas, llame al <b>1-800-665-8779</b>. Tres trampas frecuentes: <b>estafas de alquiler</b> — un anuncio en el que nunca conoce a nadie y le piden transferir un depósito porque "estoy fuera de la ciudad" es casi siempre fraude; visite la vivienda en persona, conozca al propietario o a un agente con licencia, y obtenga un contrato escrito antes de mover dinero. <b>Sin historial crediticio local</b> — ofrezca una carta de oferta de empleo, extractos bancarios, un garante, o varios meses pagados por adelantado (ojo: el alquiler pagado por adelantado no es un depósito y la ley no se lo exige). <b>Promesas verbales</b> — reparaciones, servicios incluidos, mascotas permitidas: póngalo todo por escrito en el contrato, porque lo verbal es casi imposible de probar. Haga con el propietario un informe escrito del estado de la vivienda al entrar y al salir: es la prueba más fuerte que tendrá para recuperar el depósito.</p>
<h3>⚖️ Problemas legales y cómo obtener ayuda legal</h3>
<p>Necesitar ayuda legal no siempre significa pagar un abogado — BC tiene varias opciones gratuitas o de bajo costo. <b>Legal Aid BC</b> cubre derecho de familia, defensa criminal e inmigración/refugiados para personas que califican por ingresos — línea de {CITY} <b>250-314-1900</b>, línea provincial <b>1-866-577-2525</b>, legalaid.bc.ca. {CITY} tiene una clínica legal física, la <b>Okanagan Thompson Legal Clinic</b> (220-301 Victoria St, 236-425-9121), que ofrece ayuda gratuita o de bajo costo en derecho de familia, asistencia social/beneficios por discapacidad, seguro de desempleo, deudas y disputas de arrendamiento (vea Categoría → Ayuda legal en este mapa). <b>Access Pro Bono BC</b> (604-878-7400, accessprobono.ca) ofrece asesoría legal gratuita y referencias para personas de bajos ingresos, personas mayores de 55 años, personas con discapacidad e inmigrantes/refugiados. Las demandas de menor cuantía por debajo de $5,000 y las disputas de condominios pueden resolverse en línea, sin abogado, a través del <b>Tribunal de Resolución Civil de BC (CRT)</b> (1-844-322-2292). Los salarios impagos u otras disputas laborales van a la <b>Dirección de Normas Laborales de BC</b> (1-833-236-3700).</p>
<h3>🛡️ Si sufre discriminación, acoso o trato injusto</h3>
<p>Si le tratan de forma distinta por su <b>raza, color, lugar de origen, ascendencia, religión, los prejuicios asociados a su acento, sexo, edad, discapacidad u orientación sexual</b> — en la <b>contratación y en el trabajo, al alquilar vivienda, o en cualquier servicio abierto al público</b> (tienda, restaurante, escuela, hospital, autobús) — eso es ilegal en BC, existe una vía formal de queja, y <b>no necesita abogado ni inglés fluido</b> para usarla.</p>
<p><b>Paso uno: escríbalo.</b> Ese mismo día si es posible: fecha, hora, lugar, quién estaba presente, las palabras exactas hasta donde las recuerde, y qué respondió usted. Guarde mensajes, correos, el anuncio de empleo, el anuncio del alquiler, la conversación. Una nota escrita de memoria después también sirve: cuanto antes se escriba, más peso tiene.</p>
<p><b>Paso dos: elija la vía.</b> Presente la queja ante el <b>Tribunal de Derechos Humanos de BC</b>, <b>1-888-440-8844</b>. Se puede presentar en línea, es <b>gratuito</b>, y hay un <b>plazo de un año</b> desde los hechos (más allá hace falta una justificación aparte), así que no lo deje pasar. Si duda si presentarla, o quiere ayuda para redactarla, la <b>BC Human Rights Clinic</b> ofrece asistencia legal y representación gratuitas a los denunciantes que califican. Si ocurrió en el trabajo e implica salarios, horas o despido, la <b>Dirección de Normas Laborales</b> (1-833-236-3700) puede actuar en paralelo. Si hubo discurso de odio, amenazas o violencia, eso es materia penal: llame a la policía (911 en emergencias; el número no urgente está en la sección siguiente).</p>
<p><b>Sobre "¿esto es discriminación?"</b> Muchos residentes dudan de sí mismos: que le salten en la fila, que le hablen muy despacio, que le pregunten una y otra vez de dónde es <em>realmente</em>, enviar currículums al silencio. Parte es prejuicio irreflexivo; parte es trato desigual ilegal; y la línea no siempre se ve con claridad desde dentro. Puede llamar al <b>2-1-1</b>, contarlo en su idioma y pedir que le deriven, o sentarse una vez con un trabajador de asentamiento de una agencia local de servicios para inmigrantes: han visto muchísimas versiones de esto y pueden ayudarle a juzgar si es una queja formal o una conversación con el supervisor de alguien. <b>En cualquier caso, no es algo que tenga que digerir solo.</b></p>
<h3>🎓 Para estudiantes internacionales</h3>
<p><b>Horas de trabajo:</b> con permiso de estudios válido, matriculado a tiempo completo en una institución designada (DLI) y habiendo comenzado los estudios, puede trabajar fuera del campus hasta <b>24 horas por semana</b> durante los períodos lectivos, y sin límite durante los recesos programados (verano, invierno, semana de lectura). Necesita un SIN antes del primer turno. Superar el límite incumple las condiciones del permiso y puede costarle su condición de estudiante o derivar en una orden de salida — no crea a quien diga que "unas horas de más nunca se revisan": la nómina de su empleador <em>es</em> el registro.</p>
<p><b>Seguro médico:</b> los estudiantes también deben estar asegurados aquí. Su institución normalmente le inscribe de oficio en un seguro privado (como GuardMe) los primeros meses; después usted solicita el MSP y hace el cambio cuando se lo aprueben. El hueco entre ambos es donde la gente queda sin cobertura: confirme las dos fechas en la semana de orientación. La mayoría de los campus tienen además un plan complementario dental y de salud del sindicato estudiantil, en el que se le inscribe por defecto, con una ventana corta para darse de baja.</p>
<p><b>Estatus y después de graduarse:</b> la elegibilidad para el Permiso de Trabajo Posgraduación (PGWP) depende del tipo y la duración del programa y de la institución, y las reglas han cambiado varias veces en los últimos años. Guíese por el sitio de <a href="https://www.canada.ca/en/immigration-refugees-citizenship.html" target="_blank" rel="noopener">IRCC</a> y por la información vigente de su oficina internacional, no por lo que hizo un amigo hace tres años ni por la promesa verbal de un reclutador. Prepare cualquier renovación del permiso de estudios varios meses antes de que venza.</p>
<p><b>Estudios y bienestar:</b> las aulas canadienses dan mucho peso a la participación, al trabajo en grupo y a la <b>citación de fuentes</b>. Copiar sin atribución es falta académica, y las consecuencias pueden llegar a afectar su estatus migratorio — esto difiere mucho de lo que se tolera en algunos países, así que aprenda las normas de citación de su institución en el primer semestre. La asesoría académica, el centro de escritura y el servicio de consejería suelen estar ya incluidos en su matrícula. Usarlos no es una marca en su contra.</p>
<h3>🍲 Cuando el dinero no alcanza, o algo sale mal</h3>
<p>Que el efectivo escasee los primeros meses es extremadamente común, y existe toda una red para pedir ayuda sin pasar vergüenza. Los <b>bancos de alimentos</b> entregan comida presentando una identificación por cada miembro del hogar y no filtran por situación migratoria (los datos locales están en la sección siguiente y en el mapa). El <b>2-1-1</b> es la línea canadiense de derivación a servicios comunitarios — gratuita, confidencial, disponible en más de una docena de idiomas: describa el problema y le dirán qué agencia local lo atiende, ya sea alquiler, comida, cuidado infantil, violencia familiar, salud mental o servicios para mayores. Si el problema es el alquiler mismo, pregunte al 2-1-1 o a una agencia local por un <b>Rent Bank</b> (un pequeño préstamo reembolsable para evitar el desalojo). Los residentes de bajos ingresos que califiquen pueden solicitar la <b>Asistencia de Ingresos</b> provincial. Para las facturas de servicios, llame a la empresa y pida un acuerdo de pago: esa conversación va mucho mejor antes de un corte que después. Una advertencia: usar un banco de alimentos o los servicios sociales locales es un asunto distinto de su solicitud de inmigración, pero algunas categorías de permiso sí tienen condiciones relevantes — si no está seguro, pida primero asesoría gratuita a una agencia de asentamiento o a asistencia legal, en lugar de pasar hambre por miedo.</p>
