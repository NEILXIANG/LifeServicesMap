const TASKS=[{"id":"settle","icon":"🧭","when":"first","q":{"en":"I do not know what I do not know — who can walk me through it?","fr":"Je ne sais pas ce que j’ignore — qui peut m’accompagner ?","es":"No sé lo que no sé — ¿quién puede guiarme?","zh":"我根本不知道自己漏了什么——有人能带我走一遍吗？","ko":"무엇을 모르는지조차 몰라요 — 누가 안내해 줄 수 있나요?","ja":"何が分からないのかも分からない — 誰か一緒に見てくれませんか"},"t":{"en":"Sit down with a settlement worker","fr":"Rencontrer un intervenant en établissement","es":"Reunirse con un trabajador de asentamiento","zh":"找定居服务专员当面过一遍","ko":"정착 지원 담당자와 상담하기","ja":"定住支援ワーカーに相談する"},"why":{"en":"Free, one-to-one, in many languages — this is the shortcut for everything else on this list.","fr":"Gratuit, en tête-à-tête, en plusieurs langues — le raccourci pour tout le reste de cette liste.","es":"Gratis, uno a uno, en varios idiomas — el atajo para todo lo demás de esta lista.","zh":"免费、一对一、多语言——这份清单上其他所有事，走这条路最快。","ko":"무료 일대일 상담, 여러 언어 지원 — 이 목록의 나머지 모든 일에 대한 지름길입니다.","ja":"無料の個別相談、多言語対応 — このリストの他のすべてへの近道です。"},"steps":[{"en":"Call or walk in and say you have just arrived and want help getting set up.","fr":"Téléphonez ou passez, et dites que vous venez d’arriver et cherchez de l’aide pour vous installer.","es":"Llame o pase y diga que acaba de llegar y quiere ayuda para instalarse.","zh":"打电话或直接去，说你刚到，想找人帮你把该办的都办了。","ko":"전화하거나 직접 방문해 막 도착했고 정착 도움을 받고 싶다고 말하세요.","ja":"電話または直接訪問し、「着いたばかりで、生活の立ち上げを手伝ってほしい」と伝えます。"},{"en":"Ask for an interpreter in your language if you want one — it costs you nothing.","fr":"Demandez un interprète dans votre langue si vous le souhaitez — c’est gratuit.","es":"Pida un intérprete en su idioma si lo desea — no tiene costo.","zh":"需要的话直接要求母语翻译——不收费。","ko":"원하면 모국어 통역을 요청하세요 — 비용은 없습니다.","ja":"希望すれば母語の通訳を依頼できます — 費用はかかりません。"},{"en":"Bring whatever immigration papers you have; they will tell you what is missing.","fr":"Apportez les documents d’immigration que vous avez; on vous dira ce qui manque.","es":"Lleve los papeles de inmigración que tenga; le dirán qué falta.","zh":"把手上有的移民材料都带上，他们会告诉你还缺什么。","ko":"가지고 있는 이민 서류를 모두 가져가면, 무엇이 빠졌는지 알려줍니다.","ja":"手元にある在留関係の書類を持参すれば、何が足りないか教えてくれます。"}],"cost":{"en":"Free","fr":"Gratuit","es":"Gratuito","zh":"免费","ko":"무료","ja":"無料"},"place":"2c686174","src":"","srcName":"","say":"Hi, I've just arrived in Kamloops and I'd like help getting set up. Could I speak to a settlement worker? I'd like an interpreter in my language, please.","sayGloss":{"zh":"（意思：您好，我刚到 Kamloops，想找人帮我安顿下来。能找一位定居服务专员吗？请帮我安排一位说我母语的翻译。）","fr":"(Sens : Bonjour, je viens d’arriver à Kamloops et j’aimerais de l’aide pour m’installer. Puis-je parler à un intervenant en établissement ? J’aimerais un interprète dans ma langue, s’il vous plaît.)","es":"(Significado: Hola, acabo de llegar a Kamloops y quisiera ayuda para instalarme. ¿Podría hablar con un trabajador de asentamiento? Quisiera un intérprete en mi idioma, por favor.)","ko":"(뜻: 안녕하세요, Kamloops에 막 도착했는데 정착하는 데 도움을 받고 싶습니다. 정착 지원 담당자와 이야기할 수 있을까요? 제 언어 통역을 부탁드립니다.)","ja":"（意味：こんにちは、Kamloopsに着いたばかりで、生活の立ち上げを手伝ってほしいです。定住支援ワーカーと話せますか？私の言語の通訳をお願いします。）"},"confid":{"en":"A settlement worker is not an immigration officer. They do not report your case to IRCC (the federal immigration department), and asking them for help does not affect your status.","fr":"Un intervenant en établissement n’est pas un agent d’immigration. Il ne signale pas votre dossier à IRCC (le ministère fédéral de l’immigration), et lui demander de l’aide n’a aucun effet sur votre statut.","es":"Un trabajador de asentamiento no es un agente de inmigración. No informa su caso a IRCC (el ministerio federal de inmigración), y pedirle ayuda no afecta su estatus.","zh":"定居服务专员不是移民官。他们不会把你的情况报给移民局，找他们帮忙也不会影响你的身份。","ko":"정착 지원 담당자는 이민 심사관이 아닙니다. 상담 내용을 IRCC(이민국)에 보고하지 않으며, 도움을 요청해도 신분에 영향을 주지 않습니다.","ja":"定住支援ワーカーは入国管理の職員ではありません。あなたの件をIRCCに報告することはなく、相談しても在留資格に影響しません。"}},{"id":"sin","icon":"🪪","when":"first","q":{"en":"I need to be able to work and be paid","fr":"Je dois pouvoir travailler et être payé","es":"Necesito poder trabajar y cobrar","zh":"我要能合法工作、拿到工资","ko":"합법적으로 일하고 급여를 받아야 해요","ja":"働いて給料を受け取れるようにしたい"},"t":{"en":"Get a Social Insurance Number (SIN)","fr":"Obtenir un numéro d’assurance sociale (NAS)","es":"Obtener un Número de Seguro Social (SIN)","zh":"申请工卡号（SIN）","ko":"사회보험번호(SIN) 발급","ja":"社会保険番号（SIN）を取得する"},"why":{"en":"An employer cannot put you on payroll without one. Apply as soon as you arrive.","fr":"Un employeur ne peut pas vous payer sans ce numéro. Faites la demande dès votre arrivée.","es":"Un empleador no puede pagarle sin este número. Solicítelo apenas llegue.","zh":"没有它雇主无法给你发工资。落地后尽早办。","ko":"이 번호가 없으면 고용주가 급여를 지급할 수 없습니다. 도착하면 바로 신청하세요.","ja":"この番号がないと雇用主は給与を支払えません。到着したらすぐ申請しましょう。"},"steps":[{"en":"Apply online (fastest), by mail, or in person at Service Canada by appointment.","fr":"Demande en ligne (le plus rapide), par la poste, ou en personne à Service Canada sur rendez-vous.","es":"Solicite en línea (lo más rápido), por correo o en persona en Service Canada con cita.","zh":"三种办法：网上申请（最快）、邮寄，或预约后到 Service Canada 现场办。","ko":"온라인(가장 빠름), 우편, 또는 예약 후 Service Canada 방문 중 선택하세요.","ja":"オンライン（最速）、郵送、または予約してService Canadaの窓口で申請します。"},{"en":"Applying in person: you normally get your number during the visit.","fr":"En personne : vous repartez normalement avec votre numéro le jour même.","es":"En persona: normalmente recibe su número durante la visita.","zh":"现场办理：通常当场就能拿到号码。","ko":"방문 신청 시: 보통 그 자리에서 번호를 받습니다.","ja":"窓口の場合: 通常その場で番号が発行されます。"}],"cost":{"en":"Free","fr":"Gratuit","es":"Gratuito","zh":"免费","ko":"무료","ja":"無料"},"note":{"en":"Plastic SIN cards are no longer issued — you get a number, on a letter. Never carry it in your wallet.","fr":"Les cartes NAS en plastique n’existent plus — vous recevez un numéro sur une lettre. Ne la gardez pas dans votre portefeuille.","es":"Ya no se emiten tarjetas SIN de plástico — recibe un número en una carta. No la lleve en la cartera.","zh":"现在不再发塑料卡，只给一封带号码的信。不要随身带在钱包里。","ko":"플라스틱 SIN 카드는 더 이상 발급되지 않으며, 번호가 적힌 안내문을 받습니다. 지갑에 넣고 다니지 마세요.","ja":"プラスチックのSINカードは廃止され、番号が記載された書面が届きます。財布に入れて持ち歩かないでください。"},"place":"50c8f348","src":"https://www.canada.ca/en/employment-social-development/services/sin/apply.html","srcName":"Service Canada","bring":{"en":"Bring your immigration document from IRCC — the permit, PR card or confirmation that shows your status.","fr":"Apportez votre document d’immigration d’IRCC — permis, carte RP ou confirmation de statut.","es":"Lleve su documento de inmigración de IRCC — permiso, tarjeta RP o confirmación de estatus.","zh":"带上 IRCC 出具的移民身份文件——工签/学签、枫叶卡或身份确认信。","ko":"IRCC가 발급한 이민 신분 서류(허가증, 영주권 카드, 신분 확인서)를 준비하세요.","ja":"IRCCが発行した在留資格の書類（許可証、PRカード、確認書）を持参します。"},"say":"Hi, I've just moved to Canada and I'd like to apply for a Social Insurance Number.","sayGloss":{"zh":"（意思：您好，我刚搬到加拿大，想申请社会保险号（SIN）。）","fr":"(Sens : Bonjour, je viens d’arriver au Canada et j’aimerais demander un numéro d’assurance sociale.)","es":"(Significado: Hola, acabo de mudarme a Canadá y quisiera solicitar un Número de Seguro Social.)","ko":"(뜻: 안녕하세요, 캐나다에 막 이주했는데 사회보험번호를 신청하고 싶습니다.)","ja":"（意味：こんにちは、カナダに来たばかりで、社会保険番号を申請したいです。）"}},{"id":"msp","icon":"⚕️","when":"first","q":{"en":"I need health coverage — and I might get sick before it starts","fr":"J’ai besoin d’une couverture santé — et je pourrais tomber malade avant qu’elle commence","es":"Necesito cobertura médica — y podría enfermarme antes de que empiece","zh":"我要办医保——但生效前万一生病怎么办","ko":"의료보험이 필요해요 — 개시 전에 아플 수도 있고요","ja":"医療保険が必要 — 開始前に病気になったら困る"},"t":{"en":"Apply for MSP and get a BC Services Card","fr":"Demander le MSP et obtenir la carte BC Services","es":"Solicitar MSP y obtener la BC Services Card","zh":"申请 MSP 医保并领 BC Services Card","ko":"MSP 신청 및 BC Services Card 발급","ja":"MSPに加入しBC Services Cardを受け取る"},"why":{"en":"BC’s public health insurance. There is a wait, so the day you apply matters.","fr":"L’assurance maladie publique de la C.-B. Il y a un délai : la date de votre demande compte.","es":"El seguro público de salud de BC. Hay una espera, así que el día en que solicita importa.","zh":"BC 省的公费医疗。有等待期，所以越早申请越好。","ko":"BC주의 공공 의료보험입니다. 대기 기간이 있으므로 신청 날짜가 중요합니다.","ja":"BC州の公的医療保険です。待機期間があるため、申請日が重要です。"},"steps":[{"en":"Apply the week you arrive — online takes about 15 minutes.","fr":"Faites la demande dès la semaine de votre arrivée — environ 15 minutes en ligne.","es":"Solicite la semana en que llegue — en línea toma unos 15 minutos.","zh":"落地当周就申请——网上大约 15 分钟。","ko":"도착한 주에 바로 신청하세요 — 온라인은 약 15분이면 됩니다.","ja":"到着した週に申請しましょう — オンラインなら約15分です。"},{"en":"Upload a document showing your name, date of birth and status (passport, PR card, or a permit valid 6+ months).","fr":"Téléversez un document indiquant nom, date de naissance et statut (passeport, carte RP, ou permis valide 6 mois et plus).","es":"Suba un documento con su nombre, fecha de nacimiento y estatus (pasaporte, tarjeta RP o permiso válido 6+ meses).","zh":"上传能显示姓名、出生日期和身份的证件（护照、枫叶卡，或有效期 6 个月以上的签证）。","ko":"이름·생년월일·신분이 나오는 서류(여권, 영주권 카드, 6개월 이상 유효한 허가증)를 업로드하세요.","ja":"氏名・生年月日・在留資格が分かる書類（パスポート、PRカード、6か月以上有効な許可証）をアップロードします。"},{"en":"Cover the wait with private insurance — during it you pay the full cost of any care.","fr":"Couvrez le délai avec une assurance privée — pendant cette période, vous payez la totalité des soins.","es":"Cubra la espera con seguro privado — durante ella usted paga el costo total de la atención.","zh":"等待期请自行买私人保险——这段时间看病要全额自付。","ko":"대기 기간은 사보험으로 대비하세요 — 이 기간에는 진료비를 전액 부담합니다.","ja":"待機期間は民間保険でカバーを — この間の医療費は全額自己負担です。"},{"en":"Once approved you get a Personal Health Number. Adults collect the photo card at an ICBC driver licensing office — not Service BC.","fr":"Une fois la demande approuvée, vous recevez un numéro personnel de santé. Les adultes retirent la carte avec photo dans un bureau ICBC — pas à Service BC.","es":"Al aprobarse recibe un Número Personal de Salud. Los adultos recogen la tarjeta con foto en una oficina de ICBC — no en Service BC.","zh":"批准后会拿到个人健康号（PHN）。成人的带照片卡要去 ICBC 驾照办公室领——不是 Service BC。","ko":"승인되면 개인 건강번호(PHN)를 받습니다. 성인은 사진이 있는 카드를 ICBC 운전면허 사무소에서 수령합니다 — Service BC가 아닙니다.","ja":"承認されると個人健康番号（PHN）が発行されます。成人の顔写真付きカードはICBCの運転免許事務所で受け取ります（Service BCではありません）。"}],"cost":{"en":"No fee for the card. MSP has no monthly premiums.","fr":"Aucun frais pour la carte. Le MSP n’a pas de primes mensuelles.","es":"La tarjeta no tiene costo. El MSP no cobra primas mensuales.","zh":"卡本身免费，MSP 也不再收月费。","ko":"카드 발급은 무료이며, MSP 월 보험료도 없습니다.","ja":"カードは無料で、MSPの月額保険料もありません。"},"wait":{"en":"The rest of the month you arrive, plus two more months.","fr":"Le reste du mois de votre arrivée, plus deux mois complets.","es":"El resto del mes en que llega, más dos meses completos.","zh":"到达当月的剩余时间，再加两个整月。","ko":"도착한 달의 남은 기간에 두 달을 더한 기간입니다.","ja":"到着した月の残り＋さらに2か月です。"},"help":{"en":"Health Insurance BC · 1-800-663-7100 · Mon–Fri 8:00–16:30","fr":"Health Insurance BC · 1-800-663-7100 · lun–ven 8 h–16 h 30","es":"Health Insurance BC · 1-800-663-7100 · lun–vie 8:00–16:30","zh":"Health Insurance BC · 1-800-663-7100 · 周一至周五 8:00–16:30","ko":"Health Insurance BC · 1-800-663-7100 · 월–금 8:00–16:30","ja":"Health Insurance BC · 1-800-663-7100 · 月–金 8:00–16:30"},"place":"85cdbdb6","src":"https://www2.gov.bc.ca/gov/content/health/health-drug-coverage/msp/bc-residents/eligibility-and-enrolment/apply-for-msp","srcName":"HealthLink BC / MSP","bring":{"en":"A document showing your name, date of birth and immigration status — a passport, PR card, or a permit valid for six months or more. You upload a scan or photo of it.","fr":"Un document indiquant nom, date de naissance et statut d’immigration — passeport, carte RP, ou permis valide six mois ou plus. Vous en téléversez une copie numérisée ou une photo.","es":"Un documento con su nombre, fecha de nacimiento y estatus migratorio — pasaporte, tarjeta RP o un permiso válido por seis meses o más. Suba un escaneo o una foto.","zh":"一份能显示姓名、出生日期和移民身份的文件——护照、枫叶卡，或有效期六个月以上的签证。上传扫描件或照片即可。","ko":"이름·생년월일·이민 신분이 나오는 서류 — 여권, 영주권 카드, 또는 6개월 이상 유효한 허가증. 스캔본이나 사진을 업로드합니다.","ja":"氏名・生年月日・在留資格が分かる書類 — パスポート、PRカード、または6か月以上有効な許可証。スキャンまたは写真をアップロードします。"},"deadline":{"en":"Apply now","fr":"À faire maintenant","es":"Solicite ya","zh":"越早越好","ko":"지금 신청","ja":"今すぐ申請"}},{"id":"licence","icon":"🚗","when":"first","q":{"en":"I want to drive here — and I heard there is a deadline","fr":"Je veux conduire ici — et il paraît qu’il y a un délai","es":"Quiero conducir aquí — y escuché que hay un plazo","zh":"我想在这里开车——听说有时间限制","ko":"여기서 운전하고 싶어요 — 기한이 있다고 들었어요","ja":"ここで運転したい — 期限があると聞きました"},"t":{"en":"Switch to a BC driver’s licence","fr":"Passer au permis de conduire de la C.-B.","es":"Cambiar a una licencia de conducir de BC","zh":"换成 BC 省驾照","ko":"BC 운전면허로 교환","ja":"BC州の運転免許に切り替える"},"why":{"en":"You have 90 days from arriving before you need a BC licence.","fr":"Vous avez 90 jours après votre arrivée avant d’avoir besoin d’un permis de la C.-B.","es":"Tiene 90 días desde su llegada antes de necesitar una licencia de BC.","zh":"落地后 90 天内必须换成 BC 驾照。","ko":"도착일로부터 90일 안에 BC 면허가 필요합니다.","ja":"到着から90日以内にBC州の免許が必要になります。"},"steps":[{"en":"Go to an ICBC driver licensing office — no appointment needed for most visits.","fr":"Rendez-vous dans un bureau de permis ICBC (l’assureur public qui gère aussi les permis) — la plupart des visites ne nécessitent pas de rendez-vous.","es":"Vaya a una oficina de ICBC (la aseguradora pública que también emite licencias) — la mayoría de las visitas no requieren cita.","zh":"直接去 ICBC 驾照办公室——多数业务不用预约。","ko":"ICBC(BC주 공영 보험사, 운전면허도 담당) 운전면허 사무소로 가세요 — 대부분 예약 없이 가능합니다.","ja":"ICBCの運転免許事務所へ — 多くの手続きは予約不要です。"},{"en":"Some countries exchange straight across; others require a knowledge and road test. The knowledge test is offered in 12 languages.","fr":"Certains pays permettent un échange direct; d’autres exigent un examen théorique et pratique. L’examen théorique existe en 12 langues.","es":"Algunos países permiten el canje directo; otros exigen examen teórico y práctico. El teórico está en 12 idiomas.","zh":"部分国家可直接互换；其他国家需要考笔试和路考。笔试提供 12 种语言。","ko":"일부 국가는 그대로 교환되고, 그 외에는 필기·도로주행 시험이 필요합니다. 필기시험은 12개 언어로 제공됩니다.","ja":"国によっては無試験で交換でき、それ以外は筆記試験と路上試験が必要です。筆記試験は12言語で受けられます。"},{"en":"If your licence is not in English, have it translated first — an untranslated one puts the application on hold.","fr":"Si votre permis n’est pas en anglais, faites-le traduire d’abord — sinon la demande est suspendue.","es":"Si su licencia no está en inglés, tradúzcala antes — sin traducción la solicitud queda en espera.","zh":"驾照不是英文的，先做翻译——没翻译申请会被搁置。","ko":"면허증이 영어가 아니면 먼저 번역하세요 — 번역이 없으면 신청이 보류됩니다.","ja":"免許証が英語でない場合は先に翻訳を — 未翻訳だと申請は保留になります。"}],"note":{"en":"Fewer than two years of non-learner driving experience puts you in the Graduated Licensing Program.","fr":"Moins de deux ans d’expérience de conduite (hors apprenti) vous place dans le programme d’accès graduel.","es":"Menos de dos años de experiencia (sin ser aprendiz) lo coloca en el Programa de Licencias Graduadas.","zh":"非实习驾龄不满两年的，会被并入 Graduated Licensing 阶梯式发照。","ko":"초보 단계를 제외한 운전 경력이 2년 미만이면 단계별 면허 제도(GLP)에 편입됩니다.","ja":"仮免を除く運転経験が2年未満の場合、段階的免許制度（GLP）の対象になります。"},"place":"867acd77","src":"https://icbc.com/driver-licensing/moving-bc/moving-from-another-country","srcName":"ICBC","bring":{"en":"Bring your Canadian immigration document as primary ID, plus a second piece of ID, and every licence you hold — you must surrender them.","fr":"Apportez votre document d’immigration canadien comme pièce principale, une deuxième pièce d’identité, et tous vos permis — vous devez les remettre.","es":"Lleve su documento de inmigración canadiense como identificación principal, una segunda identificación y todas sus licencias — debe entregarlas.","zh":"主证件带加拿大移民身份文件，再加一份第二证件，以及你持有的所有驾照——都要上交。","ko":"주 신분증으로 캐나다 이민 서류, 추가 신분증 1종, 그리고 보유한 모든 운전면허증을 가져가 반납해야 합니다.","ja":"主たる身分証としてカナダの在留資格書類、補助身分証1点、保有するすべての免許証（返納が必要）を持参します。"},"deadline":{"en":"90 days","fr":"90 jours","es":"90 días","zh":"90 天内","ko":"90일 이내","ja":"90日以内"},"say":"Hi, I've just moved to BC and I need to exchange my driver's licence. Which documents do you need?","sayGloss":{"zh":"（意思：您好，我刚搬到 BC 省，需要换领驾照。你们需要哪些文件？）","fr":"(Sens : Bonjour, je viens d’arriver en C.-B. et je dois échanger mon permis de conduire. Quels documents vous faut-il ?)","es":"(Significado: Hola, acabo de mudarme a BC y necesito canjear mi licencia de conducir. ¿Qué documentos necesitan?)","ko":"(뜻: 안녕하세요, BC주에 막 이주했는데 운전면허를 교환해야 합니다. 어떤 서류가 필요한가요?)","ja":"（意味：こんにちは、BC州に来たばかりで、運転免許を切り替える必要があります。どの書類が必要ですか？）"}},{"id":"bank","icon":"🏦","when":"first","q":{"en":"I need a bank account, but I have no job here yet","fr":"J’ai besoin d’un compte bancaire, mais je n’ai pas encore d’emploi ici","es":"Necesito una cuenta bancaria, pero aún no tengo trabajo aquí","zh":"我要开银行账户，但还没找到工作","ko":"은행 계좌가 필요한데 아직 직장이 없어요","ja":"銀行口座が必要だが、まだ仕事がない"},"t":{"en":"Open a bank account","fr":"Ouvrir un compte bancaire","es":"Abrir una cuenta bancaria","zh":"开一个银行账户","ko":"은행 계좌 개설","ja":"銀行口座を開く"},"why":{"en":"You have the right to open one. A bank may not refuse you for having no job, no money to deposit, or a past bankruptcy.","fr":"Vous avez le droit d’en ouvrir un. Une banque ne peut pas refuser parce que vous n’avez ni emploi, ni argent à déposer, ni à cause d’une faillite passée.","es":"Tiene derecho a abrir una. Un banco no puede negársela por no tener empleo, dinero para depositar o una quiebra previa.","zh":"开户是你的法定权利。银行不能因为你没工作、没钱存、或曾经破产就拒绝你。","ko":"계좌 개설은 법적 권리입니다. 직장이 없다, 넣을 돈이 없다, 과거에 파산했다는 이유로 은행이 거절할 수 없습니다.","ja":"口座開設は法律上の権利です。仕事がない、預ける資金がない、過去に破産した——これらを理由に断ることはできません。"},"steps":[{"en":"Walk into any branch and say you want to open a personal chequing account.","fr":"Présentez-vous dans une succursale et dites que vous voulez ouvrir un compte chèques personnel.","es":"Vaya a cualquier sucursal y diga que quiere abrir una cuenta de cheques (chequing) personal.","zh":"走进任意一家网点，说你要开个人支票账户（chequing account）。","ko":"아무 지점에나 가서 개인 당좌예금(chequing) 계좌를 개설하고 싶다고 말하세요.","ja":"最寄りの支店で、個人向け当座預金（chequing）口座を開きたいと伝えます。"},{"en":"Show two original pieces of ID — photocopies are not accepted.","fr":"Présentez deux pièces d’identité originales — les photocopies ne sont pas acceptées.","es":"Muestre dos identificaciones originales — no se aceptan fotocopias.","zh":"出示两份证件原件——复印件不行。","ko":"신분증 원본 2종을 제시하세요 — 사본은 받지 않습니다.","ja":"身分証の原本を2点提示します — コピーは不可です。"},{"en":"Ask what the monthly fee is, and whether a no-fee or newcomer account is available before you sign.","fr":"Demandez les frais mensuels et s’il existe un compte sans frais ou pour nouveaux arrivants avant de signer.","es":"Pregunte la cuota mensual y si hay una cuenta sin cuota o para recién llegados antes de firmar.","zh":"签字前先问清月费，以及有没有免月费或新移民专用账户。","ko":"서명 전에 월 수수료와, 수수료 없는 계좌나 신규 이민자 전용 계좌가 있는지 물어보세요.","ja":"署名の前に月額手数料と、手数料無料や新規移住者向けの口座があるかを確認しましょう。"}],"bring":{"en":"Two pieces of ID: one showing your name and address, one showing your name and date of birth — a foreign passport counts, as do Canadian government ID, a utility bill, or a bank statement. Or one piece plus someone in good standing with the bank who can vouch for you.","fr":"Deux pièces : une avec nom et adresse, une avec nom et date de naissance — un passeport étranger compte, tout comme une pièce d’identité canadienne, une facture de services publics ou un relevé bancaire. Ou une pièce plus une personne en règle avec la banque qui se porte garante.","es":"Dos documentos: uno con nombre y dirección, otro con nombre y fecha de nacimiento — sirve un pasaporte extranjero, una identificación canadiense, una factura de servicios o un estado de cuenta. O uno más alguien en regla con el banco que responda por usted.","zh":"两份证件：一份显示姓名和地址，一份显示姓名和出生日期——外国护照可以，加拿大政府证件、水电账单、银行对账单也可以。或者一份证件加一位该银行认可的人为你担保。","ko":"신분증 2종: 하나는 이름과 주소, 다른 하나는 이름과 생년월일이 나오는 것 — 외국 여권도 되고, 캐나다 정부 발급 신분증, 공과금 고지서, 은행 명세서도 가능합니다. 또는 1종 + 은행이 인정하는 보증인.","ja":"身分証2点: 1点は氏名と住所、もう1点は氏名と生年月日が分かるもの — 外国のパスポート、カナダ政府発行の身分証、公共料金の請求書、銀行の明細書などが使えます。または1点＋銀行が認める保証人。"},"note":{"en":"A bank can still refuse for fraud reasons or if you will not let them verify your ID — but not for being new or broke.","fr":"Une banque peut refuser pour des motifs de fraude ou si vous refusez la vérification d’identité — mais pas parce que vous venez d’arriver ou n’avez pas d’argent.","es":"Un banco sí puede negarse por motivos de fraude o si usted no permite verificar su identidad — pero no por acabar de llegar o no tener dinero.","zh":"银行仍可以因涉嫌欺诈、或你不配合核验身份而拒绝——但不能因为你是新来的或没钱。","ko":"사기 우려가 있거나 신분 확인을 거부하는 경우에는 거절할 수 있지만, 새로 왔다거나 돈이 없다는 이유로는 안 됩니다.","ja":"詐欺の疑いや本人確認を拒む場合は断られることがありますが、来たばかり・お金がないことを理由にはできません。"},"place":"e7514fcc","src":"https://www.canada.ca/en/financial-consumer-agency/services/banking/opening-bank-account.html","srcName":"Financial Consumer Agency of Canada","say":"Hi, I've just moved here and I'd like to open a personal chequing account. What ID do you need from me?","sayGloss":{"zh":"（意思：您好，我刚搬来这里，想开一个个人支票账户。你们需要我提供什么证件？）","fr":"(Sens : Bonjour, je viens d’arriver ici et j’aimerais ouvrir un compte-chèques personnel. Quelles pièces d’identité vous faut-il ?)","es":"(Significado: Hola, acabo de mudarme aquí y quisiera abrir una cuenta de cheques personal. ¿Qué identificación necesitan?)","ko":"(뜻: 안녕하세요, 여기로 막 이사 왔는데 개인 체킹 계좌를 열고 싶습니다. 어떤 신분증이 필요한가요?)","ja":"（意味：こんにちは、ここに引っ越してきたばかりで、個人のチェッキング口座を開きたいです。どの身分証が必要ですか？）"}},{"id":"school","icon":"🎒","when":"first","q":{"en":"I need to get my child into school","fr":"Je dois inscrire mon enfant à l’école","es":"Necesito inscribir a mi hijo en la escuela","zh":"我要给孩子办入学","ko":"아이를 학교에 입학시켜야 해요","ja":"子どもを学校に入れたい"},"t":{"en":"Register a child for school (SD73)","fr":"Inscrire un enfant à l’école (SD73)","es":"Inscribir a un niño en la escuela (SD73)","zh":"给孩子在 SD73 登记入学","ko":"SD73에 자녀 학교 등록","ja":"SD73で子どもの就学手続き"},"why":{"en":"Which school your child attends is decided by your home address, not by choice.","fr":"L’école de votre enfant est déterminée par votre adresse, non par choix.","es":"La escuela de su hijo la determina su domicilio, no su elección.","zh":"孩子上哪所学校由你家住址决定，不是想选哪所就哪所。","ko":"자녀가 다닐 학교는 선택이 아니라 거주지 주소로 정해집니다.","ja":"通う学校は選択ではなく、自宅の住所で決まります。"},"steps":[{"en":"Find your catchment school first, from your home address, using the district’s School Locator.","fr":"Trouvez d’abord votre école de secteur à partir de votre adresse, avec le School Locator du district.","es":"Primero encuentre su escuela de zona según su domicilio, con el School Locator del distrito.","zh":"先用学区的 School Locator，按你家地址查出对口学校。","ko":"먼저 학군의 School Locator로 집 주소에 해당하는 배정 학교를 확인하세요.","ja":"まず学区のSchool Locatorで、自宅住所に対応する学校を調べます。"},{"en":"Fill in the Student Enrolment Form.","fr":"Remplissez le formulaire d’inscription de l’élève (Student Enrolment Form).","es":"Complete el Student Enrolment Form.","zh":"填写 Student Enrolment Form 学生入学表。","ko":"Student Enrolment Form(학생 등록 서식)을 작성합니다.","ja":"Student Enrolment Form（就学登録用紙）に記入します。"},{"en":"Take or mail it to that school — registration happens at the school, not online.","fr":"Apportez-le ou postez-le à cette école — l’inscription se fait à l’école, pas en ligne.","es":"Llévelo o envíelo por correo a esa escuela — la inscripción se hace en la escuela, no en línea.","zh":"把表交到那所学校（可邮寄）——入学登记在学校办，不是网上办。","ko":"해당 학교에 제출하거나 우편으로 보냅니다 — 등록은 온라인이 아니라 학교에서 합니다.","ja":"その学校へ持参または郵送します — 手続きはオンラインではなく学校で行います。"}],"bring":{"en":"Your child’s birth certificate, their BC Services Card, proof of your address, and a custody agreement if one applies.","fr":"Le certificat de naissance de l’enfant, sa carte BC Services, une preuve d’adresse, et l’entente de garde s’il y a lieu.","es":"El certificado de nacimiento del niño, su BC Services Card, comprobante de domicilio y el acuerdo de custodia si corresponde.","zh":"孩子的出生证明、孩子的 BC Services Card、你的住址证明，如有监护协议也要带。","ko":"자녀의 출생증명서, 자녀의 BC Services Card, 주소 증명, 해당되면 양육권 합의서.","ja":"子どもの出生証明書、子どものBC Services Card、住所証明、該当する場合は親権に関する取り決め。"},"help":{"en":"SD73 School Board Office · 250-374-0679","fr":"Bureau du conseil scolaire SD73 · 250-374-0679","es":"Oficina del distrito escolar SD73 · 250-374-0679","zh":"SD73 学区办公室 · 250-374-0679","ko":"SD73 교육청 사무실 · 250-374-0679","ja":"SD73教育委員会事務局 · 250-374-0679"},"note":{"en":"If your child is still learning English, say so when you register — the district has language support, and asking early is what gets it started. Kindergarten registration for the coming September opens the first week of February; a child who is not a citizen also needs their immigration document.","fr":"Si votre enfant apprend encore l’anglais, dites-le à l’inscription — le district offre du soutien linguistique, et le demander tôt le déclenche. L’inscription à la maternelle pour la rentrée de septembre ouvre la première semaine de février; un enfant qui n’est pas citoyen doit aussi présenter son document d’immigration.","es":"Si su hijo aún aprende inglés, dígalo al inscribirse — el distrito ofrece apoyo lingüístico y pedirlo pronto lo activa. La inscripción a kínder para el próximo septiembre abre la primera semana de febrero; un niño que no es ciudadano también necesita su documento de inmigración.","zh":"孩子英语还不熟，登记时就说明——学区有语言支持，早提早安排。下一个九月入学的幼儿园（Kindergarten）登记从二月第一周开始；非公民的孩子还需要带移民身份文件。","ko":"자녀가 아직 영어를 배우는 중이라면 등록할 때 말하세요 — 학군에 언어 지원이 있고, 일찍 요청해야 시작됩니다. 다음 9월 입학 유치원(Kindergarten) 등록은 2월 첫째 주에 시작됩니다. 시민권자가 아닌 아이는 이민 신분 서류도 필요합니다.","ja":"子どもがまだ英語を学習中なら登録時に伝えてください — 学区に言語支援があり、早く伝えるほど早く始まります。翌9月入学のキンダーガーテン登録は2月第1週に始まります。市民権のない子どもは在留資格の書類も必要です。"},"src":"https://www.sd73.bc.ca/en/our-district-board/register-for-school.aspx","srcName":"SD73","say":"Hi, I've just moved into this catchment and I'd like to register my child. My child is still learning English.","sayGloss":{"zh":"（意思：您好，我刚搬进这个学区片区，想给孩子登记入学。孩子的英语还在学习中。）","fr":"(Sens : Bonjour, je viens d’emménager dans ce secteur scolaire et j’aimerais inscrire mon enfant. Mon enfant apprend encore l’anglais.)","es":"(Significado: Hola, acabo de mudarme a esta zona escolar y quisiera inscribir a mi hijo/a. Mi hijo/a todavía está aprendiendo inglés.)","ko":"(뜻: 안녕하세요, 이 학군으로 막 이사 왔는데 아이를 등록하고 싶습니다. 아이는 아직 영어를 배우는 중입니다.)","ja":"（意味：こんにちは、この学区に引っ越してきたばかりで、子どもを登録したいです。子どもはまだ英語を学習中です。）"}},{"id":"tax","icon":"🧾","when":"ongoing","q":{"en":"I earned little or nothing — do I still have to file taxes?","fr":"J’ai gagné peu ou rien — dois-je quand même déclarer mes impôts ?","es":"Gané poco o nada — ¿aun así debo declarar impuestos?","zh":"我收入很少甚至没有收入，还要报税吗？","ko":"소득이 거의 없는데도 세금 신고를 해야 하나요?","ja":"収入がほとんどないが、確定申告は必要？"},"t":{"en":"File a tax return — especially on a low income","fr":"Produire une déclaration — surtout à faible revenu","es":"Presentar la declaración — sobre todo con bajos ingresos","zh":"即使收入低也要报税","ko":"소득이 적어도 세금 신고하기","ja":"低収入でも確定申告する"},"why":{"en":"Filing is how the benefit payments start. No return, no payments — even if you owe no tax.","fr":"C’est la déclaration qui déclenche les prestations. Pas de déclaration, pas de versements — même sans impôt à payer.","es":"La declaración es lo que activa los pagos de beneficios. Sin declaración, no hay pagos — aunque no deba impuestos.","zh":"福利金是靠报税才发得下来的。不报就不发——哪怕你一分税都不用交。","ko":"수당 지급은 세금 신고를 해야 시작됩니다. 신고하지 않으면 낼 세금이 없어도 지급되지 않습니다.","ja":"給付金は申告して初めて支給が始まります。納税額がゼロでも、申告しなければ支給されません。"},"steps":[{"en":"File once a year, by April 30 (June 15 if self-employed, but any tax owed is still due April 30).","fr":"Déclarez une fois par an, au plus tard le 30 avril (15 juin si travailleur autonome, mais l’impôt dû reste exigible le 30 avril).","es":"Declare una vez al año, antes del 30 de abril (15 de junio si trabaja por cuenta propia, pero el impuesto adeudado vence el 30 de abril).","zh":"每年报一次，截止 4 月 30 日（自雇是 6 月 15 日，但欠的税仍须 4 月 30 日前缴清）。","ko":"연 1회, 4월 30일까지 신고합니다(자영업자는 6월 15일이지만 납부할 세금은 4월 30일까지).","ja":"年1回、4月30日までに申告します（自営業は6月15日ですが、納税額は4月30日までに納付）。"},{"en":"Keep filing every year — the payments stop if you skip one.","fr":"Déclarez chaque année — les versements s’arrêtent si vous en sautez une.","es":"Declare todos los años — los pagos se detienen si se salta uno.","zh":"每年都要报——漏一年，福利金就停。","ko":"매년 신고하세요 — 한 해라도 거르면 지급이 중단됩니다.","ja":"毎年申告してください — 1年でも抜けると支給が止まります。"},{"en":"On a modest income with a simple return, a free community tax clinic will do it for you.","fr":"Avec un revenu modeste et une déclaration simple, une clinique d’impôts communautaire gratuite la fera pour vous.","es":"Con ingresos modestos y una declaración simple, una clínica comunitaria gratuita la hace por usted.","zh":"收入不高、情况简单的，可以去免费社区报税站，他们帮你报。","ko":"소득이 많지 않고 신고가 단순하면 무료 커뮤니티 세무 클리닉에서 대신 해 줍니다.","ja":"収入が少なく申告が簡単な場合は、無料のコミュニティ税務クリニックが代行してくれます。"}],"note":{"en":"Filing is what starts the Canada Child Benefit (monthly, if you have children) and the Canada Groceries and Essentials Benefit (every three months).","fr":"C’est la déclaration qui déclenche l’Allocation canadienne pour enfants (mensuelle, si vous avez des enfants) et la Prestation canadienne pour l’épicerie et les produits essentiels (trimestrielle).","es":"La declaración activa el beneficio por hijos (Canada Child Benefit, mensual, si tiene hijos) y el beneficio para alimentos y esenciales (Canada Groceries and Essentials Benefit, cada tres meses).","zh":"报税才会启动“儿童福利金”（有孩子的话按月发）和“食品与必需品补贴”（每三个月一次）。","ko":"신고를 해야 캐나다 아동수당(자녀가 있으면 매월)과 식료품·생필품 수당(3개월마다)이 시작됩니다.","ja":"申告により、児童手当（子どもがいる場合は毎月）と食料・生活必需品給付（3か月ごと）が始まります。"},"src":"https://www.canada.ca/en/revenue-agency/news/newsroom/tax-tips/tax-tips-2026/tax-tip-taxes-made-simple-newcomers-canada.html","srcName":"Canada Revenue Agency","deadline":{"en":"April 30","fr":"30 avril","es":"30 de abril","zh":"4月30日","ko":"4월 30일","ja":"4月30日"}},{"id":"connect","icon":"🤝","when":"ongoing","q":{"en":"I do not know anyone here","fr":"Je ne connais personne ici","es":"No conozco a nadie aquí","zh":"我在这里一个人都不认识","ko":"여기서 아는 사람이 한 명도 없어요","ja":"ここに知り合いが一人もいない"},"t":{"en":"Meet people in this city","fr":"Rencontrer des gens dans cette ville","es":"Conocer gente en esta ciudad","zh":"在这座城市认识人","ko":"이 도시에서 사람 만나기","ja":"この街で人と出会う"},"why":{"en":"Paperwork gets you settled; people are what make a place home. This is the part nobody hands you, so it has to be done on purpose.","fr":"Les démarches vous installent; ce sont les gens qui font d’un lieu un chez-soi. Personne ne vous l’offre : il faut s’y mettre volontairement.","es":"Los trámites lo instalan; las personas hacen que un lugar sea un hogar. Esto nadie se lo da: hay que hacerlo a propósito.","zh":"手续办完只是安顿下来；真正让一个地方变成家的是人。这部分没有人会主动递给你，得自己有意识地去做。","ko":"서류는 정착을 도와주지만, 그곳을 집으로 만드는 것은 사람입니다. 이것만은 아무도 대신 해주지 않으니 의식적으로 해야 합니다.","ja":"手続きは生活を整えるだけ。その土地を「わが家」にするのは人です。これだけは誰も差し出してくれないので、意識してやる必要があります。"},"steps":[{"en":"Volunteer. It is the most reliable way to meet people when you know nobody — and it is where Canadian references and local work history start.","fr":"Faites du bénévolat. C’est le moyen le plus fiable de rencontrer des gens quand on ne connaît personne — et c’est là que commencent les références canadiennes.","es":"Haga voluntariado. Es la forma más fiable de conocer gente cuando no conoce a nadie — y ahí empiezan las referencias canadienses.","zh":"去做义工。谁都不认识的时候，这是最靠得住的认识人的路——加拿大的推荐人和本地工作经历，也往往从这里开始。","ko":"자원봉사를 하세요. 아는 사람이 없을 때 사람을 만나는 가장 확실한 방법이며, 캐나다에서의 추천인과 경력도 여기서 시작됩니다.","ja":"ボランティアを。知り合いがいないときに人と出会う最も確実な方法で、カナダでの推薦者や職歴もここから始まります。"},{"en":"Use the library. Free programs, free wifi, free meeting rooms, and staff who will point you at what is on — no membership fee, no purchase.","fr":"Fréquentez la bibliothèque. Programmes gratuits, wifi, salles de réunion, et du personnel qui vous orientera — sans frais ni achat.","es":"Use la biblioteca. Programas gratis, wifi, salas de reunión y personal que le indicará qué hay — sin cuota ni compra.","zh":"常去图书馆。免费活动、免费网络、免费会议室，工作人员会告诉你近期有什么——不收会费，也不用消费。","ko":"도서관을 이용하세요. 무료 프로그램, 무료 와이파이, 무료 회의실, 그리고 무엇이 열리는지 알려주는 직원이 있습니다.","ja":"図書館を使いましょう。無料のプログラム、無料Wi-Fi、無料の会議室、そして今どんな催しがあるか教えてくれる職員がいます。"},{"en":"Ask your settlement worker what groups are running — many run newcomer social groups, conversation circles and language exchanges themselves.","fr":"Demandez à votre intervenant en établissement quels groupes existent — beaucoup animent des groupes sociaux, cercles de conversation et échanges linguistiques.","es":"Pregunte a su trabajador de asentamiento qué grupos hay — muchos organizan grupos sociales, círculos de conversación e intercambios de idiomas.","zh":"问问定居服务专员现在有哪些小组——他们自己往往就办新移民社交小组、英语角和语言交换。","ko":"정착 지원 담당자에게 어떤 모임이 있는지 물어보세요 — 신규 이민자 모임, 회화 모임, 언어 교환을 직접 운영하는 곳이 많습니다.","ja":"定住支援ワーカーにどんな集まりがあるか聞いてみましょう。新規移住者の交流会や会話サークル、言語交換を自ら運営していることが多いです。"},{"en":"Go back to the same place weekly. Familiarity, not charm, is what turns strangers into acquaintances.","fr":"Retournez au même endroit chaque semaine. C’est la familiarité, pas le charme, qui transforme des inconnus en connaissances.","es":"Vuelva al mismo lugar cada semana. Es la familiaridad, no la simpatía, lo que convierte a extraños en conocidos.","zh":"每周去同一个地方。把陌生人变成熟人的是“反复见面”，不是会不会社交。","ko":"매주 같은 곳에 가세요. 낯선 사람을 아는 사람으로 바꾸는 것은 사교성이 아니라 반복된 마주침입니다.","ja":"毎週同じ場所に通いましょう。他人を知人に変えるのは社交性ではなく、繰り返し顔を合わせることです。"}],"note":{"en":"This one has no deadline and no office, which is exactly why it gets skipped. Put one thing in your week.","fr":"Celle-ci n’a ni délai ni bureau — c’est précisément pourquoi on la remet. Mettez une chose dans votre semaine.","es":"Esta no tiene plazo ni oficina, y por eso justamente se posterga. Ponga una cosa en su semana.","zh":"这件事没有期限、也没有办事窗口，所以最容易被一直往后拖。给自己每周安排一件就够。","ko":"이 일은 기한도 창구도 없어서 가장 미루기 쉽습니다. 일주일에 하나만 정해 두세요.","ja":"これは期限も窓口もないため、いちばん後回しにされます。週に一つだけ予定に入れましょう。"},"place":"507845f0","src":"https://volunteerkamloops.org/","srcName":"Volunteer Kamloops"},{"id":"eldercare","icon":"🧓","when":"ongoing","place":"8cc8a65f","src":"https://interiorcommunityservices.bc.ca/","srcName":"Interior Community Services","q":{"en":"My parent is getting older and needs help at home","fr":"Mon parent vieillit et a besoin d’aide à la maison","es":"Mi padre o madre envejece y necesita ayuda en casa","zh":"父母年纪大了，在家需要人帮忙","ko":"부모님이 연로하셔서 집에서 도움이 필요해요","ja":"親が年をとって、家で手助けが必要になった"},"t":{"en":"Get help caring for an older relative","fr":"Obtenir de l’aide pour un proche âgé","es":"Conseguir ayuda para cuidar a un familiar mayor","zh":"为年长家人找到照护帮助","ko":"연로한 가족 돌봄 도움 받기","ja":"高齢の家族の介護に助けを得る"},"why":{"en":"This one is for people who have lived here for years as much as for anyone new. Most of the help is free or subsidised, and almost nobody knows it exists until they need it.","fr":"Cette fiche s’adresse autant à ceux qui vivent ici depuis des années qu’aux nouveaux. La plupart de l’aide est gratuite ou subventionnée, et presque personne ne la connaît avant d’en avoir besoin.","es":"Esta ficha es tanto para quien lleva años aquí como para quien acaba de llegar. La mayor parte de la ayuda es gratuita o subvencionada, y casi nadie sabe que existe hasta que la necesita.","zh":"这张卡对住了很多年的人和刚来的人一样有用。大部分帮助是免费或有补贴的，而几乎没有人在需要之前知道它们存在。","ko":"이 카드는 오래 산 사람에게도 새로 온 사람에게도 똑같이 필요합니다. 대부분의 지원은 무료이거나 보조를 받으며, 필요해지기 전까지는 거의 아무도 그 존재를 모릅니다.","ja":"このカードは、長く住んでいる人にも新しく来た人にも同じように役立ちます。支援の大半は無料か補助付きで、必要になるまでほとんど誰も知りません。"},"steps":[{"en":"Call 8-1-1 (HealthLink BC, 24 hours, interpreters) and describe what your relative can no longer manage. They will tell you whether to start with the family doctor or with home and community care.","fr":"Appelez le 8-1-1 (HealthLink BC, 24 h, interprètes) et décrivez ce que votre proche n’arrive plus à faire. On vous dira s’il faut commencer par le médecin de famille ou par les soins à domicile.","es":"Llame al 8-1-1 (HealthLink BC, 24 horas, con intérpretes) y describa lo que su familiar ya no puede hacer. Le dirán si empezar por el médico de familia o por la atención domiciliaria.","zh":"打 8-1-1（HealthLink BC，24 小时，有翻译），说清楚家人现在哪些事做不了了。他们会告诉你先找家庭医生，还是先找居家与社区照护。","ko":"8-1-1(HealthLink BC, 24시간, 통역 가능)에 전화해 가족이 더 이상 할 수 없게 된 일을 설명하세요. 가정의부터 갈지, 재가·지역사회 돌봄부터 갈지 알려줍니다.","ja":"8-1-1（HealthLink BC、24時間、通訳あり）に電話し、家族ができなくなったことを説明します。家庭医から始めるか、在宅・地域ケアから始めるかを教えてくれます。"},{"en":"Ask Interior Health's Home and Community Care for an assessment. It is free, and it is the door to subsidised home support, adult day programmes and, later, assisted living.","fr":"Demandez une évaluation aux Soins à domicile et communautaires d’Interior Health. C’est gratuit, et c’est la porte d’entrée du soutien à domicile subventionné, des programmes de jour et, plus tard, de la résidence assistée.","es":"Pida una evaluación a Home and Community Care de Interior Health. Es gratuita y es la puerta al apoyo domiciliario subvencionado, los programas de día y, más adelante, la vivienda asistida.","zh":"向 Interior Health 的居家与社区照护（Home and Community Care）申请评估。评估免费，也是进入有补贴的居家支持、成人日间项目、以及以后的辅助生活设施的入口。","ko":"Interior Health의 재가·지역사회 돌봄(Home and Community Care)에 평가를 요청하세요. 무료이며, 보조가 있는 재가 지원, 성인 주간 프로그램, 나중의 보조 생활시설로 가는 입구입니다.","ja":"Interior HealthのHome and Community Careに評価を申し込みます。無料で、補助付きの在宅支援、成人向けデイプログラム、その先の介護付き住宅への入口です。"},{"en":"For the everyday things — a ride to an appointment, groceries, light housekeeping, a friendly visit — Better at Home runs through Interior Community Services. Volunteers do it, and the fee is on a sliding scale down to nothing.","fr":"Pour le quotidien — un trajet vers un rendez-vous, l’épicerie, un peu de ménage, une visite amicale — Better at Home passe par Interior Community Services. Ce sont des bénévoles, et le tarif est dégressif jusqu’à zéro.","es":"Para lo cotidiano — llevar a una cita, la compra, limpieza ligera, una visita — Better at Home funciona a través de Interior Community Services. Lo hacen voluntarios y la tarifa es escalonada hasta cero.","zh":"日常的事——送去看病、买菜、简单家务、上门聊天——走 Interior Community Services 的 Better at Home 项目。由志愿者做，费用按收入递减，可以到零。","ko":"일상적인 일 — 진료 동행, 장보기, 가벼운 집안일, 말벗 방문 — 은 Interior Community Services의 Better at Home을 통합니다. 자원봉사자가 하며, 비용은 소득에 따라 0까지 내려갑니다.","ja":"日々のこと — 受診の送迎、買い物、軽い家事、話し相手の訪問 — はInterior Community ServicesのBetter at Homeが担います。ボランティアが行い、料金は所得に応じてゼロまで下がります。"},{"en":"If you are the one doing the caring, say so at each of these calls. Caregiver respite and support groups exist, and you are entitled to them.","fr":"Si c’est vous qui prenez soin, dites-le à chaque appel. Le répit et les groupes de soutien pour proches aidants existent, et vous y avez droit.","es":"Si es usted quien cuida, dígalo en cada llamada. Existen el respiro y los grupos de apoyo para cuidadores, y tiene derecho a ellos.","zh":"如果照顾的人是你自己，每次打电话都说一声。照护者的喘息服务和互助小组是存在的，而且你有权使用。","ko":"돌보는 사람이 본인이라면 전화할 때마다 말하세요. 돌봄 제공자를 위한 휴식 서비스와 지원 모임이 있고, 이용할 권리가 있습니다.","ja":"介護しているのがあなた自身なら、電話のたびにそう伝えてください。介護者のためのレスパイトや支援グループがあり、利用する権利があります。"}],"cost":{"en":"Assessment free. Home support and Better at Home charge on a sliding scale by income; many families pay nothing.","fr":"Évaluation gratuite. Le soutien à domicile et Better at Home facturent selon le revenu; beaucoup de familles ne paient rien.","es":"Evaluación gratuita. El apoyo domiciliario y Better at Home cobran según ingresos; muchas familias no pagan nada.","zh":"评估免费。居家支持与 Better at Home 按收入分级收费，很多家庭不用付钱。","ko":"평가는 무료. 재가 지원과 Better at Home은 소득에 따라 차등 부과되며, 많은 가정이 비용을 내지 않습니다.","ja":"評価は無料。在宅支援とBetter at Homeは所得に応じた料金で、多くの家庭は無料です。"},"help":{"en":"Stuck between offices? The Seniors' line at 2-1-1, or a settlement worker if language is part of the difficulty.","fr":"Perdu entre les services ? Le 2-1-1, ou un intervenant en établissement si la langue fait partie du problème.","es":"¿Perdido entre oficinas? El 2-1-1, o un trabajador de asentamiento si el idioma es parte de la dificultad.","zh":"在几个机构之间转不出来？打 2-1-1；如果语言也是障碍，找定居服务专员。","ko":"기관 사이에서 헤매고 있다면 2-1-1, 언어가 어려움의 일부라면 정착 지원 담당자에게.","ja":"窓口の間で行き詰まったら2-1-1へ。言葉も壁になっているなら定住支援ワーカーへ。"},"alias":["老人","养老","居家护理","护工","照护","노인","돌봄","요양","高齢者","介護","在宅","aînés","soins à domicile","mayores","cuidado"]},{"id":"sick","icon":"🩺","when":"problem","q":{"en":"I am sick and I do not have a family doctor","fr":"Je suis malade et je n’ai pas de médecin de famille","es":"Me siento mal y no tengo médico de familia","zh":"我生病了，但没有家庭医生","ko":"아픈데 가정의가 없어요","ja":"体調が悪いのにかかりつけ医がいない"},"t":{"en":"Get care without a family doctor","fr":"Se faire soigner sans médecin de famille","es":"Recibir atención sin médico de familia","zh":"没有家庭医生时怎么看病","ko":"가정의 없이 진료받기","ja":"かかりつけ医なしで受診する"},"why":{"en":"Most people arrive without one. There are three doors, and picking the right one saves hours.","fr":"La plupart des gens arrivent sans médecin. Il y a trois portes; choisir la bonne fait gagner des heures.","es":"La mayoría llega sin uno. Hay tres puertas, y elegir la correcta ahorra horas.","zh":"大多数人刚来时都没有家庭医生。有三条路，选对能省好几个小时。","ko":"대부분 처음에는 가정의가 없습니다. 세 가지 경로가 있고, 잘 고르면 몇 시간을 아낍니다.","ja":"多くの人は最初かかりつけ医がいません。窓口は3つあり、選び方で数時間変わります。"},"steps":[{"en":"Not urgent, or unsure: call 8-1-1 — free, 24 hours, a nurse, with interpreters in many languages.","fr":"Non urgent ou incertain : composez le 8-1-1 — gratuit, 24 h, une infirmière, avec interprètes.","es":"No urgente o con dudas: llame al 8-1-1 — gratis, 24 horas, una enfermera, con intérpretes.","zh":"不紧急或拿不准：打 8-1-1——免费、24 小时、护士接听，可要求中文翻译。","ko":"급하지 않거나 판단이 어려우면 8-1-1로 전화하세요 — 무료, 24시간, 간호사 상담, 통역 가능.","ja":"緊急でない・判断に迷うときは8-1-1へ — 無料・24時間・看護師対応、通訳もあります。"},{"en":"Needs seeing today: a walk-in clinic. Go early — they fill their day’s list and then close. North Shore UPCC takes walk-ins; South Shore UPCLC is appointment-only — call 250-314-2256 from 10 am.","fr":"À voir aujourd’hui : une clinique sans rendez-vous. Allez tôt — la liste du jour se remplit puis ferme. Le UPCC de North Shore accepte sans rendez-vous; le UPCLC de South Shore fonctionne sur rendez-vous seulement — appelez le 250-314-2256 à partir de 10 h.","es":"Necesita verse hoy: una clínica sin cita. Vaya temprano — llenan el cupo del día y cierran. El UPCC de North Shore atiende sin cita; el UPCLC de South Shore es solo con cita — llame al 250-314-2256 desde las 10 am.","zh":"当天必须看：去 walk-in 诊所。要早去——当天号满就关门了。North Shore 的 UPCC 可以直接走进去看；South Shore 的 UPCLC 只接受预约——早上 10 点起打 250-314-2256。","ko":"오늘 진료가 필요하면 워크인 클리닉으로. 일찍 가세요 — 하루 접수가 차면 마감합니다. North Shore UPCC는 예약 없이 방문할 수 있고, South Shore UPCLC는 예약제입니다 — 오전 10시부터 250-314-2256으로 전화하세요.","ja":"当日中に診てもらう必要があるならウォークインクリニックへ。早めに — その日の受付が埋まると締め切られます。North ShoreのUPCCは予約なしで受診でき、South ShoreのUPCLCは予約制です — 午前10時から250-314-2256へ電話を。"},{"en":"Chest pain, trouble breathing, heavy bleeding, or you think it is serious: 911, or the hospital emergency department.","fr":"Douleur thoracique, difficulté à respirer, saignement important, ou doute sérieux : 911 ou l’urgence de l’hôpital.","es":"Dolor de pecho, dificultad para respirar, sangrado abundante o algo grave: 911 o urgencias del hospital.","zh":"胸痛、呼吸困难、大量出血，或你觉得情况严重：打 911，或直接去医院急诊。","ko":"흉통, 호흡 곤란, 다량 출혈, 위중하다고 느껴지면 911 또는 병원 응급실로.","ja":"胸痛、呼吸困難、大量出血、重症と感じたら911または病院の救急外来へ。"}],"note":{"en":"Care during the MSP (BC's public health insurance) wait is not free — you pay the full cost, so private insurance for that gap matters.","fr":"Les soins pendant le délai du MSP (l'assurance maladie publique de la C.-B.) ne sont pas gratuits — vous payez tout; d’où l’importance d’une assurance privée.","es":"La atención durante la espera del MSP (el seguro público de salud de BC) no es gratuita — usted paga todo; por eso importa el seguro privado.","zh":"MSP（BC 省公费医疗）等待期内看病不免费——要全额自付，所以那段时间的私人保险很重要。","ko":"MSP(BC 공공 의료보험) 대기 기간의 진료는 무료가 아니며 전액 본인 부담이므로, 그 기간의 사보험이 중요합니다.","ja":"MSP（BC州の公的医療保険）の待機期間中の受診は無料ではなく全額自己負担です。その間の民間保険が重要です。"},"place":"b29c9af7","src":"https://www.healthlinkbc.ca/","srcName":"HealthLink BC (8-1-1)","say":"Hi, I don't have a family doctor. Can I be seen today? I have a BC Services Card / I don't have one yet.","sayGloss":{"zh":"（意思：您好，我没有家庭医生。今天能看诊吗？我有 BC Services Card／我还没有。）","fr":"(Sens : Bonjour, je n’ai pas de médecin de famille. Puis-je être vu(e) aujourd’hui ? J’ai une carte BC Services / je n’en ai pas encore.)","es":"(Significado: Hola, no tengo médico de familia. ¿Pueden atenderme hoy? Tengo la BC Services Card / todavía no la tengo.)","ko":"(뜻: 안녕하세요, 가정의가 없습니다. 오늘 진료받을 수 있을까요? BC Services Card가 있습니다 / 아직 없습니다.)","ja":"（意味：こんにちは、かかりつけ医がいません。今日診てもらえますか？BC Services Cardを持っています／まだ持っていません。）"},"confid":{"en":"What you tell a nurse or doctor is confidential. Care is given regardless of your immigration status — bring what coverage you have, or none.","fr":"Ce que vous dites à une infirmière ou à un médecin est confidentiel. Les soins sont donnés quel que soit votre statut d’immigration. — apportez la couverture que vous avez, ou rien.","es":"Lo que le dice a una enfermera o médico es confidencial. La atención se brinda sin importar su estatus migratorio.","zh":"你对护士或医生说的话是保密的。无论你的移民身份如何都会给你看病——有保险就带着，没有也照看。","ko":"간호사나 의사에게 한 말은 비밀이 보장됩니다. 이민 신분과 무관하게 진료를 받을 수 있습니다. — 보험이 있으면 가져가고, 없어도 됩니다.","ja":"看護師や医師に話した内容は守秘されます。在留資格にかかわらず診療は受けられます。 — 保険があれば持参、なくても大丈夫です。"}},{"id":"deposit","icon":"🏠","when":"problem","q":{"en":"My landlord is keeping my deposit, or charging fees I doubt","fr":"Mon propriétaire garde mon dépôt, ou facture des frais douteux","es":"Mi arrendador retiene mi depósito o cobra tarifas dudosas","zh":"房东扣我押金，或收了我觉得不该收的费用","ko":"집주인이 보증금을 돌려주지 않거나 이상한 비용을 청구해요","ja":"大家が敷金を返してくれない、不審な費用を請求された"},"t":{"en":"Get your deposit back","fr":"Récupérer votre dépôt","es":"Recuperar su depósito","zh":"把押金要回来","ko":"보증금 돌려받기","ja":"敷金を取り戻す"},"why":{"en":"BC law caps deposits and sets a deadline for returning them.","fr":"La loi de la C.-B. plafonne les dépôts et fixe un délai de remboursement.","es":"La ley de BC limita los depósitos y fija un plazo para devolverlos.","zh":"BC 省法律对押金金额和退还期限都有硬性规定。","ko":"BC주 법은 보증금 상한과 반환 기한을 정하고 있습니다.","ja":"BC州法は敷金の上限と返還期限を定めています。"},"steps":[{"en":"Give your landlord your forwarding address in writing — the clock starts from that.","fr":"Donnez votre adresse de réexpédition par écrit — le délai part de là.","es":"Dé su dirección de reenvío por escrito — el plazo empieza ahí.","zh":"先用书面把你的新通讯地址给房东——期限从这一刻开始算。","ko":"새 주소를 서면으로 집주인에게 전달하세요 — 기한은 그때부터 시작됩니다.","ja":"転居先の住所を書面で大家に伝えます — 期限はそこから始まります。"},{"en":"They then have 15 days to return it or file a claim against it.","fr":"Il a ensuite 15 jours pour le rendre ou déposer une réclamation.","es":"Luego tiene 15 días para devolverlo o presentar un reclamo.","zh":"房东有 15 天时间退还，或就押金提出申请。","ko":"집주인은 15일 안에 반환하거나 보증금에 대한 신청을 해야 합니다.","ja":"大家は15日以内に返還するか、敷金に対する申立てを行う必要があります。"},{"en":"If they do neither, apply to the Residential Tenancy Branch — they can be ordered to pay you double.","fr":"S’il ne fait ni l’un ni l’autre, adressez-vous au Residential Tenancy Branch — il peut être condamné à payer le double.","es":"Si no hace ninguna de las dos, acuda al Residential Tenancy Branch — pueden ordenarle pagar el doble.","zh":"两样都没做，就向 RTB 申请——法定可以判房东双倍赔付。","ko":"둘 다 하지 않으면 주택임대청(RTB)에 신청하세요 — 두 배 지급 명령이 가능합니다.","ja":"どちらも行わない場合は住宅賃貸局（RTB）に申立てを — 2倍の支払いを命じられることがあります。"}],"note":{"en":"Caps: security deposit at most half a month’s rent; pet damage deposit at most another half. Landlords may not charge application fees, monthly pet fees, or a fee to return your deposit.","fr":"Plafonds : dépôt de garantie au plus un demi-mois de loyer; dépôt pour animal au plus un autre demi-mois. Interdits : frais de dossier, frais mensuels pour animal, frais pour rendre le dépôt.","es":"Topes: depósito de garantía como máximo medio mes de renta; depósito por mascota otro medio. Prohibido: cuotas de solicitud, cuotas mensuales por mascota o cobrar por devolver el depósito.","zh":"上限：押金最多半个月租金，宠物押金最多再半个月。房东不得收申请费、宠物月费，也不得为退押金收费。","ko":"상한: 보증금은 월세의 최대 절반, 반려동물 보증금은 추가로 최대 절반. 신청 수수료, 월 반려동물 요금, 보증금 반환 수수료는 청구할 수 없습니다.","ja":"上限: 敷金は家賃の半月分まで、ペット敷金はさらに半月分まで。申込手数料、月々のペット料金、敷金返還の手数料は請求できません。"},"help":{"en":"Residential Tenancy Branch · 1-800-665-8779","fr":"Residential Tenancy Branch (RTB, bureau des locations résidentielles de la C.-B.) · 1-800-665-8779","es":"Residential Tenancy Branch (RTB, oficina de arrendamientos de BC) · 1-800-665-8779","zh":"BC 省住宅租赁管理处 RTB · 1-800-665-8779","ko":"BC주 주택임대청(RTB) · 1-800-665-8779","ja":"BC州住宅賃貸局(RTB) · 1-800-665-8779"},"src":"https://www2.gov.bc.ca/gov/content/housing-tenancy/residential-tenancies/starting-a-tenancy/deposits-fees","srcName":"BC Residential Tenancy Branch","confid":{"en":"Filing with the Residential Tenancy Branch is your legal right. A landlord may not evict you for using it.","fr":"Déposer une demande au Residential Tenancy Branch est votre droit. Un propriétaire ne peut pas vous expulser pour cela.","es":"Presentar ante el Residential Tenancy Branch es su derecho. Un arrendador no puede desalojarlo por hacerlo.","zh":"向 RTB 申请是你的法定权利。房东不能因为你这样做就赶你走。","ko":"주택임대청(RTB)에 신청하는 것은 법적 권리입니다. 집주인은 이를 이유로 퇴거시킬 수 없습니다.","ja":"住宅賃貸局（RTB）への申立ては法的な権利です。それを理由に立ち退きを迫ることはできません。"}},{"id":"hardship","icon":"🤲","when":"problem","q":{"en":"I cannot cover food or rent this month","fr":"Je n’arrive pas à payer la nourriture ou le loyer ce mois-ci","es":"No puedo cubrir la comida o el alquiler este mes","zh":"这个月的饭钱或房租不够了","ko":"이번 달 식비나 월세를 감당할 수 없어요","ja":"今月の食費や家賃が払えない"},"t":{"en":"Get help when money runs out","fr":"Obtenir de l’aide quand l’argent manque","es":"Conseguir ayuda cuando falta el dinero","zh":"钱不够时去哪里求助","ko":"돈이 떨어졌을 때 도움받기","ja":"お金が足りないときの支援"},"why":{"en":"Asking early costs nothing and keeps a hard month from becoming an eviction. None of this checks your immigration status.","fr":"Demander tôt ne coûte rien et évite qu’un mois difficile devienne une expulsion. Rien de tout cela ne vérifie votre statut d’immigration.","es":"Pedir ayuda pronto no cuesta nada y evita que un mes difícil termine en desalojo. Nada de esto revisa su estatus migratorio.","zh":"早开口不花一分钱，能把“难过的一个月”挡在“被赶出去”之前。这些地方都不查你的移民身份。","ko":"일찍 요청하면 비용이 들지 않고, 힘든 한 달이 퇴거로 이어지는 것을 막습니다. 어느 곳도 이민 신분을 확인하지 않습니다.","ja":"早めに相談すれば費用はかからず、苦しい月が立ち退きに至るのを防げます。いずれも在留資格を確認しません。"},"steps":[{"en":"Call or text 2-1-1. It is free and confidential, offers interpretation in 240+ languages, and its whole job is to know which local service fits your situation.","fr":"Appelez ou textez le 2-1-1. Gratuit et confidentiel, avec interprétation en plus de 240 langues; son rôle est de savoir quel service local correspond à votre situation.","es":"Llame o envíe un texto al 2-1-1. Es gratis y confidencial, ofrece interpretación en más de 240 idiomas, y su función es saber qué servicio local le corresponde.","zh":"打或发短信到 2-1-1。免费、保密、可提供 240 多种语言的翻译，它的全部工作就是知道你这种情况该找本地哪个机构。","ko":"2-1-1로 전화하거나 문자하세요. 무료·비밀보장, 240개 이상 언어 통역을 제공하며, 상황에 맞는 지역 서비스를 찾아주는 것이 이 기관의 일입니다.","ja":"2-1-1に電話またはSMSを。無料・秘密厳守、240以上の言語で通訳対応があり、あなたの状況に合う地域のサービスを知っているのが役目です。"},{"en":"Go to the food bank. You do not need to be destitute, and you do not need status — bring ID if you have it.","fr":"Allez à la banque alimentaire. Nul besoin d’être démuni ni d’avoir un statut — apportez une pièce d’identité si vous en avez une.","es":"Vaya al banco de alimentos. No hace falta estar en la miseria ni tener estatus — lleve identificación si la tiene.","zh":"去食物银行。不需要“穷到极点”才能去，也不看身份——有证件就带上。","ko":"푸드뱅크에 가세요. 극빈 상태여야 하는 것도, 신분이 있어야 하는 것도 아닙니다 — 신분증이 있으면 가져가세요.","ja":"フードバンクへ。困窮の極みである必要も、在留資格も問われません。身分証があれば持参してください。"},{"en":"If rent is the problem, act before you miss it — a landlord must follow a legal process, and there are people whose job is to help you through it.","fr":"Si c’est le loyer, agissez avant de le manquer — un propriétaire doit suivre une procédure légale, et des gens sont là pour vous accompagner.","es":"Si el problema es el alquiler, actúe antes de fallar un pago — el arrendador debe seguir un proceso legal y hay quien puede ayudarle.","zh":"如果卡在房租上，在没交上之前就行动——房东必须走法定程序，而且有专门的人帮你走这个流程。","ko":"문제가 월세라면 연체 전에 움직이세요 — 집주인은 법적 절차를 따라야 하며, 그 과정을 도와주는 사람들이 있습니다.","ja":"家賃が問題なら滞納する前に動きましょう。大家は法的手続きを踏む必要があり、その過程を助ける人がいます。"}],"help":{"en":"bc211 · dial or text 2-1-1 · free, confidential, interpretation in 240+ languages · 9am–9pm weekdays","fr":"bc211 · composez ou textez 2-1-1 · gratuit, confidentiel, interprétation en plus de 240 langues · 9h–21h en semaine","es":"bc211 · marque o envíe un texto al 2-1-1 · gratis, confidencial, interpretación en más de 240 idiomas · 9–21 h entre semana","zh":"bc211 · 拨打或发短信 2-1-1 · 免费、保密、240 多种语言翻译 · 工作日 9:00–21:00","ko":"bc211 · 2-1-1 전화 또는 문자 · 무료·비밀보장·240개 이상 언어 통역 · 평일 9시–21시","ja":"bc211 · 2-1-1に電話またはSMS · 無料・秘密厳守・240以上の言語で通訳 · 平日9時〜21時"},"confid":{"en":"None of these services report you to immigration, and none of them are shared with your landlord or employer.","fr":"Aucun de ces services ne vous signale à l’immigration, ni ne communique quoi que ce soit à votre propriétaire ou employeur.","es":"Ninguno de estos servicios lo reporta a inmigración, ni comparte nada con su arrendador o empleador.","zh":"这些机构都不会把你报给移民局，也不会把情况告诉你的房东或雇主。","ko":"이 서비스들은 이민 당국에 신고하지 않으며, 집주인이나 고용주에게 알리지도 않습니다.","ja":"いずれのサービスも入国管理に通報せず、大家や雇用主に伝えることもありません。"},"place":"8857cba0","src":"https://bc.211.ca/about-us/","srcName":"bc211"},{"id":"rights","icon":"🛡️","when":"problem","q":{"en":"I was treated unfairly because of who I am","fr":"On m’a traité(e) injustement à cause de qui je suis","es":"Me trataron injustamente por quién soy","zh":"我因为自己的身份被不公平对待了","ko":"내가 누구인지 때문에 부당한 대우를 받았어요","ja":"自分の属性を理由に不当な扱いを受けた"},"t":{"en":"File a human rights complaint","fr":"Déposer une plainte en droits de la personne","es":"Presentar una queja de derechos humanos","zh":"提出人权投诉","ko":"인권 진정 제기하기","ja":"人権申立てを行う"},"why":{"en":"In housing, work or a service, BC law protects you — and the deadline is short.","fr":"En logement, au travail ou dans un service, la loi de la C.-B. vous protège — et le délai est court.","es":"En vivienda, trabajo o un servicio, la ley de BC lo protege — y el plazo es corto.","zh":"租房、工作、接受服务时受 BC 省法律保护——但申诉期限很短。","ko":"주거, 직장, 서비스에서 BC주 법이 보호하며, 제기 기한이 짧습니다.","ja":"住居・職場・サービスの場面でBC州法が守ってくれますが、申立ての期限は短いです。"},"steps":[{"en":"Write down what happened, when, and who was there — dates matter more than you expect.","fr":"Notez ce qui s’est pass 1년 이내","ja":"1年以内"}},{"id":"legal","icon":"⚖️","when":"problem","q":{"en":"I have a legal problem and cannot afford a lawyer","fr":"J’ai un problème juridique et je n’ai pas les moyens d’un avocat","es":"Tengo un problema legal y no puedo pagar un abogado","zh":"我有法律问题，但请不起律师","ko":"법적 문제가 있는데 변호사를 선임할 형편이 안 돼요","ja":"法律問題があるが弁護士を頼む余裕がない"},"t":{"en":"Get free legal help","fr":"Obtenir de l’aide juridique gratuite","es":"Conseguir ayuda legal gratuita","zh":"获得免费法律帮助","ko":"무료 법률 지원 받기","ja":"無料の法的支援を受ける"},"why":{"en":"Legal Aid BC covers family, child protection, criminal, immigration and refugee matters — advice even where full representation is not available.","fr":"Legal Aid BC couvre le droit de la famille, la protection de l’enfance, le criminel, l’immigration et les réfugiés — des conseils même sans représentation complète.","es":"Legal Aid BC cubre familia, protección infantil, penal, inmigración y refugiados — asesoría incluso cuando no hay representación completa.","zh":"Legal Aid BC 覆盖家庭、儿童保护、刑事、移民与难民等领域——即使够不上全程代理，也能拿到法律意见。","ko":"Legal Aid BC는 가족, 아동보호, 형사, 이민·난민 문제를 다룹니다 — 전면 대리가 어려워도 상담은 받을 수 있습니다.","ja":"Legal Aid BCは家族、児童保護、刑事、移民・難民の分野を扱います — 全面的な代理が難しくても助言は受けられます。"},"steps":[{"en":"Contact Legal Aid BC and describe the problem — they will tell you which of their services fits.","fr":"Communiquez avec Legal Aid BC et décrivez le problème — on vous dira quel service convient.","es":"Contacte a Legal Aid BC y describa el problema — le dirán qué servicio corresponde.","zh":"联系 Legal Aid BC 说明情况——他们会告诉你适用哪一项服务。","ko":"Legal Aid BC에 연락해 상황을 설명하면, 어떤 서비스가 맞는지 알려 줍니다.","ja":"Legal Aid BCに連絡して状況を説明すると、どのサービスが該当するか教えてくれます。"},{"en":"Ask for an interpreter if you need one — help is available in other languages.","fr":"Demandez un interprète au besoin — l’aide existe dans d’autres langues.","es":"Pida un intérprete si lo necesita — hay ayuda en otros idiomas.","zh":"需要翻译就直接说——他们提供其他语言的帮助。","ko":"필요하면 통역을 요청하세요 — 다른 언어로도 지원됩니다.","ja":"必要なら通訳を依頼してください — 他言語での支援があり // Stated once, rendered everywhere. Change this line to change the terms.
const LICENCE={id:'CC BY-NC 4.0', url:'https://creativecommons.org/licenses/by-nc/4.0/'};
// Single source of truth for the verification date. It used to be written out by
// hand in five different note strings, which is how they drift apart.
const VERIFIED='2026-08-30';
// Bus routes are not hand-collected: they come from the operator's GTFS feed, and
// every stop name and coordinate in BR was re-checked against this edition of it.
// Routes 8, 11, 12 and 15 are absent from the feed — Kamloops does not run them.
const BUS_SOURCE={feed:'BC Transit GTFS', edition:'2026-08-29', stopsChecked:475};
function verifiedDate(l){
  const [y,m,d]=VERIFIED.split('-').map(Number);
  const mn=UI[l].months[m-1];
  if(l==='zh')return y+'年'+m+'月'+d+'日';
  if(l==='ko')return y+'년 '+m+'월 '+d+'일';
  if(l==='ja')return y+'年'+m+'月'+d+'日';
  if(l==='en')return mn+' '+d+', '+y;
  if(l==='fr')return d+' '+mn+' '+y;
  return d+' de '+mn+' de '+y;
}
// Expands the {CITY}/{PROV}/{TRANSIT}/{SD}/{DATE} placeholders used throughout the
// translated copy. One function so a new city can never half-replace a name.
function tpl(str,l){
  if(!str)return str;
  return str
    .replace(/\{CITY\}/g,CITY.name[l])
    .replace(/\{PROV\}/g,CITY.prov[l])
    .replace(/\{TRANSIT_URL\}/g,CITY.transit.url)
    .replace(/\{TRANSIT\}/g,CITY.transit.name)
    .replace(/\{SD_URL\}/g,CITY.schoolDistrict.url)
    .replace(/\{SD\}/g,CITY.schoolDistrict.name)
    .replace(/\{CONTACT\}/g,CITY.contact)
    .replace(/\{LIC_URL\}/g,LICENCE.url)
    .replace(/\{LIC\}/g,LICENCE.id)
    .replace(/\{VER\}/g,DATA_VERSION)
    .replace(/\{DATE\}/g,verifiedDate(l));
}
// Builds the guide's index from whatever headings the four guide tiers happen to
// render. Nothing here knows what the sections are, so a city that rewrites
// guideCity, or a province that rewrites guideProv, gets a correct index for free
// and in its own language. Buttons rather than anchors: an <a href="#gs-3"> inside
// a modal makes the browser write to location.hash, which on a back-press closes
// something the reader did not ask to close.

// ---------------------------------------------------------------------------
// The task layer's UI. The guide used to open on twenty-six headings of prose,
// which answers "what exists here" but not "I have this problem, what do I do".
// It now opens on the problems themselves, in the reader's own words; choosing
// one replaces the list with that task's steps, documents, office, cost and
// wait, and a back link returns to the list. The long-form prose is untouched
// and still sits below — this is a way in, not a replacement.
// ---------------------------------------------------------------------------

// Which tasks the reader has ticked off. Kept in this browser only — never in
// the URL, never in an event, never on a server. Bandura's point about
// self-efficacy is the whole reason this exists: a list of eleven official
// errands is daunting, and the single cheapest way to make it feel finishable
// is to let someone see that three of them are already behind them.
const _TASK_DONE_KEY='kamloopsTasksDone';
let taskDone=new Set();
try{const raw=JSON.parse(localStorage.getItem(_TASK_DONE_KEY)||'[]');
    if(Array.isArray(raw))taskDone=new Set(raw.filter(x=>typeof x==='string'));}catch(e){}
function saveTaskDone(){try{localStorage.setItem(_TASK_DONE_KEY,JSON.stringify([...taskDone]));}catch(e){}try{updateGuideProgress();}catch(e){}}
function toggleTaskDone(id){
  const now=!taskDone.has(id);
  if(now)taskDone.add(id);else taskDone.delete(id);
  saveTaskDone();
  // Which card, never sent: the privacy summary promises ticks stay on the
  // device, and the funnel question ("do people finish?") only needs the count.
  trackEvent('task_done',{action:now?'done':'undone',total:taskDone.size});
  return now;
}
let _taskOpen=null;
let _taskQ='';
// Search inside the guide: the question, the title, the steps, and the same
// aliases the map search uses — so 驾照 / SIN / 押金 land on their card.
function taskMatches(t,q){
  q=(q||'').trim().toLowerCase();if(!q)return true;
  // the reader's language plus English: a zh reader types "SIN", "ICBC",
  // "licence" — the words on the forms — as often as 驾照
  const tx=v=>v?((v[L_]||'')+' '+(v.en||'')):'';
  const bag=[tx(t.q),tx(t.t),tx(t.why),...(t.steps||[]).map(tx),
    ...(t.bring?[tx(t.bring)]:[]),...(t.alias||[])].join(' ').toLowerCase();
  if(bag.indexOf(q)>=0)return true;
  const pl=t.place?P.find(p=>p.id===t.place):null;
  return !!(pl&&(pl.n.toLowerCase().indexOf(q)>=0||(pl.alias||[]).some(a=>a.toLowerCase().indexOf(q)>=0)));
}
function taskText(v){return v&&(v[L_]||v.en)||'';}
// For the map search hand-off: the card's own question, title and aliases —
// not its steps, or "library" would point at the card that mentions one.
function taskMatchesLoose(t,q){
  q=(q||'').trim().toLowerCase();if(!q)return false;
  const tx=v=>v?((v[L_]||'')+' '+(v.en||'')):'';
  const bag=[tx(t.q),tx(t.t),...(t.alias||[])].join(' ').toLowerCase();
  if(bag.indexOf(q)>=0)return true;
  const words=q.split(/\s+/).filter(w=>w.length>=2);
  return words.length>1&&words.every(w=>bag.indexOf(w)>=0);
}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function localISODate(d){
  d=d||new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function renderTaskList(){
  const host=document.getElementById('guideTasks');
  if(!host)return;
  const u=UI[L_];
  _taskOpen=null;
  let h='<p class="task-lead">'+esc(u.taskLead)+'</p>';
  h+='<input type="search" class="task-search" id="taskSearch" placeholder="'+esc(u.taskSearchPh)+'" value="'+esc(_taskQ)+'" autocomplete="off">';
  const arr=arrivalDate();
  h+='<div class="task-arrive"><label for="arriveDate">'+esc(u.arriveLabel)+'</label>'
    +'<input type="date" id="arriveDate" value="'+esc(arr||'')+'" max="'+localISODate()+'">'
    +(arr?'<button type="button" class="task-tool" id="arriveClear">'+esc(u.arriveClear)+'</button>':'')
    +'<span class="task-arrive-h">'+esc(u.arriveHint)+'</span></div>';
  h+='<div id="taskBuckets"></div>';
  host.innerHTML=h;
  renderTaskBuckets();
  // 2026-09-10: the whole block, search box included, used to be rebuilt on
  // every keystroke. Replacing the focused <input> mid-composition aborts an
  // IME session, so 驾照 / 免許 / 운전면허 lost every syllable after the first.
  // The box now stays put and only the list below it re-renders — and not
  // while a composition is in progress.
  const ts=host.querySelector('#taskSearch');
  if(ts){
    ts.addEventListener('compositionend',()=>{_taskQ=ts.value;renderTaskBuckets();});
    ts.oninput=e=>{if(e&&e.isComposing)return;_taskQ=ts.value;renderTaskBuckets();};
  }
  const ad=host.querySelector('#arriveDate');
  if(ad)ad.onchange=()=>{setArrival(ad.value);trackEvent('arrival_set',{set:!!ad.value});renderTaskList();};
  const ac=host.querySelector('#arriveClear');
  if(ac)ac.onclick=()=>{setArrival(null);renderTaskList();};
}
function renderTaskBuckets(){

// Click tracking — Phase A: every event is now (a) sent to the edge via
// navigator.sendBeacon('/api/event', Blob) and (b) mirrored into a local ring
// buffer that ?debug=1 can export. The 25 call sites below stay exactly as
// written; only the helper internals changed. Names follow a verb_noun pattern
// so the SQL reports read like English.
//
// Anonymous session ID is generated locally, persisted in localStorage, and
// attached to every event so the server side can say "this user clicked X
// then Y" without ever knowing who they are. No fingerprinting, no IP
// collection — the Worker echoes nothing back. (The two third parties, the
// tile server and the Cloudflare visit counter, are named in the privacy note.)
const _SID_KEY='kamloopsSid';
function getSid(){
  try{
    let sid=localStorage.getItem(_SID_KEY);
    if(sid&&/^[a-z0-9]{12,32}$/.test(sid))return sid;
    // crypto.randomUUID is universal since 2022; the Math.random fallback is
    // paranoia for very old engines and produces a different value per call
    // anyway (no longer a session id, just a "did not get an id" marker).
    sid=(typeof crypto!=='undefined'&&crypto.randomUUID)
      ?crypto.randomUUID().replace(/-/g,'').slice(0,24)
      :Math.random().toString(36).slice(2,18);

  }catch(e){return 'anon';}
}

  // strip is not a chip), and it clears the route too — a bar that empties
  // while the map stays greyed-out was the most-reported confusion in testing.
  if(root.querySelectorAll('.af-chip').length>1){

// The URL has quietly carried the current language/area/category/search/route for
// several rounds now (writeURLState), but nothing ever told a reader that copying
// the address bar sends someone else straight to this same view — a "here are the
// banks on the North Shore, in Korean" link was possible but undiscoverable. This
// button makes the existing feature visible instead of adding a new one.
// ---------------------------------------------------------------------------
// Sharing. The button used to copy the link outright; it now opens a sheet,
// because "share" means WhatsApp to a reader from Delhi, LINE in Osaka,
// KakaoTalk in Seoul and WeChat in Chinese-speaking households — and the copy
// is still the first thing in the sheet, so the old one-click habit costs one
// extra tap rather than breaking.
//
// Only platforms with a real, documented share-a-link endpoint get a button.
// WeChat, TikTok and KakaoTalk have none: WeChat expects a QR scan on desktop
// or a server-signed JS-SDK inside its own browser, TikTok's Share Kit takes
// video/photo through a registered app rather than a URL, and KakaoTalk needs
// its SDK and an app key. navigator.share covers all three on a phone, because
// the OS sheet lists whatever the reader has installed, so that is offered
// first and the sheet says plainly what to do on a desktop.
// ---------------------------------------------------------------------------
const SHARE_TARGETS=[
  {k:'whatsapp', ic:'💬', name:'WhatsApp', url:(u,t)=>'https://wa.me/?text='+encodeURIComponent(t+' '+u)},
  {k:'facebook', ic:'📘', name:'Facebook', url:(u)=>'https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(u)},
  {k:'x',        ic:'✖️', name:'X',        url:(u,t)=>'https://twitter.com/intent/tweet?url='+encodeURIComponent(u)+'&text='+encodeURIComponent(t)},
  {k:'telegram', ic:'✈️', name:'Telegram', url:(u,t)=>'https://t.me/share/url?url='+encodeURIComponent(u)+'&text='+encodeURIComponent(t)},
  {k:'line',     ic:'🟢', name:'LINE',     url:(u)=>'https://social-plugins.line.me/lineit/share?url='+encodeURIComponent(u)},
  {k:'email',    ic:'✉️', name:null, label:'shareEmail', url:(u,t)=>'mailto:?subject='+encodeURIComponent(t)+'&body='+encodeURIComponent(u)},
  {k:'sms',      ic:'📱', name:null, label:'shareSms',   url:(u,t)=>'sms:?&body='+encodeURIComponent(t+' '+u)}
];

function copyShareLink(){
  const u=UI[L_],href=location.href;
  trackEvent('share_click',{stage:'intent',target:'copy'});
  let copied=false;
  try{
    const ta=document.createElement('textarea');
    ta.value=href;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    copied=document.execCommand('copy');
    document.body.removeChild(ta);
  }catch(e){}
  if(copied){trackEvent('share_click',{stage:'result',target:'copy',copied:true,method:'execCommand'});showToast(u.linkCopied);return;}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(href).then(
      ()=>{trackEvent('share_click',{stage:'result',target:'copy',copied:true,method:'clipboard'});showToast(u.linkCopied);},
      ()=>{trackEvent('share_click',{stage:'result',target:'copy',copied:false,method:'clipboard'});});
  }else{
    // Both paths unavailable — the click produced nothing, so record it rather
    // than let the failure rate look like zero.
    trackEvent('share_click',{stage:'result',target:'copy',copied:false,method:'none'});
  }
}
function renderShareSheet(){

  nat.textContent=u.shareNative;

  // Copy comes first: it is the one that always works, including offline and
  // inside in-app browsers that block window.open.
  const copyBtn=document.createElement('button');
  copyBtn.className='share-item';copyBtn.type='button';
  copyBtn.innerHTML='<span class="si" aria-hidden="true">🔗</span><span></span>';
  copyBtn.lastChild.textContent=u.shareCopy;
  copyBtn.onclick=copyShareLink;
  grid.appendChild(copyBtn);
  SHARE_TARGETS.forEach(t=>{
    const a=document.createElement('a');
    a.className='share-item';a.target='_blank';a.rel='noopener';
    a.href=t.url(location.href,shareText());

}

function labelRect(el,pt,dx,dy){

// first/last stop and any named terminus; landmarks pass none — with only a
// handful of them, none needs to jump the queue over the others).
// `slots` (2026-09-09): when true, a label blocked above its point may try below

// each individual name was chosen by hand.

// "forced only" is not the answer either — a loop route's first and last stop

  // each other are unreadable in both directions. Against a cluster bubble the bar
  // is lower: the bubbles are big and numerous, and vetoing every label that merely
  // grazes one left just 3 of 31 names on screen. Only a bite out of the middle of
  // the text actually costs legibility, so clusters block a label at 30% coverage.

  // slot a forced one then drew over.

  // carry the identical name and land on top of each other. The second one adds
  // nothing a reader can use, so it is dropped rather than smudged over the first.
  //

  // reasoning that they are the anchors and must win. They must win *against

  // anchors printed over each other are two labels nobody can read, and at wide

  // takes another slot if its first is taken, and stands down if none is free.

      if(!clear(r))continue;

  entries.forEach(e=>{
    if(e.force||!e.rect||!e.allow)return;
    const cand=slots&&e.el?labelSlots(e.el):[[0,0]];
    for(let i=0;i<cand.length;i++){

      if(!fits(r))continue;
      e.off=cand[i];placed.push(r);show.add(e.idx);return;

    if(!e.el)return;
    e.el.style.display=show.has(e.idx)?'':'none';

    // applied as a margin on top of it — no fighting over the same property, and

const STOP_LABEL_ALL_ZOOM=16;   // at and above this, every stop is a candidate

function updateStopLabelVisibility(){

  // Zoomed in, the reader is asking "which stop do I get off at" and every name
  // earns its place. Zoomed out they are asking "where does this line go", and
  // eight names along its length answer that better than sixty fighting for room.
  const stride=(z>=STOP_LABEL_ALL_ZOOM||n<=STOP_LABEL_TARGET)
    ? 1 : Math.ceil(n/STOP_LABEL_TARGET);

    (item,idx,items)=>idx===0||idx===items.length-1||isKeyStop(item.name),
    true,                                   // a blocked name may try below or to the side

// version-bumped since the PWA shipped — and nothing ever registered it, so the
// offline shell it describes did not exist. That matters here more than for most
// sites: manifest.json advertises an installable standalone app, session_start
// reports a `pwa` flag as though one were running, and the offline notice tells
// the reader in five languages that "place details, search, filters and the
// resident guide all work without a connection" — which, on a cold offline load
// with no service worker, was simply not true.
// Registered defensively: only over http(s) (a file:// copy has no origin to
// scope to), only after load so it never competes with first paint, and inside
// try/catch because a rejected registration must never surface to the reader.
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){
  window.addEventListener('load',()=>{
    try{
      navigator.serviceWorker.register('sw.js').catch(e=>{
        trackEvent('sw_register',{ok:false,msg:String(e&&e.message||e).slice(0,80)});
      }).then(reg=>{if(reg)trackEvent('sw_register',{ok:true});});
    }catch(e){}
  });
}
// #map has no measured height until layout runs; take the real one now.
setTimeout(syncPanPad,0);
// P1-A ONB-02 (2026-09-05): a first-time visitor with no stored choice falls
// back to navigator.languages instead of bare 'en' — zh users on zh devices
// were bouncing off English before noticing the language buttons.
//
// 2026-09-07, settled after this had been flipped three times: keep the browser
// guess. The objection to it was that an English speaker whose browser merely
// lists zh somewhere would land on Chinese — but detectLang() returns the FIRST
// entry of navigator.languages that we support, so ['en-US','zh-CN'] resolves to
// en and only ['zh-CN',...] resolves to zh. Verified all four paths in a browser:
//   ['en-US','zh-CN'] -> en      ['zh-CN','en-US'] -> zh
//   ['de-DE']         -> en      zh browser + a saved choice of fr -> fr
// So the guess is only ever the reader's own first preference, and an explicit
// choice still beats it. Please do not swap this back to a hard-coded 'en'
// without a concrete case where the first-preference rule gets it wrong.
// 2026-09-07: the explicit choice a returning reader already made is restored
// ahead of that guess. It had been dropped in the September rewrite, so someone
// who switched to 中文 landed back on the browser guess every single visit.
// Precedence is: ?lang= in the link  >  what you picked last time  >  browser
// language  >  English.
const LANG_KEY='kamloopsLang';
function getStoredLang(){
  try{const v=localStorage.getItem(LANG_KEY);return owns(UI,v)?v:null;}catch(e){return null;}
}
function setStoredLang(l){try{localStorage.setItem(LANG_KEY,l);}catch(e){}}
function detectLang(){
  const cands=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||''];
  for(let i=0;i<cands.length;i++){
    const base=(cands[i]||'').toLowerCase().split('-')[0];
    if(owns(UI,base))return base;
  }
  return 'en';
}
(function applyURLState(){
  // Read the address bar *before* writeURLState() rewrites it below — the
  // ?src= flyer tag and ?source=pwa were being read afterwards, from a URL
  // that no longer carried them, so neither had ever been recorded.
  const landedSearch=location.search;
  const st=readURLState();
  if(st){
    if(st.regions){aR=new Set(st.regions);}
    if(st.cats){aC=new Set(st.cats);}
    if(st.themes){aT=new Set(st.themes);}
    if(st.q){searchInputEl.value=st.q;searchRaw=st.q.toLowerCase();
      if(st.q.length>=MIN_QUERY)searchTerm=st.q.toLowerCase();
      searchClearEl.hidden=false;}
  }
  // URL ?lang= 永远胜出；其次是上次手动选过的语言（记在 localStorage 里）；
  // 再次才按 navigator.languages 猜；都没有则退回英文。
  setLang(st&&st.lang?st.lang:(getStoredLang()||detectLang()));
  if(st&&st.route)renderRoute(st.route,true);
  if(st&&st.task)setTimeout(()=>openGuide('link',st.task),80);
  urlWriteBlocked=false;
  writeURLState();
  // session_start is the denominator every other rate is measured against:
  // without it "12 sessions" only counts people who happened to click something,
  // and a visitor who loaded the map, found nothing, and left is invisible.
  // Fires once per page load, after URL state is applied, so lang/region/cats
  // reflect what the visitor actually landed on.
  trackEvent('session_start',{
    ver:DATA_VERSION,
    lang:L_,
    ref:document.referrer?(new URL(document.referrer)).host:'direct',
    // ?src=flyer-2609 etc.: which printed thing brought this person here. The
    // only way to learn whether a flyer on a noticeboard is worth reprinting.
    src:(function(){try{const v=new URLSearchParams(landedSearch).get('src')||'';return /^[a-z0-9-]{1,24}$/.test(v)?v:undefined;}catch(e){return undefined;}})(),
    // which of the three layouts this reader is actually looking at
    dev:(innerWidth<600?'phone':innerWidth<1024?'tablet':'desktop'),
    // installed to the home screen, or opened from the browser? The manifest
    // has advertised ?source=pwa since the PWA shipped and nothing ever read it,
    // so "is anyone installing this" has never been answerable.
    pwa:(function(){try{
      return /[?&]source=pwa\b/.test(landedSearch)
        ||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)
        ||navigator.standalone===true;}catch(e){return false;}})(),
    // arrived on a shared link that already carried filters — a different
    // journey from landing on the default map, and one the share feature exists
    // to create, so its share of traffic is worth knowing
    deep:!!(st&&(st.regions||st.cats||st.themes||st.q||st.route)),
    lead:!!(st&&st.lang)
  });
})();
