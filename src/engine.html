<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kamloops Living Services Map</title>
<meta name="description" id="metaDesc" content="Kamloops living-services map: schools, healthcare, housing, transit, groceries and resident essentials across every neighbourhood.">
<meta property="og:type" content="website">
<meta property="og:title" id="ogTitle" content="Kamloops Living Services Map">
<meta property="og:description" id="ogDesc" content="Schools, healthcare, housing, transit, groceries and resident essentials across every Kamloops neighbourhood.">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<!-- Safari has never accepted an SVG apple-touch-icon, so the previous line
     pointed iOS at a file it silently ignored and the home-screen tile came out
     as a screenshot of the page. A real 180px PNG is what that platform wants. -->
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a73e8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<style id="app-css">
  :root{--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK SC",sans-serif;
         --ink:#202124;--sub-ink:#5f6368;--paper:#f8f9fa;--card:#ffffff;--line:#dadce0;--accent:#1a73e8;--accent-text:#1967d2;--sage:#188038;}
  /* Dark mode was added on 2026-09-05 and removed again on 2026-09-07 at the
     owner's request: this page is one light surface with a light OSM basemap
     inside it, and re-skinning only the chrome we own left the map itself
     bright white in the middle of a dark frame. Declaring the page light-only
     also stops browsers and in-app webviews (WeChat's especially) from applying
     their own automatic dark transform, which is what produces unreadable
     light-on-light text. If dark mode is ever wanted again it has to cover the
     tile layer too, not just the panels. */
  :root{color-scheme:light;}
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased;}
  /* every interactive control is a real <button> for keyboard access; these rules
     strip the browser's default button chrome so the visual design is unchanged */
  .lang-btn,.preset-chip,.reg-btn,.cat-btn,.cat-group-label,.bus-item,.af-clear,
  .af-chip .x,.rt-name,.rt-remove,.panel-close,.search-clear{
    font-family:inherit;font-size:inherit;color:inherit;text-align:inherit;-webkit-appearance:none;appearance:none;}
  .cat-group-label,.bus-item,.reg-btn,.cat-btn,.preset-chip{width:auto;}
  .af-chip .x,.rt-remove,.search-clear,.panel-close,.af-clear,.rt-name,.grp-check,.grp-expand,.fav-star{background:none;border:none;}
  /* type=search draws its own clear button; the page supplies one, so hide the native one */
  input[type=search]::-webkit-search-cancel-button,
  input[type=search]::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--font);}
  header{padding:26px 20px 4px;position:relative;}
  h1{font-family:var(--font);font-size:clamp(20px,3vw,27px);margin:0 0 5px;font-weight:500;letter-spacing:0;padding-right:265px;}
  /* P2-H: the visible first-run hint now carries the "how to use this" guidance
     (see .fhint below), so this line would only repeat it at the cost of the
     vertical space P0-B works to win back. It stays out of sighted layout but,
     unlike display:none, is not pulled from the accessibility tree either — the
     h1's aria-describedby (below, in the body) still reaches it, so a screen
     reader gets a one-line description of what the map covers that a sighted
     reader gets some other way (the title, the hint, the categories on screen). */
  /* 2026-09-10: visible again. The reasoning above held while this line only
     repeated what the map covered. It now carries the one sentence a first-time
     reader needs — what this thing does for them — and the title alone
     ("Life Guide") cannot say it. One muted line; on a phone it is the cheapest
     vertical space on the page. */
  .sub{margin:3px 0 0;font-size:13px;line-height:1.4;color:var(--sub-ink);max-width:760px;text-wrap:balance;}
  .lang-sw{position:absolute;top:24px;right:20px;display:flex;gap:2px;background:#f1f3f4;border-radius:9px;padding:2px;}
  .lang-btn{padding:5px 12px;border-radius:7px;border:none;background:transparent;font-size:12px;cursor:pointer;font-weight:590;color:var(--sub-ink);transition:all .15s cubic-bezier(.4,0,.2,1);}
  .lang-btn.active{background:var(--card);color:var(--accent-text);box-shadow:0 1px 2px 0 rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);}
  .header-links{position:absolute;top:60px;right:20px;display:flex;align-items:center;gap:14px;}
  .feedback-link{font-size:11.5px;font-weight:600;color:var(--accent-text);text-decoration:none;padding:7px 3px;}
  .note-toggle{position:relative;font-family:inherit;font-size:11.5px;font-weight:600;color:var(--accent-text);text-decoration:none;background:none;border:none;padding:7px 3px;margin:0;cursor:pointer;}
  .feedback-link:hover,.note-toggle:hover{text-decoration:underline;}
  /* 2026-09-10 — the guide is the product; the map is one of its tools. Until
     now this button was styled exactly like Share and Feedback, which told a
     first-time reader it was a utility. It is now the one filled control in
     the header: same accent as the filter buttons below, so the eye reads it
     as "the thing to press", and the label is the question the reader came
     with rather than the name of a document. */
  #guideToggle{background:var(--accent);color:#fff;border-radius:999px;padding:7px 13px;font-weight:700;
    box-shadow:0 1px 2px rgba(26,115,232,.3);}
  #guideToggle:hover{text-decoration:none;filter:brightness(1.06);}
  #guideToggle .hl-ic{margin-right:2px;}
  /* #noteToggle carries a static `hidden` attribute (2026-09-08). Without this,
     the coarse-pointer media query below sets .note-toggle{display:inline-flex},
     an author rule that wins over the UA's [hidden]{display:none} regardless of
     specificity — so the button would silently reappear, full-size, on every
     touch device. Same trap validate.py's "[hidden] traps" check looks for. */
  #noteToggle[hidden]{display:none;}

  .sec-label{padding:2px 0 7px;font-family:var(--font);font-size:11.5px;font-weight:600;color:var(--sage);letter-spacing:.2px;}
  /* unified filter toolbar — identical on every breakpoint */
  .ftoolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;row-gap:6px;padding:12px 20px 0;}
  .filter-btn{background:var(--accent);color:#fff;border:none;border-radius:20px;padding:9px 12px 9px 14px;font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:7px;cursor:pointer;white-space:nowrap;transition:filter .15s cubic-bezier(.4,0,.2,1);box-shadow:0 1px 2px 0 rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);}
  .filter-btn:hover{filter:brightness(.94);}
  .filter-btn svg{flex:0 0 auto;display:block;}
  .filter-btn .chev{font-size:9px;transition:transform .18s;opacity:.9;}
  .filter-btn.open .chev{transform:rotate(180deg);}
  .filter-btn .badge{background:#fff;color:var(--accent-text);border-radius:999px;font-size:10.5px;padding:1px 6px;font-weight:800;}
  .status{font-size:12.5px;color:var(--ink);font-weight:590;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:4px 2px;}
  .fbicon{font-size:12px;line-height:1;}
  .reset-btn{font-size:12px;color:var(--accent-text);font-weight:700;background:none;border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:16px;cursor:pointer;padding:6px 12px;white-space:nowrap;display:flex;align-items:center;gap:4px;}
  .reset-btn[hidden]{display:none;}
  .reset-btn:hover{background:color-mix(in srgb,var(--accent) 8%,transparent);}
  /* A bare "·" explained only by a hover title was invisible on touch, which is
     most of this app's traffic — the word itself is now the visible cue, sourced
     from a data attribute JS sets per language, at full opacity so it stays AA. */
  .preset-chip.adjusted::after{content:attr(data-adj-label);margin-left:5px;font-weight:700;}
  .qp-row{padding:11px 20px 0;position:relative;}
  .qp-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-bottom:7px;}
  .qp-head .sec-label{padding-bottom:0;}
  /* A plain transparent-to-paper fade reads as scrollable only if you already know
     to look for it — against an off-white background it is nearly invisible (a
     first-time user testing this could barely see it even zoomed in). It is now
     opacity-gated by .has-more, which JS sets only while there is genuinely more to
     scroll to (so it never lingers once the row is scrolled to its end, or shows at
     all when every chip already fits), and paired with a small chevron so the cue
     doesn't depend on noticing a soft edge. */
  .qp-row::after{content:'';position:absolute;right:0;top:29px;bottom:2px;width:40px;
    background:linear-gradient(to right,transparent,var(--paper) 65%);
    pointer-events:none;opacity:0;transition:opacity .2s;}
  .qp-row.has-more::after{opacity:1;}
  .qp-row::before{content:'\203a';position:absolute;right:7px;top:29px;bottom:2px;
    display:flex;align-items:center;font-size:17px;font-weight:800;color:var(--sub-ink);
    pointer-events:none;opacity:0;transition:opacity .2s;z-index:1;}
  .qp-row.has-more::before{opacity:.85;}
  /* 2026-09-10: the card floats over the map instead of sitting above it.
     Above it, it cost 190px of a phone's screen and the map fell to 15% of the
     viewport (round-7 check 47); floating, the map keeps its size and the card
     goes away with one tap. Phones: top of the map (the bottom is below the fold), three doors in a row.
     Wide screens: top-right corner, one line per door, clear of the zoom control. */
  .firstuse{position:absolute;z-index:850;left:12px;right:12px;top:10px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--accent) 7%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 22%,transparent);box-shadow:0 2px 10px rgba(0,0,0,.16);}
  .firstuse[hidden]{display:none;}
  .firstuse .fu-h{font-size:13px;font-weight:700;margin:0 28px 6px 0;}
  .firstuse .fu-x{position:absolute;top:2px;right:2px;background:none;border:none;font-size:15px;line-height:1;padding:6px;cursor:pointer;color:var(--sub-ink);min-width:44px;min-height:44px;}
  .fu-rows{display:flex;flex-wrap:wrap;gap:6px;}
  .fu-row span,.fu-hl{display:none;}
  @media(min-width:700px){.firstuse{left:auto;right:16px;top:16px;width:min(380px,calc(100% - 32px));}
    .fu-rows{display:grid;grid-template-columns:1fr;gap:6px;}
    .fu-row span{display:block;flex:1 1 auto;}.fu-hl{display:inline;}.fu-hs{display:none;}}
  .fu-row{display:flex;align-items:center;gap:8px;font-size:12.5px;line-height:1.4;}
  .fu-row button{flex:0 0 auto;background:var(--accent);color:#fff;border:none;border-radius:999px;padding:5px 11px;font:600 12px/1 inherit;font-family:inherit;cursor:pointer;min-height:32px;min-width:64px;}
  @media(pointer:coarse){.fu-row button{min-height:44px;min-width:72px;}}
  .hotlines{margin:8px 0 4px;padding:9px 11px;border-radius:10px;background:#fff4f4;border:1px solid #f3c9c9;font-size:12.5px;line-height:1.55;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;}
  .hotlines.compact{margin:0 0 10px;font-size:12px;}
  .af-hotlines{flex:0 0 100%;}
  .af-hotlines .hotlines{margin:4px 0 0;}
  .hotlines .hl-lead{font-weight:700;color:#8a1c1c;flex:0 0 100%;}
  .hotlines .hl-line{white-space:nowrap;color:var(--ink);text-decoration:none;}
  .hotlines .hl-line b{color:#a11;}
  .fhint{padding:5px 20px 0;font-size:11px;color:var(--sub-ink);}
  /* 2026-09-10: the reason to come back — ticks and the next deadline — lived
     only inside the guide modal. One line on the landing screen carries it. */
  .guide-progress{display:flex;align-items:center;gap:10px;margin:8px 20px 0;padding:8px 12px;border-radius:10px;background:color-mix(in srgb,var(--accent) 7%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 22%,transparent);font:inherit;font-size:12.5px;color:var(--ink);cursor:pointer;text-align:left;width:calc(100% - 40px);box-sizing:border-box;}
  .guide-progress[hidden]{display:none;}
  .guide-progress .gp-bar{flex:0 0 72px;height:6px;border-radius:3px;background:color-mix(in srgb,var(--accent) 18%,transparent);overflow:hidden;}
  .guide-progress .gp-bar span{display:block;height:100%;background:var(--accent);}
  .guide-progress .gp-dl{margin-left:auto;font-weight:600;color:var(--accent-text);white-space:nowrap;}
  .guide-progress .gp-dl.soon{color:#b3261e;}
  @media(max-width:600px){.guide-progress{margin:6px 12px 0;width:calc(100% - 24px);font-size:12px;}}
  .active-filters{display:flex;flex-wrap:wrap;gap:6px;padding:9px 20px 0;}
  .active-filters[hidden],.fhint[hidden]{display:none;}
  .active-filters:empty{display:none;}
  .fhint:empty{display:none;}
  .af-chip{display:flex;align-items:center;gap:6px;padding:5px 8px 5px 12px;border-radius:16px;background:color-mix(in srgb,var(--accent) 9%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent-text);font-size:11.5px;font-weight:600;}
  .af-chip.af-route{background:color-mix(in srgb,var(--accent) 16%,var(--card));}
  .af-chip .x{width:15px;height:15px;border-radius:50%;background:color-mix(in srgb,var(--accent) 16%,transparent);display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;line-height:1;}
  .af-chip .x:hover{background:var(--accent);color:#fff;}
  .af-clear{font-size:11.5px;color:var(--sub-ink);text-decoration:underline;cursor:pointer;padding:5px 2px;}
  /* region row — horizontal scroll, same component on all breakpoints */
  .reg-row{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 12px;}
  .reg-btn{flex:0 0 auto;padding:7px 14px;border-radius:20px;border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);background:color-mix(in srgb,var(--accent) 7%,var(--card));font-size:12.5px;cursor:pointer;font-weight:590;color:var(--accent-text);user-select:none;white-space:nowrap;transition:all .15s;}
  .reg-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  /* panel sections — one visual system shared by quick-picks / area / category */
  .psec{padding-bottom:15px;margin-bottom:15px;border-bottom:1px solid var(--line);}
  .psec:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
  /* Area and Bus Routes are both flat, single-purpose lists; Favorites' only
     wrinkle (export/import) explains itself inline. Category is the one panel with
     real hidden structure — collapsed groups, a group checkbox that means "all of
     these", a partial-selection state — so it's the one panel that gets an
     upfront line explaining the two gestures, rather than making every panel
     carry a hint most of them don't need. */
  .cat-panel-hint{margin:0 0 10px;font-size:11.5px;line-height:1.55;color:var(--sub-ink);}
  .cat-utils-inline{display:flex;justify-content:flex-end;margin-bottom:8px;}
  .cat-utils{font-size:11px;color:var(--sub-ink);display:flex;gap:6px;align-items:center;}
  .cat-util-btn{cursor:pointer;font-weight:700;color:var(--accent-text);background:none;border:none;font-family:inherit;font-size:inherit;padding:0;}
  /* quick picks */
  .preset-row{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px;margin:0 -20px;padding-left:20px;padding-right:34px;}
  .preset-row::-webkit-scrollbar{display:none;}
  .preset-chip{flex:0 0 auto;white-space:nowrap;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;transition:all .15s;}
  .preset-chip:hover{background:#f1f3f4;border-color:color-mix(in srgb,var(--sage) 35%,var(--line));}
  .preset-chip.active{background:var(--sage);border-color:var(--sage);color:#fff;}
  .preset-chip.qp-guide{background:color-mix(in srgb,var(--accent) 10%,var(--card));border-color:color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--accent-text);font-weight:700;}
  .preset-chip.qp-guide:hover{background:color-mix(in srgb,var(--accent) 16%,var(--card));}
  /* category accordion */
  .cat-wrap{display:flex;flex-direction:column;gap:7px;}
  .cat-group{border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden;}
  .cat-group-label{display:flex;align-items:center;gap:8px;padding:10px 12px;margin:0;font-family:var(--font);font-size:12px;font-weight:600;color:var(--ink);letter-spacing:.1px;cursor:pointer;user-select:none;}
  .grp-expand{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:none;border:none;padding:0;cursor:pointer;font:inherit;color:inherit;text-align:left;}
  .cat-group-label .grp-name{flex:1;min-width:0;}
  .cat-group-label .grp-count{font-size:10.5px;font-weight:700;color:var(--accent-text);white-space:nowrap;}
  .grp-check{width:16px;height:16px;padding:0;background:none;border-radius:5px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10px;line-height:1;flex:0 0 auto;color:#fff;cursor:pointer;font-weight:800;}
  .grp-check.all{background:var(--sage);border-color:var(--sage);}
  .grp-check.none{background:transparent;}
  .grp-check.partial{background:color-mix(in srgb,var(--sage) 55%,var(--card));border-color:var(--sage);color:var(--ink);}
  .cat-group-label .car{font-size:10px;color:var(--sub-ink);transition:transform .15s;flex:0 0 auto;}
  .cat-group.open .cat-group-label .car{transform:rotate(90deg);}
  .cat-grid{display:none;flex-wrap:wrap;gap:5px;padding:0 10px 10px;}
  .cat-group.open .cat-grid{display:flex;}
  .cat-btn{flex:0 0 auto;display:flex;flex-direction:row;align-items:center;gap:3px;padding:6px 10px;border-radius:8px;border:1px solid color-mix(in srgb,var(--bc) 28%,transparent);background:color-mix(in srgb,var(--bc) 10%,var(--card));cursor:pointer;user-select:none;transition:all .13s;font-size:11.5px;font-weight:600;color:var(--bc);white-space:nowrap;min-height:32px;}
  .cat-btn .icon{font-size:13px;line-height:1;}
  .cat-btn.active{background:var(--bc);border-color:var(--bc);color:#fff;box-shadow:0 1px 2px 0 rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);}
  .cat-btn .cnt{font-size:10.5px;font-weight:500;color:var(--sub-ink);}
  .cat-btn.active .cnt{color:#fff;}
  /* Zero in the selected area(s) — kept in the list (see renderCats) rather than
     removed, so it reads as "none here" instead of "not tracked". Colour, not
     opacity, does the muting so the text itself never drops below AA contrast. */
  .cat-btn.zero{background:var(--card);border-color:var(--line);color:var(--sub-ink);cursor:help;}
  .cat-btn.zero .icon{filter:grayscale(1);}
  /* Themes are a second axis, not more categories, so they get their own block at
     the top of this panel and a visual language of their own: a pill rather than a
     square chip, one neutral accent colour rather than 47 category colours. Both
     axes narrow the same map and combine with AND, which the hint text says out
     loud — a reader who ticks "Kids & Family" and "Parks" should not be surprised
     to see fewer pins than either alone. */
  .theme-sec{padding-bottom:15px;margin-bottom:15px;border-bottom:1px solid var(--line);}
  .theme-row{display:flex;flex-wrap:wrap;gap:6px;}
  .theme-btn{flex:0 0 auto;display:flex;align-items:center;gap:4px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font:inherit;font-size:11.5px;font-weight:600;color:var(--ink);white-space:nowrap;min-height:32px;transition:all .13s;}
  .theme-btn .icon{font-size:13px;line-height:1;}
  .theme-btn .cnt{font-size:10.5px;font-weight:500;color:var(--sub-ink);}
  .theme-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 1px 2px 0 rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);}
  .theme-btn.active .cnt{color:#fff;}
  .theme-btn.zero{background:var(--card);border-color:var(--line);color:var(--sub-ink);cursor:help;}
  .theme-btn.zero .icon{filter:grayscale(1);}
  /* Same pill, read-only, inside a place popup — this is where most people will
     first learn the axis exists, so it has to look like the filter it maps to. */
  .pv-themes{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 2px;}
  /* 2026-09-10 — the guide reaches the map ("where do I go" → pin) but the
     map never reached the guide. A reader who opens Service Canada's popup
     sees an address and hours and nothing about the thing they came to do
     there. This line is the guide handed over at the moment it is needed. */
  .pv-task{margin:8px 0 2px;padding:8px 10px;border-radius:9px;background:color-mix(in srgb,var(--accent) 9%,var(--card));
    border:1px solid color-mix(in srgb,var(--accent) 22%,transparent);font-size:12px;line-height:1.45;}
  .pv-task b{display:block;font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--accent-text);margin-bottom:2px;}
  .pv-task-go{display:inline-block;margin-top:3px;background:var(--accent);color:#fff;border:none;border-radius:999px;
    padding:6px 11px;font:600 12px/1 inherit;font-family:inherit;cursor:pointer;min-height:30px;}
  .pv-open{display:inline-block;margin:0 6px 2px 0;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:700;vertical-align:1px;}
  .pv-open.on{background:#e6f4ea;color:#137333;}
  .pv-open.off{background:#f1f3f4;color:#5f6368;}
  .pv-approx{margin:4px 0 2px;font-size:10.5px;line-height:1.5;color:var(--sub-ink);}
  .pv-theme{display:inline-block;font-size:9.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--paper);border:1px solid var(--line);color:var(--sub-ink);}

     for it.
     P0-C: this used to also drop the first-run hint outright, on the theory that
     anyone on a screen this small had already gotten the point — but screen height
     tracks a device's age and price, not the reader's familiarity with the page, so
     that rule silently penalised exactly the people least likely to already know
     how this works. The hint now only ever disappears because hintDismissed says
     so (see refreshHint()); on a screen this tight it shows the hintShort key instead of
     the longer default, which is what actually earns back the space this block is
     tightening everything else for.
     Targets stay at 44px: shrinking them back is not an acceptable trade. */
  @media(max-height:680px) and (max-width:600px){
    header{padding-top:6px;padding-bottom:0;gap:6px 10px;}
    h1{font-size:15.5px;margin-top:0;}

    .status{order:2;flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;
      text-overflow:ellipsis;}
    .reset-btn{order:3;margin-left:0;}
    #map{margin-top:6px;}
    /* Touch targets step down from 44px to 36px here — still half again WCAG 2.5.8's

       the page exists to show. That is the guideline working against its own purpose. */
    @media(pointer:coarse){

anisme, et n’est affiliée à aucune entreprise ou organisation mentionnée, ni ne les représente.</p><p><b>Ce que ce n’est pas.</b> Ce n’est ni un avis juridique, ni un avis médical, ni un conseil en immigration ou en fiscalité. Elle vous dit où aller et à qui demander; pour votre propre situation, demandez à ce « qui » — chaque fiche le nomme. En cas d’urgence, composez le 911.</p><p><b>Ce qui change.</b> Heures, frais et règles changent. Téléphonez avant de partir — c’est notre conseil, et c’est aussi la limite de ce dont nous pouvons répondre. Dans la mesure permise par la loi, nous déclinons toute responsabilité pour une perte découlant de la confiance accordée à cette page.</p><p><b>Tiers.</b> Les sites liés, le fond de carte et les données factuelles (adresses, téléphones) tirées de Google Places relèvent chacun de leurs propres conditions; cette page n’en répond pas.</p><p><b>Corrections et retrait.</b> Si quelque chose est faux, écrivez-nous et nous corrigerons; les changements sont consignés dans le numéro de version. Une correction envoyée peut être utilisée, et l’envoyer vaut accord pour la publier sous la licence de cette page, sans attribution sauf demande. Si vous êtes un organisme mentionné et que l’entrée est erronée, ou que vous préférez ne pas y figurer, écrivez et ce sera changé.</p><p><b>Droit applicable.</b> Cette déclaration est régie par les lois de la Colombie-Britannique, Canada. Cette page s’adresse aux adultes et à leurs familles; elle ne recueille de renseignements personnels auprès de personne.</p>","noteToggleLabel":"ℹ️ À propos des données","regLabel":"📍 Filtrer par secteur","catLabel":"🏷️ Filtrer par catégorie","allReg":"Tous les secteurs","allCat":"✓ Toutes les catégories","noCat":"✕ Tout effacer","nextDayPrefix":"lendemain ","lStopSeq":"Arrêt n°","lStops":"Arrêts","lService":"Heures de service","lFare":"Tarif","busFareText":"Adulte simple 2,25$ · DayPASS 4,50$ · Mensuel 55$ (carte Umo ou paiement sans contact accepté)","busCaveat":"Plage couvrant tous les trajets prévus (incl. service tardif de fin de semaine) — vérifiez les horaires/tarifs exacts sur le site de {TRANSIT}","busBtnLabel":"Lignes de bus","auto":"🚗 Transport","daily":"🏠 Essentiels quotidiens","kids":"👨‍👩‍👧 Lieux pour enfants","newcomer":"🧳 Essentiels résidents","sports":"💪 Sports et fitness","lPhone":"Tél.","lHours":"Heures","lWeb":"Site web →","footer":"Référence personnelle · non officielle · chaque entrée porte une date de vérification et une source · l'organisme lui-même a le dernier mot · Pour les zones scolaires, utilisez l'<a href=\"{SD_URL}\" target=\"_blank\" rel=\"noopener\">outil officiel {SD}</a> · Pour les itinéraires/arrêts de bus, utilisez <a href=\"{TRANSIT_URL}\" target=\"_blank\" rel=\"noopener\">{TRANSIT}</a> · Pour les droits des locataires, voir la <a href=\"https://www2.gov.bc.ca/gov/content/housing-tenancy/residential-tenancies\" target=\"_blank\" rel=\"noopener\">Residential Tenancy Branch de la C.-B.</a> (<b>1-800-665-8779</b>)<br><span class=\"footer-emergency\">🚨 Urgence : <b>911</b> · <b>8-1-1</b> (conseils santé non urgents, interprète en français sur demande) · <b>250-828-3000</b> (GRC non urgent)</span><br>💬 Commentaires et suggestions : <a href=\"mailto:{CONTACT}\">{CONTACT}</a><br><span class=\"footer-privacy\">📊 Cette page enregistre les fonctions utilisées, pour repérer ce qui ne marche pas</span>","edu":"🎓 Éducation","health":"⚕️ Santé","outdoor":"🌳 Plein air","shopping":"🛍️ Achats","lNav":"Itinéraire","feedbackLink":"💬 Commentaires","lCall":"Appeler","lWeb2":"Site web"},"es":{"title":"Guía práctica de {CITY}","sub":"Qué hacer, adónde ir, qué llevar — paso a paso · con un mapa de lugares verificados en toda la ciudad","note":"<h3>⚠️ Fuente y cobertura</h3><p>Esta es una recopilación personal, a partir de Google Places y sitios web oficiales, que cubre todos los vecindarios. Cada categoría muestra los lugares principales (restaurantes/gasolineras, etc. hay cientos — selección curada, no exhaustiva; 🚌 el transporte público muestra los principales intercambiadores con los números de ruta que los sirven solo como referencia — hay demasiadas paradas para enumerarlas todas; las tarifas son aproximadamente $2.25 adulto sencillo/$4.50 DayPASS/$55 mensual (se acepta tarjeta Umo o pago sin contacto) — confirme rutas/tarifas/llegadas en vivo en el sitio de {TRANSIT}).</p><h3>🏢 Notas prácticas</h3><p>Para los alquileres, confirme por teléfono o en el sitio web del edificio. Los horarios pueden cambiar; llame con anticipación para confirmar.</p><h3>📅 Última verificación y declaración</h3><p>Última revisión completa: {DATE}. Cada lugar lleva además su propia fecha de verificación y tipo de fuente; cada ficha enlaza su fuente oficial.</p><p><b>Qué es.</b> Una referencia de vida local en seis idiomas, recopilada por una persona. No la publica ningún gobierno ni organización, y no está afiliada ni representa a ningún negocio u organización aquí listado.</p><p><b>Qué no es.</b> No es asesoría legal, médica, migratoria ni fiscal. Le dice adónde ir y a quién preguntar; para su propia situación, pregunte a ese «quién» — cada ficha lo nombra. En una emergencia, llame al 911.</p><p><b>Lo que cambia.</b> Horarios, tarifas y normas cambian. Llame antes de salir — es nuestro consejo y también el límite de lo que podemos responder. En la medida que la ley permite, no asumimos responsabilidad por pérdidas derivadas de confiar en esta página.</p><p><b>Terceros.</b> Los sitios enlazados, las imágenes del mapa y los datos de hecho (direcciones, teléfonos) tomados de Google Places tienen cada uno sus propios términos; esta página no responde por ellos.</p><p><b>Correcciones y retiro.</b> Si algo está mal, escríbanos y lo corregiremos; los cambios quedan en el número de versión. Una corrección enviada puede usarse, y enviarla se entiende como acuerdo para publicarla bajo la licencia de esta página, sin atribución salvo que la pida. Si usted es una organización listada y la entrada es errónea, o prefiere no aparecer, escriba y se cambiará.</p><p><b>Ley aplicable.</b> Esta declaración se rige por las leyes de Columbia Británica, Canadá. Esta página es para adultos y sus familias; no recopila información personal de nadie.</p>","noteToggleLabel":"ℹ️ Sobre los datos","regLabel":"📍 Filtrar por zona","catLabel":"🏷️ Filtrar por categoría","allReg":"Todas las zonas","allCat":"✓ Todas las categorías","noCat":"✕ Borrar todo","nextDayPrefix":"día siguiente ","lStopSeq":"Parada n.°","lStops":"Paradas","lService":"Horario de servicio","lFare":"Tarifa","busFareText":"Adulto sencillo $2.25 · DayPASS $4.50 · Mensual $55 (se acepta tarjeta Umo o pago sin contacto)","busCaveat":"El rango cubre todos los viajes programados (incl. servicio nocturno de fin de semana) — confirme horarios/tarifas exactos en el horario actual de {TRANSIT}","busBtnLabel":"Rutas de autobús","auto":"🚗 Transporte","daily":"🏠 Esenciales diarios","kids":"👨‍👩‍👧 Lugares para niños","newcomer":"🧳 Esenciales para residentes","sports":"💪 Deportes y fitness","lPhone":"Teléfono","lHours":"Horario","lWeb":"Visitar sitio web →","footer":"Referencia personal · no oficial · cada entrada lleva fecha de verificación y fuente · la última palabra la tiene la oficina · Para zonas escolares use la <a href=\"{SD_URL}\" target=\"_blank\" rel=\"noopener\">herramienta oficial de {SD}</a> · Para rutas/paradas de autobús y llegadas en vivo use <a href=\"{TRANSIT_URL}\" target=\"_blank\" rel=\"noopener\">{TRANSIT}</a> · Para derechos del inquilino/depósitos/avisos vea la <a href=\"https://www2.gov.bc.ca/gov/content/housing-tenancy/residential-tenancies\" target=\"_blank\" rel=\"noopener\">Oficina de Arrendamientos Residenciales de BC (RTB)</a> (<b>1-800-665-8779</b>)<br><span class=\"footer-emergency\">🚨 Emergencias: <b>911</b> · <b>8-1-1</b> (asesoría de salud no urgente, intérprete en español a pedido) · <b>250-828-3000</b> (RCMP no urgente)</span><br>💬 Comentarios y sugerencias: <a href=\"mailto:{CONTACT}\">{CONTACT}</a><br><span class=\"footer-privacy\">📊 Esta página registra qué funciones se usan, para detectar lo que no funciona</span>","edu":"🎓 Educación","health":"⚕️ Salud","outdoor":"🌳 Aire libre","shopping":"🛍️ Compras","lNav":"Cómo llegar","feedbackLink":"💬 Comentarios","lCall":"Llamar","lWeb2":"Sitio web"},"ko":{"title":"{CITY} 생활 가이드","sub":"무엇을 해야 하는지, 어디로 가야 하는지, 무엇을 가져가야 하는지 — 단계별로 · 도시 전역의 확인된 장소 지도 포함","note":"<h3>⚠️ 출처 및 수집 범위</h3><p>이 페이지는 개인이 Google Places와 각 기관 공식 웹사이트를 참고해 정리한 자료이며, 모든 지역을 포함합니다. 각 분류는 해당 지역의 주요 장소를 선별한 것입니다(식당/주유소 등은 수백 곳에 달해 전체 목록이 아닙니다; 🚌 대중교통은 주요 환승 거점과 참고용 노선 번호만 표시하며, 정류장이 매우 많아 전부 나열할 수 없습니다. 요금은 대략 성인 편도 $2.25 · 데이패스 $4.50 · 월정기권 $55입니다(Umo 카드 또는 탭 결제 가능) — 정확한 노선/요금/실시간 도착 정보는 {TRANSIT} 공식 웹사이트를 확인하세요).</p><h3>🏢 실용 안내</h3><p>아파트 임대료는 전화 또는 해당 건물 웹사이트로 확인하세요. 운영시간은 변경될 수 있으니 방문 전 전화로 확인하는 것이 좋습니다.</p><h3>📅 최종 확인일 및 안내</h3><p>마지막 전체 점검: {DATE}. 각 장소에는 자체 확인일과 출처 유형이, 각 카드에는 공식 출처 링크가 있습니다.</p><p><b>이것은 무엇인가.</b> 한 사람이 정리한 여섯 언어의 지역 생활 참고 자료입니다. 어떤 정부나 기관이 발행한 것이 아니며, 여기 나열된 어떤 업체·기관과도 관련이 없고 그들을 대표하지 않습니다.</p><p><b>이것이 아닌 것.</b> 법률·의료·이민·세무 조언이 아닙니다. 어디로 가고 누구에게 물을지를 알려줄 뿐이며, 본인의 상황은 그 “누구”에게 물으세요 — 모든 카드에 적혀 있습니다. 응급 상황에는 911.</p><p><b>바뀌는 것들.</b> 운영시간, 비용, 규정은 바뀝니다. 출발 전에 전화하세요 — 이것이 우리의 조언이자, 우리가 책임질 수 있는 경계입니다. 법이 허용하는 범위에서, 이 페이지를 신뢰함으로써 생긴 손실에 대해 책임을 지지 않습니다.</p><p><b>제3자.</b> 링크된 사이트, 지도 배경, Google Places에서 가져온 주소·전화 등 사실 정보는 각자의 약관을 따르며, 이 페이지가 책임지지 않습니다.</p><p><b>정정과 삭제.</b> 틀린 것이 있으면 알려주세요. 고치고, 변경은 버전 번호에 기록합니다. 보내주신 정정은 사용될 수 있으며, 보내는 것은 이 페이지의 라이선스로 게시하는 데 동의하는 것으로 봅니다(요청이 없으면 익명). 여기 나열된 기관으로서 정보가 틀렸거나 나열되기를 원치 않으면 알려주세요. 바로 바꿉니다.</p><p><b>준거법.</b> 이 안내는 캐나다 브리티시컬럼비아주 법의 적용을 받습니다. 이 페이지는 성인과 그 가족을 위한 것이며, 누구의 개인정보도 수집하지 않습니다.</p>","noteToggleLabel":"ℹ️ 데이터 안내","regLabel":"📍 지역별 필터","catLabel":"🏷️ 분류별 필터","allReg":"전체 지역","allCat":"✓ 전체 분류","noCat":"✕ 분류 초기화","nextDayPrefix":"익일 ","lStopSeq":"정류장 순서","lStops":"정류장 수","lService":"운행 시간","lFare":"요금","busFareText":"성인 편도 $2.25 · 데이패스 $4.50 · 월정기권 $55 (Umo 카드 또는 탭 결제 가능)","busCaveat":"위 시간대는 해당 노선의 전체 운행 범위입니다(주말 연장 운행 포함) — 정확한 시간/요금은 {TRANSIT} 공식 시간표를 확인하세요","busBtnLabel":"버스 노선","auto":"🚗 교통","daily":"🏠 생활 필수","kids":"👨‍👩‍👧 아이와 갈 곳","newcomer":"🧳 주민 필수","sports":"💪 스포츠·피트니스","lPhone":"전화","lHours":"시간","lWeb":"웹사이트 방문 →","footer":"개인이 정리한 참고 자료 · 비공식 · 모든 항목에 확인일과 출처 표기 · 최종 확인은 해당 기관에 · 학군 배정은 <a href=\"{SD_URL}\" target=\"_blank\" rel=\"noopener\">{SD} 공식 도구</a>로 확인 · 버스 노선/정류장/실시간 도착 정보는 <a href=\"{TRANSIT_URL}\" target=\"_blank\" rel=\"noopener\">{TRANSIT} 웹사이트</a>에서 조회 · 임대 분쟁/보증금/퇴거 통지 등은 <a href=\"https://www2.gov.bc.ca/gov/content/housing-tenancy/residential-tenancies\" target=\"_blank\" rel=\"noopener\">BC주 주택임대청(RTB)</a>(<b>1-800-665-8779</b>)에 문의<br><span class=\"footer-emergency\">🚨 긴급 전화: <b>911</b>(긴급상황) · <b>8-1-1</b>(비응급 건강 상담, 한국어 통역 요청 가능) · <b>250-828-3000</b>(RCMP 비응급)</span><br>💬 의견 및 제안: <a href=\"mailto:{CONTACT}\">{CONTACT}</a><br><span class=\"footer-privacy\">📊 이 페이지는 어떤 기능이 쓰였는지 기록합니다 — 무엇이 잘 안 되는지 찾기 위해서입니다</span>","edu":"🎓 교육","health":"⚕️ 의료","outdoor":"🌳 야외활동","shopping":"🛍️ 쇼핑","lNav":"길찾기","feedbackLink":"💬 피드백","lCall":"전화","lWeb2":"웹사이트"},"ja":{"title": "{CITY} 生活ガイド", "sub": "何をすべきか、どこへ行くか、何を持っていくか — 順を追って · 市内全域の確認済みスポット地図つき", "note": "<h3>⚠️ データの出典と収録範囲</h3><p>本ページのデータは個人が作成したもので、Google Placesおよび各機関の公式サイトから収集し、市内全域をカバーしています。各カテゴリーには主要なスポットを厳選して掲載しています（レストラン・ガソリンスタンドなどは市内に数百件あり、全てを網羅したリストではありません。🚌公共交通機関は主要な乗換拠点のみを表示し、備考欄に記載する経由路線番号は参考情報です。停留所が非常に多いため全ては掲載できません。運賃は目安として大人片道$2.25・1日券$4.50・月間パス$55です（Umoカードまたはタップ決済対応）。正確な路線・運賃・リアルタイムの到着情報は{TRANSIT}の公式サイトでご確認ください）。</p><h3>🏢 実用的な注意事項</h3><p>賃貸料金は電話または公式サイトでご確認ください。営業時間は変更される場合があるため、訪問前に電話でご確認することをお勧めします。</p><h3>📅 最終確認日と声明</h3><p>最後の全体確認: {DATE}。各場所には個別の確認日と出典の種類が、各カードには公式の出典リンクがあります。</p><p><b>これは何か。</b>一人が編集した六言語の地域生活の参考資料です。政府や団体が発行したものではなく、掲載されたいかなる事業者・団体とも関係がなく、それらを代表するものでもありません。</p><p><b>これは何でないか。</b>法律・医療・移民・税務の助言ではありません。どこへ行き誰に聞くかを示すだけで、ご自身の状況はその「誰か」に聞いてください — 各カードに名前があります。緊急時は911へ。</p><p><b>変わるもの。</b>営業時間、料金、規則は変わります。出かける前に電話を — それが私たちの助言であり、私たちが責任を持てる境界でもあります。法律の許す範囲で、このページへの依拠から生じた損失について責任を負いません。</p><p><b>第三者。</b>リンク先のサイト、地図の背景、Google Placesから得た住所・電話などの事実データは、それぞれの規約に従い、このページは責任を負いません。</p><p><b>訂正と削除。</b>誤りがあればお知らせください。修正し、変更はバージョン番号に記録します。送られた訂正は採用されることがあり、送信はこのページのライセンスで公開することへの同意とみなします（希望がなければ無記名）。掲載団体で、記載が誤っているか掲載を望まない場合は、お知らせいただければ変更します。</p><p><b>準拠法。</b>この声明はカナダ・ブリティッシュコロンビア州の法律に準拠します。このページは成人とその家族向けで、誰の個人情報も収集しません。</p>", "noteToggleLabel": "ℹ️ データについて", "regLabel": "📍 エリアで絞り込み", "catLabel": "🏷️ カテゴリーで絞り込み", "allReg": "すべてのエリア", "allCat": "✓ すべてのカテゴリー", "noCat": "✕ すべて解除", "nextDayPrefix": "翌日", "lStopSeq": "停留所順", "lStops": "停留所数", "lService": "運行時間", "lFare": "運賃", "busFareText": "大人片道$2.25 · 1日券$4.50 · 月間パス$55（Umoカードまたはタップ決済対応）", "busCaveat": "上記は当該路線の全便の運行時間帯です（週末延長便を含む）— 正確な時刻・運賃は{TRANSIT}の公式時刻表でご確認ください", "busBtnLabel": "バス路線", "auto": "🚗 交通", "daily": "🏠 暮らしの基本", "kids": "👨‍👩‍👧 子供向け施設", "newcomer": "🧳 住民の手続き先", "sports": "💪 スポーツ・フィットネス", "lPhone": "電話", "lHours": "時間", "lWeb": "公式サイトへ →", "footer": "個人がまとめた参考資料 · 非公式 · 各項目に確認日と出典を記載 · 最終確認は機関へ · 学区の割り当ては<a href=\"{SD_URL}\" target=\"_blank\" rel=\"noopener\">{SD}公式ツール</a>でご確認ください · バス路線・停留所・リアルタイム到着情報は<a href=\"{TRANSIT_URL}\" target=\"_blank\" rel=\"noopener\">{TRANSIT}公式サイト</a>でご確認ください · 賃貸トラブル・敷金・退去通知などは<a href=\"https://www2.gov.bc.ca/gov/content/housing-tenancy/residential-tenancies\" target=\"_blank\" rel=\"noopener\">BC州住宅賃貸局（RTB）</a>（<b>1-800-665-8779</b>）へ<br><span class=\"footer-emergency\">🚨 緊急電話: <b>911</b>（緊急時）· <b>8-1-1</b>（非緊急の健康相談、日本語通訳依頼可）· <b>250-828-3000</b>（RCMP非緊急）</span><br>💬 ご意見・ご提案: <a href=\"mailto:{CONTACT}\">{CONTACT}</a><br><span class=\"footer-privacy\">📊 このページは、どの機能が使われたかを記録しています（うまくいっていない箇所を見つけるため）</span>", "edu": "🎓 教育", "health": "⚕️ 医療", "outdoor": "🌳 アウトドア", "shopping": "🛍️ ショッピング", "lNav": "経路案内", "feedbackLink": "💬 フィードバック", "lCall": "電話", "lWeb2": "公式サイト"}};

UI.en.legalSum=[['A reference compiled by one person','Six languages; not published by any government or organisation, and not speaking for any organisation listed.'],['Every entry carries a verification date and a source','Anything unchecked for more than six months is flagged at build time.'],['Not legal, medical, immigration or tax advice','It says where to go and who to ask; for your own case, ask the “who” the card names. In an emergency, call 911.'],['Hours and fees change','Phone before you set out — our advice, and the edge of what we can answer for.'],['If something is wrong, write','It gets fixed; an organisation that would rather not be listed is removed on request.']];
UI.fr.legalSum=[['Une référence compilée par une personne','Six langues; publiée par aucun gouvernement ni organisme, et ne parlant pour aucune organisation mentionnée.'],['Chaque entrée porte une date de vérification et une source','Tout ce qui n’a pas été revérifié depuis plus de six mois est signalé à la compilation.'],['Ni avis juridique, médical, en immigration ou fiscal','Cela dit où aller et à qui demander; pour votre cas, adressez-vous au « qui » nommé sur la fiche. En urgence, le 911.'],['Heures et frais changent','Téléphonez avant de partir — notre conseil, et la limite de ce dont nous répondons.'],['Une erreur ? Écrivez-nous','Elle sera corrigée; un organisme qui préfère ne pas figurer est retiré sur demande.']];
UI.es.legalSum=[['Una referencia recopilada por una persona','Seis idiomas; no la publica ningún gobierno ni organización, y no habla por ninguna organización listada.'],['Cada entrada lleva fecha de verificación y fuente','Lo que lleve más de seis meses sin revisar se marca al compilar.'],['No es asesoría legal, médica, migratoria ni fiscal','Dice adónde ir y a quién preguntar; para su caso, pregunte al «quién» que nombra la ficha. En emergencia, 911.'],['Horarios y tarifas cambian','Llame antes de salir — nuestro consejo, y el límite de lo que respondemos.'],['Si algo está mal, escriba','Se corrige; una organización que prefiera no figurar se retira a petición.']];

UI.zh.privacySum=[['不知道你是谁','不收集姓名、邮箱、电话；不写 Cookie；服务端不记录 IP 地址。'],['位置和收藏都不出这台设备','点“附近”拿到的坐标只用来把地图移到你身边，不发送也不保存；收藏只存在你自己的浏览器里。'],['会记录你用到了哪些功能','点开了哪些地点、搜了什么词、屏幕多大——用来找出哪里做得不好。地图底图和访问统计由两家第三方提供，它们会看到你的 IP——和任何网页地图一样。每一条都可以在浏览器的网络面板里自己看。']];
UI.en.privacySum=[['It does not know who you are','No name, email or phone number is collected, no cookies are set, and no IP address is recorded on the server.'],['Your location and favourites never leave this device','Coordinates from Near Me only move the map to where you are — they are never sent or stored. Favourites live in your own browser.'],['It does record which features you use','Which places you open, what you search for, how big your screen is — used to find what isn’t working. The map imagery and the visit count come from two third parties, who see your IP address — as with any web map. You can read every request in your browser’s network panel.']];
UI.fr.privacySum=[['Elle ne sait pas qui vous êtes','Aucun nom, courriel ni numéro de téléphone n’est recueilli, aucun témoin n’est déposé et aucune adresse IP n’est enregistrée côté serveur.'],['Votre position et vos favoris ne quittent pas cet appareil','Les coordonnées de « Près de moi » servent uniquement à centrer la carte — elles ne sont ni envoyées ni conservées. Les favoris restent dans votre navigateur.'],['Elle enregistre bien les fonctions que vous utilisez','Les lieux ouverts, vos recherches, la taille de votre écran — pour repérer ce qui ne marche pas. Le fond de carte et le compteur de visites viennent de deux tiers, qui voient votre adresse IP — comme toute carte web. Vous pouvez lire chaque requête dans l’onglet Réseau de votre navigateur.']];
UI.es.privacySum=[['No sabe quién es usted','No se recopila nombre, correo ni teléfono, no se instalan cookies y no se registra su dirección IP en el servidor.'],['Su ubicación y sus favoritos no salen de este dispositivo','Las coordenadas de «Cerca de mí» solo sirven para centrar el mapa — nunca se envían ni se guardan. Los favoritos quedan en su propio navegador.'],['Sí registra qué funciones usa','Qué lugares abre, qué busca, qué tamaño tiene su pantalla — para detectar lo que no funciona. Las imágenes del mapa y el contador de visitas vienen de dos terceros, que ven su dirección IP — como en cualquier mapa web. Puede leer cada solicitud en el panel Red de su navegador.']];
UI.ko.privacySum=[['사용자가 누구인지 모릅니다','이름·이메일·전화번호를 수집하지 않고, 쿠키를 쓰지 않으며, 서버에 IP 주소를 기록하지 않습니다.'],['위치와 즐겨찾기는 이 기기를 벗어나지 않습니다','“내 주변”으로 얻은 좌표는 지도를 옮기는 데만 쓰이고 전송되거나 저장되지 않습니다. 즐겨찾기는 사용자의 브라우저에만 있습니다.'],['어떤 기능을 썼는지는 기록합니다','어떤 장소를 열었는지, 무엇을 검색했는지, 화면 크기가 얼마인지 — 무엇이 잘 안 되는지 찾기 위해서입니다. 지도 배경과 방문자 수는 두 곳의 제3자가 제공하며, 그들은 IP 주소를 보게 됩니다 — 모든 웹 지도와 같습니다. 이 요청들은 브라우저 네트워크 패널에서 직접 확인할 수 있습니다.']];
UI.ja.privacySum=[['あなたが誰かは分かりません','氏名・メールアドレス・電話番号は収集せず、Cookieも使わず、サーバーにIPアドレスを記録することもありません。'],['位置情報とお気に入りはこの端末から出ません','「近く」で取得した座標は地図を動かすためだけに使われ、送信も保存もされません。お気に入りはご自身のブラウザにのみ保存されます。'],['どの機能が使われたかは記録します','開いた場所、検索した語、画面の大きさ — うまくいっていない箇所を見つけるためです。地図の背景と訪問数は二つの第三者が提供し、彼らはIPアドレスを見ます — どのウェブ地図でも同じです。これらのリクエストはブラウザのネットワークパネルですべて確認できます。']];

UI.zh.privacyNote='🔒 隐私：本页面不收集姓名、邮箱、电话、精确位置这类个人身份信息，收藏夹只存在你自己的浏览器里。为了了解哪些功能真正有用，页面会发送匿名使用数据，内容包括你点开了哪些地点、用了哪些功能、在搜索框里输入的文字（会先去掉连续数字并截断，用来判断大家在找什么）、把你带到这里的那个网站的域名（只有域名，没有具体网址）、你的屏幕落在手机／平板／电脑哪一档（只有这三个值，用来判断布局在哪种屏幕上不好用），以及这个页面是从浏览器打开的还是已经装到桌面上。同时会有一个在你浏览器本地随机生成的标识符，它保存在浏览器里、下次再来仍然是同一个，用来区分回访，但不与任何身份信息关联，也不跨站点或跨设备追踪；不写 Cookie，服务端不记录 IP 地址。这些请求在浏览器开发者工具的网络面板里可以逐条看到全部内容（/api/event）。页面加载时还会向另外两个第三方发出请求：地图底图（OpenStreetMap 的瓦片服务器），以及 Cloudflare Web Analytics 的统计脚本（static.cloudflareinsights.com，不写 Cookie、不做个人追踪，只汇总访问量等指标）。这两者在请求过程中都会看到你的 IP —— 前者是所有网页地图的共同机制。断网时除底图外全部功能照常可用。如果你点击“附近”按钮来定位自己，浏览器会请求位置权限；坐标只会在你自己的设备上使用来让地图居中，绝不会发送到我们的服务器，也不会被记录。';

UI.en.privacyNote='🔒 Privacy: this page does not collect identifying information such as your name, email, phone number or precise location, and your favourites stay in your own browser. To understand which parts are actually useful it does send anonymous usage data — which places you open, which features you use, the text you type into the search box (digit runs stripped and truncated, so it shows what people look for rather than an address), the domain of whatever site linked you here (the domain only, never the full address), which of three buckets your screen falls into (phone / tablet / desktop — just those three values, so layout problems can be traced to a screen size), and whether the page was opened in a browser or installed to your home screen. It also uses a random identifier generated locally in your browser; it is stored there and stays the same on your next visit so return use can be told apart, but it is not linked to any identity and does not track you across sites or devices. No cookies are set and no IP address is recorded on the server. You can inspect every one of these requests in full in your browser\'s DevTools Network panel (/api/event). Two other third parties receive a request when the page loads: OpenStreetMap\'s tile servers for the map imagery, and Cloudflare Web Analytics (static.cloudflareinsights.com — no cookies, no individual tracking, aggregate visit counts only). Both see your IP address in the process; for the map that is the same as any web map. Offline, everything but the imagery still works. If you tap the Near Me button, your browser will ask for location permission; your coordinates are used only on your own device to centre the map — they are never sent to our server or logged.';

UI.fr.privacyNote='🔒 Confidentialité : cette page ne recueille pas d\'informations identifiantes comme votre nom, courriel, téléphone ou position précise, et vos favoris restent dans votre propre navigateur. Pour savoir quelles parties servent vraiment, elle envoie des données d\'usage anonymes — les lieux que vous ouvrez, les fonctions que vous utilisez, le texte saisi dans la recherche (suites de chiffres retirées et texte tronqué), le domaine du site qui vous a amené ici (le domaine seul, jamais l\'adresse complète), la catégorie de votre écran parmi trois (téléphone / tablette / ordinateur — ces trois valeurs seulement, pour rattacher un problème de mise en page à une taille d\'écran), et si la page a été ouverte dans un navigateur ou installée sur votre écran d\'accueil. Elle utilise aussi un identifiant aléatoire généré localement dans votre navigateur; il y est conservé et reste le même à votre prochaine visite afin de distinguer les retours, sans être lié à une identité ni vous suivre entre sites ou appareils. Aucun témoin (cookie) n\'est déposé et aucune adresse IP n\'est enregistrée côté serveur. Vous pouvez inspecter chacune de ces requêtes dans l\'onglet Réseau des outils de développement (/api/event). Deux autres tiers reçoivent une requête au chargement : les serveurs de tuiles d\'OpenStreetMap pour le fond de carte, et Cloudflare Web Analytics (static.cloudflareinsights.com — sans témoins, sans suivi individuel, uniquement des totaux de visites). Les deux voient alors votre adresse IP; pour la carte, c\'est le cas de toute carte web. Hors ligne, tout fonctionne sauf le fond de carte. Si vous touchez le bouton Près de moi, votre navigateur demandera l\'autorisation de localisation; vos coordonnées ne servent qu\'à centrer la carte sur votre propre appareil — elles ne sont jamais envoyées à notre serveur ni enregistrées.';

UI.es.privacyNote='🔒 Privacidad: esta página no recopila información identificativa como su nombre, correo, teléfono o ubicación precisa, y sus favoritos permanecen en su propio navegador. Para saber qué partes resultan útiles sí envía datos de uso anónimos: qué lugares abre, qué funciones usa, el texto que escribe en el buscador (se eliminan las secuencias de dígitos y se recorta), el dominio del sitio que le trajo hasta aquí (solo el dominio, nunca la dirección completa), en cuál de tres categorías cae su pantalla (teléfono / tableta / computadora — solo esos tres valores, para poder atribuir un problema de diseño a un tamaño de pantalla) y si la página se abrió en un navegador o está instalada en su pantalla de inicio. También usa un identificador aleatorio generado localmente en su navegador; se guarda allí y sigue siendo el mismo en su próxima visita para distinguir las vueltas, sin vincularse a ninguna identidad ni seguirle entre sitios o dispositivos. No se instalan cookies ni se registra su dirección IP en el servidor. Puede inspeccionar cada una de estas solicitudes en el panel Red de las herramientas de desarrollo (/api/event). Al cargar la página, otros dos terceros reciben una solicitud: los servidores de teselas de OpenStreetMap para el mapa base y Cloudflare Web Analytics (static.cloudflareinsights.com: sin cookies, sin seguimiento individual, solo recuentos agregados de visitas). Ambos ven su dirección IP en el proceso; en el caso del mapa, como cualquier mapa web. Sin conexión, todo funciona salvo las imágenes del mapa. Si toca el botón Cerca de mí, su navegador solicitará permiso de ubicación; sus coordenadas se usan solo en su propio dispositivo para centrar el mapa — nunca se envían a nuestro servidor ni se registran.';

UI.ko.privacyNote='🔒 개인정보: 이 페이지는 이름·이메일·전화번호·정확한 위치 같은 식별 정보를 수집하지 않으며, 즐겨찾기는 사용자의 브라우저에만 저장됩니다. 어떤 기능이 실제로 도움이 되는지 파악하기 위해 익명 사용 데이터는 전송합니다 — 어떤 장소를 열었는지, 어떤 기능을 썼는지, 검색창에 입력한 텍스트(연속된 숫자는 제거하고 길이를 잘라냅니다), 이곳으로 연결해 준 사이트의 도메인(도메인만이며 전체 주소는 아닙니다), 화면이 휴대폰·태블릿·데스크톱 중 어디에 해당하는지(이 세 값뿐이며, 레이아웃 문제를 화면 크기와 연결하기 위한 것입니다), 그리고 이 페이지를 브라우저에서 열었는지 홈 화면에 설치해 열었는지입니다. 또한 브라우저에서 로컬로 생성된 임의 식별자를 사용합니다. 브라우저에 저장되어 다음 방문에도 동일하게 유지되므로 재방문을 구분할 수 있지만, 어떤 신원과도 연결되지 않고 사이트나 기기를 넘나들며 추적하지 않습니다. 쿠키는 사용하지 않으며 서버에 IP 주소를 기록하지 않습니다. 이 요청들은 브라우저 개발자도구 네트워크 패널에서 내용 전체를 확인할 수 있습니다(/api/event). 페이지를 열면 두 곳의 제3자에 요청이 전송됩니다: 지도 배경 이미지를 위한 OpenStreetMap 타일 서버, 그리고 Cloudflare Web Analytics(static.cloudflareinsights.com — 쿠키 없음, 개인 추적 없음, 방문 수 등 집계 지표만). 두 곳 모두 이 과정에서 사용자의 IP를 보게 되며, 지도의 경우 모든 웹 지도와 동일합니다. 오프라인에서도 배경 이미지를 제외한 모든 기능이 작동합니다. "내 주변" 버튼을 누르면 브라우저가 위치 권한을 요청합니다. 좌표는 사용자의 기기에서만 지도를 이동하는 데 사용되며, 서버로 전송되거나 기록되지 않습니다.';UI.ja.privacyNote='🔒 プライバシー: このページは氏名、メールアドレス、電話番号、正確な位置情報などの識別情報を収集せず、お気に入りはご自身のブラウザにのみ保存されます。どの機能が実際に役立っているかを把握するため、匿名の利用データは送信しています — 開いた場所、使った機能、検索ボックスに入力したテキスト（連続する数字は除去・切り詰めた上で、住所そのものではなく検索されている内容が分かるようにしています）、このページへのリンク元サイトのドメイン（ドメインのみで、完全なアドレスは含みません）、画面が3種類のうちどれに当たるか（スマートフォン／タブレット／パソコンの3値のみで、レイアウトの問題を画面サイズと関連付けるためのものです）、そしてこのページをブラウザで開いたのかホーム画面に追加して開いたのかです。また、ブラウザ内でローカルに生成されるランダムな識別子も使用します。これはブラウザに保存され次回訪問時も同じ値のままなので再訪問を区別できますが、いかなる身元とも結び付かず、サイトや端末をまたいで追跡することもありません。Cookieは使用せず、サーバー側でIPアドレスを記録することもありません。これらのリクエストはすべて、ブラウザの開発者ツールのネットワークパネル（/api/event）で内容を確認できます。ページの読み込み時には、他に2つの第三者にもリクエストが送られます: 地図画像用のOpenStreetMapのタイルサーバーと、Cloudflare Web Analytics（static.cloudflareinsights.com — Cookieなし、個人の追跡なし、集計された訪問数のみ）です。どちらもこの過程でIPアドレスを取得しますが、地図についてはどのウェブ地図でも同様です。オフラインでも、地図画像以外はすべて利用できます。「近く」ボタンをタップすると、ブラウザが位置情報の許可を求めます。取得した座標はご自身の端末上で地図を中心に合わせるためだけに使われ、サーバーに送信されたり記録されたりすることはありません。';

UI.ko.busCoverage='{TRANSIT}가 이 도시에서 운행하는 14개 정규 노선이 모두 포함되어 있습니다. 8·11·12·15번 노선은 존재하지 않습니다 — 번호가 건너뛸 뿐, 누락이 아닙니다. 이 밖에 등교일에만 운행하는 학생 전용 노선 12개(70–81번)는 포함하지 않았습니다. 노선·정류장·운행 시간은 {TRANSIT} 공식 GTFS 데이터(2026년 8월 29일판)와 한 건씩 대조했으며 475개 정류장이 모두 일치했습니다. 실시간 도착 정보는 {TRANSIT} 웹사이트를 확인하세요.';UI.ja.busCoverage='{TRANSIT}がこの都市で運行する14の定期路線をすべて収録しています。8、11、12、15番の路線は存在しません — 番号が欠番になっているだけで、抜け漏れではありません。このほか、登校日のみ運行する学生専用路線12路線（70〜81番）は収録していません。路線・停留所・運行時間は{TRANSIT}の公式GTFSフィード（2026年8月29日版）と1件ずつ照合し、475の停留所すべてが一致しました。リアルタイムの到着情報は{TRANSIT}をご確認ください。';

UI.zh.catPanelHint='点组名展开查看子分类；勾选整组前的方框可一次选中该组。这里每个分类的颜色和图标都和地图上的图钉一致——这份列表也可以当图例查阅。一个都不勾选时会显示全部分类；勾选是“只看这些”，并不是“隐藏这些”——没有单独隐藏某个分类的功能，只能缩小到你勾选的那几个。生活服务/医疗/住房/购物餐饮这四组默认展开，是因为居民最先用到，其余分组默认收起。';

UI.en.lowPrecision='📍 This pin is approximate — it can sit about 100 m off. The address above is the accurate part, and it is what the Directions button uses.';
UI.fr.lowPrecision='📍 Ce repère est approximatif — il peut être décalé d’une centaine de mètres. C’est l’adresse ci-dessus qui est exacte, et c’est elle qu’utilise le bouton Itinéraire.';
UI.es.lowPrecision='📍 Este marcador es aproximado — puede desviarse unos 100 m. La dirección de arriba es la parte exacta, y es la que usa el botón Cómo llegar.';
UI.ko.lowPrecision='📍 이 핀은 대략적인 위치로 100m 정도 어긋날 수 있습니다. 정확한 것은 위의 주소이며, “길찾기” 버튼도 주소를 사용합니다.';UI.ja.lowPrecision='📍 このピンはおおよその位置で、100mほどずれることがあります。正確なのは上の住所で、「経路案内」ボタンもこの住所を使用します。';
UI.zh.themeLabel='🧭 按主题筛选（可与分类叠加）';
UI.en.themeLabel='🧭 Filter by theme (stacks with categories)';
UI.fr.themeLabel='🧭 Filtrer par thème (se combine aux catégories)';
UI.es.themeLabel='🧭 Filtrar por tema (se suma a las categorías)';
UI.ko.themeLabel='🧭 테마로 필터 (분류와 함께 적용)';UI.ja.themeLabel='🧭 テーマで絞り込む（カテゴリーと併用可）';
UI.zh.themeHint='主题是“打卡点”的另一种分法：一个地点可以同时属于多个主题，也会和上面的分类重叠——图书馆既是「亲子遛娃」也是「免费低价」「冬天室内」「学生常用」。勾选多个主题表示“同时满足”，因此选得越多结果越少；主题、分类、区域三者是叠加生效的。不勾选任何主题时不做主题筛选。';
UI.en.themeHint='Themes are a second way of slicing the same places: one place can carry several, and they deliberately overlap the categories above — a library is at once Kids & Family, Free & Low-cost, Indoor / Winter and Student Life. Ticking more than one theme means "all of them", so each extra tick narrows the result. Themes, categories and areas all apply together. With no theme ticked, no theme filter is applied.';
UI.fr.themeHint='Les thèmes découpent les mêmes lieux autrement : un lieu peut en porter plusieurs, et ils recoupent volontairement les catégories ci-dessus — une bibliothèque est à la fois « Enfants et famille », « Gratuit ou abordable », « Intérieur / hiver » et « Vie étudiante ». Cocher plusieurs thèmes signifie « tous à la fois » : chaque coche supplémentaire restreint le résultat. Thèmes, catégories et secteurs s’appliquent ensemble. Aucun thème coché = aucun filtre par thème.';
UI.es.themeHint='Los temas son otra forma de agrupar los mismos lugares: un lugar puede tener varios y se solapan a propósito con las categorías de abajo — una biblioteca es a la vez "Niños y familia", "Gratis o económico", "Bajo techo / invierno" y "Vida estudiantil". Marcar más de un tema significa "todos a la vez", así que cada marca adicional reduce el resultado. Temas, categorías y zonas se aplican juntos. Sin ningún tema marcado, no se aplica filtro por tema.';
UI.ko.themeHint='테마는 같은 장소를 다른 방식으로 나눈 축입니다. 한 장소가 여러 테마를 가질 수 있고, 아래의 분류와 일부러 겹칩니다 — 도서관은 “아이·가족”이면서 동시에 “무료·저렴”, “실내·겨울”, “학생 생활”이기도 합니다. 테마를 여러 개 선택하면 "모두 해당"을 뜻하므로 선택할수록 결과가 줄어듭니다. 테마·분류·지역은 모두 함께 적용됩니다. 아무것도 선택하지 않으면 테마 필터는 적용되지 않습니다.';UI.ja.themeHint='テーマは同じ場所を別の切り口で分類したものです。1つの場所が複数のテーマを持つことがあり、上のカテゴリーとあえて重なる部分もあります — 図書館は「子供・家族」であると同時に「無料・低価格」「屋内・冬向け」「学生生活」でもあります。複数のテーマにチェックを入れると「すべてに該当」という意味になるため、チェックを増やすほど結果は絞られます。テーマ、カテゴリー、エリアはすべて同時に適用されます。テーマを何もチェックしていない場合、テーマによる絞り込みは行われません。';
UI.zh.themeZeroHint='在当前的区域/分类/主题组合下没有符合的地点。试着少勾一个条件。';
UI.en.themeZeroHint='Nothing matches this combination of area, category and theme. Try un-ticking one of them.';
UI.fr.themeZeroHint='Rien ne correspond à cette combinaison de secteur, de catégorie et de thème. Essayez de décocher l’un d’eux.';
UI.es.themeZeroHint='Nada coincide con esta combinación de zona, categoría y tema. Pruebe a desmarcar uno.';
UI.ko.themeZeroHint='현재의 지역·분류·테마 조합에 해당하는 장소가 없습니다. 조건을 하나 해제해 보세요.';UI.ja.themeZeroHint='現在のエリア、カテゴリー、テーマの組み合わせに該当する場所がありません。条件を1つ解除してみてください。';
UI.zh.catZeroHint='当前选择的区域内没有这个分类的地点（换个区域或选“全部区域”可能会有）。';
UI.zh.busPanelHint='选中一条线路会把它画在地图上，和当前显示的其他地点共存——不会筛选或隐藏它们；再点一次线路（或点提示条上的✕）可以取消选中。';
UI.en.clearCatFilter='✕ Clear category filter';UI.en.doneBtn='Done';UI.en.presetAdjusted='adjusted by hand';UI.en.presetAdjustedShort='(edited)';
UI.en.catPanelHint='Tap a group name to see its subcategories; check the box before a group to select all of it at once. Each category\'s colour and icon here match its pins on the map — this list doubles as the map legend. With nothing checked, every category shows; checking one narrows the map to just that — there\'s no way to hide a single category, only to narrow to the ones you check. Services, Health, Housing and Shopping & Dining start open because residents reach for them first; every other group starts collapsed.';
UI.en.catZeroHint='None of this category in the areas currently selected — try a different area, or "All Areas".';
UI.en.busPanelHint='Selecting a route draws it on the map alongside whatever places are already showing — it doesn\'t filter or hide them. Tap it again, or the ✕ on the indicator, to remove it.';
UI.fr.clearCatFilter='✕ Effacer le filtre de catégorie';UI.fr.doneBtn='Terminé';UI.fr.presetAdjusted='ajusté manuellement';UI.fr.presetAdjustedShort='(modifié)';
UI.fr.catPanelHint='Touchez le nom d’un groupe pour voir ses sous-catégories; cochez la case devant un groupe pour le sélectionner en entier. La couleur et l’icône de chaque catégorie ici correspondent à ses repères sur la carte — cette liste sert aussi de légende. Rien coché = tout s’affiche; cocher une catégorie restreint la carte à celle-ci seulement — il n’y a pas moyen de masquer une catégorie, seulement de restreindre à celles cochées. Services, Santé, Logement et Achats et repas s’ouvrent par défaut parce que ce sont ceux dont les résidents ont le plus besoin; les autres groupes restent repliés.';
UI.fr.catZeroHint='Aucun lieu de cette catégorie dans les secteurs actuellement sélectionnés — essayez un autre secteur, ou « Tous les secteurs ».';
UI.fr.busPanelHint='Sélectionner une ligne la trace sur la carte à côté des lieux déjà affichés — elle ne les filtre ni ne les masque. Touchez-la de nouveau, ou le ✕ sur l’indicateur, pour la retirer.';
UI.es.clearCatFilter='✕ Quitar filtro de categoría';UI.es.doneBtn='Listo';UI.es.presetAdjusted='ajustado manualmente';UI.es.presetAdjustedShort='(editado)';
UI.es.catPanelHint='Toque el nombre de un grupo para ver sus subcategorías; marque la casilla junto a un grupo para seleccionarlo por completo. El color y el icono de cada categoría aquí coinciden con sus marcadores en el mapa — esta lista también sirve como leyenda. Sin nada marcado, se muestran todas las categorías; marcar una restringe el mapa solo a esa — no hay forma de ocultar una categoría, solo de restringir a las que marque. Servicios, Salud, Vivienda y Compras y restaurantes empiezan abiertos porque son los que más buscan los residentes; el resto empieza colapsado.';
UI.es.catZeroHint='No hay lugares de esta categoría en las zonas seleccionadas actualmente — pruebe otra zona, o "Todas las zonas".';

UI.zh.guideCA1=`<h3>🛬 落地头两周：按这个顺序办</h3>
<p>1️⃣ 手机SIM卡（先让别人能联系上你）→ 2️⃣ SIN社保号（找工作、报税、领福利的前提）→ 3️⃣ 申请省健康卡（有等待期，落地当天就能申请）→ 4️⃣ 开银行账户 → 5️⃣ 租房并确定固定地址 → 6️⃣ 孩子入学 → 7️⃣ 驾照。这几件事互相有依赖：没有SIN不能正式上班，没有固定地址很多手续办不了，健康卡等待期越早开始越早结束。落地前先把护照、签证/移民纸、出生证明、结婚证、学历与成绩单、疫苗接种记录全部扫描一份存在手机和云端——接下来半年你会被反复要求出示这些文件，而原件寄回原籍国补办往往要几个月。</p>
<h3>🪪 SIN社会保险号（Social Insurance Number）</h3>
<p>找工作、报税、申请多数政府福利都需要SIN号。可以在<a href="https://www.canada.ca/en/employment-social-development/services/sin.html" target="_blank" rel="noopener">Service Canada官网</a>在线申请，或前往本地Service Canada服务点现场办理（本工具「分类 → 政务移民」里可以找到地址）。免费办理，通常当场或几天内拿到。注意：SIN号是终身身份信息，除了雇主、银行和政府机构，任何人索要都应当拒绝——冒充税务局/移民局索取SIN号并要求转账的电话诈骗，是居民最常遇到的骗局之一。真正的政府部门不会用电话威胁你立刻付款、不会要求用礼品卡或加密货币付款。</p>
<h3>🏦 开银行账户</h3>
<p>本地主要银行（TD、CIBC、BMO、Scotiabank等）大多有“居民欢迎账户”，通常首年减免月费、可用护照+移民/学签文件直接开户，无需本地信用记录。建议带好护照、移民文件（PR卡/学签/工签）、SIN卡（如已办好）前往网点。地图「分类 → 银行」里能找到附近网点。开户时可以直接问清三件事：月费怎么免、每月免费交易次数、国际汇款手续费——不同银行差别很大，而这三项是你未来每个月都在付的钱。</p>
<h3>💳 从零开始建立信用记录</h3>
<p>在加拿大，租房、办手机套餐、买车贷款、甚至部分工作背景调查都会查信用记录。刚落地的人不是“信用不好”，而是“系统里查不到你”——很多申请会因此被直接拒绝，这和你在原籍国的资产、收入无关。最快的起步方式是申请一张<b>担保信用卡</b>（secured credit card：你先存一笔钱作为信用额度，几乎不会被拒），或银行专门给居民的入门信用卡；之后每月刷一点日常开销、<b>全额按时还清</b>，6到12个月就能建立起基本记录。四个最容易踩的坑：只还“最低还款额”（利息极高，也不利于评分）、把额度刷满（长期建议控制在额度的30%以内）、短期内申请很多张卡（每次硬查询都扣分）、以及漏还账单——一次逾期的负面记录会留存数年。Equifax和TransUnion两家征信机构都可以免费查询自己的信用报告，建议每年查一次，顺便确认没有人冒用你的身份。</p>
<h3>📱 手机与网络</h3>
<p>加拿大主要运营商有Rogers/Telus/Bell及其子品牌（Fido、Koodo、Virgin Plus等），子品牌套餐通常更便宜。建议先办预付费SIM卡应急，落地稳定后再考虑签约套餐（可能需要信用记录或押金）。签约前留意：合约期、超量流量费、以及“设备补贴”是否把你锁在两年高价套餐里。</p>
<h3>🗣️ 英语不流利怎么办：你有权免费要求传译</h3>
<p>这是居民最被低估的一项权利。BC省公立医疗系统通过省级语言服务（Provincial Language Service）提供<b>200多种语言的免费传译，一天24小时可用，患者和家属不需要付任何费用</b>。预约时或到前台时直接说 “I need an interpreter. I speak ______.” 就可以，紧急情况可拨 <b>1-877-228-2557</b>。此外，<b>8-1-1</b>健康咨询热线提供130多种语言，<b>2-1-1</b>社区服务热线提供十余种语言的转介服务。请不要让孩子在医院替你翻译：医学术语翻错的后果很严重，而且这对孩子是不公平的心理负担。银行、学校、法律援助机构大多也能安排电话传译——主动开口要求就好，这不是给别人添麻烦，这是本来就为你准备的服务。带着一张写好自己母语名称的纸条（例如 “Mandarin / 普通话”）会让沟通更快。</p>
<h3>🧾 报税：哪怕收入为零也要报</h3>
<p>加拿大很多福利不是“申请”来的，而是“报税”报出来的：GST/HST消费税退税、加拿大儿童福利金（CCB）、以及各省的补贴，都根据你上一年的报税记录自动计算发放。这意味着——<b>即使这一年你没有任何收入，也应该报税，否则这些钱一分拿不到</b>，而且断报之后补领会很麻烦。报税季通常从每年2月开始，个人截止日期是4月30日。收入不高、税务情况简单的人（包括居民、留学生、领福利的人）可以到加拿大税务局（CRA）支持的<b>免费报税诊所</b>（Community Volunteer Income Tax Program）请志愿者免费代报，在<a href="https://www.canada.ca/en/revenue-agency/services/tax/individuals/community-volunteer-income-tax-program.html" target="_blank" rel="noopener">CRA官网</a>按邮编即可查到附近站点。第一次报税通常需要邮寄纸质表格，之后才能开通网上报税。</p>
<h3>💼 找工作、简历与学历认证</h3>
<p>三处和原籍国差别很大、也最容易卡住人的地方：</p>
<p><b>一、简历格式不同。</b>加拿大简历通常1–2页，<b>不放照片、不写年龄、性别、婚姻状况、身份证号</b>（这些信息反而会让雇主为规避歧视嫌疑而弃用你的简历）；重点是用具体数字说明你做成了什么，而不是罗列职责。求职信（cover letter）通常要针对每一个职位单独改写。</p>
<p><b>二、“加拿大本地经验”的死循环。</b>很多岗位要求本地经验，而你刚来正好没有。常见的破解路径是：先接受一份过渡性工作积累本地推荐人；去做志愿者（在加拿大，志愿经历被认真当作工作经验写进简历）；参加移民服务机构的就业辅导与“职业导师”（mentorship）配对，由本行业的本地人带你熟悉行业规则和人脉。</p>
<p><b>三、学历与职业资格认证。</b>你的外国学历本身是有效的，但申请学校或某些岗位时常需要做<b>学历评估</b>（WES等机构出具的认证报告）。更关键的是：医生、护士、药剂师、教师、会计、工程师、律师、电工、水管工等属于<b>受监管职业</b>，必须通过对应省级专业协会的认证程序才能执业，这个过程可能需要一到几年、涉及考试与实习——如果你打算从事这些职业，请在落地后尽早开始查询流程，不要等到求职受挫才发现。免费的简历修改、模拟面试、行业介绍，本地移民服务机构一般都提供。</p>

UI.zh.guideProv=`<h3>⚕️ {PROV}健康卡（MSP + BC Services Card）</h3>
<p>{PROV}的公共医疗保险叫MSP（Medical Services Plan），居民需要通过<a href="https://www2.gov.bc.ca/gov/content/health/health-drug-coverage/msp/bc-residents/enrolment" target="_blank" rel="noopener">Health Insurance BC官网</a>申请BC Services Card。<b>等待期的算法是：成为本省居民当月的剩余时间 + 之后两个整月</b>，也就是最长接近三个月；这段时间内在本地看病、急诊都要自费全额支付，因此强烈建议在落地前就买好临时医疗保险覆盖空窗期（多数保险不覆盖既往病史，要提前看清条款）。从加拿大其他省搬来的人，请保留原省份的医保直到等待期结束。等待期是从<b>申请</b>算起的，所以落地当天就递交，不要拖。自2020年1月起，MSP对已参保居民不再收取月费。</p>
<h3>🩺 找不到家庭医生怎么办</h3>
<p>本省家庭医生短缺是普遍现象，很多本地长住居民同样没有家庭医生，这不是针对新来者的差别待遇。正规做法是登记<b>Health Connect Registry（家庭医生轮候登记）</b>：在 <a href="https://www.healthlinkbc.ca/find-care/health-connect-registry" target="_blank" rel="noopener">HealthLink BC官网</a> 在线登记只需几分钟，或拨 <b>8-1-1</b> 用你的母语登记（提供130多种语言）。登记需要你的个人健康号（PHN）、住址、电话和邮箱。在轮候期间，你并不是没有医疗可用：<b>8-1-1</b> 全天24小时有护士、药剂师、营养师接听；<b>Urgent and Primary Care Centre（紧急与基层医疗中心）</b>处理当天可看的非急症；<b>walk-in clinic（无需预约诊所）</b>可以看常见病；社区药剂师在本省可以为一部分轻症开药、也可以打疫苗；真正危及生命时才去医院急诊或打911。看病时记得可以免费要求传译（见上一节）。</p>
<h3>🚗 驾照、车险与冬季轮胎</h3>
<p>{PROV}驾照由ICBC负责。多数国家/地区的驾照可以直接换领或凭驾龄减免部分路考，具体请查<a href="https://www.icbc.com/driver-licensing/new-to-bc" target="_blank" rel="noopener">ICBC官网“New to BC”页面</a>确认自己是否符合互认协议；本地考驾照可以在地图「分类 → 驾校」里找。两件居民常吃亏的事：<b>一是保险折扣</b>——你在原籍国的多年无事故记录，只有拿到原保险公司出具的英文“无索赔证明”（claims history letter）才可能被承认，否则会被当作新手按最高费率计价，这封信最好在离境前就开好；<b>二是冬季轮胎</b>——本省大量山区公路在每年10月1日至次年3月31日（部分路段延长至4月30日）强制要求冬季轮胎，合规轮胎须带 M+S 标志或三峰雪花标志，且胎面深度至少3.5毫米。四季胎不等于冬季胎，交警会拦查并罚款，山路上不合规还可能被要求掉头。</p>
<h3>🎒 子女入学与英语支持</h3>
<p>{CITY}属于{SD}学区，公立学校按住址划片，可用<a href="{SD_URL}" target="_blank" rel="noopener">{SD}官方划片查询工具</a>输入住址确认对应学校，再联系学校或学区办理登记，通常需要出生证明/护照、疫苗接种记录、住址证明、以及移民身份文件。三件家长最需要知道的事：<b>一、英语不是入学门槛</b>——学校有ELL（English Language Learner，英语学习者）支持，孩子会被安排在正常年级同时接受额外语言辅导，不会因为英语不好被降级；<b>二、有免费的定居工作者进校服务</b>——SWIS（Settlement Workers in Schools）是专门面向新移民家庭的免费服务，帮你理解学校制度、参加家长会、填表、对接课外资源，也能帮忙安排传译；<b>三、加拿大学校的家校沟通比很多国家频繁</b>——邮件、家校App、家长会都很重要，读不懂就直接说需要翻译，学校有义务让你听懂关于你孩子的信息。</p>
<h3>🏠 租房：法律给你的底线</h3>
<p>押金（damage deposit）法律上限是<b>半个月租金</b>，如果带宠物可再收半个月宠物押金，除此之外房东不能收“押一付三”之类的额外押金。租金<b>每12个月才能涨一次</b>，必须提前<b>三个整月</b>书面通知并使用官方表格（RTB-7），2026年的法定涨幅上限是<b>2.3%</b>——超过上限或通知不合规的涨租，你没有义务接受。退租通知期、房东进入房屋须提前24小时书面通知等规则，都由<a href="https://www2.gov.bc.ca/gov/content/housing-tenancy/residential-tenancies" target="_blank" rel="noopener">{PROV}住宅租赁管理处（RTB）</a>规定，争议可拨 <b>1-800-665-8779</b>。三个居民常见的坑：<b>看房诈骗</b>——从未见面、以“我在外地”为由要求先转押金的房源几乎都是骗局，务必实地看房、见到房东本人或持牌中介、拿到书面租约再付钱；<b>没有本地信用记录</b>——可以用工作offer、银行存款证明、预付多月租金（注意：预付不等于押金，不受押金上限约束但也不构成法律义务）、或找担保人来替代信用报告；<b>口头承诺</b>——修缮、包水电、可养宠物等一律写进租约，口头说的在纠纷里几乎无法证明。搬入和搬出时和房东一起做书面房屋状况检查（condition inspection report），这是你日后拿回押金最有力的证据。</p>
<h3>⚖️ 法律问题与法律援助</h3>
<p>遇到法律问题不代表一定要花钱请律师，{PROV}有多个免费/低门槛渠道：<b>Legal Aid BC</b>（法律援助BC）覆盖家庭法、刑事辩护、移民/难民等收入受限人群的法律援助，本地电话 <b>250-314-1900</b>，省内热线 <b>1-866-577-2525</b>，官网legalaid.bc.ca；{CITY}本地有一家实体法律诊所 <b>Okanagan Thompson Legal Clinic</b>（220-301 Victoria St，电话236-425-9121），提供家庭法协助、社会救助/伤残津贴、失业保险、债务、租房纠纷等方面的免费/低成本帮助（地图「分类 → 法律援助」可查看）；<b>Access Pro Bono BC</b>（604-878-7400，accessprobono.ca）为低收入人群、55岁以上长者、残障人士、移民/难民提供免费法律咨询与转介；金额5000加元以下的小额索赔及公寓/共管物业纠纷可通过<b>{PROV}民事解决法庭CRT</b>（1-844-322-2292）在线处理，无需律师；工资/工时等职场纠纷找<b>{PROV}劳工标准处</b>（1-833-236-3700）。</p>
<h3>🛡️ 遇到歧视、骚扰或不公平对待怎么办</h3>
<p>如果你因为<b>种族、肤色、原籍国、族裔、宗教、口音相关的成见、性别、年龄、残障、性取向</b>等原因，在<b>求职与工作、租房、以及面向公众的服务（商店、餐厅、学校、医院、公共交通）</b>中被区别对待，这在{PROV}是违法的，你有正式的申诉渠道，而且<b>不需要请律师、也不需要英语流利</b>。</p>

<h3>🎓 留学生须知</h3>
<p><b>打工时数：</b>持有效学签、在指定学习机构（DLI）全日制在读、且已开学的学生，学期内校外打工上限为<b>每周24小时</b>；学校正式假期（寒暑假、阅读周）期间可以不限时数。上班前必须先办SIN。超时打工违反学签条件，可能导致失去学生身份甚至被要求离境——不要相信“多做几小时没人查”的说法，雇主的工资记录就是记录。</p>

UI.zh.guideCA2=`<h3>☎️ 常用号码速查</h3>
<p><b>911</b>——报警/火警/救护车，危及生命时打；接通后先说地址。<b>8-1-1</b>——HealthLink BC非紧急健康咨询，24小时有护士接听，可要求130多种语言的传译。<b>2-1-1</b>——社区与社会服务转介（房租、食物、育儿、长者、家暴、心理健康），免费保密，多语种。<b>988</b>——全国自杀危机求助热线，可打电话也可发短信。<b>1-877-228-2557</b>——医疗传译服务预约。<b>1-800-665-8779</b>——{PROV}住宅租赁管理处RTB。<b>1-833-236-3700</b>——{PROV}劳工标准处（工资、工时、解雇）。<b>1-888-440-8844</b>——{PROV}人权仲裁庭（歧视投诉）。<b>1-800-563-0808</b>——VictimLinkBC，家暴与犯罪受害者支持，24小时、110多种语言。<b>250-828-3000</b>——本地RCMP警察非紧急报案。多数政府服务电话都可以要求“interpreter”，不需要自己讲流利英语也能办事。</p>
<h3>🧭 不知道该问谁？按问题类型对号入座</h3>
<p>居民最常见的困境不是“没有资源”，而是“不知道这件事归谁管”。下面这张对照表能解决大部分情况：</p>
<p><b>身份、签证、担保、入籍</b> → IRCC官网（canada.ca）为唯一权威来源；复杂个案找持牌移民顾问（RCIC）或移民律师，收入有限可先问Legal Aid BC。不要依赖社交媒体群里的经验帖，规则每年都在变。<br>
<b>SIN、就业保险EI、养老金CPP/OAS</b> → Service Canada（1-800-622-6232）。<br>
<b>报税、儿童福利CCB、GST退税</b> → 加拿大税务局CRA（1-800-959-8281）；报税本身找免费报税诊所。<br>
<b>健康卡、看病、疫苗、心理健康</b> → 8-1-1（24小时，可要传译）；找不到家庭医生就登记Health Connect Registry。<br>
<b>租房纠纷、押金、涨租、被赶</b> → RTB 1-800-665-8779；争议金额小或需要免费法律意见找Access Pro Bono。<br>
<b>工资被拖欠、被无理解雇、加班没算</b> → {PROV}劳工标准处 1-833-236-3700。<br>
<b>被歧视、被骚扰</b> → {PROV}人权仲裁庭 1-888-440-8844（一年时效）。<br>
<b>孩子上学、转学、英语支持、家长会看不懂</b> → 学校本身 + SWIS（学校移民服务）+ 学区办公室。<br>
<b>驾照、车险、事故理赔</b> → ICBC。<br>
<b>水电气、网络、账单争议</b> → 各公用事业公司客服；账单付不起先打电话谈分期。<br>
<b>“我不知道这算什么问题”</b> → 打 <b>2-1-1</b>，或走进本地移民服务机构。这两个入口存在的意义就是替你分诊。</p>
<p>三条通用原则：<b>一、先找官方网站（.gc.ca / .bc.ca 结尾）</b>，中介和论坛的信息可能过期或有利益倾向；<b>二、任何要求你立刻付款、用礼品卡付款、或威胁你被捕/被遣返的电话都是诈骗</b>，直接挂断，用官网上的号码回拨核实；<b>三、办事时记下日期、经办人姓名和参考编号</b>，加拿大很多流程要多次跟进，这些记录会帮到你。</p>
<h3>🤝 孤独、想家，以及怎样真的融入</h3>
<p>移民经历里最少被谈论、却最普遍的部分不是签证和找工作，而是<b>落地几个月后突然涌上来的孤独感</b>：语言隔着一层、笑话听不懂、原来的职业身份被清零、原籍国的亲友关系因为时差和距离慢慢变淡。这不是你脆弱，也不是你没适应好，这是几乎每个移民都会经过的阶段，通常在头一到两年最难。</p>
<p><b>心理支持是免费的、也是保密的。</b>打 <b>8-1-1</b> 可以询问本地心理健康服务并要求母语传译；<b>988</b> 是全国危机热线（电话或短信）；本地的加拿大心理健康协会（CMHA）分会提供免费或低价的辅导与小组；大学的学生有校内免费心理咨询；有些机构专门提供针对移民、用母语进行的辅导。使用这些服务不会影响你的移民身份。</p>
<p><b>实操层面，本地人真正认识新朋友的方式其实很固定：</b>图书馆的免费活动与语言角、社区中心的兴趣班、孩子的学校家长群和球队、宗教场所（很多同时是同乡社群中心）、志愿者活动（这是同时解决“孤独”和“没有本地经验”两个问题的最高效办法）、以及移民服务机构组织的居民聚会与“友伴配对”。加拿大的社交节奏通常比很多国家慢而浅：邻居只是打招呼不代表冷淡，同事下班后各回各家也不代表排斥；关系往往需要在同一个固定活动里重复见面几个月才升温。<b>主动、重复、准时出现</b>，比英语好不好更起作用。</p>
<p><b>关于口音和身份，有两件事值得先说清楚。</b>第一，你的口音不是缺陷——这个国家超过五分之一的人口出生在国外，带口音的英语是这里的常态而不是例外；把“等我英语完美了再去参加”往后拖，通常只会拖成更长的孤立。第二，如果你在某些场合确实感到被区别对待，那份感受值得被认真对待，也有正式渠道（见上一节“遇到歧视”），同时也不必让它定义你对整座城市的判断——绝大多数日常互动并非如此。</p>
<p><b>也请给自己留一点“不必融入”的空间。</b>做母语的饭、过自己的节日、和原籍国的家人保持联系、在本地找到自己的族裔社群——这些不是“不融入”，恰恰是让人能长期留下来的根。融入不是把原来的自己删掉再换一个。</p>
<p style="margin-top:14px;color:var(--sub-ink);font-size:11.5px;">以上内容为综合公开信息整理的入门参考，具体政策以官方网站/致电确认为准，如有变动以官方信息为准。</p>

UI.en.guideCA1=`<h3>🛬 Your First Two Weeks, in Order</h3>
<p>1️⃣ Phone SIM (so people can reach you) → 2️⃣ SIN (required to work, file taxes, receive benefits) → 3️⃣ Apply for provincial health coverage (there's a waiting period, so apply the day you land) → 4️⃣ Open a bank account → 5️⃣ Find housing and a fixed address → 6️⃣ Enrol children in school → 7️⃣ Driver's licence. These depend on each other: you can't be legally paid without a SIN, many applications need a fixed address, and the health-coverage clock only starts once you apply. Before you fly, scan your passport, visa/immigration papers, birth certificate, marriage certificate, diplomas and transcripts, and immunization records, and keep copies on your phone and in the cloud — you'll be asked for these repeatedly over the next six months, and replacing an original from abroad can take months.</p>
<h3>🪪 Social Insurance Number (SIN)</h3>
<p>You need a SIN to work, file taxes, and access most government benefits. Apply online at <a href="https://www.canada.ca/en/employment-social-development/services/sin.html" target="_blank" rel="noopener">Service Canada's website</a>, or in person at a local Service Canada office (look under Category → Gov/Immigration on this map). It's free, and usually issued the same day or within a few days. Your SIN is lifetime identity data: apart from employers, banks and government agencies, refuse anyone who asks for it. Phone scams impersonating the tax agency or immigration and demanding your SIN plus an immediate payment are among the most common frauds aimed at residents — real government offices never threaten you with arrest over the phone and never ask to be paid in gift cards or cryptocurrency.</p>
<h3>🏦 Opening a Bank Account</h3>
<p>Major banks here (TD, CIBC, BMO, Scotiabank, etc.) usually offer "resident welcome" accounts with no monthly fee for the first year, openable with your passport plus immigration/study/work permit documents — no local credit history required. Bring your passport, immigration documents (PR card/study or work permit), and your SIN card (if you have it) to a branch. Find nearby branches under Category → Banks on this map. Ask three questions at the counter: how the monthly fee is waived, how many free transactions you get per month, and what an international transfer costs. Banks differ a lot on all three, and those are the charges you'll pay every month for years.</p>
<h3>💳 Building Credit From Zero</h3>
<p>In Canada, renting a home, getting a phone plan, financing a car, and sometimes even a job background check all involve a credit check. A new arrival doesn't have <em>bad</em> credit — you have <em>no file</em>, so the system can't find you at all, and applications get declined regardless of what you owned or earned back home. The fastest way to start is a <b>secured credit card</b> (you deposit an amount that becomes your limit, so approval is near-automatic), or a bank's entry-level resident card. Then put a small regular expense on it and <b>pay the full balance on time every month</b>; six to twelve months of that establishes a basic file. Four common traps: paying only the "minimum payment" (the interest is severe and it doesn't help your score), running the card to its limit (aim to stay under about 30% of the limit), applying for several cards in a short period (each hard check costs you points), and missing a payment — a single late mark can stay on your file for years. You can request your own credit report free from both Equifax and TransUnion; doing that once a year is also how you catch someone using your identity.</p>
<h3>📱 Phone & Internet</h3>
<p>Major carriers are Rogers/Telus/Bell and their budget sub-brands (Fido, Koodo, Virgin Plus, etc.), which are usually cheaper. Consider a prepaid SIM first for immediate needs, then switch to a contract plan once settled (contracts may require credit history or a deposit). Before signing, check the contract length, the overage rate for extra data, and whether a "free phone" is locking you into two years of an expensive plan.</p>
<h3>🗣️ If Your English Isn't Fluent: You Can Ask for a Free Interpreter</h3>
<p>This is the most under-used right residents have. Through the Provincial Language Service, BC's public health system provides <b>free interpretation in more than 200 languages, 24 hours a day, at no cost to patients or their families</b>. When you book, or at the front desk, simply say: "I need an interpreter. I speak ______." For urgent situations the line is <b>1-877-228-2557</b>. The <b>8-1-1</b> health advice line covers 130+ languages, and the <b>2-1-1</b> community services line offers referrals in a dozen or so. Please don't have your child interpret for you at a medical appointment: mistranslated medical terms carry real consequences, and it places an unfair weight on a kid. Banks, schools and legal-aid offices can usually arrange phone interpretation too — asking is not an imposition, it's a service that already exists for you. Carrying a slip of paper with your language written on it in English ("Mandarin", "Tagalog", "Tigrinya") makes the request faster.</p>
<h3>🧾 File a Tax Return Even With Zero Income</h3>
<p>Many Canadian benefits aren't applied for — they're <em>calculated from your tax return</em>. The GST/HST credit, the Canada Child Benefit (CCB), and most provincial supplements are paid automatically based on last year's filing. Which means: <b>even in a year with no income at all, you should file, or you receive none of it</b>, and claiming it retroactively later is a much bigger job. Filing season generally opens in February, with an April 30 deadline for individuals. If your income is modest and your situation is simple — which describes most residents, students and people on benefits — a CRA-supported <b>free tax clinic</b> (the Community Volunteer Income Tax Program) will file it for you at no charge; search by postal code on the <a href="https://www.canada.ca/en/revenue-agency/services/tax/individuals/community-volunteer-income-tax-program.html" target="_blank" rel="noopener">CRA site</a>. A first return usually has to be mailed on paper before online filing becomes available to you.</p>
<h3>💼 Work, Résumés and Credential Recognition</h3>
<p>Three things work differently here than in most countries, and they are where people get stuck:</p>
<p><b>1. The résumé format is different.</b> A Canadian résumé is typically 1–2 pages and carries <b>no photo, no age, no gender, no marital status, no ID number</b> — including them can actually get your résumé set aside, because employers avoid anything that looks like a discrimination risk. Lead with concrete results and numbers rather than a list of duties, and rewrite the cover letter for each posting.</p>
<p><b>2. The "Canadian experience" catch-22.</b> Many postings ask for local experience, which by definition you don't have yet. The usual ways through: take a bridging job to earn local references; volunteer (in Canada, volunteer work is taken seriously and belongs on your résumé); and use the employment counselling and <b>mentorship matching</b> that settlement agencies run, which pairs you with someone established in your field.</p>
<p><b>3. Credentials and regulated professions.</b> Your foreign degree is real, but schools and some employers will ask for a <b>credential evaluation</b> (a report from an agency such as WES). More importantly, doctors, nurses, pharmacists, teachers, accountants, engineers, lawyers, electricians and plumbers are <b>regulated professions</b>: you cannot practise until the relevant provincial regulatory body licenses you, which can involve exams and supervised practice and can take one to several years. If that's your field, start the enquiry in your first weeks rather than after a year of rejected applications. Free résumé review, mock interviews and sector briefings are standard services at settlement agencies.</p>
